ere":"the office safe, desk and body","detail":"The Mosler's door stands wide with no tool mark on the dial, the cash-box shelf empty while the petty-cash tin with $18 sits beside it; the desk's top right drawer is out and empty; Eddie's wallet with $31 is still in his hip pocket.","proves":"Whoever opened the safe knew the combination, and was not after money.","atScene":true},{"id":"ev4","name":"The cash box","where":"in the ice plant inside the spur fence, forty feet from the gate","detail":"Coast Marine's green steel cash box, still locked, $612 in bills and freight-collect receipts inside, a brown smear across the lid.","proves":"The robbery was staged by someone who left by the spur gate and never wanted the money; prints in the smear will say who carried it.","atScene":false},{"id":"ev5","name":"Roy Haskell's camel-hair overcoat","where":"on his back when he reached the pier at 03:50","detail":"The right pocket lining stretched and dark with gun oil in the shape of a short revolver, a loose .38 Special cartridge caught in the seam, and green ice-plant juice and creosote on the hem.","proves":"He has lately carried a snub-nosed revolver in that pocket and walked through the ice plant by the spur in that coat.","atScene":false}],"forensics":{"tod":"A single .38 bullet entered the left chest from about four feet, light powder stippling on the shirt, and lodged against the spine; death inside two minutes. Body heat and rigor at 04:10 put death between 00:40 and 01:50.","prints":"The cash box from the ice plant carries Eddie Marchetti's prints all over and, on the lid, a right thumb and forefinger of Roy Haskell laid down in Marchetti's blood. The gold Ronson bears Vivian Haskell's prints and nobody else's, the lipstick glass hers and Marchetti's; Chick Navarro's prints are nowhere in the office.","comms":"Two coin-phone toll tickets touch the case: Gate 9 to a Hollywood cigar store that Vice knows as Lefty Bruno's wire room, 00:58 to 01:00; and the phone outside Teo's to the Haskell residence in Palos Verdes Estates, 01:38 to 01:40, answered. No call was placed from either phone between 01:00 and 01:38.","tox":"Blood alcohol 0.06 per cent, two rye highballs, no drug. The slug is a .38 Special lead round-nose fired from a Colt revolver, and it matches land for land the slug Harbor Division dug from the office door frame in March 1946, after Roy Haskell reported firing his licensed Colt Detective Special at a prowler.","logs":"Gate 9 log in Pop Kowalski's hand: Haskell's Packard out 22:50; Valley Produce reefer in 23:40; cream Mercury coupe registered to Mrs. V. Haskell in 00:09, out 01:03; nothing else in or out until the patrol car at 03:20, Navarro refused at the gate at 00:27 and 01:00. Harbor patrol launch log: 01:24, the Marysville Victory's second mate reports 'a shot or a backfire ashore at 171', nothing found; no vessel moved in the East Channel all night. The spur padlock, found hanging open at 03:20, was opened with a key, not cut; the railroad holds one key and Coast Marine's agent the other."},"redHerring":"Chick Navarro, a bookie's runner with a $40 marker on Eddie, hung at the Gate 9 fence through the murder window while the safe stood open and the cash box was gone, so the pier reads it as a collection turned stick-up. Pop's log has him refused at the gate twice and nobody on foot through it, his wire-room call is ticketed at 00:58, the cash box turned up in the ice plant with $612 inside, Eddie's wallet was in his pocket, and Chick's prints are nowhere in the office.","solutionPath":["Coroner: one .38 round at four feet, death between 00:40 and 01:50; Benny Ochoa's jitney was in pieces from 01:05 to 01:35 and the patrol launch logged the report at 01:24, so the bang the gang took for a backfire at 01:22 was the shot.","The gate log has Vivian Haskell's Mercury in at 00:09 and out at 01:03, Chick saw her drive out, and her lighter, the lipstick glass and the Lark tickets in Eddie's coat give the affair and the elopement; she lied about being home, but she was through the gate nineteen minutes before the shot and answered the 01:38 call at home, so she is cleared and her husband has a motive.","Chick's 'Eddie walked off toward the spur at half past one' is corrected by Eddie's polo coat hanging on the rack: the camel coat crossing the apron at 01:32 was someone else's; Benny saw the same light overcoat go in at 01:06, and Roy Haskell's camel-hair overcoat has ice plant on the hem.","The cash box in the ice plant with $612 inside, the untouched petty cash and wallet, and the unmarked safe dial show the robbery was staged by someone with the combination who left by a spur gate only the railroad and Coast Marine's agent have keys to.","Fingerprints: Roy Haskell's thumb and forefinger in Eddie's blood on the cash-box lid prove he handled it after the shot, breaking 'I drove out at ten to eleven and never came back.'","The toll ticket puts his 'call to the wife around one' at 01:38 from Teo's coin phone, Chick heard Sol razz him about the longest phone call in history, and Chick's Mercury remark at 00:38 is what sent him out at 00:55; ballistics ties the slug to his Colt, and the loose cartridge and gun-oiled pocket in his coat break 'the gun was in the office drawer.'","Name Roy Haskell: jealousy, his wife leaving him for Eddie on the Lark next Friday; one shot from his own Colt at 01:22 that the gang took for a backfire, and a stick-up dressed over it."]},"briefs":[{"name":"Roy Haskell","part":"killer","personality":"Dry, courteous and economical, a company man who has settled strikes and paid off walking bosses without raising his voice; he says 'frankly' and 'as a practical matter' and answers the question he wishes he had been asked. Pressed, he goes colder and more precise and reaches for the company's attorney rather than lose his temper.","voiceSample":"Frankly, Detective, a stick-up on this waterfront isn't a mystery, it's a Friday.","relationship":"He hired Eddie for his Navy manner and came to despise the swagger; by the end he hated him with a jealousy that surprised him, and shot him before he had quite decided to.","movements":[{"from":"21:00","to":"23:00","where":"Coast Marine office, then his Packard to Front Street","doing":"Closed out the Friday manifests with Eddie, told him to lock the cash in the safe at two, and drove out through Gate 9 at 22:50 to Teo's.","seenBy":["Eddie Marchetti","Benny Ochoa","Pop Kowalski"]},{"from":"23:00","to":"00:55","where":"Teo's back room","doing":"Played poker with Sol Hirsch, Ned Garza and Cap Mulhern; heard Chick's remark about the Mercury at 00:38.","seenBy":["Teo Almeida","Sol Hirsch","Ned Garza","Cap Mulhern","Chick Navarro"]},{"from":"00:55","to":"01:08","where":"the fence, the spur gate and the shadow of the transit shed","doing":"Walked to the spur, let himself in with his key, watched Vivian's car leave and crossed to the office.","seenBy":["Benny Ochoa"]},{"from":"01:08","to":"01:31","where":"Coast Marine office","doing":"Argued with Eddie, shot him at 01:22, opened the safe, took the cash box and pulled the drawers.","seenBy":["Eddie Marchetti"]},{"from":"01:31","to":"01:38","where":"the apron, the spur and Front Street","doing":"Crossed the apron with the box, dropped it in the ice plant and the Colt in the channel, and walked back to Teo's.","seenBy":["Benny Ochoa","Chick Navarro"]},{"from":"01:38","to":"02:30","where":"Teo's coin phone, then the back room","doing":"Telephoned Vivian, washed his hands in the men's room and played poker until he cashed out.","seenBy":["Teo Almeida","Sol Hirsch","Ned Garza","Cap Mulhern","Chick Navarro"]},{"from":"02:30","to":"03:50","where":"his Packard, the Palos Verdes house, then the pier","doing":"Drove home, sat in the kitchen in his overcoat, took the police call at 03:25 and drove down to the pier.","seenBy":["Vivian Haskell","Pop Kowalski"]}],"knows":["Vivian has been meeting Eddie in the office on Fridays; he suspected for a month from the Mercury's mileage and Eddie's Chesterfields in her ashtray, and Chick's crack at 00:38 settled it (he heard it).","Chick said at the table he had to see 'the night man' after one about forty dollars, and left the back room at about a quarter to one, before Roy did (he heard and saw it).","He left the table at 00:55 with the Colt in his overcoat pocket, as on every poker night, and opened the spur padlock with the key on his ring at 01:01 (he did it).","He watched Vivian's Mercury pull away from the office at about 01:02 from the shadow of the transit shed (he saw it).","In the office Eddie, in shirtsleeves, told him Vivian was leaving on the Lark on the 14th and 'you can keep the house, Roy', and he shot him once at 01:22 (he did it).","He opened the safe with the combination, took the cash box, pulled the drawers, and got blood on his right hand from the desk edge (he did it).","He dropped the cash box in the ice plant inside the spur fence, dropped the Colt through the deck gap into the channel, and left the padlock hanging (he did it).","He telephoned home from Teo's coin phone at 01:38 to be sure Vivian was there and to be seen on the phone, and sat down again at 01:42 (he did it).","The jitney had been backfiring all evening and the gang would take one shot for it (he knows the pier)."],"doesNotKnow":["That Benny Ochoa saw the light overcoat go into the office at 01:06 and come out with the box at 01:31.","That Chick Navarro was at the gate fence and saw the camel coat cross the apron.","That Vivian left her lighter and a lipstick glass on Eddie's desk.","That the police lab still holds the slug from his 1946 prowler shot."],"secret":"His wife was leaving him for his own night clerk; he shot the man and dressed it as a stick-up.","lies":[{"claim":"I stepped out for ten minutes around one, Detective, to telephone my wife from the coin phone and get some air. Sol Hirsch will tell you.","truth":"He was gone from 00:55 to 01:42 and spent it at the pier; the call was at 01:38.","when":"Asked about the poker game or his movements after midnight.","crack":"The toll ticket timing the call at 01:38, Chick's account of Sol's 'longest phone call in history', or Benny's sighting of the light overcoat."},{"claim":"I drove out of Gate 9 at ten to eleven and never set foot on that pier again until your patrolmen called me at half past three.","truth":"He entered by the spur gate at 01:01 and was in the office from 01:08 to 01:31.","when":"Asked whether he went back to the terminal, or about the spur gate and its key.","crack":"His prints in Eddie's blood on the cash-box lid, or the ice plant on his coat hem with the spur padlock opened by a key only he and the railroad hold."},{"claim":"My Colt lived in the top right desk drawer at the office, as it has since the prowler business; whoever cleaned out the safe took it.","truth":"It was in his overcoat pocket all evening and is now in the East Channel.","when":"Asked about the gun, the empty drawer, or the ballistics.","crack":"The loose .38 cartridge and gun-oiled pocket in his overcoat, or Vivian saying he carries the Colt to poker every Friday."},{"claim":"Marchetti was a good night man. My wife met him once at the company picnic, I believe; I doubt she would know him in the street.","truth":"He knew they were lovers, and Eddie had just told him Vivian was leaving.","when":"Asked about Eddie, his wife, or what Chick said at the table.","crack":"The Lark tickets in Eddie's coat with Vivian's lighter on the desk, or Chick's account of the Mercury remark and Roy folding his hand."}],"honestMistake":null,"tells":["Squares his tie clip between thumb and finger.","Says 'frankly' before anything that isn't."],"pressure":{"baseline":15,"breakPoint":75,"lawyerPoint":86,"style":"lawyer"},"opening":"Sit down, Detective. I have been up since half past three and told your patrolmen everything I know, but let's go through it once more for the record."},{"name":"Vivian Haskell","part":"liar","personality":"Brittle, clever and bored, a club hostess's polish over a Long Beach cannery childhood; she calls the detective 'Sergeant' whatever his rank, makes cracks to keep him at arm's length and holds a cigarette like a prop. Cornered, she turns contemptuous, then flares, and she will not cry in front of a cop.","voiceSample":"I read, I smoked, I went to bed. It's what the agent's wife does on Fridays, Sergeant; ask anyone in Palos Verdes.","relationship":"She loved Eddie as much as she has loved anyone, mostly for being the opposite of Roy; now she is grieving and frightened in equal parts and can show neither.","movements":[{"from":"21:00","to":"00:09","where":"the Haskell house, then her Mercury to Gate 9","doing":"Read and did her nails until Roy's game had settled in, then drove down to the pier at 23:55.","seenBy":["Pop Kowalski"]},{"from":"00:09","to":"01:00","where":"Coast Marine office","doing":"Drank two rye highballs with Eddie and talked about San Francisco.","seenBy":["Eddie Marchetti"]},{"from":"01:00","to":"01:20","where":"office door, Gate 9 and the road home","doing":"Kissed Eddie goodnight, drove out past Pop and the kid at the fence, and drove home.","seenBy":["Eddie Marchetti","Pop Kowalski","Chick Navarro"]},{"from":"01:20","to":"02:52","where":"the Haskell house","doing":"Undressed, took Roy's call at 01:38 and lay awake.","seenBy":[]},{"from":"02:52","to":"03:30","where":"the Haskell house","doing":"Pretended to sleep while Roy sat in the kitchen, and heard him take the police call at 03:25.","seenBy":["Roy Haskell"]},{"from":"03:30","to":"04:00","where":"the Haskell house, alone","doing":"Sat up in the kitchen after Roy drove off.","seenBy":[]}],"knows":["She has been Eddie's lover since October and met him in the office most Fridays after midnight while Roy played poker (she did it).","They were to take the Lark to San Francisco on Friday the 14th; Eddie had the Pullman tickets in his polo coat and a job with a forwarder on the Embarcadero (he showed her the tickets).","She drove in through Gate 9 at about ten past twelve, Pop waving her through as always, and left Eddie alive and laughing in his shirtsleeves at the office door at one (she saw it).","She left her gold Ronson on his desk and missed it only when she got home at twenty past one (she did it).","Roy telephoned at 01:38, hoarse, and said 'You're home' before anything else, then that he would be late (she heard it).","Roy carries his Colt in his overcoat pocket on poker nights 'for the walk to the car'; other nights it lives in the hall table drawer (she has watched him pocket it).","Roy came in at ten to three, did not come to bed, and sat in the kitchen in his overcoat until the police rang at 03:25 (she heard it).","Roy asked twice in the last month about the Mercury's mileage (she heard it).","A kid in a drape jacket hangs at the gate fence on Fridays; Eddie called him Chick and said he ran bets (she saw him; Eddie told her)."],"doesNotKnow":["Who killed Eddie, or how.","That Roy left the poker table, or for how long.","That Chick told Roy her car was at the office.","What happened in the office after 01:03."],"secret":"The affair and the elopement: if Roy proves adultery she leaves the marriage with nothing, and the police look at the mistress and the husband first.","lies":[{"claim":"I was home all night, Sergeant. I read until eleven and went to bed, and Roy came in somewhere around half past two.","truth":"She was with Eddie in the office from 00:09 to 01:00 and home by 01:20; Roy came in at 02:52.","when":"Asked where she was, whether she left the house, or about her car.","crack":"The gate log showing her Mercury in at 00:09 and out at 01:03, or her prints on the lighter on Eddie's desk."},{"claim":"Eddie Marchetti was Roy's night man. I met him once, at the company picnic last summer.","truth":"They had been lovers since October and were leaving for San Francisco together on the 14th.","when":"Asked about Eddie, their relationship, or San Francisco.","crack":"The two Lark tickets in Eddie's coat with the lipstick glass and her engraved lighter, or Benny's account of her car at the office on Fridays."}],"honestMistake":null,"tells":["Twists her wedding ring as if unscrewing it.","Taps the unlit cigarette on its case, end over end."],"pressure":{"baseline":25,"breakPoint":60,"lawyerPoint":88,"style":"anger"},"opening":"You'll forgive me if I don't offer coffee, Sergeant; the maid doesn't come Saturdays. Roy's night man is dead and you've driven up the hill to see the agent's wife. Go on, then."},{"name":"Chick Navarro","part":"mistaken","personality":"Fast and jittery, a Front Street kid who talks hep ('pal', 'no kidding', 'I dig') and laughs at the end of sentences that aren't funny; he has been taught never to say Lefty's name to a cop. Underneath he is scared of being tagged for the stick-up and of his mother finding out, and if he is leaned on he cries and then talks too much.","voiceSample":"I'm a runner, pal, I run. Paper goes out, cash comes back, and I don't ask who's kissing who.","relationship":"Eddie was a good-time guy who bet too much and paid late, and treated Chick like a kid brother; Chick liked him and is shaken.","movements":[{"from":"21:00","to":"23:30","where":"the Front Street bars","doing":"Collected on the Hollywood Legion fights, bar to bar.","seenBy":["Teo Almeida"]},{"from":"23:30","to":"00:20","where":"Teo's back room","doing":"Settled the fight money with the poker players and hung about the table.","seenBy":["Roy Haskell","Teo Almeida","Sol Hirsch","Ned Garza","Cap Mulhern"]},{"from":"00:20","to":"00:35","where":"Gate 9 fence","doing":"Walked down to see if Eddie was working, saw the Mercury by the office, and was turned away by Pop.","seenBy":["Pop Kowalski"]},{"from":"00:38","to":"00:48","where":"Teo's back room","doing":"Told Haskell his wife's car was at the office and watched him fold a hand blind.","seenBy":["Roy Haskell","Teo Almeida","Sol Hirsch","Ned Garza","Cap Mulhern"]},{"from":"00:48","to":"01:45","where":"Gate 9 coin phone and fence","doing":"Called Lefty at 00:58, was refused at the gate again, and watched the office door for Eddie.","seenBy":["Pop Kowalski","Vivian Haskell"]},{"from":"01:45","to":"02:15","where":"Teo's back room","doing":"Found Haskell dealing at 01:50, collected from Cap Mulhern and left.","seenBy":["Roy Haskell","Teo Almeida","Sol Hirsch","Cap Mulhern"]},{"from":"02:15","to":"04:00","where":"his mother's rooms on Grand Avenue","doing":"Went home and slept.","seenBy":[]}],"knows":["Eddie owed Lefty $40 on last Friday's Hollywood Legion card and told him Thursday to come by the office 'after one Friday, I'll have it' (he heard it).","At about 00:25 from the gate he saw the cream Mercury parked beside the office, the car he knows for Mrs. Haskell's from other Fridays; Pop would not let him in without a pass (he saw it).","At 00:38 in the back room he said 'Your missus is working late, Mr. Haskell, the Merc's parked at the office,' and Haskell went quiet and folded the next hand without looking at it (he said and saw it).","He left Teo's at about a quarter to one and called Lefty's wire room from the Gate 9 coin phone at about 00:58 (he did it).","At 01:03 the Mercury came out through the gate with Mrs. Haskell at the wheel and turned up the hill (he saw it).","He heard one bang from the pier around twenty past one and took it for the jitney, which had been popping all night (he heard it).","At about 01:32 a man in a camel coat and hat crossed the lit apron from the office toward the spur tracks with something square under his arm; he believes it was Eddie (he saw it).","When he got back to Teo's at about 01:50 Haskell was dealing, and Sol Hirsch was razzing him about the longest phone call in history (he saw and heard it).","He has a 1945 juvenile sheet for running numbers; his mother thinks he works nights at the cannery (he knows it)."],"doesNotKnow":["Who killed Eddie, or how.","What went on inside the office that night.","When Haskell left Teo's or how long he was gone.","That Eddie's polo coat was hanging on the rack when he died.","Anything about the Haskells' marriage beyond the Friday car."],"secret":"He runs bets for Lefty Bruno and has a juvenile sheet; he is terrified of being tagged for the stick-up.","lies":[],"honestMistake":{"claim":"Eddie came out of the office about half past one in that camel coat of his and walked off toward the spur tracks with a box under his arm. He was alive then, pal, so whoever got him got him after.","truth":"It was Roy Haskell in his camel-hair overcoat carrying the cash box; Eddie had been dead since 01:22, in shirtsleeves, with his polo coat on the rack.","why":"Forty yards of fog and floodlight haloes, two coats the same color, and Chick was watching that door for Eddie and nobody else; the last he knew, Haskell was at a poker table up the street."},"tells":["Laughs when nothing is funny.","Touches the betting slips in his breast pocket."],"pressure":{"baseline":30,"breakPoint":55,"lawyerPoint":82,"style":"tears"},"opening":"Look, I carry paper for a guy, that's all I do. I don't carry a gun and I never been inside that gate in my life, pal; Pop'll tell you."},{"name":"Benny Ochoa","part":"honest","personality":"Steady, plain and slow to answer, a San Pedro Mexican-American who came back from Italy a sergeant and drives a jitney because the gang is his family; he says 'mister', 'I tell you straight' and the odd 'pues', and will not guess at what he did not see. Bullied, he goes quiet and short until the detective finds his manners.","voiceSample":"That wasn't my machine. My machine was in pieces on the deck, mister, and I know what my machine sounds like.","relationship":"He liked Eddie well enough, a kidder who was decent to the gang, but a show-off with women he should have left alone.","movements":[{"from":"21:00","to":"01:05","where":"the apron between the shed and the hatch","doing":"Ran the jitney between the shed and the ship, backfiring on a fouled plug all evening.","seenBy":["Augie Sarkis","Roy Haskell","Pop Kowalski"]},{"from":"01:05","to":"01:35","where":"the shed's north door","doing":"Shut the engine down and changed the plug with the hood up, forty yards from the office.","seenBy":["Augie Sarkis"]},{"from":"01:35","to":"03:00","where":"the apron","doing":"Ran the jitney until the hatches were covered.","seenBy":["Augie Sarkis"]},{"from":"03:00","to":"03:08","where":"the apron to the office","doing":"Walked over for the tally sheets Eddie had not brought.","seenBy":["Augie Sarkis"]},{"from":"03:08","to":"03:12","where":"the office, then the gate house","doing":"Found Eddie dead and ran to Pop.","seenBy":["Pop Kowalski"]},{"from":"03:12","to":"04:00","where":"the office door","doing":"Waited with Pop and the patrolmen and answered their questions.","seenBy":["Pop Kowalski","Roy Haskell"]}],"knows":["The jitney backfired all evening on a fouled plug, and he shut it down at 01:05 at the shed's north door and had the plug out until 01:35 (he did it).","At 01:22 by the shed clock he heard one flat bang from the direction of the office, louder than his machine ever made, and the gang yelled 'Benny's jitney'; his engine was in pieces (he heard it).","At about 01:06 a tall man in a long light overcoat and hat came along the dark side of the shed from the spur and went into the office; he did not see the face (he saw it).","At about 01:31 the same coat came out and crossed the apron fast toward the spur with something square under his arm (he saw it).","Mr. Haskell wears a camel-hair overcoat; the only other camel coat on the pier is Eddie's polo coat (he has seen both).","The cream Mercury came in at about ten past twelve and parked by the office; he knows it as the agent's wife's car, there on Fridays since before Christmas (he saw it).","Mr. Haskell's Packard went out the gate at ten to eleven (he saw it).","Eddie told him Thursday he was quitting for a forwarder's job in Frisco next week, 'and I'm not going alone' (he heard it).","At 03:08 he found Eddie behind the desk in his shirtsleeves, the polo coat on the rack, the safe wide open and the drawers out, and ran for Pop (he saw it)."],"doesNotKnow":["Who shot Eddie, or why.","Anything that happened at Teo's or at the gate.","That Chick Navarro was at the fence.","Who Eddie meant to take to Frisco."],"secret":"His small embarrassment: he knew at once the bang was no backfire and kept quiet rather than fight Augie Sarkis about leaving the hatch; he thinks he might have looked in.","lies":[],"honestMistake":null,"tells":["Wipes his hands on the rag though they are already clean.","Looks at the ceiling before a hard answer."],"pressure":{"baseline":15,"breakPoint":70,"lawyerPoint":90,"style":"shutdown"},"opening":"I found him. I told Pop, Pop called you. Ask me what you want, mister, I got nothing to hide."}],"id":"noir_docks_2"},{"settingId":"noir_docks","truth":{"title":"I Know You, Mister","house":"Benton Terminal Company, Berth 93 on the Outer Harbor at San Pedro: a transit shed with a two-room wooden shipping office at its shore end, Gate 5 and Pop Mireles's shack off 22nd Street, and three blocks up the hill the Night Owl Cafe, which never closes and lets rooms above.","victim":{"name":"Frank Oberle","age":51,"role":"night checker at Benton Terminal, three weeks on the job, lodger above the Night Owl","sketch":"A lean, grey, close-mouthed man who kept a 1934 longshore button in his pocket, not on his cap, drank rye steadily and said little. His younger brother Eddie died under a strikebreaker's truck on the San Francisco Embarcadero in July 1934, and Frank had been looking for the driver ever since."},"night":{"start":"21:00","end":"04:00","discovered":"02:12","discoveredBy":"Carl Sievert","where":"the back room of the Benton shipping office, Berth 93"},"weather":"Tuesday 11 February 1947: light rain from dusk until about eleven, then a thick wet fog settling on the Outer Harbor; 48 degrees, no wind, every window on the pier shut.","publicFacts":["Frank Oberle, night checker at Benton Terminal, Berth 93, was found dead at his desk in the back room of the shipping office at about a quarter past two by Carl Sievert, the night superintendent, with the room full of fumes from the gas heater.","Sievert telephoned Harbor Division from the office at 02:18; a radio car came through Gate 5 at 02:27 and the coroner's wagon at 03:40.","A Local 13 night gang was working cased goods out of the SS Cape Alava at Berth 93 under floodlights from seven in the evening, and the police held them on the pier.","Light rain fell until about eleven, then wet fog; the Night Owl Cafe on 22nd Street, three blocks up from Gate 5, serves all night, and Frank rented a room above it.","Pop Mireles keeps the Gate 5 shack and writes every car and every stranger in the gate book, as the company requires.","Frank Oberle had been at Benton three weeks, hired off the hall board; he came down from San Francisco and kept to himself.","The word on the pier by morning is that the company's old heater finally killed somebody."],"suspects":[{"name":"Carl Sievert","age":46,"role":"night superintendent at Benton Terminal, the company's man on the pier after dark, twelve years with Benton","sketch":"A square, greying man in a tan gabardine topcoat and a grey fedora, with a flat Northwestern voice and no wasted movement. There is soot on his right cuff, and he rubs at it.","part":"killer"},{"name":"Benny Szabo","age":27,"role":"runner for Hal Weems the bookmaker, who takes the night gang's horse bets and drinks at the Night Owl","sketch":"Thin and quick in a sharp, shiny suit and two-tone shoes, nicotine fingers and a comedian's grin that comes and goes. He cannot sit still.","part":"liar"},{"name":"Lew Hatcher","age":38,"role":"winch driver on the Local 13 night gang working the Cape Alava","sketch":"Big, slow and sunburnt even in February, in a hickory shirt and a white cap stiff with grease, a wad of tobacco in his cheek. He looks at a city policeman the way he looks at a company man.","part":"mistaken"},{"name":"Nora Pastore","age":49,"role":"widow, owner of the Night Owl Cafe and the rooms above it, where Oberle lodged","sketch":"Handsome and heavy-lidded, hennaed hair and a cardigan over a good black dress, a cigarette burning in an ashtray she never touches. She has been up all night and shows it only in her hands.","part":"honest"}],"killer":"Carl Sievert","accomplice":null,"motive":"In July 1934 Carl Sievert was Arthur Keel, an Oakland strikebreaker who drove a company truck through the picket line at Pier 38 in San Francisco; Frank Oberle's brother Eddie went under the wheels and died, and Keel left the state under a new name. Three weeks ago Frank hired on at Benton, recognised him, sent to San Francisco for the strike committee's photograph, and on Tuesday night told him he would name him at the Local 13 meeting on Monday, which on this waterfront would end Sievert's job, his marriage and very likely his life.","method":"At 01:02 Sievert climbed the rear loading platform and stuffed a wet dunnage sack into the flue cap of the back-room gas heater, with Frank half drunk and alone inside a shut room on a cold night; the starved burner spilled carbon monoxide into the room for an hour and Frank died slumped over his manifests at about 01:40. At 02:03 Sievert cleared the flue, hid the sack under a pallet, pulled the stovepipe from its wall thimble so the death would read as a slipped joint, and 'found' the body.","alibiGap":{"from":"00:40","to":"02:12","killerClaims":"That he drove up to the Night Owl at about a quarter to one, ate chili and drank coffee at Nora's bar until a little after two, then drove back and found Frank dead in the fumes.","actually":"He left the Night Owl at 00:40, was logged back through Gate 5 at 00:47, drank with Frank in the back room from 00:50 to 01:00, stuffed the heater flue from the rear platform at 01:02, sat in his dark Hudson until 02:03, cleared the flue, pulled the stovepipe loose to stage an accident and telephoned the police at 02:18."},"timeline":[{"time":"21:00","place":"Night Owl Cafe, 22nd Street","present":["Frank Oberle","Nora Pastore","Benny Szabo"],"event":"Frank eats chili and drinks two ryes at Nora's bar while Benny works the room with his slips; at 21:20 Frank tells Nora 'Monday I settle a thirteen-year debt at the hall' and walks down to the pier, and Benny leaves at 21:45 for the Sixth Street pool hall.","witnesses":["Nora Pastore","Benny Szabo"]},{"time":"21:25","place":"Gate 5 and the shipping office","present":["Frank Oberle","Carl Sievert","Pop Mireles"],"event":"Pop logs Frank in on foot, Sievert hands him the Cape Alava manifests in the back room, and Frank lights the gas heater and shuts the window against the rain.","witnesses":["Pop Mireles","Carl Sievert"]},{"time":"21:30","place":"Berth 93, SS Cape Alava and the apron","present":["Lew Hatcher","Sal Mendoza","Carl Sievert"],"event":"Lew drives the No. 2 hatch winches for the night gang working cased goods under the floodlights, as since seven, while Sievert walks the apron and the shed on his rounds.","witnesses":["Sal Mendoza","Lew Hatcher"]},{"time":"22:40","place":"shipping office back room","present":["Carl Sievert","Frank Oberle"],"event":"Sievert comes in off the apron and asks Frank for a quiet word later, man to man; Frank, not looking up from the manifests, says 'I know you, mister. Monday I say it at the hall.'","witnesses":[]},{"time":"23:05","place":"Cape Alava, No. 2 hatch","present":["Lew Hatcher","Sal Mendoza","Carl Sievert"],"event":"The starboard winch blows a steam-line gasket; Mendoza stands the gang by and sends for the ship's engineer, Sievert comes over from the shed and waits with him, and Lew sits smoking on the hatch coaming.","witnesses":["Sal Mendoza","Lew Hatcher"]},{"time":"23:10","place":"shipping office front room","present":["Frank Oberle"],"event":"Alone, Frank puts through a seven-minute call to Dan Guerin in San Francisco, SUtter 1-4480, and pencils 'Dan G, SU 1-4480. Photo in Tues mail. Hall Mon.' on the desk pad under the telephone.","witnesses":[]},{"time":"23:30","place":"lunch wagon by the shed","present":["Lew Hatcher","Sal Mendoza","Carl Sievert"],"event":"With the engineer still at the winch, Mendoza calls the meal half an hour early and the gang eats at the lunch wagon; Lew, who wears no watch on the winch, takes it for the regular midnight break.","witnesses":["Sal Mendoza","Carl Sievert"]},{"time":"00:02","place":"Gate 5 and the Night Owl","present":["Carl Sievert","Pop Mireles","Nora Pastore"],"event":"Sievert drives his green Hudson out through Gate 5, logged by Pop at 12:02, and eats chili at Nora's bar from 00:05 until 00:40, when he pushes the bowl away, says 'something I forgot at the office' and drives off as the last red car to Wilmington rattles past.","witnesses":["Pop Mireles","Nora Pastore"]},{"time":"00:05","place":"Gate 5 and the lunch wagon","present":["Benny Szabo","Pop Mireles","Lew Hatcher","Sal Mendoza"],"event":"Benny walks in through Gate 5, logged at 12:05, and takes the gang's Santa Anita slips at the lunch wagon, Lew giving him two dollars on a horse in the fourth.","witnesses":["Pop Mireles","Lew Hatcher","Sal Mendoza"]},{"time":"00:25","place":"Cape Alava and the shipping office front room","present":["Lew Hatcher","Sal Mendoza","Benny Szabo","Frank Oberle"],"event":"The engineer finishes and the gang goes back on; climbing to the winch platform Lew sees Benny go in at the office door, where Benny pays Frank sixty dollars at the counter for four cases of Canadian that went off Monday's tally, drinks a cup of his coffee and leaves at 00:38, out through Gate 5 at 00:40.","witnesses":["Lew Hatcher","Pop Mireles"]},{"time":"00:47","place":"Gate 5 and the apron","present":["Carl Sievert","Pop Mireles"],"event":"Sievert's Hudson comes back through Gate 5, logged at 12:47, and parks with its lights off in the dark at the shore end of the shed behind the office; from the winch platform Lew sees the headlights come along the apron and go out.","witnesses":["Pop Mireles","Lew Hatcher"]},{"time":"00:50","place":"shipping office back room","present":["Carl Sievert","Frank Oberle"],"event":"Sievert sets a pint of Old Overholt on the desk, pours two and asks for a week; Frank drinks his and says 'Monday, Keel,' and Sievert leaves at 01:00 saying good night, his own glass still on the desk.","witnesses":[]},{"time":"01:02","place":"rear loading platform behind the office","present":["Carl Sievert"],"event":"By flashlight Sievert climbs the rear platform, stuffs a wet Benton dunnage sack into the flue cap of the back-room heater and goes to sit smoking in the dark Hudson; Lew, on the winch platform, sees a flashlight move behind the office roofline for a minute or two.","witnesses":["Lew Hatcher"]},{"time":"01:05","place":"payphone booth outside the Night Owl","present":["Benny Szabo","Nora Pastore"],"event":"Benny, who came in at 00:45 for a beer, phones the night's slips from the booth to Hal Weems's office in Wilmington until 01:24, feeding nickels while Nora watches him through the window, then goes back to his stool for the rest of the night.","witnesses":["Nora Pastore"]},{"time":"01:40","place":"shipping office back room","present":["Frank Oberle"],"event":"Frank, heavy with rye in the hot shut room, slumps over the manifests and dies of the heater's fumes between about 01:15 and 02:00, nobody near enough to hear the chair creak.","witnesses":[]},{"time":"02:03","place":"rear platform and the shipping office","present":["Carl Sievert"],"event":"Sievert pulls the sack from the flue, a corner tearing off inside the pipe, shoves it under a dunnage pallet by the shed's rear doors, props both office doors, pulls the stovepipe from its wall thimble with bare hands, 'finds' Frank at 02:12 and at 02:18 telephones Harbor Division from the front room.","witnesses":[]},{"time":"02:27","place":"Gate 5, the apron and the Night Owl","present":["Carl Sievert","Lew Hatcher","Sal Mendoza","Pop Mireles","Benny Szabo","Nora Pastore"],"event":"A radio car is logged through Gate 5 at 2:27, Mendoza stops the gang and Lew climbs down, Sievert tells the officers he found Frank on coming back from the Night Owl, and at 03:20 a patrolman climbs the hill to look at Frank's room, finding Nora behind the bar and Benny on his stool.","witnesses":["Lew Hatcher","Sal Mendoza","Pop Mireles","Nora Pastore","Benny Szabo"]}],"evidence":[{"id":"ev1","name":"Stovepipe and wall thimble","where":"back room of the shipping office, behind the gas heater","detail":"The heater's four-inch stovepipe pulled out of its wall thimble and hanging from the heater collar, a bright scrape through the rust on the thimble, and on the wall an unbroken ring of fresh soot where the pipe sat while the heater burned; inside the elbow, charred brown threads of wet sacking.","proves":"The pipe was seated all night while the heater ran and was pulled loose afterwards, and the flue had been stuffed with sacking and then cleared: an accident somebody arranged.","atScene":true},{"id":"ev2","name":"Two glasses and a pint of Old Overholt","where":"Frank's desk in the back room, beside the manifests","detail":"A pint of rye three-quarters gone and two tumblers, one dry with Frank's lip marks and one on the far side of the desk with a swallow still in it.","proves":"Frank had a drinking companion in the back room after he began the shift; the lab can say who.","atScene":true},{"id":"ev3","name":"Desk pad note","where":"under the telephone on the front-room counter","detail":"Frank's pencilled note on the company desk pad: 'Dan G, SU 1-4480. Photo in Tues mail. Hall Mon.'","proves":"Frank telephoned San Francisco that night about a photograph and meant to take something to the union hall on Monday.","atScene":true},{"id":"ev4","name":"Sooty dunnage sack","where":"under a dunnage pallet by the shed's rear doors, twenty feet from the office's rear platform","detail":"A wet burlap sack stencilled BENTON TERMINAL, black with soot inside, one corner torn away, smelling of scorched jute.","proves":"This is what stopped the flue; the torn corner matches the threads in the pipe, and whoever hid it knew the shed.","atScene":false},{"id":"ev5","name":"Clipping and telegram in Frank's room","where":"dresser drawer in Frank's room above the Night Owl","detail":"A San Francisco News clipping of 6 July 1934, PICKET DIES UNDER TRUCK AT PIER 38, naming Edward Oberle, 24, and the driver, Arthur Keel, 33, of Oakland, released without charge; and a Western Union telegram delivered Monday: PHOTO IN TUESDAYS MAIL STOP IF IT IS KEEL GO TO THE LOCAL NOT ALONE STOP DAN.","proves":"Frank believed he had found Arthur Keel, the man who killed his brother in 1934, living under another name on this waterfront, and meant to expose him.","atScene":false},{"id":"ev6","name":"Sievert's topcoat","where":"on Sievert's back, then on the hook in the office when he takes it off","detail":"A tan gabardine topcoat, right cuff and forearm smeared with soot and flecked with brown jute fibre, a wet patch dried stiff.","proves":"He handled a wet, sooty sack that night, which a man who only found a body and pulled a pipe would never need to do.","atScene":false}],"forensics":{"tod":"Carbon monoxide poisoning: cherry-pink lividity and a blood saturation of 68 per cent, no injury but a bruise on the forehead where it met the desk. Body heat and the onset of rigor at 03:50 put death between 01:15 and 02:00, after at least half an hour unconscious in the fumes.","prints":"The second glass on the desk carries Carl Sievert's right thumb and forefinger laid over Frank Oberle's, and both men's prints are on the Old Overholt pint. The stovepipe elbow bears only Sievert's prints, pressed into fresh soot; Benny Szabo's prints are on the front counter and the coffee can and nowhere in the back room.","comms":"Benton's office line, TErminal 2-6190: a seven-minute call at 23:10 to SUtter 1-4480, San Francisco, listed to D. Guerin, and the call to Harbor Division at 02:18, nothing else after 21:00. The payphone outside the Night Owl: one toll call to TErminal 4-2210, Wilmington, from 01:05 to 01:24.","tox":"Blood alcohol 0.12 per cent, chili and bread in the stomach, no chloral, barbiturate or other drug, and no bullet or blade wound anywhere. The charred fibre inside the flue elbow is wet jute sacking, and the soot and fibre on the right cuff of Sievert's topcoat match it.","logs":"Pop Mireles's Gate 5 book, collected by the harbour master's night man: Sievert's Hudson out 12:02 and in 12:47; B. Szabo, runner, in on foot 12:05 and out 12:40; nothing else through the gate until the radio car at 2:27, and no vessel moved on the Outer Harbor all night. Sal Mendoza's time sheet for the Cape Alava gang shows the No. 2 winch down from 23:05, the meal taken early from 23:30 to 00:25, and the gang working from 00:25 until the police stopped them."},"redHerring":"Lew Hatcher shoved Frank Oberle in the shed on Tuesday afternoon over a short tally that docked the gang an hour, and the gang says so; but Mendoza's time sheet and the whole gang put Lew on the winch platform under the floodlights from 00:25 until the police came, and the method needed a man free to come and go at the office by car, not a winch driver in plain sight.","solutionPath":["Coroner: carbon monoxide, death between 01:15 and 02:00; the stovepipe shows a fresh scrape, an unbroken soot ring on the wall and charred jute inside the elbow, so the flue was stuffed and then cleared, not jarred loose.","Lew's 'Szabo went into the office at one' is corrected by Mendoza's time sheet (meal 23:30 to 00:25) and the gate book (Szabo out 12:40); the telephone company has Benny on the Night Owl payphone 01:05 to 01:24, which Nora saw. Benny's lie hides the four cases of Canadian, not a murder.","The gate book has Sievert's Hudson out at 12:02 and back at 12:47, and Nora says he left his chili at 00:40 as the last red car passed and never came back; that breaks 'I was at the Owl until after two'.","Fingerprints: Sievert's over Frank's on the second glass and the pint, and his alone in the soot on the stovepipe; that breaks 'I was never in the back room before I found him'.","The sooty Benton sack under the dunnage pallet, its torn corner matching the threads in the pipe, and the soot and jute on Sievert's right cuff put the sack in his hand.","Motive: the clipping names Arthur Keel, 33, as the driver who killed Eddie Oberle in 1934; Dan Guerin's telegram and the 23:10 call to SUtter 1-4480 show Frank expected a photograph; Nora heard 'there's a man on that pier I buried thirteen years ago' and 'I know you, mister'. Sievert was 33 in 1934 and came to San Pedro from up north in 1935.","Name Carl Sievert, born Arthur Keel: afraid of being named at the union hall as the scab driver of '34, he stuffed the heater flue and gassed Frank Oberle in the shut back room between 01:02 and 02:03."]},"briefs":[{"name":"Carl Sievert","part":"killer","personality":"A quiet, square-built company man who talks in short flat sentences, calls every man by his last name and the detective 'Lieutenant', and has spent twelve years agreeing first and saying nothing second. Pressed, he goes colder and shorter until he stops talking altogether; he never raises his voice.","voiceSample":"Oberle was a checker, Lieutenant. I've got forty men on that pier; I don't make friends with the checkers.","relationship":"He saw Frank Oberle as the past come walking through his gate; three weeks of lying awake turned fear into something he could do with his hands.","movements":[{"from":"21:00","to":"21:30","where":"shipping office and apron","doing":"Handed Frank the Cape Alava manifests at 21:25 and started his rounds.","seenBy":["Frank Oberle","Pop Mireles"]},{"from":"21:30","to":"22:40","where":"apron, shed and Cape Alava","doing":"Walked his rounds, checked the shed doors and watched the gang work No. 2 hatch.","seenBy":["Lew Hatcher","Sal Mendoza"]},{"from":"22:40","to":"22:50","where":"shipping office back room","doing":"Asked Frank for a word later, man to man, and was told 'I know you, mister. Monday I say it at the hall.'","seenBy":[]},{"from":"22:50","to":"00:02","where":"apron and No. 2 hatch","doing":"Stood with Mendoza after the gasket blew at 23:05, waited for the engineer and agreed the early meal.","seenBy":["Lew Hatcher","Sal Mendoza"]},{"from":"00:02","to":"00:40","where":"Hudson to the Night Owl, bar stool","doing":"Ate chili and drank coffee at Nora's bar, then left the bowl half eaten and drove back.","seenBy":["Pop Mireles","Nora Pastore"]},{"from":"00:47","to":"01:00","where":"Gate 5, then the office back room","doing":"Logged in, parked dark behind the shed, poured two ryes with Frank and asked for a week; was refused.","seenBy":["Pop Mireles","Frank Oberle"]},{"from":"01:02","to":"02:03","where":"rear platform, then the dark Hudson","doing":"Stuffed the flue cap with a wet dunnage sack by flashlight, then sat smoking in the car with the lights off.","seenBy":[]},{"from":"02:03","to":"02:27","where":"rear platform and the shipping office","doing":"Pulled and hid the sack, propped the doors, pulled the stovepipe from the thimble, 'found' Frank at 02:12 and telephoned Harbor Division at 02:18.","seenBy":["Pop Mireles"]}],"knows":["He is Arthur Keel: in July 1934 he drove a company truck through the picket line at Pier 38 in San Francisco, a striker named Eddie Oberle went under the wheels and died, and he was released and left for Oregon under his mother's name (he did it).","Frank Oberle recognised him the first week, said 'I know you, mister' to his face in the shed on Thursday, and on Tuesday at 22:40 said he would name him at the Local 13 meeting on Monday (he heard it).","Pop Mireles logs every car through Gate 5; he had hoped the old man dozes after midnight (he knows the gate).","He was at the Night Owl from about 00:05 to 00:40, left his chili half eaten and told Nora 'something I forgot at the office' (he did it).","He poured two glasses of Old Overholt in the back room at 00:50 and left his own glass on the desk with a swallow in it (he did it).","At 01:02 he stuffed the heater's flue cap from the rear platform with a wet Benton dunnage sack; at 02:03 he pulled it out, a corner tearing off inside, and shoved the sack under a dunnage pallet by the shed's rear doors (he did it).","At about 02:08 he pulled the stovepipe out of the wall thimble with bare, sooty hands so the death would read as a bad pipe joint (he did it).","The gang took the meal early, at 23:30, because of the blown gasket, and Benny Szabo was on the pier at the break taking slips (he saw it).","His topcoat's right cuff is sooty and wet and he has had no chance to brush it (he knows it)."],"doesNotKnow":["That Frank telephoned Dan Guerin in San Francisco at 23:10 from the office line, or wrote the number on the desk pad.","That Frank kept the 1934 clipping and Guerin's telegram in his room over the Night Owl.","That Lew Hatcher, from the winch platform, saw his headlights on the apron at 00:47 and a flashlight behind the office at 01:02.","That Nora Pastore fixed the time he left the Night Owl by the last red car.","That Benny Szabo and Frank were dealing in short-counted cases."],"secret":"He is Arthur Keel, the scab driver of 1934 who killed Eddie Oberle, and he gassed Frank Oberle to keep the waterfront from learning it.","lies":[{"claim":"I drove up to the Owl about a quarter to one, had chili and coffee at Nora's bar, and drove back a little after two. That's when I found him.","truth":"He was at the Owl from 00:05 to 00:40 and was logged back through Gate 5 at 00:47.","when":"Asked where he was after midnight or how he came to find the body.","crack":"The Gate 5 book showing his Hudson out at 12:02 and in at 12:47, or Nora's statement that he left at 00:40 as the last red car passed and never came back."},{"claim":"I hadn't been in that back room since I gave him the manifests at half past nine. Those two glasses? Frank had company earlier. Ask the runner, Szabo.","truth":"He drank with Frank from 00:50 to 01:00 and left his own glass on the desk.","when":"Asked when he last saw Frank alive, or about the glasses and the pint.","crack":"The fingerprint report: his prints over Frank's on the second glass and on the pint."},{"claim":"The stovepipe was hanging off the wall when I opened the door. That joint's been working loose for a year; I've told the office twice.","truth":"He pulled it out himself at about 02:08 after clearing a flue he had stuffed.","when":"Asked about the heater, the pipe or how the fumes got into the room.","crack":"The bright scrape and unbroken soot ring on the wall with the charred jute in the elbow, or the sooty sack under the pallet and the soot on his cuff."},{"claim":"Oberle? Hired him off the hall board three weeks ago. Quiet old guy, decent checker. We never exchanged ten words.","truth":"Frank had recognised him as Arthur Keel and promised to name him at the hall on Monday.","when":"Asked how he knew Frank, about San Francisco, 1934, or the name Keel.","crack":"The clipping and telegram from Frank's room together with Nora's account of 'I know you, mister', or the 23:10 call to SUtter 1-4480 on the desk pad."}],"honestMistake":null,"tells":["Rubs his right cuff with his left thumb.","Says 'Lieutenant' and pauses before anything untrue."],"pressure":{"baseline":20,"breakPoint":75,"lawyerPoint":92,"style":"shutdown"},"opening":"Lieutenant. I've got a ship working and a dead man in my office, so tell me what you need and I'll get it for you."},{"name":"Benny Szabo","part":"liar","personality":"Fast-talking, nervy and funny, a Wilmington baker's kid who has run slips since he was fifteen and thinks every cop is working an angle. He jokes when he is scared, starts every sentence with 'look' or 'listen', and when cornered asks for Hal Weems's lawyer.","voiceSample":"Listen, I take two-dollar bets off longshoremen, I don't go in offices. Offices got clerks, clerks got pencils, pencils write down names.","relationship":"He liked Frank well enough as a customer and a partner in a small sideline: a dour old bird who paid on time and asked no questions.","movements":[{"from":"21:00","to":"21:45","where":"Night Owl Cafe","doing":"Worked the bar with his slips and saw Frank eat and leave at 21:20.","seenBy":["Nora Pastore","Frank Oberle"]},{"from":"21:45","to":"23:50","where":"Sixth Street pool hall","doing":"Collected the day's losers and shot eight-ball.","seenBy":["pool-hall regulars"]},{"from":"23:50","to":"00:05","where":"22nd Street down to Gate 5","doing":"Walked down the hill and was logged in by Pop at 00:05.","seenBy":["Pop Mireles"]},{"from":"00:05","to":"00:25","where":"lunch wagon by the shed","doing":"Took the gang's Santa Anita slips, including Lew's two dollars.","seenBy":["Lew Hatcher","Sal Mendoza"]},{"from":"00:25","to":"00:38","where":"shipping office front room","doing":"Paid Frank sixty dollars at the counter for four cases of Canadian off Monday's tally and drank a cup of his coffee.","seenBy":["Frank Oberle","Lew Hatcher"]},{"from":"00:38","to":"00:45","where":"Gate 5 and up the hill","doing":"Logged out at 00:40 and walked up to the Night Owl.","seenBy":["Pop Mireles"]},{"from":"00:45","to":"01:24","where":"Night Owl bar and the payphone booth outside","doing":"Had a beer, then phoned the slips to Weems's office in Wilmington from 01:05 to 01:24.","seenBy":["Nora Pastore"]},{"from":"01:24","to":"04:00","where":"Night Owl bar","doing":"Drank beer and fed the jukebox; was on his stool when the patrolman came at 03:20.","seenBy":["Nora Pastore"]}],"knows":["Frank short-counted cases for him: four cases of Canadian off Monday's Cape Alava tally went to a trucker friend, and he paid Frank sixty dollars for them at the counter at about half past twelve (he did it).","Frank told him at the counter he had 'a thing to settle Monday at the hall' and asked him where Local 13 holds its meeting (he heard it).","The gang was eating at the lunch wagon when he came in at five past midnight, earlier than their usual break; Mendoza was griping about a blown winch gasket (he saw and heard it).","Sievert's Hudson was not in its place beside the office when he came through at 00:05 nor when he left at 00:40 (he noticed).","Frank was alone, alive and steady enough at 00:38, with the heater roaring and the back-room window shut (he saw it).","Pop Mireles wrote him in and out of the gate book as always (he saw Pop write).","He phoned the sheet to Weems's Wilmington number from the Night Owl booth from about five past one until nearly half past (he did it).","Sievert was not in the Night Owl when he got there at 00:45 and did not come in the rest of the night (he saw it).","Frank drank rye but kept no bottle in the office, so far as he ever saw in three weeks of visits (he saw it)."],"doesNotKnow":["Who killed Frank, or how the fumes got into the room.","Anything that happened on the pier after 00:40.","Why Frank wanted the hall meeting, or anything about San Francisco, 1934 or a man named Keel.","That Lew Hatcher saw him go into the office."],"secret":"He and Frank were skimming cased liquor off the Benton tallies for a trucker; it would cost him his job with Weems and a pilferage charge.","lies":[{"claim":"Look, I never set foot on Berth 93 last night. Company don't want runners on the pier; I take the gang's action at the Owl.","truth":"He was logged through Gate 5 at 00:05 and out at 00:40, took slips at the lunch wagon and was in the office with Frank from 00:25 to 00:38.","when":"Asked where he was around midnight or whether he saw Frank that night.","crack":"The Gate 5 book, Lew Hatcher's sighting of him going into the office, or his prints on the counter and the coffee can."},{"claim":"Frank Oberle? Knew him to nod at. He didn't bet.","truth":"Frank was his partner in short-counting cases and he paid him sixty dollars that night.","when":"Asked how he knew Frank or what business he had with him.","crack":"Being placed in the office by the gate book or his prints, together with the four-case shortage on Monday's Cape Alava tally."}],"honestMistake":null,"tells":["Laughs before he answers.","Jiggles his knee and glances at the door."],"pressure":{"baseline":30,"breakPoint":58,"lawyerPoint":84,"style":"lawyer"},"opening":"Listen, I was drinking beer at the Owl, Nora'll tell you, so whatever this is, it ain't me. Can I smoke?"},{"name":"Lew Hatcher","part":"mistaken","personality":"Big-shouldered, slow-spoken Oklahoma man who came west in '36 and found the union; he is sure of what he saw, says it twice, and treats a city cop like a company man until shown otherwise. He gets loud and jabs the table when his word is doubted.","voiceSample":"I seen what I seen, mister. That runner went in that office at one o'clock, right when we went back on, and you can write that down.","relationship":"He thought Oberle was a company stiff who cost the gang an hour's pay with a short tally on Tuesday afternoon, and shoved him for it; he is sorry the old man is dead and would not say so to a cop.","movements":[{"from":"21:00","to":"23:05","where":"No. 2 hatch winch platform, Cape Alava","doing":"Drove the winches for the gang working cased goods.","seenBy":["Sal Mendoza","Carl Sievert"]},{"from":"23:05","to":"23:30","where":"hatch coaming","doing":"Sat smoking while the ship's engineer worked on the blown steam line.","seenBy":["Sal Mendoza","Carl Sievert"]},{"from":"23:30","to":"00:25","where":"lunch wagon by the shed","doing":"Ate with the gang at what he took for the midnight meal and gave Benny two dollars on a horse.","seenBy":["Sal Mendoza","Benny Szabo","Carl Sievert"]},{"from":"00:25","to":"02:27","where":"winch platform","doing":"Drove the winches; saw Benny go into the office as he climbed up, headlights on the apron a while later, a flashlight behind the office later still.","seenBy":["Sal Mendoza"]},{"from":"02:27","to":"04:00","where":"apron","doing":"Stopped work when the radio car came and stood with the gang.","seenBy":["Sal Mendoza","Carl Sievert"]}],"knows":["He drove the No. 2 hatch winches from seven until the starboard steam line blew a gasket, and Mendoza stood the gang by for the ship's engineer (he did it).","The gang ate at the lunch wagon and went back on when the engineer finished; he wears no watch on the winch and took it for the regular midnight meal (he believes it).","As he climbed back to the winch platform he saw Benny Szabo walk in at the shipping office front door; he had given Benny two dollars on a horse in the fourth at the lunch wagon (he saw and did it).","Twenty minutes or so after going back on, headlights came along the apron from the gate and went dark behind the shed by the office, where nobody parks (he saw it).","Fifteen minutes or so after that, a flashlight moved behind the office roofline, where the rear platform is, for a minute or two (he saw it).","Sievert walked the apron and watched the hatch all evening and stood with Mendoza when the gasket blew; he did not see Sievert on the apron between the meal and the police (he saw and did not see).","He shoved Frank Oberle in the shed on Tuesday afternoon over a short tally that docked the gang an hour, and the gang saw it (he did it).","Pop Mireles logs every car and every stranger, which the gang grumbles about (he knows the pier).","The office back-room window was lit and shut all night from where he sat (he saw it)."],"doesNotKnow":["Who killed Frank, or how.","That the meal was called at 23:30, not midnight, or the true clock time of anything after the gasket blew.","Who was in the car or behind the office.","That Benny was out through the gate at 00:40, or what he and Frank did in the office."],"secret":null,"lies":[],"honestMistake":{"claim":"Szabo went into that office at one in the morning, right when we went back on after the midnight meal; the car came along twenty past, and the flashlight was half past one, quarter to two.","truth":"The meal was called early, 23:30 to 00:25, so Benny went in at 00:25 and was off the pier by 00:40; the headlights were Sievert's Hudson at 00:47 and the flashlight was at about 01:02.","why":"He keeps no watch on the winch, took the forced early break for the usual midnight meal, and counted everything from it."},"tells":["Jabs the table with two fingers.","Says 'mister' colder each time."],"pressure":{"baseline":25,"breakPoint":65,"lawyerPoint":88,"style":"anger"},"opening":"You're the city cop. I'll say it once: the gang was working, I was on the winch, and I don't know nothing about company heaters."},{"name":"Nora Pastore","part":"honest","personality":"Tired, dry and kind under the lacquer, a tuna fisherman's widow who has run the Night Owl eighteen years and heard every lie on the waterfront; she calls men 'hon' and the law 'officer', keeps her hours by the red cars and the radio, and tears up only when nobody is looking.","voiceSample":"Hon, I pour for drunks and cops and company men, and I remember what time every one of them leaves. That's the job.","relationship":"She was fond of Frank; he was quiet, paid his rent on Friday, fixed her icebox, and in three weeks told her more about himself than most lodgers do in a year.","movements":[{"from":"21:00","to":"00:05","where":"behind the bar","doing":"Served Frank chili and two ryes until 21:20, Benny worked the room until 21:45, the usual trade after.","seenBy":["Frank Oberle","Benny Szabo"]},{"from":"00:05","to":"00:40","where":"behind the bar","doing":"Served Sievert chili and coffee; he left half of it at 00:40 as the last red car went by.","seenBy":["Carl Sievert"]},{"from":"00:40","to":"01:24","where":"behind the bar","doing":"Benny came in at 00:45 and had a beer, then used the booth outside from about 01:05 to 01:24.","seenBy":["Benny Szabo"]},{"from":"01:24","to":"03:20","where":"behind the bar","doing":"Slow trade; Benny on his stool and nobody else she knew.","seenBy":["Benny Szabo"]},{"from":"03:20","to":"04:00","where":"bar and Frank's room upstairs","doing":"Let a patrolman into Frank's room, then sat down in the kitchen and cried.","seenBy":["Benny Szabo"]}],"knows":["Frank told her on Thursday night, over a rye, 'There's a man on that pier I buried thirteen years ago in Frisco,' and that he had said to the man's face, 'I know you, mister' (she heard it).","On Tuesday at 21:20 Frank said 'Monday I settle a thirteen-year debt at the hall' and went down to work (she heard it).","Frank mailed a letter to San Francisco from her counter on Friday and got a Western Union telegram on Monday that he read twice and put in his wallet; there was an old newspaper cutting on his dresser when she changed the sheets (she saw it).","Carl Sievert came in about five past midnight, as most nights, had chili and coffee, pushed the bowl away at 00:40, said 'something I forgot at the office' and drove off as the last red car to Wilmington rattled past, which it does at 00:42 every night (she saw it).","Sievert did not come back to the Night Owl that night; she was behind the bar until the patrolman came (she saw it).","Benny Szabo came in at about a quarter to one, had a beer, and spent twenty minutes in the booth outside from about five past one, feeding nickels (she watched him through the window).","Benny was in the Night Owl from nine until a quarter to ten and from a quarter to one on, but she cannot say where he was between (she saw it).","Frank drank only at her bar and never kept a bottle in his room (she knew him).","Frank once said of the night super, 'came down from Oregon in '35, he says,' with a look she did not understand at the time (she heard it)."],"doesNotKnow":["Who killed Frank, or how.","What happened on the pier after Frank went down at 21:20.","What was in Frank's letter or telegram, or the name Keel.","Where Benny was between 21:45 and 00:45."],"secret":"Her small embarrassment: she lets Benny run slips from her bar and takes five dollars a week for it.","lies":[],"honestMistake":null,"tells":["Wipes the same spot on the bar.","Looks at the clock over the register before she answers about times."],"pressure":{"baseline":15,"breakPoint":70,"lawyerPoint":90,"style":"tears"},"opening":"Sit down, officer, I'll pour you a coffee. He was a nice man, Frank. Ask what you want to ask and let me get back to it."}],"id":"noir_docks_3"}],"orbital":[{"settingId":"orbital","truth":{"title":"The Lot 44 Reserve","house":"Castellan Ore's station: a spinning ring of cabins, galley, medical bay and offices; a zero-g hub with hydroponics, tool crib, Airlock B and comms blister; a cargo spine, the assay bay at its hub end and Airlock A at the far dock; an outer-hull pod rack where tugs drop ore pods; a reactor ring aft.","victim":{"name":"Henrik Aalto","age":53,"role":"contract surveyor for Meridian Surety, the buyer's underwriter, sent up on the last shuttle to re-assay Lot 44","sketch":"A tall, stooped Finn with a grey crew cut and reading lenses pushed up on his forehead, who weighed everything twice and wrote down the second number. Twelve days aboard, courteous to all and in nobody's pocket, he ate fast and went back to work."},"night":{"start":"18:00","end":"02:00","discovered":"23:48","discoveredBy":"Jun-ho Baek","where":"the assay bay"},"weather":"13 September 2089, station time: ring at 0.4 g and 21 degrees; ore tug Marisol undocked at 17:40; no EVA on the board; relay windows at 20:00 and 02:00.","publicFacts":["Dr Henrik Aalto, the underwriter's surveyor, was found dead in the assay bay at the hub end of the cargo spine at 23:48 by Jun-ho Baek, floating against the inside of the door with blood at his ears and nose.","Eleven aboard: Ines Carvalho (commander), Dr Kwame Asante (medical officer), Stefan Varga (chief engineer), Arjun Pillai (comms), Nilufar Rashidova (quartermaster), Dalia Khoury (assay chief), Jun-ho Baek (assay technician), Tobias Ekwueme (rigger and EVA lead), Soledad Quispe (hydroponics), Henrik Aalto, and the security officer. At dinner Aalto asked Ekwueme why pod-rack caddy masses did not match the tug manifests and was told to stick to rocks.","Dr Asante pronounced Aalto dead of decompression at 00:05. Carvalho sealed the spine, mustered the crew in the galley at 00:30 and reported at the 02:00 relay window; the orbital authority deputised the security officer. The shuttle is nine days out.","WARDEN logs every badge, in and out, at the spine hatch, hydroponics, the comms blister, the reactor ring and both airlocks. It logs badges, not faces. The ring, spokes, hub junction, galley, offices and cabins are unlogged.","Maintenance mode is set at a system's own panel with a service key, which stays captive in the panel until normal mode is restored; WARDEN records when the mode was set and restored and nothing in between. There are four keys: the commander's, the chief engineer's, the assay chief's, and one on the tool-crib hook beside Airlock B.","The assay bay clears ore dust by purging to vacuum through a hull port. The only purge control is the panel on the spine wall outside the bay door; the interlock refuses a purge if the door is open or a badge is inside, unless the bay is in maintenance mode. The door opens outward, so spine pressure holds it shut against a vacuum.","Every suit keeps its own sealed recorder of pressure, oxygen and the wearer's pulse, whatever WARDEN is doing. Office lights drop to standby after five minutes without movement and wake when someone walks in; both show in WARDEN's power log. The grade office spectrometer takes a twelve-pellet carousel and, once loaded, feeds and logs a pellet every seven minutes with nobody in the room. Every lot's assay carries its own iridium ratio, which is how the lab tells one lot's rock from another's."],"suspects":[{"name":"Dalia Khoury","age":44,"role":"assay chief, six years aboard, whose certificate sets the grade and the price of every lot that leaves the station","sketch":"Compact and immaculate, a grey streak in black hair pinned tight, clean nails in a station of dirty ones and a service key lying flat on her lanyard. She answers in whole sentences with figures in them and smiles after, not during.","part":"killer"},{"name":"Tobias Ekwueme","age":34,"role":"rigger and EVA lead from Port Harcourt, who runs the pod rack and the airlocks and services the suits","sketch":"Very tall and loose-limbed, shaved head, wrists ringed with old suit-seal scars, known the length of the station by his orange rigger's jacket. He grins first and answers second, and sits in a chair as if it were borrowed.","part":"liar"},{"name":"Soledad Quispe","age":27,"role":"hydroponics technician from Arequipa, who grows the station's greens alone in the hub","sketch":"Small and quick, green-stained cuticles, a braid tucked into her collar, hands that talk. She answers before you finish asking and does not like being asked twice.","part":"mistaken"},{"name":"Jun-ho Baek","age":25,"role":"assay technician on his first contract, second signature on Khoury's certificates","sketch":"Slight and neat with dark rings under his eyes, a work slate hugged to his chest. He has not slept, answers as if filling in a lab log, and corrects himself to the minute.","part":"honest"}],"killer":"Dalia Khoury","accomplice":null,"motive":"Khoury certified Lot 44 at 6.4 g/t platinum-group metal when it ran 1.9, salting the assay cores and two reserve boxes with rich Lot 39 core, for a third of the grade bonus the Vesta pit contractor drew on her certificates; she had already spent 280,000 of it buying out her own contract. Aalto, re-assaying the reserve cores for the buyer's underwriter, told her at 21:34 that he would file for clawback and an audit of her at the 02:00 relay window, and she killed him to stop the message and destroy his samples.","method":"At 22:38 Khoury, wearing Ekwueme's orange jacket and having used his badge at the spine hatch, turned her service key to put the assay bay in maintenance mode, which kills its interlocks and its logging, and at 22:41 opened the dust purge with Aalto shut inside; the bay went to vacuum in under a minute, spine pressure held the door, and he was dead by 22:43. She refilled the bay at 22:54, took the two relabelled core boxes, restored normal mode at 23:08 and hung the jacket and badge back in Ekwueme's locker, leaving the hatch log to name him.","alibiGap":{"from":"22:26","to":"23:16","killerClaims":"That she sat at her desk in the grade office on the ring from 21:55 until the commander's call at 23:55, minding the Lot 45 run, whose log shows a pellet every seven minutes without a break.","actually":"She loaded the twelve-pellet carousel, wedged the office door at 22:26, took Ekwueme's jacket and badge from locker 4 at 22:32, badged into the spine at 22:36, purged the bay at 22:41, refilled it at 22:54, took the boxes, badged out at 23:10, returned the jacket at 23:12 and was back at her desk at 23:16."},"sharedStory":null,"timeline":[{"time":"18:30","place":"galley","present":["Henrik Aalto","Dalia Khoury","Tobias Ekwueme","Soledad Quispe","Jun-ho Baek","Ines Carvalho","Kwame Asante","Stefan Varga","Nilufar Rashidova"],"event":"Dinner for all but Pillai, on blister watch from 18:00: Aalto asks Ekwueme why pod-rack caddy masses do not match the tug manifests and is told to stick to rocks, then asks Baek to bring the Lot 44 certificate file to the bay at 23:45 to witness the last six cores.","witnesses":["Dalia Khoury","Tobias Ekwueme","Soledad Quispe","Jun-ho Baek"]},{"time":"19:10","place":"grade office","present":["Dalia Khoury","Jun-ho Baek"],"event":"Khoury and Baek pelletise Lot 45, Baek telling her at 19:15 that he pointed out the reserve rack to Aalto that afternoon and hearing 'Of course you did', until he leaves at 20:30 for tea in the galley and his cabin at 21:10 and she works on alone to 21:15; Ekwueme and Quispe have been in their cabins since 19:15 and 19:20, and Aalto badges into the spine at 19:40.","witnesses":["Dalia Khoury","Jun-ho Baek"]},{"time":"21:20","place":"cargo spine","present":["Tobias Ekwueme","Dalia Khoury","Henrik Aalto"],"event":"Khoury badges in and reaches the assay bay door as Ekwueme, in Hold 2 on a lashing check of the Lot 45 pods since 20:10, passes on his way out at 21:25 and hears Aalto say from inside 'Close the door, Dalia. You will want it closed'; Quispe has been in hydroponics since 20:02.","witnesses":["Tobias Ekwueme","Dalia Khoury"]},{"time":"21:34","place":"assay bay","present":["Henrik Aalto","Dalia Khoury"],"event":"Behind the shut door Aalto, who saved a draft to the relay queue at 21:12, shows Khoury the reserve figures and the doubled labels and, asked to hold until the shuttle, says it goes at 02:00 once Baek has witnessed the last six; she badges out at 21:50, and Ekwueme is in his cabin from 21:35.","witnesses":[]},{"time":"21:55","place":"grade office","present":["Dalia Khoury"],"event":"Khoury loads the spectrometer's carousel with twelve Lot 45 pellets, starts the run at 22:02 and at 22:26 wedges the door on a core tray and leaves for Spoke 2; Baek has been in his cabin since 21:10 and Ekwueme in his since 21:35.","witnesses":[]},{"time":"22:16","place":"Airlock B locker room","present":["Tobias Ekwueme"],"event":"Ekwueme, out of his cabin at 22:12, takes the tool-crib key from its hook, sets Airlock B to maintenance mode at 22:21, hangs his orange jacket with his badge on its collar loop in locker 4 and seals Suit 4.","witnesses":[]},{"time":"22:29","place":"pod rack, outer hull","present":["Tobias Ekwueme"],"event":"Ekwueme goes out alone and unlogged, works along the rail to pod 17 and empties its tool caddy of the Marisol's drop of coffee, tobacco and rum, his helmet lamp noted from the comms blister by Pillai at 22:50.","witnesses":["Arjun Pillai"]},{"time":"22:32","place":"Airlock B locker room","present":["Dalia Khoury"],"event":"Khoury, seeing the amber maintenance lamp, walks into the unlogged locker room, pulls on Ekwueme's jacket bare-handed with the hood up, takes his badge off the collar loop and puts on nitrile gloves.","witnesses":[]},{"time":"22:36","place":"hub junction","present":["Soledad Quispe","Dalia Khoury"],"event":"Quispe, badging out of hydroponics at 22:35, sees the orange jacket pull hand over hand along the rail to the spine hatch and badge through, says 'Night, Tobias' to its back and gets no answer, and notes Airlock B's lamp amber and the tool-crib hook empty.","witnesses":["Soledad Quispe","Dalia Khoury"]},{"time":"22:38","place":"assay bay","present":["Dalia Khoury","Henrik Aalto"],"event":"At the panel outside the shut door Khoury turns her key to maintenance at 22:38 and opens the purge at 22:41; Aalto reaches the door, cannot move it against spine pressure and is dead by 22:43, while Ekwueme on the hull sees dust and paper plume from the purge port.","witnesses":["Tobias Ekwueme"]},{"time":"22:47","place":"grade office","present":["Jun-ho Baek"],"event":"Baek comes from his cabin for the Lot 44 certificate file and finds the door wedged on a core tray, the lights on standby until he steps in, the spectrometer cycling by itself and nobody there; he takes the file and leaves at 22:50.","witnesses":["Jun-ho Baek"]},{"time":"22:52","place":"galley","present":["Soledad Quispe","Jun-ho Baek","Ines Carvalho","Stefan Varga","Kwame Asante","Nilufar Rashidova"],"event":"Baek comes in with the Lot 44 file and says Dalia is not in the office and the batch is running itself, joining Quispe, who has sat with tea since 22:42 beside the card game Carvalho, Varga and Asante began at 21:30 while Rashidova wipes down; Quispe leaves for her cabin at 23:05 and Baek stays until 23:42.","witnesses":["Soledad Quispe","Jun-ho Baek"]},{"time":"22:54","place":"assay bay","present":["Dalia Khoury","Henrik Aalto"],"event":"Khoury shuts the purge and opens the equalising valve, dipping the spine's pressure, goes in at 22:58, takes core boxes 44-R3 and 44-R5 inside the jacket, fails to find Aalto's slate under the bags on the purge grille, restores normal mode at 23:08 and badges out with Ekwueme's badge at 23:10.","witnesses":[]},{"time":"23:12","place":"Airlock B locker room","present":["Dalia Khoury"],"event":"Khoury hangs the jacket in locker 4 on the left-hand hook with the badge clipped to its chest pocket and goes down Spoke 2 with the boxes under her arm.","witnesses":[]},{"time":"23:16","place":"grade office","present":["Dalia Khoury"],"event":"Khoury puts the two boxes in the bottom drawer of the sample cabinet behind the Lot 45 trays, kicks the core tray clear of the door and sits at her desk until Carvalho calls at 23:55.","witnesses":[]},{"time":"23:19","place":"Airlock B locker room","present":["Tobias Ekwueme"],"event":"Ekwueme comes in through the lock, racks Suit 4, finds his jacket on the wrong hook with the badge on the wrong pocket and grit on the cuffs, leaves both hanging untouched, restores normal mode at 23:27, hangs the key back on its hook and is in his cabin with the helmet bag by 23:34.","witnesses":[]},{"time":"23:48","place":"assay bay","present":["Jun-ho Baek","Henrik Aalto"],"event":"Baek, badged into the spine at 23:46, opens the bay door and finds Aalto floating against it with the bench swept bare, and calls Asante and Carvalho on the spine intercom; Asante pronounces at 00:05.","witnesses":["Jun-ho Baek"]},{"time":"00:30","place":"galley","present":["Dalia Khoury","Tobias Ekwueme","Soledad Quispe","Jun-ho Baek","Ines Carvalho","Kwame Asante","Stefan Varga","Nilufar Rashidova"],"event":"Carvalho, who woke the security officer at 00:10 and sealed the spine, musters the crew, Khoury from the grade office and Ekwueme and Quispe from their cabins, and sends her report at the 02:00 relay window.","witnesses":["Dalia Khoury","Tobias Ekwueme","Soledad Quispe","Jun-ho Baek"]}],"evidence":[{"id":"ev1","name":"Purge panel","where":"spine wall beside the assay bay door","detail":"A panel with a key switch marked NORMAL and MAINT, a red purge handle and an equalising valve. Its placard reads 'PURGE REFUSED IF DOOR OPEN OR BADGE INSIDE. MAINT: INTERLOCKS OFF, NO LOG.' The switch stands at NORMAL with no key in it, and the bay has no purge control inside.","proves":"The purge was run from outside the shut door, with the interlocks deliberately off, by someone holding a service key; Aalto could not have done it to himself.","atScene":true},{"id":"ev2","name":"Bay door and core rack","where":"inside the assay bay","detail":"Aalto against the inner face of the door with three nails torn on its handle; the bench bare of powder and the purge grille matted with sample bags, paper and grey dust. In the rack marked LOT 44 RESERVE, slots R3 and R5 are empty and R7 to R12 unopened.","proves":"The bay was emptied to vacuum while he worked and he died trying to get out; afterwards someone came in past his body and took two particular core boxes.","atScene":true},{"id":"ev3","name":"Aalto's slate","where":"under the sample bags on the purge grille","detail":"His work slate, cracked but readable. Bench log: 'R1 1.8. R2 2.0. R3 6.6, label over label. R4 1.9. R5 6.3, label over label. R6 1.9. R7 to R12 tonight, Baek to witness 23:45.' Last note: '21:34 asked to hold until the shuttle. Refused. It goes at 02:00.'","proves":"Lot 44 runs under a third of its certificate, two reserve boxes were doctored, and whoever was in the bay with him at 21:34 asked him to hold it back and learned he would report at 02:00.","atScene":true},{"id":"ev4","name":"Orange jacket and badge","where":"locker 4, Airlock B locker room","detail":"Ekwueme's orange rigger's jacket on the left-hand hook, his badge clipped to the chest pocket, grey rock dust on both cuffs and down the inside front.","proves":"The badge that passed the spine hatch at 22:36 hung in a room nobody was logging, and someone wore the jacket and carried something dusty inside it.","atScene":false},{"id":"ev5","name":"Suit 4 and the helmet bag","where":"Airlock B suit rack, and under Ekwueme's bunk","detail":"Suit 4 racked damp, its recorder lamp amber for unread data. Under his bunk, a helmet bag holding a pod-rack caddy liner with two kilos of coffee, tobacco and a litre of rum, tagged from the Marisol's stores.","proves":"Ekwueme was on the hull collecting a tug's contraband, which explains the Airlock B gap and the caddy masses Aalto queried.","atScene":false},{"id":"ev6","name":"Core boxes 44-R3 and 44-R5","where":"bottom drawer of the grade office sample cabinet, behind Lot 45 trays","detail":"Two reserve core boxes labelled 44-R3 and 44-R5, each label stuck over an older one reading LOT 39 RESERVE, the core inside darker than Lot 44 rock.","proves":"The boxes taken from the bay were carried to the assay chief's office that night, and they show the reserve set was salted with richer core.","atScene":false}],"forensics":{"tod":"Rapid decompression: both eardrums burst, lungs torn, gas in the heart and great vessels, three nails torn on the door handle; no blow and no wound. He was dead within two minutes of the bay losing pressure, and body temperature against the bay's 19 degrees puts that between 22:20 and 23:10.","prints":"The purge panel, key switch and bay door carry only nitrile-glove smears. Ekwueme's badge, found clipped to the chest pocket of his orange jacket on the left-hand hook of locker 4 in the Airlock B locker room, has a right thumb partial of Dalia Khoury on its back, laid over his own prints; the tool-crib key carries his alone, and Suit 4's glove liners hold Ekwueme's biometrics and nobody else's. Boxes 44-R3 and 44-R5, recovered from the bottom drawer of the grade office sample cabinet behind the Lot 45 trays, carry Khoury's prints on the Lot 39 labels underneath. A hel
