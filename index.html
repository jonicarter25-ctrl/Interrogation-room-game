 B","detail":"Gauge at 91 per cent after forty-four minutes sealed, as it should be. The coupling collar has fresh bright scratches across its keying lugs and a shred of white thread tape caught in them.","proves":"Something other than the keyed green line was forced onto this bottle; the gauge says how much gas, not which.","atScene":true},{"id":"ev3","name":"Spare-cell drawer","where":"rack B, Airlock B suit bay","detail":"Four spare oxygen cells: three sealed in foil, one pouch torn open with the cell bare and its cap gone. Macaraeg's 18:10 daily check lists four sealed. On the rack above, the gas analyser carries a red tag two weeks old: 'out of service, check by charge log and gauge'.","proves":"The cap in Strand's helmet came out of this drawer after 18:10 that evening, and nobody at rack B could test what was in a bottle.","atScene":true},{"id":"ev4","name":"Strand's draft to the Safety Board","where":"his slate on the engineering office desk","detail":"Held for 02:00 with SR-2231 attached: Noor Baptiste's report of a weeping crack at the loop B feed manifold, closed 'sensor artefact, no action' on T. Parata's badge with no inspection logged, and Baptiste sent down 'unsuited' a month later. Last line, added 21:31: 'Delete of SR-2231 attempted from ENG-1 at 20:22 on T. Parata's badge.'","proves":"Strand was about to end Tane Parata's career, and Parata was at the office terminal at 20:22.","atScene":false},{"id":"ev5","name":"EVA sheet","where":"Macaraeg's slate, handed to Kobayashi at the muster","detail":"EVA B, 22:15: Strand, thumbed 19:41; tender Macaraeg; standby Tipene, thumbed 20:50. Margin note: 'hydro empty, pump off, 20:18'. Mix check line: 'analyser red-tagged, by log and gauge; ES says skip the portable'.","proves":"The gas in the bottle was never analysed, and the standby was not in hydroponics at 20:18.","atScene":false},{"id":"ev6","name":"Two taped fittings","where":"the fittings drawer on the hydroponics gas bench","detail":"Among forty loose fittings, a black-line socket and a bottle-thread nipple each carry fresh white thread tape; nothing else in the drawer is taped. Hydroponics draws black-line nitrogen to blanket its feed tanks.","proves":"Screwed together these two put black-line nitrogen into a suit bottle, and they were joined and parted recently.","atScene":false}],"forensics":{"tod":"Hypoxia: no injury, no decompression, lungs clear, blood oxygen near nil with no rise in carbon dioxide, as when rebreathed air runs out of oxygen and the man never feels it. Suit telemetry has the helmet sealed at 22:19, his pulse climbing to 124 by 22:43 and stopping at 22:53.","prints":"The seal cap carries no ridges, only a smear from a green nitrile glove and dried feed salts of the kind mixed in hydroponics. Macaraeg's prints are on the bottle, helmet latches and winch; Tane Parata's are on the engineering office door and ENG-1 and nowhere in the suit bay. In the fittings drawer on the hydroponics gas bench, two of some forty loose fittings carry fresh white thread tape, a black-line socket and a bottle-thread nipple; the nipple has blue suit-bottle thread paste inside it.","comms":"Queue for 02:00, unsent: Strand to the Orbital Safety Board, 'SR-2231 attached. Closed without inspection by acting chief T. Parata. I will image the manifold tonight and send both.' Archive: a session at ENG-1 on T. Parata's badge with commands at 20:15, 20:19, 20:22 (DELETE SR-2231, refused: compliance hold, Strand), 20:27 and 20:30. Suit 3's camera sent four images of the loop B manifold from 22:38 to 22:40: a hairline crack with a frost bloom.","tox":"No drug, alcohol or poison in Strand's blood. The gas left in suit 3's bottle is 97 per cent nitrogen, and the air in the suit when the helmet came off held 5 per cent oxygen; rack B's green line delivers 99.5 per cent oxygen and its black line dry nitrogen.","logs":"Rack B: suit 3's bottle last charged on the 9th, green line, Macaraeg; maintenance mode set 20:09 and restored 20:34, nothing logged between, and no other gap this month. Engineering office, from 20:00: Strand out 20:05; T. Parata in 20:13, out 20:32; Strand in 21:20, out 21:50. Comms blister: Wrona in 19:16, out 19:33; in 20:03, out 20:21. Power: hydroponics feed pump F-1 drew nothing on Thursday until 20:43 and ran to 21:04; on the six Thursdays before it ran 52 to 58 minutes. Reactor hatch: T. Parata in 21:52, Brandt out 22:04."},"redHerring":"Tane Parata: Strand's ultimatum at dinner, a report that would finish him, his claim to have stayed in his bunk and a refused delete of SR-2231 in the half hour the rack went dark make him the obvious hand. But the engineering office door has his badge in at 20:13 and out at 20:32, ENG-1 took five commands from him in between, the hub is five minutes away, and nothing of his is in the suit bay.","solutionPath":["Lab assay and the seal cap: suit 3's bottle held 97 per cent nitrogen and a forty-one-day-old cell had been capped, so alarm and telemetry read trapped air; he was killed by work done on his suit before he dressed.","Macaraeg's 18:10 check (full bottle, four sealed spares, green lamp) and the logs report fix when: rack B's only unlogged gap is maintenance mode from 20:09 to 20:34.","Parata has the motive in Strand's queued message (comms report) and lies about his bunk, but the engineering office door log (in 20:13, out 20:32) and his ENG-1 commands, the refused delete at 20:22 among them, keep him on the ring through the gap.","Wrona saw Tipene at rack B with a bottle on the charging arm and the lamp amber and puts it at 19:33; the lamp was amber only from 20:09 to 20:34, so it was her second trip out of the blister, badge out 20:21.","Tipene's alibi fails twice: the power log has feed pump F-1 idle until 20:43, and Macaraeg says he found hydroponics and its seed store empty with the pump off at 20:18.","Trace sweep: hydroponics feed salts and a green-glove smear on the seal cap, and suit-bottle thread paste inside a freshly taped fitting in the hydroponics drawer.","Motive: Parata told her at 19:12 and heard 'Leave Emil to me', and Macaraeg heard Strand refuse her at 19:38. Name Mere Tipene: she filled Strand's bottle with nitrogen and blinded his helmet cell to keep her brother out of prison."]},"briefs":[{"name":"Mere Tipene","part":"killer","personality":"Unhurried and dry, a Gisborne grower who talks to officers the way she talks to seedlings: patiently and without much hope. She says 'yeah, nah', 'eh' and 'mate', deflects by pointing at the work waiting for her and the time this is costing, and when cornered gets loud and blunt rather than clever. Talk of charging Tane shakes her more than anything aimed at herself.","voiceSample":"Yeah, nah. Bay 2 gets its feed changed Thursdays whether a man dies or not; lettuce doesn't read the incident board, eh.","relationship":"She half liked Strand: he ate her tomatoes and said so. She thinks he was right about the manifold and had no give in him about people, and she is calmer about what she did than she ought to be.","movements":[{"from":"18:00","to":"19:36","where":"hydroponics, the galley, hydroponics","doing":"Evening checks, dinner at 18:30; from 19:12 Tane told her about SR-2231 and she sent him to his bunk at 19:30.","seenBy":["Tane Parata","Kasia Wrona","Rodel Macaraeg"]},{"from":"19:38","to":"19:41","where":"ring corridor","doing":"Asked Strand to hold the report until the shuttle and was refused.","seenBy":["Rodel Macaraeg"]},{"from":"19:43","to":"20:03","where":"hydroponics","doing":"Parked the feed cart and made up the adapter from two fittings and tape.","seenBy":[]},{"from":"20:03","to":"20:40","where":"spoke and Airlock B suit bay","doing":"Rack B in maintenance mode 20:09 to 20:34: nitrogen into suit 3's bottle, cap on the helmet cell.","seenBy":["Kasia Wrona"]},{"from":"20:40","to":"21:20","where":"hydroponics","doing":"Ran feed pump F-1 from 20:43 to 21:04, thumbed Rodel's sheet at 20:50, stripped the adapter.","seenBy":["Rodel Macaraeg"]},{"from":"21:20","to":"22:46","where":"her cabin","doing":"Lay awake until Rodel's standby call.","seenBy":[]},{"from":"22:46","to":"02:00","where":"Airlock B suit bay, galley, her cabin","doing":"At the suit bay by 22:52, half suited when the helmet came off; muster 23:40; cabin from 00:20.","seenBy":["Rodel Macaraeg","Hana Kobayashi"]}],"knows":["Tane, the brother she raised from when he was eleven (Tipene is her late husband's name), told her in hydroponics at 19:12 that Strand had found SR-2231, the loop B report he closed as acting chief without inspecting, and would send it at 02:00; she said 'Go to your bunk. Leave Emil to me' (she was there).","At 19:38 outside the engineering office she asked Strand to hold it until the shuttle; he said 'He has had fourteen months, Mere', and Rodel walked up with the EVA sheet as he said it (she was there).","She reckoned that with Strand dead nothing of his would go at 02:00, and Tane would have until the shuttle to put his own name on it: the nine days Strand refused her (her own reasoning).","The board had Strand out of B at 22:15 with herself standby, and with rack B's analyser red-tagged nobody would test the bottle (she read the board).","She set rack B to maintenance at 20:09, bled suit 3's bottle, filled it from the black line through her adapter, capped the helmet cell with a spare's cap and restored the rack at 20:34 (she did it).","Back at 20:40, she started feed pump F-1 at 20:43; at 20:50 Rodel said he had come by and found nobody, and she said she had been in the seed store since eight (she did it).","Her work gloves carry feed salts; the adapter is back in her drawer as two fittings and the gloves went into the digester (she did it).","At 23:03 she reached for the helmet to get the cap back and Rodel said nobody touches the suit; Dr Nasser found the cap at 23:21 (she was there).","Nitrogen in a recycling suit gives no warning: no choking, light-headed, then out; everyone learns it in suit school (training)."],"doesNotKnow":["That Kasia Wrona was in the comms blister and saw her at rack B at 20:21.","That Rodel wrote 'hydro empty, pump off, 20:18' on the EVA sheet.","That the security officer has pulled, or will pull, feed pump F-1's power trace; she never thought of the pump as a clock when she picked her story.","That Tane went to the engineering office and tried to delete the report."],"secret":"She killed Strand to keep her brother out of prison. Tane must never know it was done for him, and she will not see him charged with it.","lies":[{"claim":"I was in hydro from quarter to eight till twenty past nine: seed store from eight pulling trays while the pump ran on bay 2. Rodel got my thumb there at ten to nine. If he says he looked in earlier and found nobody, he never came through to the seed store.","truth":"She was out of hydroponics from 20:03 to 20:40 and only started feed pump F-1 at 20:43.","when":"Asked where she was between eight and nine, or about the feed change.","crack":"The WARDEN power log showing feed pump F-1 drew nothing until 20:43."},{"claim":"I didn't go up to the hub at all between dinner and Rodel's call. No reason to, mate.","truth":"She was at rack B from 20:08 to 20:35.","when":"Asked whether she went to the hub, the suit bay or rack B that evening.","crack":"Kasia Wrona's statement that she saw her at rack B with a bottle on the charging arm."},{"claim":"All right, yes. About half seven I looked over my standby suit, two minutes, rack on green, never touched Emil's. Slipped my mind, eh.","truth":"She was at rack B from 20:08 to 20:35, lamp amber, working on suit 3; at half past seven she was in hydroponics with Tane.","when":"Only once Wrona's sighting has been put to her.","crack":"The trace sweep finding hydroponics feed salts and a green-glove smear on the seal cap in Strand's helmet."},{"claim":"Tane told me nothing. I stopped Emil in the corridor about my standby slot, that's all; first I heard of any report was at the im":"After dinner I went to my bunk and stayed there till I went on watch at ten to ten. Who's saying different?","truth":"He was with Mere in hydroponics from 19:12 to 19:30 and in the engineering office from 20:13 to 20:32.","when":"Asked where he was between dinner and his watch.","crack":"The WARDEN door log with his badge into the engineering office at 20:13 and out at 20:32."},{"claim":"It was a paperwork thing, a closure code he didn't like. To be fair, Emil didn't like most of them.","truth":"He closed a real safety report without inspection and had its author sent down; it would cost him his licence and perhaps five years.","when":"Asked what Strand meant at dinner, or about loop B.","crack":"The comms report quoting Strand's unsent message to the Orbital Safety Board: 'SR-2231 attached. Closed without inspection by acting chief T. Parata.'"},{"claim":"I didn't talk to anyone about it. Not even Mere; she's got enough on.","truth":"He told Mere everything at 19:12 and she said 'Leave Emil to me'.","when":"Asked who else knew about the report, or what he said to his sister.","crack":"Rodel Macaraeg's statement of what he heard Strand say to Mere at 19:38: 'He has had fourteen months, Mere'."}],"honestMistake":null,"tells":["Thumbs the dosimeter at his collar as if checking his dose.","Makes a joke, then asks who told you."],"pressure":{"baseline":32,"breakPoint":60,"lawyerPoint":82,"style":"lawyer"},"opening":"Save you asking: yes, he had a go at me at dinner and the whole galley heard. Bunk, then watch. That's the lot, honestly."},{"name":"Kasia Wrona","part":"mistaken","personality":"Brisk, exact and faintly amused, a comms operator who trusts logs over people and treats her own memory as a log. Her English is a shade formal, without contractions when she is firm ('that is a badge time, not an opinion'); she deflects by correcting the wording of the question. If her accuracy is doubted she goes clipped and then silent.","voiceSample":"Nineteen thirty-three ages'; she did not open it (she saw the queue).","In the galley at 20:27 Macaraeg, at tea with Demir, said he had been to hydroponics for Mere's thumb and found nobody (she heard it).","She saw neither Tane nor Macaraeg in the hub on either trip (she saw)."],"doesNotKnow":["Who killed Strand, or what was wrong with his suit.","When rack B was in maintenance mode.","What SR-2231 says beyond its header.","Where Tane was after dinner, or what Mere and Strand said to each other."],"secret":"An operator is not supposed to read the headers of other people's held traffic, and she noticed Strand's to the Safety Board at about 19:20. She owns up if asked what was in the 02:00 queue.","lies":[],"honestMistake":{"claim":"I saw Mere at rack B when I came out of the blister the first time, 19:33 by my badge: a bottle on the arm, lamp amber. The standby looking over her suit; nothing in it.","truth":"She saw it on her second trip out, at 20:21; at 19:33 the suit bay was empty and the lamp green.","why":"Two near-identical trips inside an hour, her mind on the tracking fault the second time, and a standby checking a suit just after the board went up made sense for the first."},"tells":["Taps her stylus on the slate once for each time she gives.","Repeats your question back with one word corrected."],"pressure":{"baseline":18,"breakPoint":66,"lawyerPoint":88,"style":"shutdown"},"opening":"I have times for you. I was in the blister twice last night and WARDEN has me in and out to the minute, so let us not waste your morning on 'about'."},{"name":"Rodel Macaraeg","part":"honest","personality":"Warm, direct and wrecked with guilt, a Cebu rigger who calls the officer 'boss' and says 'ay' before bad news. He tells it straight even when it damns him; when it hurts he goes vague and recites the checklist. He does not argue; he agrees with the worst reading of himself.","voiceSample":"Ay, boss, the board was all green and I let a man go out on a bottle nobody tested. Log and gauge, log and p running and the tank barely a hand's width down; she thumbed as standby and said she had been in the seed store since eight (he saw it).","Dressing Strand he had oxygen 20.9 and a full gauge; rack B's own analyser has been red-tagged for two weeks, so he offered to fetch the portable one from Airlock A, ten minutes, and Strand said 'we are late, skip it' (he did it).","At 22:41 Strand laughed and slurred 'tell Parata it is very tidy out here', and answered nothing after 22:44; the board showed oxygen flat at 20.9 and his pulse at 124, then falling (he heard and saw it).","At 23:03 Mere, half suited, reached to take the helmet 'to stow it' and he said nobody touches the suit; at 23:21 Dr Nasser found a blue seal cap on a cell he had fitted uncapped on 4 March (he saw it)."],"doesNotKnow":["Who killed Strand, or what gas was in the bottle.","What Mere and Strand were arguing about, beyond the two lines he heard.","Where Tane was after dinner.","That rack B was in maintenance mode between his check and the EVA, or that Wrona saw anyone there."],"secret":"His shame is the mix check: a portable analyser was ten minutes away in Airlock A and he let Strand wave it off. He admits it if asked directly.","lies":[],"honestMistake":null,"tells":["Turns his open hands palm down on the table and presses them flat.","Recites the pre-EVA checklist under his breath when it gets hard."],"pressure":{"baseline":30,"breakPoint":56,"lawyerPoint":85,"style":"tears"},"opening":"Boss. I dressed him, I checked him, I sent him out and I reeled him back in dead. Ask me anything; I have been asking myself all night."}],"id":"orbital_3"}]}</script>

async function requestHint() {

function computeMissed() {
  const out = [];
  const groups = lieGroups();
  const caught = (g) => { if (g.admitted) return true; const st = lieStatus(g); return st.cited || st.linked; };
  for (const g of groups.filter((x) => x.label === 'lie' && !caught(x)).slice(0, 3)) out.push(`${g.suspect}'s lie was never challenged: \u201c${g.text}\u201d`);
  for (const g of groups.filter((x) => x.label === 'mistaken' && !caught(x)).slice(0, 1)) out.push(`${g.suspect}'s honest mistake was never corrected: \u201c${g.text}\u201d`);
  const st = stOf();
  for (const f of st.forensics.filter((x) => !G.forensics[x.id]).slice(0, 2)) out.push(`Never requested: ${f.name}.`);
  return out.slice(0, 5);
}

TRUTH: the killer is ${t.killer}. Accomplice: ${t.accomplice || 'none'}. Motive: ${t.motive} Method: ${t.method}
Solution path: ${arr(t.solutionPath).join(' / ')}
Evidence in the case: ${arr(t.evidence).map((e) => `${e.name}: ${e.proves}`).join('; ')}

THE ACCUSATION: the detective accused ${acc.killer}${acc.accomplice ? ` with ${acc.accomplice} as accomplice` : ' and named no accomplice'}. The killer's name is ${killerCorrect ? 'CORRECT' : 'WRONG'}${t.accomplice ? `; the accomplice is ${acc.accCorrect ? 'CORRECT' : 'WRONG'}` : ''} (already scored separately; do not score the names again).

/* deterministic audit of a truth file: returns a list of problems for one repair call */
const TITLES = new Set(['mr', 'mrs', 'miss', 'ms', 'dr', 'sir', 'lady', 'lord', 'captain', 'capt', 'colonel', 'col', 'major', 'rev', 'the', 'hon', 'professor', 'prof', 'nurse', 'sister', 'father', 'brother']);

  const probs = [];
  const names = t.suspects.map((s) => s.name);
  for (const n of names) { const c = t.timeline.filter((e) => e.present.some((p) => sameName(p.trim(), n))).length; if (c < 2) probs.push(`Suspect ${n} appears in fewer than two timeline entries; account for their movements through the night.`); }
  const gf = nightOffset(t.alibiGap.from, t.night.start), gt = nightOffset(t.alibiGap.to, t.night.start);
  if (gf == null || gt == null) probs.push('alibiGap.from and alibiGap.to must be HH:MM times inside the night.');
  else if (!t.timeline.some((e) => { const o = nightOffset(e.time, t.night.start); return o >= gf && o <= gt; })) probs.push('No timeline entry falls inside the alibi gap; the murder must appear in the timeline within it.');
  if (!t.evidence.length || t.evidence.length < 3) probs.push('Provide at least 4 evidence items that result from the timeline.');
  else if (!t.evidence.some((e) => e.atScene)) probs.push('Mark at least one evidence item atScene: true.');
  if (t.publicFacts.length < 3) probs.push('Provide at least 5 public facts.');
  const plan = dials ? castPlan(normDials(dials)) : [];
  if (plan.includes('accomplice') && !t.accomplice) probs.push('The case requires an accomplice: name one suspect as "accomplice" (part and top-level field).');
  if (plan.includes('mistaken') && !t.suspects.some((s) => s.part === 'mistaken')) probs.push('One suspect must have part "mistaken".');
  const liars = t.suspects.filter((s) => s.part === 'liar').length, wantLiars = plan.filter((x) => x === 'liar').length;
  if (liars < wantLiars) probs.push(`The case requires ${wantLiars} non-killer liar(s); only ${liars} suspect(s) have part "liar".`);
  for (const f of Object.keys(t.forensics)) if (t.forensics[f] === 'The report is inconclusive.') probs.push(`Forensic report "${f}" is missing a true, specific result.`);
  if (!t.solutionPath.length) probs.push('Provide a solutionPath of 5-7 steps.');

function viewTimeline(pins, events) {
  const t = G.truth; const start = toMin(t.night.start), span = nightOffset(t.night.end, t.night.start) || 390;
  const off = (time) => { const o = nightOffset(time, t.night.start); return o > span + 360 ? o - 1440 : o; };
  const bucket = (o) => Math.floor(o / 60) * 60;
  const hours = []; for (let m = 0; m <= span; m += 60) hours.push(m);
  for (const x of [...(events || []), ...pins]) { const b = bucket(off(x.time)); if (!hours.includes(b)) hours.push(b); }
  hours.sort((a, b) => a - b);
  return `<div class="timeline">${hours.map((h) => {
    const evs = (events || []).filter((e) => bucket(off(e.time)) === h).sort((a, b) => off(a.time) - off(b.time));
    const ps = pins.filter((p) => bucket(off(p.time)) === h).sort((a, b) => off(a.time) - off(b.time));
    const has = evs.length || ps.length;
    return `<div class="tl-h ${has ? 'has' : ''}">${hhmm(start + h)}</div><div class="tl-c">${evs.map((e) => `<div class="tl-ev ${e.murder ? 'murder' : ''}"><b>${esc(e.time)}</b>${esc(e.event)} <em style="color:var(--muted)">${esc(e.place)}${arr(e.present).length ? ' · ' + esc(e.present.join(', ')) : ''}</em></div>`).join('')}${ps.map((p) => `<div class="tl-pin">“${esc(p.text)}”<small>${esc(p.source)} · refers to ${esc(p.time)}${linksOf(p.id).some((l) => l.type === 'contradicts') ? ' · <span style="color:var(--lie)">contradiction marked</span>' : ''}</small></div>`).join('')}</div>`;
  }).join('')}</div>`;
}

function transcriptText() {
  const t = G.truth, st = stOf();
  const out = [`${t.title} (${st.name}) · Interrogation Room`, `Killer: ${t.killer}${t.accomplice ? ' with ' + t.accomplice : ''}. Score ${G.score?.total ?? '?'} (${G.score?.rank || ''}).`, ''];
  for (const b of G.briefs) {
    const s = G.suspects[b.name];
    out.push(`== ${b.name} (${PART_LABEL[b.part] || b.part})`);
    for (const m of s.transcript) {
      if (m.role === 'det') out.push(`Detective (${m.tone || 'direct'}${m.presented ? ', presenting ' + m.presented.source : ''}): ${m.text}`);
      else if (m.role === 'sus') { out.push(`${b.name}: ${m.text}`); for (const l of G.lieLog.filter((x) => x.msgId === m.id && (x.label === 'lie' || x.label === 'mistaken'))) out.push(`   [${l.label}] "${l.text}" — ${l.truth}`); }
      else out.push(`   (${m.text})`);
    }
    out.push('');
  }
  return out.join('\n');
}
function markLies(text, lies) {
  const spans = [];
  for (const l of lies) {
    const needle = String(l.text || '').trim(); if (needle.length < 6) continue;
    const i = text.toLowerCase().indexOf(needle.toLowerCase()); if (i < 0) continue;
    if (spans.some((s) => i < s.end && i + needle.length > s.start)) { l.found = true; continue; }
    spans.push({ start: i, end: i + needle.length, label: l.label, found: true }); l.found = true;
  }
  spans.sort((a, b) => a.start - b.start);
  let out = '', pos = 0;
  for (const s of spans) { out += esc(text.slice(pos, s.start)) + `<mark class="${s.label}">${esc(text.slice(s.start, s.end))}</mark>`; pos = s.end; }
  return out + esc(text.slice(pos));
}
function replayMsg(m, name) {
  if (m.role === 'sys') return `<div class="msg sys"><div class="b">${esc(m.text)}</div></div>`;
  if (m.role === 'det') return `<div class="msg det"><div class="b">${esc(m.text)}</div><div class="m">You · ${esc(m.tone || '')}${m.presented ? ' · presented ' + esc(m.presented.source) : ''}</div></div>`;
  const lies = G.lieLog.filter((l) => l.msgId === m.id && (l.label === 'lie' || l.label === 'mistaken')).map((l) => ({ ...l }));
  const body = markLies(m.text, lies);
  const unfound = lies.filter((l) => !l.found);
  return `<div class="msg sus"><div class="b">${body}</div>${unfound.map((l) => `<div class="flag ${l.label}">${l.label === 'lie' ? 'Lie' : 'Mistaken'}: “${esc(l.text)}” · ${esc(l.truth)}</div>`).join('')}<div class="m">${esc(name)}</div></div>`;
}

  switch (act) {
    case 'menu': return menuSheet();
    case 'settings': return settingsSheet();
    case 'tier': S.tier = btn.dataset.tier === 'deep' ? 'deep' : 'quick'; safeSet(KEY_SET, S); return settingsSheet();
    case 'writer': S.writer = ['quick', 'standard', 'deep'].includes(btn.dataset.tier) ? btn.dataset.tier : 'standard'; safeSet(KEY_SET, S); return settingsSheet();
    case 'setting': if (SETTINGS[id]) { S.setting = id; safeSet(KEY_SET, S); } return render();
    case 'preset': S.preset = PRESETS[id] ? id : 'custom'; if (S.preset === 'custom' && !S.dials) S.dials = { ...PRESETS.inspector.dials }; safeSet(KEY_SET, S); return render();
    case 'dial': { const d = currentDials(); const k = btn.dataset.k; d[k] = (d[k] || 0) + num(btn.dataset.d); S.dials = normDials(d); S.preset = 'custom'; safeSet(KEY_SET, S); return render(); }
    case 'dial-toggle': { const d = currentDials(); d[btn.dataset.k] = !d[btn.dataset.k]; S.dials = normDials(d); S.preset = 'custom'; safeSet(KEY_SET, S); return render(); }
    case 'dial-set': { const d = currentDials(); d[btn.dataset.k] = num(btn.dataset.v); S.dials = normDials(d); S.preset = 'custom'; safeSet(KEY_SET, S); return render(); }
    case 'training': { const saved = safeGet(KEY_GAME, null); if (!G && inProgress(saved)) { return confirmSheet('Open the training case?', `The case in progress, ${saved.truth?.title || 'untitled'}, will be deleted.`, 'training-do', 'Open training case'); } return handleAct({ dataset: { act: 'training-do' } }); }
    case 'training-do': { closeModal(); const tc = pickTraining(S.setting); if (!tc) return; safeDel(KEY_GAME); const st = SETTINGS[tc.settingId]; const dials = normDials(tc.dials || { suspects: arr(tc.truth?.suspects).length || 4, liars: 1, mistaken: true, accomplice: !!tc.truth?.accomplice, hours: 6 }); try { const truth = normalizeTruth(JSON.parse(JSON.stringify(tc.truth)), st, dials); const briefs = normalizeBriefs({ briefs: JSON.parse(JSON.stringify(tc.briefs)) }, truth); G = newGame(tc.settingId, truth, briefs, dials, { training: true, trainingId: tc.id }); ui.tab = 'case'; save(); render(); toast('Training case open. Read the file, then start asking.'); } catch (e) { console.error(e); toast('The training case could not be loaded.'); } return; }
    case 'gallery': return gallerySheet();
    case 'intro': closeModal(); ui.intro = true; render(); window.scrollTo(0, 0); return;
    case 'intro-done': safeSet(KEY_INTRO, true); ui.intro = false; render(); window.scrollTo(0, 0); return;
    case 'hint': return requestHint();
    case 'play-shared': return playShared(id);
    case 'play-shared-do': { const sid = ui.sharedPending; ui.sharedPending = null; closeModal(); return playShared(sid, true); }
    case 'share-case': return shareCase();
    case 'casebook': return casebookSheet();
    case 'open-case': return openCaseFromBook(id);
    case 'remove-case': { const book = casebook(); const c = book.find((x) => x.id === id); if (!c) return; ui.removeId = id; return confirmSheet('Remove this case?', `${c.title} is removed from your casebook here${cloud.db && cloud.uid ? ' and from your synced casebook' : ''}. A shared copy in the gallery stays.`, 'remove-case-do', 'Remove'); }
    case 'remove-case-do': { const rid = ui.removeId; ui.removeId = null; if (!rid) return closeModal(); safeSet(KEY_BOOK, casebook().filter((x) => x.id !== rid)); if (cloud.db && cloud.uid && cloud.canWrite) myCases().doc('case_' + rid).delete().catch(() => {}); closeModal(); render(); toast('Removed.'); return casebookSheet(); }
    case 'import': return importSheet();
    case 'import-confirm': {
      const ta = $('#import-text'), err = $('#import-err');
      try { const c = parseCaseCode(ta.value.trim()); const saved = safeGet(KEY_GAME, null); if (!G && inProgress(saved)) { ui.importOk = c; return confirmSheet('Open the shared case?', `The case in progress, ${saved.truth?.title || 'untitled'}, will be deleted.`, 'import-do', 'Open shared case'); } closeModal(); G = newGame(c.settingId, c.truth, c.briefs, c.dials); ui.tab = 'case'; save(); render(); toast('Shared case opened.'); }
      catch { if (err) { err.textContent = 'That is not a valid case code. Copy the whole thing from the reveal screen.'; err.hidden = false; } }
      return;
    }
    case 'import-do': { const c = ui.importOk; ui.importOk = null; if (!c) return closeModal(); closeModal(); safeDel(KEY_GAME); G = newGame(c.settingId, c.truth, c.briefs, c.dials); ui.tab = 'case'; save(); render(); toast('Shared case opened.'); return; }
    case 'close-modal': return closeModal();
    case 'home': closeModal(); if (G && (G.phase === 'reveal' || G.phase === 'verdict')) { if (!G.readOnly) safeDel(KEY_GAME); } G = null; ui.genStep = null; ui.genError = null; return render();
    case 'new': { const saved = safeGet(KEY_GAME, null); if (!G && inProgress(saved) && !ui.genError) return confirmSheet('Start a new case?', `The case in progress, ${saved.truth?.title || 'untitled'}, will be deleted.`, 'new-do', 'Start new case'); closeModal(); ui.tab = 'case'; return generateCase(S.setting, currentDials()); }
    case 'new-do': closeModal(); safeDel(KEY_GAME); ui.tab = 'case'; return generateCase(S.setting, currentDials());
    case 'rebrief': { const r = ui.resumeTruth; if (!r) return generateCase(S.setting, currentDials()); closeModal(); ui.tab = 'case'; return generateCase(r.settingId, r.dials, { truth: r.truth }); }
    case 'stop-gen': stopBusy(); stopGenTicker(); ui.genStep = null; ui.genError = null; G = null; return render();
    case 'resume': { const saved = safeGet(KEY_GAME, null); if (saved?.truth) { G = tidy(saved); ui.tab = 'case'; render(); } return; }
    case 'abandon': return confirmSheet('Abandon the saved case?', 'The case in progress is deleted. Finished cases in the casebook are kept.', 'abandon-do', 'Abandon');
    case 'abandon-confirm': return confirmSheet('Abandon this case?', 'You lose the transcript and the board. The night stays sealed and is not revealed.', 'abandon-do', 'Abandon');
    case 'abandon-do': stopBusy(); closeModal(); safeDel(KEY_GAME); G = null; return render();
    case 'tab': ui.tab = btn.dataset.tab; ui.linkFrom = null; return render();
    case 'goto-sus': G.active = name; ui.tab = 'interrogate'; return render();
    case 'pick-sus': { const ta = $('#q'); if (ta) ui.draft.q = ta.value; G.active = name; return render(); }
    case 'tone': ui.tone = btn.dataset.tone; { const ta = $('#q'); if (ta) ui.draft.q = ta.value; } return render();
    case 'present': return presentSheet();
    case 'present-choose': { const p = G.board.pins.find((x) => x.id === id); if (p) ui.present = p; closeModal(); return render(); }
    case 'present-pin': { const p = G.board.pins.find((x) => x.id === id); if (p) { ui.present = p; ui.tab = 'interrogate'; render(); toast(`Presenting to ${G.active}. Ask your question.`); } return; }
    case 'present-forensic': { const st = stOf(), f = st.forensics.find((x) => x.id === id), got = G.forensics[id]; if (!f || !got) return; let p = G.board.pins.find((x) => x.kind === 'forensic' && x.msgId === id); if (!p) p = addPin({ kind: 'forensic', text: got.result, source: f.name, msgId: id }); ui.present = p; ui.tab = 'interrogate'; render(); toast(`Presenting the report to ${G.active}. Ask your question.`); return; }
    case 'unpresent': ui.present = null; { const ta = $('#q'); if (ta) ui.draft.q = ta.value; } return render();
    case 'ask': return sendQuestion();
    case 'chip': { const ta = $('#q'); if (ta) { ta.value = btn.dataset.q || ''; ta.focus(); ta.dispatchEvent(new Event('input')); } return; }
    case 'stop': return stopBusy();
    case 'counsel': return waitForCounsel(name);
    case 'forensic': return requestForensic(id);
    case 'pin-forensic': { const st = stOf(), f = st.forensics.find((x) => x.id === id), got = G.forensics[id]; if (f && got && !G.board.pins.some((x) => x.kind === 'forensic' && x.msgId === id)) { addPin({ kind: 'forensic', text: got.result, source: f.name, msgId: id }); toast('Report pinned.'); } return render(); }
    case 'pin-scene': { const e = G.truth.evidence.find((x) => x.id === id); if (e && !G.board.pins.some((x) => x.kind === 'scene' && x.msgId === id)) { addPin({ kind: 'scene', text: `${e.name}: ${e.detail}`, source: `Scene · ${e.where}`, msgId: id }); toast('Scene item pinned.'); } return render(); }
    case 'pin-msg': return pinSheet(id, name);
    case 'pin-confirm': { const text = $('#pin-text')?.value.trim(), time = $('#pin-time')?.value || null; if (!text) return; addPin({ kind: 'quote', text, source: name, msgId: id, time: toMin(time) != null ? time : null }); closeModal(); render(); toast('Pinned to the board.'); return; }
    case 'pin-time': return timeSheet(id);
    case 'time-confirm': { const p = G.board.pins.find((x) => x.id === id); const v = $('#pin-time')?.value; if (p) { p.time = toMin(v) != null ? v : null; save(); } closeModal(); return render(); }
    case 'time-clear': { const p = G.board.pins.find((x) => x.id === id); if (p) { p.time = null; save(); } closeModal(); return render(); }
    case 'add-note': return noteSheet();
    case 'note-confirm': { const text = $('#note-text')?.value.trim(), time = $('#pin-time')?.value || null; if (!text) return; addPin({ kind: 'note', text, source: 'Your note', time: toMin(time) != null ? time : null }); closeModal(); return render(); }
    case 'unpin': removePin(id); return render();
    case 'bview': ui.boardView = btn.dataset.v; ui.linkFrom = null; return render();
    case 'link-from': ui.linkFrom = id; return render();
    case 'link-cancel': ui.linkFrom = null; return render();
    case 'link-to': if (ui.linkFrom) { addLink(ui.linkFrom, id, btn.dataset.type === 'supports' ? 'supports' : 'contradicts'); ui.linkFrom = null; toast(btn.dataset.type === 'supports' ? 'Marked as supporting.' : 'Contradiction marked.'); } return render();
    case 'unlink': G.board.links = G.board.links.filter((l) => l.id !== id); save(); return render();
    case 'reveal': G.phase = 'reveal'; save(); return render();
    case 'copy-transcript': { const txt = transcriptText(); return copyText(txt).then((ok) => { if (!ok) openModal(`<h3>Transcript</h3><textarea rows="10" readonly onclick="this.select()">${esc(txt)}</textarea><div class="row"><button class="btn ghost" data-act="close-modal">Close</button></div>`); }); }
    case 'copy-result': { const r = `${G.truth.title} · ${stOf().short} · ${G.score.total}/100, ${G.score.rank}${G.accusation?.killerCorrect ? ', killer named' : ', wrong name'} · Interrogation Room`; return copyText(r).then((ok) => { if (!ok) openModal(`<h3>Your result</h3><textarea rows="3" readonly onclick="this.select()">${esc(r)}</textarea><div class="row"><button class="btn ghost" data-act="close-modal">Close</button></div>`); }); }
    case 'copy-code': return copyText(caseCode()).then((ok) => { if (!ok) openModal(`<h3>Case code</h3><p class="note">Copying was blocked. Select the text below and copy it yourself.</p><textarea rows="8" readonly onclick="this.select()">${esc(caseCode())}</textarea><div class="row"><button class="btn ghost" data-act="close-modal">Close</button></div>`); });
    case 'replay': { const saved = safeGet(KEY_GAME, null); if (G.readOnly && inProgress(saved) && saved.id !== G.id) return confirmSheet('Play this case again?', `The case in progress, ${saved.truth?.title || 'untitled'}, will be deleted.`, 'replay-do', 'Play again'); return handleAct({ dataset: { act: 'replay-do' } }); }
    case 'replay-do': { const c = { settingId: G.settingId, truth: G.truth, briefs: G.briefs, dials: G.dials, training: G.training, sharedFrom: G.sharedFrom, sharedId: G.sharedId }; closeModal(); G = newGame(c.settingId, c.truth, c.briefs, c.dials, { training: c.training, sharedFrom: c.sharedFrom, sharedId: c.sharedId }); ui.tab = 'case'; save(); render(); toast('Same night, fresh suspects.'); return; }
    default: return;
  }
}

function sendQuestion() {
  const ta = $('#q'); if (!ta) return;
  const q = ta.value.trim(); if (!q) { ta.focus(); return; }
  if (busy) { toast(busy.kind === 'hint' ? 'Wait for the nudge to arrive.' : 'Wait for the current answer.'); return; }
  if (!sample) { toast(errCopy({ code: 'not_granted' })); return; }
  ta.value = ''; ui.draft.q = '';
  const present = ui.present; ui.present = null;
  askSuspect(G.active, q, ui.tone, present);
}

let downOnBackdrop = false;
document.addEventListener('pointerdown', (ev) => { downOnBackdrop = ev.target === modalEl; });
document.addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-act]');
  if (btn) { ev.preventDefault(); handleAct(btn); return; }
  if (ev.target === modalEl && downOnBackdrop) closeModal();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && !modalEl.hidden) { closeModal(); return; }
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.keyCode !== 229 && ev.target?.id === 'q') { ev.preventDefault(); sendQuestion(); }
});
document.addEventListener('submit', (ev) => {
  if (ev.target?.id !== 'accform') return;
  ev.preventDefault();
  const killer = $('#acc-killer').value, accomplice = $('#acc-accomplice')?.value || '', motive = $('#acc-motive').value.trim(), method = $('#acc-method').value.trim();
  const pinIds = $$('input[name=ev]:checked').map((i) => i.value);
  ui.draft.acc = { killer, accomplice, motive, method, pinIds };
  const err = $('#acc-err');
  const problems = [];
  if (!killer) problems.push('name the killer');
  if (accomplice && accomplice === killer) problems.push('the accomplice cannot be the killer');
  if (motive.length < 12) problems.push('give a motive in a sentence or two');
  if (method.length < 12) problems.push('describe the method');
  if (!pinIds.length) problems.push('cite at least one piece of evidence');
  if (problems.length) { err.textContent = `Before you lodge it: ${problems.join('; ')}.`; err.hidden = false; return; }
  confirmSheet('Lodge the accusation?', `You accuse ${killer}${accomplice ? ` and name ${accomplice} as accomplice` : ''}. This closes the case and reveals the night.`, 'accuse-do', 'Accuse');
});
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act="accuse-do"]');
  if (!b) return;
  closeModal();
  const a = ui.draft.acc; ui.draft.acc = null;
  if (a) submitAccusation(a);
});
document.addEventListener('input', (ev) => { if (ev.target?.id === 'q') { ev.target.style.height = 'auto'; ev.target.style.height = Math.min(140, ev.target.scrollHeight + ev.target.offsetHeight - ev.target.clientHeight) + 'px'; } });

/* ───────────────────────── boot ───────────────────────── */
function tidy(g) {
  if (g.phase === 'scoring') g.phase = 'play';
  if (g.truth) { const ren = { exchange: 'comms', staff: 'logs' }; for (const [o, n] of Object.entries(ren)) { if (g.truth.forensics && o in g.truth.forensics) { g.truth.forensics[n] = g.truth.forensics[o]; delete g.truth.forensics[o]; } if (g.forensics && o in g.forensics) { g.forensics[n] = g.forensics[o]; delete g.forensics[o]; } for (const p of arr(g.board?.pins)) if (p.kind === 'forensic' && p.msgId === o) p.msgId = n; } if (!('accomplice' in g.truth)) g.truth.accomplice = null; }
  g.board = g.board && typeof g.board === 'object' ? g.board : {}; g.board.pins = arr(g.board.pins); g.board.links = arr(g.board.links); g.forensics = g.forensics && typeof g.forensics === 'object' ? g.forensics : {}; g.lieLog = arr(g.lieLog); g.suspects = g.suspects && typeof g.suspects === 'object' ? g.suspects : {}; g.clock = g.clock && typeof g.clock === 'object' ? g.clock : { used: 0, budget: 360 };
  if (!g.dials) g.dials = normDials({ suspects: Object.keys(g.suspects || {}).length || 4, liars: 1, mistaken: true, accomplice: !!g.truth?.accomplice, hours: Math.round((g.clock?.budget || 360) / 60) });
  const cost = (SETTINGS[g.settingId] || SETTINGS.country_house).questionCost;
  for (const s of Object.values(g.suspects || {})) { const dropped = arr(s.transcript).filter((m) => m.pending); s.transcript = arr(s.transcript).filter((m) => !m.pending); for (const d of dropped) if (g.clock) g.clock.used = Math.max(0, g.clock.used - (Number.isFinite(d.charged) ? d.charged : cost)); }
  return g;
}
function start(snap) {
  if (snap && snap.G && snap.G.truth) { G = tidy(snap.G); Object.assign(ui, snap.ui || {}); }
  else { const saved = safeGet(KEY_GAME, null); if (saved?.truth && saved.phase && saved.phase !== 'reveal') { G = tidy(saved); ui.tab = 'case'; if (G.accusation && !G.score) { ui.draft.acc = { killer: G.accusation.killer || '', accomplice: G.accusation.accomplice || '', motive: G.accusation.motive || '', method: G.accusation.method || '', pinIds: arr(G.accusation.pinIds) }; ui.tab = 'accuse'; } } }
  if (!G && !safeGet(KEY_INTRO, false)) ui.intro = true;
  render();
  (async () => {
    try { sample = window.claude?.use ? await window.claude.use('sample') : null; } catch { sample = null; }
    sampleReady = true;
    if (!G) render();
  })();
  initCloud();
}
try { window.claude?.hot?.snapshot?.(() => ({ G, ui: { tab: ui.tab, boardView: ui.boardView, tone: ui.tone } })); } catch { /* not in a viewer */ }
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? null);

})();
</script>
