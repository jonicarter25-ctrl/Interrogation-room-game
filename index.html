}

/* ----- generating ----- */
function viewGenerating() {
  const step = ui.genStep;
  const row = (k, label, est) => { const on = step === k, done = step === 'done' || (k === 'truth' && step === 'briefs'); return `<div class="step ${on ? 'on' : ''} ${done ? 'done' : ''}"><i class="dot"></i><span>${label}</span><span class="st" data-gen="${k}">${done ? 'done' : on ? (ui.genBytes[k] ? `${(ui.genBytes[k] / 1024).toFixed(1)} KB` : 'thinking') : est}</span></div>`; };
  return `<header class="head"><div class="wrap gutter"><div class="brand">Interrogation<br>Room</div><div class="head-title">New case</div></div></header>
  <div class="main gutter"><div class="wrap gen">
    <div class="eyebrow">Writing the night</div>
    <h2 style="margin-top:6px">${step === 'done' ? 'Opening the case' : 'Sealing the truth file'}</h2>
    <p class="lede" style="margin-top:6px">The night is written first, minute by minute, and sealed. The suspects are briefed from it. You only ever see what they choose to tell you.</p>
    <div class="steps">${row('truth', 'Timeline, killer, motive, method, evidence, forensics', '30s to 90s')}${row('briefs', 'Four private briefs: what each saw, knows and will lie about', '30s to 90s')}</div>
    ${ui.genError ? `<div class="err" style="margin-top:14px">${esc(ui.genError)}</div><div class="row" style="margin-top:10px"><button class="btn primary" data-act="new">Try again</button><button class="btn ghost" data-act="home">Back</button></div>` : `<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="stop-gen">Stop</button></div>`}
    <p class="tip">${esc(pick(TIPS))}</p>
  </div></div>`;
}
function paintGen() { for (const k of ['truth', 'briefs']) { const el = $(`[data-gen="${k}"]`); if (el && ui.genStep === k) el.textContent = ui.genBytes[k] ? `${(ui.genBytes[k] / 1024).toFixed(1)} KB` : 'thinking'; } if (ui.genStep === 'briefs' || ui.genStep === 'done') { const steps = $$('.step'); if (steps[0]) { steps[0].classList.remove('on'); steps[0].classList.add('done'); const st = steps[0].querySelector('.st'); if (st) st.textContent = 'done'; } if (steps[1] && ui.genStep === 'briefs') steps[1].classList.add('on'); } }

/* ----- case file ----- */
function viewCase() {
  const t = G.truth, st = stOf();
  const scene = t.evidence.filter((e) => e.atScene);
  const pinnedScene = (id) => G.board.pins.some((p) => p.kind === 'scene' && p.msgId === id);
  return `<div class="stack">
    <div class="file">
      <div class="stamp">Confidential</div>
      <h2>${esc(t.title)}</h2>
      <p>${esc(t.house)} ${esc(t.weather)}</p>
      <h3>The deceased</h3>
      <p><b>${esc(t.victim.name)}</b>, ${esc(t.victim.age || '')}${t.victim.age ? ', ' : ''}${esc(t.victim.role)}. ${esc(t.victim.sketch)}</p>
      <h3>Discovery</h3>
      <p>Found at <b>${esc(t.night.discovered)}</b> in ${esc(t.night.where)} by ${esc(t.night.discoveredBy)}. Questioning began at ${esc(st.clock.start)}; you have ${fmtMin(G.clock.budget)} before the Chief Constable wants a name.</p>
      <h3>What the household already knows</h3>
      <ul>${t.publicFacts.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>
      <h3>Noted at the scene</h3>
      ${scene.length ? scene.map((e) => `<div class="evitem"><div class="d"><b>${esc(e.name)}</b>${esc(e.where)}. ${esc(e.detail)}</div><button data-act="pin-scene" data-id="${esc(e.id)}" ${pinnedScene(e.id) ? 'disabled' : ''}>${pinnedScene(e.id) ? 'Pinned' : 'Pin'}</button></div>`).join('') : '<p>Nothing of note was recorded at the scene.</p>'}
    </div>
    <div class="card">
      <div class="eyebrow">The household</div>
      <div class="bios" style="margin-top:10px">${t.suspects.map((s) => `<div class="bio"><b>${esc(s.name)}</b>${s.age ? `, ${esc(s.age)}` : ''}<div class="r">${esc(s.role)}</div><p>${esc(s.sketch)}</p><button class="btn sm" style="margin-top:8px" data-act="goto-sus" data-name="${esc(s.name)}">Question</button></div>`).join('')}</div>
    </div>
    <div class="card">
      <div class="eyebrow">Forensics</div>
      <p class="note" style="margin:6px 0 10px">Each report costs clock time. Results are true. Pin them to the board to use them.</p>
      <div class="foren">${st.forensics.map((f) => {
        const got = G.forensics[f.id];
        const pinned = got && G.board.pins.some((p) => p.kind === 'forensic' && p.msgId === f.id);
        return `<div class="fo"><div class="hd"><b>${esc(f.name)}</b>${got ? `<span class="cost">received ${esc(clockAt(st.clock.start, got.at))}</span>` : `<button class="btn sm" data-act="forensic" data-id="${f.id}" ${outOfTime() || timeLeft() < f.minutes ? 'disabled' : ''}>Request · ${fmtMin(f.minutes)}</button>`}</div>${got ? `<div class="res">${esc(got.result)}</div><div class="row"><button class="btn sm" data-act="pin-forensic" data-id="${f.id}" ${pinned ? 'disabled' : ''}>${pinned ? 'Pinned' : 'Pin to board'}</button><button class="btn sm ghost" data-act="present-forensic" data-id="${f.id}">Present to a suspect</button></div>` : ''}</div>`;
      }).join('')}</div>
    </div>
  </div>`;
}

/* ----- interrogation ----- */
function viewInterrogate() {
  const name = G.active && G.suspects[G.active] ? G.active : G.briefs[0].name;
  G.active = name;
  const s = G.suspects[name], brief = briefOf(name), sus = G.truth.suspects.find((x) => x.name === name), st = stOf();
  const roster = G.briefs.map((b) => { const x = G.suspects[b.name]; const r = G.truth.suspects.find((q) => q.name === b.name); return `<button class="sus ${b.name === name ? 'on' : ''}" data-act="pick-sus" data-name="${esc(b.name)}"><span class="nm">${esc(b.name)}</span><span class="rl">${esc(r?.role || '')}</span><span class="pbar ${x.state}"><i style="width:${x.pressure}%"></i></span><span class="stt ${x.state}">${STATE_LABEL[x.state]} · ${x.transcript.filter((m) => m.role === 'det').length} q</span></button>`; }).join('');
  const msgs = s.transcript.map((m) => msgHtml(m, name)).join('');
  const closed = outOfTime()
    ? `<div class="closed"><b>Out of time.</b> The Chief Constable wants a name. Go to Accuse.<button class="btn primary" data-act="tab" data-tab="accuse">Make the accusation</button></div>`
    : s.state === 'lawyered'
      ? `<div class="closed"><b>${esc(name)} will not answer without a solicitor.</b> ${s.waited ? 'You have already waited once. This witness is done talking.' : `Waiting for one costs ${fmtMin(st.solicitorWait)} and they will answer more carefully afterwards.`}${s.waited ? '' : `<button class="btn" data-act="solicitor" data-name="${esc(name)}">Wait for the solicitor · ${fmtMin(st.solicitorWait)}</button>`}</div>`
      : null;
  const composer = closed || `<div class="composer">
      <div class="tools">
        <div class="seg" role="group" aria-label="Tone">${Object.keys(TONES).map((k) => `<button data-act="tone" data-tone="${k}" class="${ui.tone === k ? 'on' : ''}">${k}</button>`).join('')}</div>
        ${ui.present ? `<span class="chip info"><span class="t" title="${esc(ui.present.text)}">Presenting: ${esc(ui.present.source)}: ${esc(ui.present.text.slice(0, 48))}${ui.present.text.length > 48 ? '…' : ''}</span><button class="x" data-act="unpresent" aria-label="Remove">×</button></span>` : `<button class="btn sm ghost" data-act="present" ${G.board.pins.length ? '' : 'disabled'} title="Put a pinned statement or report in front of the suspect">Present evidence</button>`}
        <span class="note" style="margin-left:auto">${st.questionCost} min per question</span>
      </div>
      <div class="in"><textarea id="q" rows="1" placeholder="Ask ${esc(name.split(' ')[0])} something…" ${busy ? 'disabled' : ''}></textarea>${busy?.kind === 'ask' ? `<button class="btn send" data-act="stop" aria-label="Stop">Stop</button>` : `<button class="btn primary send" data-act="ask" aria-label="Ask">Ask</button>`}</div>
    </div>`;
  return `<div class="inter">
    <div class="roster">${roster}</div>
    <div class="transcript">
      <div class="t-head"><div class="who"><b>${esc(name)}</b><span>${esc(sus?.role || '')}</span></div><div class="stt">${STATE_LABEL[s.state]}<br><span style="color:var(--fg-2)">pressure ${s.pressure}</span></div></div>
      <div class="msgs" id="msgs">${msgs}</div>
      ${composer}
    </div>
  </div>`;
}
function msgHtml(m, name) {
  if (m.role === 'sys') return `<div class="msg sys"><div class="b">${esc(m.text)}</div></div>`;
  if (m.role === 'det') return `<div class="msg det" data-msg="${m.id}">${m.presented ? `<div class="pres">Presented · ${esc(m.presented.source)}: “${esc(m.presented.text.slice(0, 120))}${m.presented.text.length > 120 ? '…' : ''}”</div>` : ''}<div class="b">${esc(m.text)}</div><div class="m">You · ${esc(m.tone)} · ${esc(clockAt(stOf().clock.start, m.clock))}</div></div>`;
  const pinned = G.board.pins.some((p) => p.msgId === m.id);
  return `<div class="msg sus" data-msg="${m.id}"><div class="b ${m.pending ? 'thinking' : ''}">${esc(m.text)}</div><div class="m">${esc(name)} · ${esc(clockAt(stOf().clock.start, m.clock))}${m.pending || m.opening ? '' : ` <button data-act="pin-msg" data-id="${m.id}" data-name="${esc(name)}">${pinned ? 'Pin another quote' : 'Pin quote'}</button>`}</div></div>`;
}
function scrollChat(instant) { const el = $('#msgs'); if (!el) return; const last = el.lastElementChild; if (last) last.scrollIntoView({ block: 'end', behavior: instant ? 'instant' : 'smooth' }); }

/* ----- board ----- */
function viewBoard() {
  const pins = G.board.pins;
  const tools = `<div class="board-tools">
      <div class="seg" role="group" aria-label="View"><button data-act="bview" data-v="pins" class="${ui.boardView === 'pins' ? 'on' : ''}">Pins</button><button data-act="bview" data-v="timeline" class="${ui.boardView === 'timeline' ? 'on' : ''}">Timeline</button></div>
      <button class="btn sm ghost" data-act="add-note">Add a note</button>
      <span class="note" style="margin-left:auto">${pins.length} pinned · ${G.board.links.filter((l) => l.type === 'contradicts').length} contradictions</span>
    </div>`;
  const linkbar = ui.linkFrom ? `<div class="linkbar" style="margin-bottom:12px"><span class="grow">Linking from <b>“${esc((pins.find((p) => p.id === ui.linkFrom) || {}).text?.slice(0, 60) || '')}”</b>. Choose the second card.</span><button class="btn sm ghost" data-act="link-cancel">Cancel</button></div>` : '';
  if (!pins.length) return tools + `<div class="empty"><p>Nothing on the board yet.</p><p class="note" style="margin-top:6px">Pin quotes from the transcript, scene items from the case file, and forensic reports. Then link the ones that cannot both be true.</p></div>`;
  if (ui.boardView === 'timeline') return tools + linkbar + viewTimeline(pins.filter((p) => p.time), null) + unplaced(pins.filter((p) => !p.time));
  return tools + linkbar + `<div class="pins">${pins.slice().reverse().map(pinHtml).join('')}</div>`;
}
function pinHtml(p) {
  const links = linksOf(p.id);
  return `<article class="pin ${p.kind} ${ui.linkFrom === p.id ? 'sel' : ''}" data-pin="${p.id}">
    <div class="q">“${esc(p.text)}”</div>
    <div class="src"><b>${esc(p.source)}</b><span>${p.kind === 'quote' ? 'said at ' + esc(clockAt(stOf().clock.start, p.clock)) : p.kind}</span>${p.time ? `<span class="tm">refers to ${esc(p.time)}</span>` : ''}</div>
    ${links.length ? `<div class="links">${links.map((l) => `<div class="lk ${l.type}"><span class="kind">${l.type}</span><span>“${esc(l.other.text.slice(0, 70))}${l.other.text.length > 70 ? '…' : ''}” <em style="color:var(--paper-muted)">${esc(l.other.source)}</em></span><button class="x" data-act="unlink" data-id="${l.id}" aria-label="Remove link">×</button></div>`).join('')}</div>` : ''}
    <div class="acts">${ui.linkFrom && ui.linkFrom !== p.id ? `<button data-act="link-to" data-id="${p.id}" data-type="contradicts" style="border-color:var(--lie);color:var(--lie)">Contradicts</button><button data-act="link-to" data-id="${p.id}" data-type="supports" style="border-color:var(--truth);color:var(--truth)">Supports</button>` : `<button data-act="link-from" data-id="${p.id}">Link</button><button data-act="pin-time" data-id="${p.id}">${p.time ? 'Time' : 'Set time'}</button><button data-act="present-pin" data-id="${p.id}">Present</button><button data-act="unpin" data-id="${p.id}">Remove</button>`}</div>
  </article>`;
}
function viewTimeline(pins, events) {
  const t = G.truth; const start = toMin(t.night.start), span = nightOffset(t.night.end, t.night.start) || 390;
  const hours = []; for (let m = 0; m <= span; m += 60) hours.push(m);
  const bucket = (off) => Math.floor(off / 60) * 60;
  return `<div class="timeline">${hours.map((h) => {
    const evs = (events || []).filter((e) => bucket(nightOffset(e.time, t.night.start)) === h).sort((a, b) => nightOffset(a.time, t.night.start) - nightOffset(b.time, t.night.start));
    const ps = pins.filter((p) => bucket(nightOffset(p.time, t.night.start)) === h).sort((a, b) => nightOffset(a.time, t.night.start) - nightOffset(b.time, t.night.start));
    const has = evs.length || ps.length;
    return `<div class="tl-h ${has ? 'has' : ''}">${hhmm(start + h)}</div><div class="tl-c">${evs.map((e) => `<div class="tl-ev ${e.murder ? 'murder' : ''}"><b>${esc(e.time)}</b>${esc(e.event)} <em style="color:var(--muted)">${esc(e.place)}${arr(e.present).length ? ' · ' + esc(e.present.join(', ')) : ''}</em></div>`).join('')}${ps.map((p) => `<div class="tl-pin">“${esc(p.text)}”<small>${esc(p.source)} · refers to ${esc(p.time)}${linksOf(p.id).some((l) => l.type === 'contradicts') ? ' · <span style="color:var(--lie)">contradiction marked</span>' : ''}</small></div>`).join('')}</div>`;
  }).join('')}</div>`;
}
function unplaced(pins) {
  if (!pins.length) return '';
  return `<div class="card" style="margin-top:14px"><div class="eyebrow">Not yet placed</div><p class="note" style="margin:4px 0 10px">Give these a time to see them on the night.</p><div class="row">${pins.map((p) => `<button class="chip" data-act="pin-time" data-id="${p.id}"><span class="t">${esc(p.source)}: ${esc(p.text.slice(0, 50))}${p.text.length > 50 ? '…' : ''}</span></button>`).join('')}</div></div>`;
}

/* ----- accuse ----- */
function viewAccuse() {
  const pins = G.board.pins;
  const a = ui.draft.acc || {};
  return `<div class="card">
    <div class="eyebrow">The accusation</div>
    <p class="lede" style="margin:6px 0 14px">Name the killer, the motive and the method, and cite the evidence you stand on. You are scored on the reasoning, not only the name. ${outOfTime() ? '' : `You still have ${fmtMin(timeLeft())}; the suspects will wait.`}</p>
    <form class="form" id="accform">
      <div><label class="f" for="acc-killer">The killer</label><select id="acc-killer"><option value="">Choose…</option>${G.truth.suspects.map((s) => `<option value="${esc(s.name)}" ${a.killer === s.name ? 'selected' : ''}>${esc(s.name)} · ${esc(s.role)}</option>`).join('')}</select></div>
      <div><label class="f" for="acc-motive">Motive</label><textarea id="acc-motive" placeholder="Why did they do it? Be specific.">${esc(a.motive || '')}</textarea></div>
      <div><label class="f" for="acc-method">Method</label><textarea id="acc-method" placeholder="How, where and when. What did they do with the weapon or the traces?">${esc(a.method || '')}</textarea></div>
      <div><label class="f">Evidence cited (${pins.length} on the board)</label>
        ${pins.length ? `<div class="evlist">${pins.map((p) => `<label><input type="checkbox" name="ev" value="${p.id}" ${(a.pinIds || []).includes(p.id) ? 'checked' : ''}><span><span class="q">“${esc(p.text.slice(0, 160))}${p.text.length > 160 ? '…' : ''}”</span><small>${esc(p.source)}${p.time ? ' · ' + esc(p.time) : ''}${linksOf(p.id).some((l) => l.type === 'contradicts') ? ' · contradiction marked' : ''}</small></span></label>`).join('')}</div>` : `<div class="empty">No evidence pinned. Go back and pin the statements and reports your case rests on.</div>`}
      </div>
      <div id="acc-err" class="err" hidden></div>
      <div class="row"><button type="submit" class="btn primary" ${pins.length ? '' : 'disabled'}>Lodge the accusation</button><span class="note">This ends the case.</span></div>
    </form>
  </div>`;
}

/* ----- verdict & reveal ----- */
function viewVerdict() {
  const sc = G.score, a = G.accusation, t = G.truth;
  return `<div class="stack">
    <div class="card">
      <div class="eyebrow">Verdict</div>
      <div class="score" style="margin-top:8px"><div><div class="big">${sc.total}</div><div class="rank">${esc(sc.rank)}</div></div>
        <div class="parts"><span><b>${sc.killer}/40</b>killer</span><span><b>${sc.motive}/20</b>motive</span><span><b>${sc.method}/20</b>method</span><span><b>${sc.evidence}/20</b>evidence</span></div></div>
      <div class="rule"></div>
      <p class="${a.killerCorrect ? 'ok' : 'err'}">${a.killerCorrect ? `You named ${esc(t.killer)}. Correct.` : `You accused ${esc(a.killer)}. The killer was ${esc(t.killer)}.`}</p>
      ${sc.verdict ? `<p class="verdict" style="margin-top:12px">${esc(sc.verdict)}</p>` : ''}
      ${sc.unscored ? `<p class="note" style="margin-top:8px">Motive, method and evidence could not be graded (Claude was unavailable), so only the name counts here.</p>` : ''}
      ${sc.caught?.length ? `<h3 style="margin-top:14px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--truth)">What you caught</h3><ul style="margin:6px 0 0;padding-left:18px">${sc.caught.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${sc.missed?.length ? `<h3 style="margin-top:14px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn)">What you missed</h3><ul style="margin:6px 0 0;padding-left:18px">${sc.missed.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      <div class="row" style="margin-top:16px"><button class="btn primary" data-act="reveal">Replay the true night</button></div>
    </div>
  </div>`;
}
function viewReveal(readOnly) {
  const t = G.truth;
  const murderTime = t.alibiGap?.from;
  const events = t.timeline.map((e) => ({ ...e, murder: murderTime && nightOffset(e.time, t.night.start) >= nightOffset(murderTime, t.night.start) && nightOffset(e.time, t.night.start) <= (nightOffset(t.alibiGap?.to, t.night.start) ?? -1) }));
  const lies = G.lieLog.filter((l) => l.label === 'lie' || l.label === 'mistaken');
  const parts = { killer: 'the killer', liar: 'lied to hide a secret', mistaken: 'honest but mistaken', honest: 'honest' };
  return `<div class="stack">
    <div class="card">
      <div class="eyebrow">What really happened</div>
      <h2 style="margin-top:6px;font-size:22px">${esc(t.title)}</h2>
      <dl class="kv" style="margin-top:10px"><dt>Killer</dt><dd><b>${esc(t.killer)}</b></dd><dt>Motive</dt><dd>${esc(t.motive)}</dd><dt>Method</dt><dd>${esc(t.method)}</dd><dt>Red herring</dt><dd>${esc(t.redHerring)}</dd></dl>
      <div class="row" style="margin-top:12px">${G.briefs.map((b) => `<span class="chip ${b.part === 'killer' ? 'lie' : b.part === 'liar' ? 'warn' : b.part === 'mistaken' ? 'info' : 'truth'}"><span class="t">${esc(b.name)} · ${parts[b.part] || b.part}</span></span>`).join('')}</div>
    </div>
    <div class="card">
      <div class="eyebrow">The lies, in the order they were told</div>
      ${lies.length ? `<div class="lies" style="margin-top:10px">${lies.map((l) => { const s = lieStatus(l); return `<div class="lie ${l.label}"><div class="who"><b>${esc(l.suspect)}</b><span>${esc(clockAt(stOf().clock.start, l.clock))}</span><span class="badge ${l.label}">${l.label === 'lie' ? 'lie' : 'honest mistake'}</span>${s.cited ? '<span class="badge caught">cited</span>' : s.linked ? '<span class="badge caught">contradiction marked</span>' : s.pinned ? '<span class="badge caught">pinned</span>' : ''}${l.admitted ? '<span class="badge admit">later admitted</span>' : ''}</div><div class="q">“${esc(l.text)}”</div><div class="tr">${esc(l.truth || '')}</div></div>`; }).join('')}</div>` : `<p class="note" style="margin-top:6px">No lies were recorded during questioning. Either nobody was pressed, or the referee could not annotate the answers.</p>`}
    </div>
    <div class="card">
      <div class="eyebrow">The true night, with your pins</div>
      <div style="margin-top:12px">${viewTimeline(G.board.pins.filter((p) => p.time), events)}</div>
    </div>
    <div class="card">
      <div class="eyebrow">How a sharp detective gets there</div>
      <ol style="margin:8px 0 0;padding-left:20px;color:var(--fg-2)">${t.solutionPath.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>
    </div>
    <div class="row">${readOnly ? `<button class="btn" data-act="home">Back</button>` : `<button class="btn primary" data-act="home">Close the case</button>`}<button class="btn ghost" data-act="copy-code">Copy case code to share</button><button class="btn ghost" data-act="replay">Play this case again</button></div>
    <p class="note">Case code: anyone who pastes it under “Play a shared case” gets the same sealed night with fresh suspects.</p>
  </div>`;
}

/* ----- modals ----- */
function openModal(html) { modalEl.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}</div>`; modalEl.hidden = false; const f = modalEl.querySelector('textarea,input,select,button'); if (f) setTimeout(() => f.focus(), 30); }
function closeModal() { modalEl.hidden = true; modalEl.innerHTML = ''; }

function pinSheet(msgId, name) {
  const s = G.suspects[name]; const m = s?.transcript.find((x) => x.id === msgId); if (!m) return;
  const sel = String(window.getSelection?.()?.toString() || '').trim();
  const prefill = sel && m.text.includes(sel) ? sel : m.text;
  openModal(`<h3>Pin a quote</h3><p class="note">Trim to the exact words you want on the board. You can pin several quotes from one answer.</p>
    <div><label class="f" for="pin-text">${esc(name)} said</label><textarea id="pin-text" rows="4">${esc(prefill)}</textarea></div>
    <div><label class="f" for="pin-time">Refers to what time on the night? (optional)</label><input type="time" id="pin-time" step="300"></div>
    <div class="row"><button class="btn primary" data-act="pin-confirm" data-id="${msgId}" data-name="${esc(name)}">Pin to board</button><button class="btn ghost" data-act="close-modal">Cancel</button></div>`);
}
function timeSheet(pinId) {
  const p = G.board.pins.find((x) => x.id === pinId); if (!p) return;
  openModal(`<h3>Place on the timeline</h3><div class="sheet-sel">“${esc(p.text)}”</div>
    <div><label class="f" for="pin-time">What time on the night does this refer to?</label><input type="time" id="pin-time" step="300" value="${esc(p.time || '')}"></div>
    <p class="note">The night runs ${esc(G.truth.night.start)} to ${esc(G.truth.night.end)}.</p>
    <div class="row"><button class="btn primary" data-act="time-confirm" data-id="${pinId}">Save</button>${p.time ? `<button class="btn ghost" data-act="time-clear" data-id="${pinId}">Clear</button>` : ''}<button class="btn ghost" data-act="close-modal">Cancel</button></div>`);
}
function noteSheet() {
  openModal(`<h3>Add a note</h3><p class="note">Your own working note. It goes on the board like a pin.</p>
    <div><textarea id="note-text" rows="3" placeholder="e.g. Nobody saw the study door between 21:40 and 22:10"></textarea></div>
    <div><label class="f" for="pin-time">Time on the night (optional)</label><input type="time" id="pin-time" step="300"></div>
    <div class="row"><button class="btn primary" data-act="note-confirm">Add</button><button class="btn ghost" data-act="close-modal">Cancel</button></div>`);
}
function presentSheet() {
  const pins = G.board.pins;
  openModal(`<h3>Present evidence</h3><p class="note">Put one pinned item in front of ${esc(G.active)}. Choose what cannot be true if their story holds.</p>
    <div class="picker">${pins.slice().reverse().map((p) => `<button data-act="present-choose" data-id="${p.id}"><span class="q">“${esc(p.text.slice(0, 140))}${p.text.length > 140 ? '…' : ''}”</span><small>${esc(p.source)}${p.time ? ' · ' + esc(p.time) : ''}</small></button>`).join('')}</div>
    <div class="row"><button class="btn ghost" data-act="close-modal">Cancel</button></div>`);
}
function menuSheet() {
  openModal(`<h3>Case menu</h3>
    <div class="stack">
      <button class="btn block" data-act="close-modal">Back to the case</button>
      <button class="btn block ghost" data-act="settings">Settings</button>
      <button class="btn block ghost" data-act="casebook">Casebook</button>
      <button class="btn block ghost danger" data-act="abandon-confirm">Abandon this case</button>
    </div>`);
}
function settingsSheet() {
  openModal(`<h3>Settings</h3>
    <div><label class="f">Suspects are played by</label>
      <div class="seg"><button data-act="tier" data-tier="quick" class="${S.tier === 'quick' ? 'on' : ''}">Quick</button><button data-act="tier" data-tier="deep" class="${S.tier === 'deep' ? 'on' : ''}">Thoughtful</button></div>
      <p class="note" style="margin-top:8px">Quick answers in a few seconds. Thoughtful suspects reason more before speaking and take noticeably longer each turn. The referee and case writer are unaffected.</p></div>
    <div class="row"><button class="btn primary" data-act="close-modal">Done</button></div>`);
}
function casebookSheet() {
  const book = casebook();
  openModal(`<h3>Casebook</h3>${book.length ? `<div class="casebook">${book.map(cbRow).join('')}</div>` : '<p class="note">No finished cases yet.</p>'}<div class="row"><button class="btn ghost" data-act="close-modal">Close</button></div>`);
}
function importSheet() {
  openModal(`<h3>Play a shared case</h3><p class="note">Paste a case code from someone's reveal screen. You get the same sealed night, with the suspects fresh.</p>
    <textarea id="import-text" rows="5" placeholder='{"ir":1,…}'></textarea><div id="import-err" class="err" hidden></div>
    <div class="row"><button class="btn primary" data-act="import-confirm">Open the case</button><button class="btn ghost" data-act="close-modal">Cancel</button></div>`);
}
function confirmSheet(title, body, act, label) {
  openModal(`<h3>${esc(title)}</h3><p class="lede">${esc(body)}</p><div class="row"><button class="btn danger" data-act="${act}">${esc(label)}</button><button class="btn ghost" data-act="close-modal">Cancel</button></div>`);
}

/* ───────────────────────── events ───────────────────────── */
function openCaseFromBook(id) {
  const c = casebook().find((x) => x.id === id);
  if (!c?.game) { toast('That case could not be loaded.'); return; }
  closeModal();
  G = c.game; G.phase = 'reveal'; G.readOnly = true;
  render();
}

function handleAct(btn) {
  const act = btn.dataset.act, id = btn.dataset.id, name = btn.dataset.name;
  switch (act) {
    case 'menu': return menuSheet();
    case 'settings': return settingsSheet();
    case 'tier': S.tier = btn.dataset.tier === 'deep' ? 'deep' : 'quick'; safeSet(KEY_SET, S); return settingsSheet();
    case 'casebook': return casebookSheet();
    case 'open-case': return openCaseFromBook(id);
    case 'import': return importSheet();
    case 'import-confirm': {
      const ta = $('#import-text'), err = $('#import-err');
      try { const c = parseCaseCode(ta.value.trim()); closeModal(); G = newGame(c.settingId, c.truth, c.briefs); ui.tab = 'case'; save(); render(); toast('Shared case opened.'); }
      catch { err.textContent = 'That is not a valid case code. Copy the whole thing from the reveal screen.'; err.hidden = false; }
      return;
    }
    case 'close-modal': return closeModal();
    case 'home': closeModal(); if (G && (G.phase === 'reveal' || G.phase === 'verdict')) { if (!G.readOnly) safeDel(KEY_GAME); } G = null; ui.genStep = null; ui.genError = null; return render();
    case 'new': closeModal(); ui.tab = 'case'; return generateCase('country_house');
    case 'stop-gen': stopBusy(); ui.genStep = null; G = null; return render();
    case 'resume': { const saved = safeGet(KEY_GAME, null); if (saved?.truth) { G = saved; ui.tab = 'case'; render(); } return; }
    case 'abandon': return confirmSheet('Abandon the saved case?', 'The case in progress is deleted. Finished cases in the casebook are kept.', 'abandon-do', 'Abandon');
    case 'abandon-confirm': return confirmSheet('Abandon this case?', 'You lose the transcript and the board. The night stays sealed and is not revealed.', 'abandon-do', 'Abandon');
    case 'abandon-do': stopBusy(); closeModal(); safeDel(KEY_GAME); G = null; return render();
    case 'tab': ui.tab = btn.dataset.tab; ui.linkFrom = null; return render();
    case 'goto-sus': G.active = name; ui.tab = 'interrogate'; return render();
    case 'pick-sus': { const ta = $('#q'); if (ta) ui.draft.q = ta.value; G.active = name; return render(); }
    case 'tone': ui.tone = btn.dataset.tone; { const ta = $('#q'); if (ta) ui.draft.q = ta.value; } return render();
    case 'present': return presentSheet();
    case 'present-choose': { const p = G.board.pins.find((x) => x.id === id); if (p) ui.present = p; closeModal(); return render(); }
    case 'present-pin': { const p = G.board.pins.find((x) => x.id === id); if (p) { ui.present = p; ui.tab = 'interrogate'; render(); toast(`Presenting to ${G.active}. Ask your question.`); } return; }
    case 'present-forensic': { const st = stOf(), f = st.forensics.find((x) => x.id === id), got = G.forensics[id]; if (!f || !got) return; let p = G.board.pins.find((x) => x.kind === 'forensic' && x.msgId === id); if (!p) p = addPin({ kind: 'forensic', text: got.result, source: f.name, msgId: id }); ui.present = p; ui.tab = 'interrogate'; render(); toast(`Presenting the report to ${G.active}. Ask your question.`); return; }
    case 'unpresent': ui.present = null; { const ta = $('#q'); if (ta) ui.draft.q = ta.value; } return render();
    case 'ask': return sendQuestion();
    case 'stop': return stopBusy();
    case 'solicitor': return waitForSolicitor(name);
    case 'forensic': return requestForensic(id);
    case 'pin-forensic': { const st = stOf(), f = st.forensics.find((x) => x.id === id), got = G.forensics[id]; if (f && got && !G.board.pins.some((x) => x.kind === 'forensic' && x.msgId === id)) { addPin({ kind: 'forensic', text: got.result, source: f.name, msgId: id }); toast('Report pinned.'); } return render(); }
    case 'pin-scene': { const e = G.truth.evidence.find((x) => x.id === id); if (e && !G.board.pins.some((x) => x.kind === 'scene' && x.msgId === id)) { addPin({ kind: 'scene', text: `${e.name}: ${e.detail}`, source: `Scene · ${e.where}`, msgId: id }); toast('Scene item pinned.'); } return render(); }
    case 'pin-msg': return pinSheet(id, name);
    case 'pin-confirm': { const text = $('#pin-text')?.value.trim(), time = $('#pin-time')?.value || null; if (!text) return; addPin({ kind: 'quote', text, source: name, msgId: id, time: toMin(time) != null ? time : null }); closeModal(); render(); toast('Pinned to the board.'); return; }
    case 'pin-time': return timeSheet(id);
    case 'time-confirm': { const p = G.board.pins.find((x) => x.id === id); const v = $('#pin-time')?.value; if (p) { p.time = toMin(v) != null ? v : null; save(); } closeModal(); return render(); }
    case 'time-clear': { const p = G.board.pins.find((x) => x.id === id); if (p) { p.time = null; save(); } closeModal(); return render(); }
    case 'add-note': return noteSheet();
    case 'note-confirm': { const text = $('#note-text')?.value.trim(), time = $('#pin-time')?.value || null; if (!text) return; addPin({ kind: 'note', text, source: 'Your note', time: toMin(time) != null ? time : null }); closeModal(); return render(); }
    case 'unpin': removePin(id); return render();
    case 'bview': ui.boardView = btn.dataset.v; ui.linkFrom = null; return render();
    case 'link-from': ui.linkFrom = id; return render();
    case 'link-cancel': ui.linkFrom = null; return render();
    case 'link-to': if (ui.linkFrom) { addLink(ui.linkFrom, id, btn.dataset.type === 'supports' ? 'supports' : 'contradicts'); ui.linkFrom = null; toast(btn.dataset.type === 'supports' ? 'Marked as supporting.' : 'Contradiction marked.'); } return render();
    case 'unlink': G.board.links = G.board.links.filter((l) => l.id !== id); save(); return render();
    case 'reveal': G.phase = 'reveal'; save(); return render();
    case 'copy-code': return copyText(caseCode()).then((ok) => { if (!ok) openModal(`<h3>Case code</h3><p class="note">Copying was blocked. Select the text below and copy it yourself.</p><textarea rows="8" readonly onclick="this.select()">${esc(caseCode())}</textarea><div class="row"><button class="btn ghost" data-act="close-modal">Close</button></div>`); });
    case 'replay': { const c = { settingId: G.settingId, truth: G.truth, briefs: G.briefs }; closeModal(); G = newGame(c.settingId, c.truth, c.briefs); ui.tab = 'case'; save(); render(); toast('Same night, fresh suspects.'); return; }
    default: return;
  }
}

function sendQuestion() {
  const ta = $('#q'); if (!ta) return;
  const q = ta.value.trim(); if (!q) { ta.focus(); return; }
  if (!sample) { toast(errCopy({ code: 'not_granted' })); return; }
  ui.draft.q = '';
  const present = ui.present; ui.present = null;
  askSuspect(G.active, q, ui.tone, present);
}

document.addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-act]');
  if (btn) { ev.preventDefault(); handleAct(btn); return; }
  if (ev.target === modalEl) closeModal();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && !modalEl.hidden) { closeModal(); return; }
  if (ev.key === 'Enter' && !ev.shiftKey && ev.target?.id === 'q') { ev.preventDefault(); sendQuestion(); }
});
document.addEventListener('submit', (ev) => {
  if (ev.target?.id !== 'accform') return;
  ev.preventDefault();
  const killer = $('#acc-killer').value, motive = $('#acc-motive').value.trim(), method = $('#acc-method').value.trim();
  const pinIds = $$('input[name=ev]:checked').map((i) => i.value);
  ui.draft.acc = { killer, motive, method, pinIds };
  const err = $('#acc-err');
  const problems = [];
  if (!killer) problems.push('name the killer');
  if (motive.length < 12) problems.push('give a motive in a sentence or two');
  if (method.length < 12) problems.push('describe the method');
  if (!pinIds.length) problems.push('cite at least one piece of evidence');
  if (problems.length) { err.textContent = `Before you lodge it: ${problems.join('; ')}.`; err.hidden = false; return; }
  confirmSheet('Lodge the accusation?', `You accuse ${killer}. This closes the case and reveals the night.`, 'accuse-do', 'Accuse');
});
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act="accuse-do"]');
  if (!b) return;
  closeModal();
  const a = ui.draft.acc; ui.draft.acc = null;
  if (a) submitAccusation(a);
});
document.addEventListener('input', (ev) => { if (ev.target?.id === 'q') { ev.target.style.height = 'auto'; ev.target.style.height = Math.min(140, ev.target.scrollHeight) + 'px'; } });

/* ───────────────────────── boot ───────────────────────── */
function start(snap) {
  if (snap && snap.G && snap.G.truth) { G = snap.G; Object.assign(ui, snap.ui || {}); }
  else { const saved = safeGet(KEY_GAME, null); if (saved?.truth && saved.phase && saved.phase !== 'reveal') { G = saved; if (G.phase === 'scoring') G.phase = 'play'; ui.tab = 'case'; } }
  render();
  (async () => {
    try { sample = window.claude?.use ? await window.claude.use('sample') : null; } catch { sample = null; }
    sampleReady = true;
    if (!G) render();
  })();
}
try { window.claude?.hot?.snapshot?.(() => ({ G, ui: { tab: ui.tab, boardView: ui.boardView, tone: ui.tone } })); } catch { /* not in a viewer */ }
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? null);

})();
</script>
