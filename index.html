<title>Interrogation Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Special+Elite&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: one-screen app frame. Brass-ruled sticky header, a scrolling pane, a sticky tab bar at the foot on phones
   (tabs move into the header on wide screens). The interrogation pane splits into roster + typed transcript on wide screens. */
:root{
  --bg:#0f1815; --panel:#162119; --panel-2:#1c2a21; --line:#2b3c32; --line-2:#3b5044;
  --fg:#ebe3cf; --fg-2:#cbc4b0; --muted:#95a296;
  --accent:#c9a24a; --accent-2:#e3c874; --on-accent:#1b1507;
  --lie:#d0604d; --truth:#78b386; --warn:#dcae4a; --info:#86b5d2;
  --paper:#ece4cf; --paper-2:#dfd5b9; --paper-ink:#1e2a23; --paper-muted:#5c665f; --paper-line:#c9bd9c;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font-display:'Josefin Sans','Futura','Century Gothic','Trebuchet MS',sans-serif;
  --font-type:'Special Elite','American Typewriter','Courier New',monospace;
  --font-body:'Alegreya Sans','Gill Sans','Segoe UI',system-ui,sans-serif;
  --tabs-h:62px; --head-h:56px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e4e1d5; --panel:#f2efe6; --panel-2:#e9e5d8; --line:#cdc7b5; --line-2:#b4ad98;
    --fg:#1b2420; --fg-2:#3a453e; --muted:#616c64;
    --accent:#8a6a1a; --accent-2:#6b5110; --on-accent:#fff9ea;
    --lie:#a93a2b; --truth:#3b7c4a; --warn:#8f650b; --info:#37658a;
    --paper:#fbf7ed; --paper-2:#f0eadb; --paper-ink:#1b2420; --paper-muted:#5f6a62; --paper-line:#d6cdb3;
    --shadow:0 8px 24px rgba(40,35,20,.14);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e4e1d5; --panel:#f2efe6; --panel-2:#e9e5d8; --line:#cdc7b5; --line-2:#b4ad98;
  --fg:#1b2420; --fg-2:#3a453e; --muted:#616c64;
  --accent:#8a6a1a; --accent-2:#6b5110; --on-accent:#fff9ea;
  --lie:#a93a2b; --truth:#3b7c4a; --warn:#8f650b; --info:#37658a;
  --paper:#fbf7ed; --paper-2:#f0eadb; --paper-ink:#1b2420; --paper-muted:#5f6a62; --paper-line:#d6cdb3;
  --shadow:0 8px 24px rgba(40,35,20,.14);
  color-scheme:light;
}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-body);-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--panel)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:.02em;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:1120px;margin:0 auto}
.app{min-height:100%;display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column}
.hidden{display:none!important}

/* Header */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--accent);box-shadow:0 1px 0 var(--line)}
.head .wrap{display:flex;align-items:center;gap:12px;min-height:var(--head-h);padding-block:6px}
.brand{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.18em;font-size:13px;color:var(--accent);white-space:nowrap}
.brand small{display:block;letter-spacing:.08em;font-size:11px;color:var(--muted);text-transform:none;font-family:var(--font-body)}
.head-title{flex:1;min-width:0;font-family:var(--font-display);font-size:15px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums;line-height:1.15}
.clock b{font-family:var(--font-display);font-size:15px;letter-spacing:.06em}
.clock span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.clock.low b{color:var(--warn)}
.clock.out b{color:var(--lie)}
.meter{width:72px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
.clock.low .meter i{background:var(--warn)}
.clock.out .meter i{background:var(--lie)}
.iconbtn{background:transparent;border:1px solid var(--line-2);border-radius:8px;width:38px;height:38px;display:inline-grid;place-items:center;color:var(--fg-2)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}

/* Tabs */
.tabs{position:sticky;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line-2);height:var(--tabs-h)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:100%}
.tab{background:none;border:0;border-top:2px solid transparent;color:var(--muted);font-family:var(--font-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);border-top-color:var(--accent)}
.tab .cnt{position:absolute;display:none}
.tabs-head{display:none}
@media (max-width:599px){.head.incase .brand{display:none}}
@media (min-width:860px) and (max-width:1023px){.head.incase .head-title{display:none}}
@media (min-width:860px){
  :root{--tabs-h:0px}
  .tabs{display:none}
  .tabs-head{display:flex;gap:4px}
  .tabs-head .tab{flex-direction:row;border-top:0;border-bottom:2px solid transparent;padding:10px 12px;font-size:12px;height:var(--head-h)}
  .tabs-head .tab.on{border-bottom-color:var(--accent)}
  .tabs-head .tab svg{width:16px;height:16px}
}

/* Generic blocks */
.pane{padding-block:18px 28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card+.card{margin-top:12px}
.eyebrow{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:var(--accent)}
.lede{color:var(--fg-2);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);border-radius:9px;padding:9px 14px;font-family:var(--font-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;line-height:1.1;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{border-color:var(--lie);color:var(--lie)}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:5px 10px;font-size:11px;letter-spacing:.08em}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--fg-2);background:var(--panel-2);max-width:100%}
.chip.lie{border-color:var(--lie);color:var(--lie)}
.chip.truth{border-color:var(--truth);color:var(--truth)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.info{border-color:var(--info);color:var(--info)}
.chip .x{border:0;background:none;color:inherit;padding:0 2px;line-height:1;font-size:14px}
.chip .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:13.5px;color:var(--muted)}
.rule{height:1px;background:var(--line);margin:14px 0}
textarea,input[type=text],input[type=time],select{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;color:var(--fg);min-width:0}
textarea{resize:vertical;min-height:80px;line-height:1.45}
textarea:focus,input:focus,select:focus{border-color:var(--accent);outline:none}
label.f{display:block;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted);margin-bottom:6px}
.err{border:1px solid var(--lie);color:var(--lie);background:transparent;border-radius:9px;padding:10px 12px;font-size:14px}
.ok{border:1px solid var(--truth);color:var(--truth);border-radius:9px;padding:10px 12px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px}
.kv dt{color:var(--muted);font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding-top:3px}
.kv dd{margin:0;min-width:0}

/* Menu */
.hero{padding-block:34px 18px;text-align:left}
.hero h1{font-size:clamp(28px,9.5vw,58px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;color:var(--fg);overflow-wrap:anywhere}
.hero h1 span{color:var(--accent)}
.hero .sub{margin-top:10px;font-family:var(--font-type);color:var(--fg-2);font-size:15px;max-width:52ch}
.menu-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){.menu-grid{grid-template-columns:1.3fr .9fr}}
.setting{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:18px}
.setting .deco{position:absolute;right:-30px;top:-30px;width:180px;height:180px;opacity:.14;pointer-events:none}
.setting h2{font-size:22px;text-transform:uppercase;letter-spacing:.1em}
.setting .blurb{margin-top:8px;color:var(--fg-2);max-width:56ch}
.soon{display:grid;gap:8px}
.soon .it{display:flex;justify-content:space-between;gap:10px;border:1px dashed var(--line-2);border-radius:9px;padding:9px 12px;color:var(--muted);font-size:14px}
.soon .it b{font-family:var(--font-display);font-weight:600;letter-spacing:.04em;color:var(--fg-2)}
.howto{font-size:14.5px;color:var(--fg-2)}
.howto ol{margin:6px 0 0;padding-left:20px}
.howto li{margin:4px 0}
details summary{cursor:pointer;font-family:var(--font-display);letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--accent)}

.settings-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
@media (min-width:640px){.settings-grid{grid-template-columns:repeat(3,1fr)}}
.scard{position:relative;overflow:hidden;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:12px 12px 10px;color:var(--fg);display:flex;flex-direction:column;gap:4px;min-height:96px}
.scard .deco{position:absolute;right:-18px;top:-14px;width:110px;height:110px;opacity:.14;pointer-events:none}
.scard b{font-family:var(--font-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.scard span{font-size:12.5px;color:var(--muted)}
.scard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.scard.on .deco{opacity:.3;color:var(--accent)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.presets .chip{cursor:pointer}
.presets .chip.on{border-color:var(--accent);color:var(--accent)}
.dials{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
@media (min-width:520px){.dials{grid-template-columns:1fr 1fr}}
.dial{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px}
.dial .k{color:var(--fg-2)}
.stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:transparent;width:30px;height:30px;color:var(--accent);font-size:16px}
.stepper b{min-width:22px;text-align:center;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.switch{border:1px solid var(--line-2);border-radius:999px;width:44px;height:24px;position:relative;background:var(--bg)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{left:23px;background:var(--on-accent)}
.cast{margin-top:12px;font-family:var(--font-type);font-size:14px;color:var(--fg-2)}
.linklist{display:grid;gap:10px}
.lpair{display:grid;grid-template-columns:1fr;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px}
@media (min-width:640px){.lpair{grid-template-columns:1fr auto 1fr}}
.lpair.contradicts{border-color:var(--lie)}
.lpair.supports{border-color:var(--truth)}
.lpair .lmid{display:flex;align-items:center;gap:8px;justify-content:center;font-family:var(--font-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.lpair.contradicts .lmid{color:var(--lie)}
.lpair.supports .lmid{color:var(--truth)}
.lpair .lmid .x{border:0;background:none;color:var(--muted);font-size:16px;padding:0 4px}
.lp{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:8px 10px;font-family:var(--font-type);font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.lp small{display:block;font-family:var(--font-body);color:var(--paper-muted);font-size:12px;margin-top:3px}
.tr-sus{border:1px solid var(--line);border-radius:10px;padding:0 12px}
.tr-sus summary{padding:10px 0;font-size:13px}
.tr-sus .msgs{padding:4px 0 12px}
mark.lie{background:transparent;color:inherit;border-bottom:2px solid var(--lie);box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--lie) 22%,transparent)}
mark.mistaken{background:transparent;color:inherit;border-bottom:2px solid var(--warn);box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--warn) 25%,transparent)}
.flag{font-size:12px;color:var(--lie);margin-top:4px}
.flag.mistaken{color:var(--warn)}
.career{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.career div{border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-align:center}
.career b{display:block;font-family:var(--font-display);font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.career span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--font-display)}
.stamp.tr{border-color:var(--info);color:var(--info)}
/* Generating */
.gen{max-width:620px;margin:28px auto 0}
.gen .steps{display:grid;gap:10px;margin-top:16px}
.step{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--muted)}
.step .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.step.on{color:var(--fg);border-color:var(--accent)}
.step.on .dot{border-color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.step.done .dot{background:var(--truth);border-color:var(--truth)}
.step .st{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);white-space:nowrap}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,162,74,.5)}50%{box-shadow:0 0 0 7px rgba(201,162,74,0)}}
.gen .tip{margin-top:16px;font-family:var(--font-type);color:var(--fg-2);font-size:14px}
@media (prefers-reduced-motion:reduce){.step.on .dot{animation:none}}

/* Interrogation */
.inter{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:860px){.inter{grid-template-columns:260px 1fr;align-items:start}}
.roster{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
@media (min-width:860px){.roster{flex-direction:column;overflow:visible;position:sticky;top:calc(var(--head-h) + env(safe-area-inset-top,0px) + 12px)}}
button.sus{flex:0 0 auto;min-width:150px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;color:var(--fg)}
@media (min-width:860px){button.sus{min-width:0}}
.sus.on{border-color:var(--accent);background:var(--panel-2)}
.sus .nm{font-family:var(--font-display);font-size:14px;letter-spacing:.04em}
.sus .rl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px}
.pbar i{display:block;height:100%;background:var(--truth);transition:width .4s}
.pbar.tense i{background:var(--warn)}
.pbar.rattled i,.pbar.shutdown i,.pbar.lawyered i{background:var(--lie)}
.sus .stt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--font-display);color:var(--muted)}
.sus .stt.rattled,.sus .stt.shutdown,.sus .stt.lawyered{color:var(--lie)}
.sus .stt.tense{color:var(--warn)}
.sus .stt.guarded{color:var(--info)}

.transcript{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:50vh}
.t-head{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.t-head .who{min-width:0}
.t-head .who b{font-family:var(--font-display);font-size:16px;letter-spacing:.04em;display:block}
.t-head .who span{font-size:13px;color:var(--muted)}
.t-head .stt{margin-left:auto;text-align:right;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--font-display);color:var(--muted);white-space:nowrap}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(92%,640px);display:flex;flex-direction:column;gap:4px}
.msg.det{align-self:flex-end;align-items:flex-end}
.msg .b{border-radius:12px;padding:10px 13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.det .b{background:var(--panel-2);border:1px solid var(--line-2);border-bottom-right-radius:4px}
.msg.sus .b{background:var(--paper);color:var(--paper-ink);font-family:var(--font-type);font-size:15px;border-bottom-left-radius:4px;box-shadow:0 1px 0 var(--paper-line)}
.msg.sys .b{background:transparent;border:1px dashed var(--line-2);color:var(--muted);font-size:13.5px;font-style:italic}
.msg .m{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg .m button{border:0;background:none;color:var(--accent);font-family:var(--font-display);letter-spacing:.08em;text-transform:uppercase;font-size:11px;padding:2px 4px}
.msg .pres{font-size:12.5px;color:var(--info);border:1px solid var(--info);border-radius:8px;padding:4px 9px;max-width:100%}
.msg .b.thinking{color:var(--paper-muted)}
.msg .b.thinking::after{content:"…";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.sheet-sel{font-family:var(--font-type);background:var(--paper);color:var(--paper-ink);padding:10px 12px;border-radius:8px;font-size:14px}
.composer{position:sticky;bottom:var(--tabs-h);background:var(--panel);border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-radius:0 0 12px 12px}
.composer .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font-family:var(--font-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.composer .in{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:140px;flex:1}
.composer .send{min-width:44px;height:44px;border-radius:9px}
.closed{padding:14px;border-top:1px solid var(--line);color:var(--fg-2);font-size:14.5px;display:flex;flex-direction:column;gap:10px}

.avatar{width:30px;height:30px;border-radius:50%;background:var(--panel-2);border:1px solid var(--accent);color:var(--accent);font-family:var(--font-display);font-size:11px;letter-spacing:.04em;display:inline-grid;place-items:center;flex:none;text-transform:uppercase}

<script type="application/json" id="training-data">{"antarctic":[{"settingId":"antarctic","truth":{"title":"Dead Air at Kittiwake","house":"Kittiwake, a British Antarctic Survey wintering base on the Loder Ice Shelf: a main hut of bunk rooms, lounge, galley, surgery, labs and radio room behind a cold porch, and a generator shed forty metres off along a handline.","victim":{"name":"Neil Cathcart","age":34,"role":"glaciologist, on the night-duty rota for Midwinter night","sketch":"Clever, sociable and careless with other people, the best darts player on base and its best-liked man until the dark set in. He has a fiancee in Edinburgh and, it turns out, a past in Cambridge."},"night":{"start":"17:00","end":"01:00","discovered":"00:02","discoveredBy":"Kevin Ord","where":"the generator shed"},"weather":"Midwinter's Day, 21 June 1983: full dark, minus 38, a 45-knot easterly with heavy drift and visibility of a few metres.","publicFacts":["Dr Neil Cathcart was found dead on the generator shed floor beside the day-tank pump at two minutes past midnight by Kevin Ord and Roger Beal, after he failed to sign back in from his night-duty generator check.","The wintering crew of nine: Roger Beal (Base Commander), Dr Hugh Sorley (doctor), Kevin Ord (radio operator), Dave Lyle (diesel mechanic), Iain Rennick (ionospheric physicist), Neil Cathcart (glaciologist), Pete Nolan (met observer), Stu Ferris (general assistant) and Mal Jessop (builder).","It was Midwinter: drinks at 18:30, dinner at 19:00, then a film in the lounge from 21:45 to 23:15 with a reel change at about half past ten, and cards afterwards.","A 45-knot easterly blew drift all evening; nobody goes out except along the handlines, and everyone must sign the outside log in the cold porch.","Dr Sorley tried oxygen in the surgery and pronounced Cathcart dead at 00:20; Beal radioed Cambridge at 00:28. There is no aircraft until October.","Beal has sealed the generator shed with the duty Lister left running, and the crew were mustered in the lounge at 00:40."],"suspects":[{"name":"Iain Rennick","age":37,"role":"ionospheric physicist, on his second winter; shared two winters with Cathcart","sketch":"Tall, gaunt and bearded, very neat in a Fair Isle jumper, his hair still faintly damp. He speaks softly and watches your hands rather than your face.","part":"killer"},{"name":"Roger Beal","age":45,"role":"Base Commander and surveyor","sketch":"A thickset ex-Navy man with a grey crew cut who moves stiffly from a bad back. Used to giving orders, he dislikes being on the wrong side of the table.","part":"liar"},{"name":"Kevin Ord","age":26,"role":"radio operator, who handles every message in and out","sketch":"A skinny Liverpudlian with headphone-flattened hair and bitten nails who talks fast and jokes when frightened. He has not slept.","part":"mistaken"},{"name":"Dave Lyle","age":29,"role":"diesel mechanic, responsible for the generator shed","sketch":"A broad Geordie with oil worked permanently into his knuckles and a moustache he is growing for Midwinter. He sits with his arms folded like a man waiting to be blamed.","part":"honest"}],"killer":"Iain Rennick","accomplice":null,"motive":"On the 16:00 radio schedule a familygram came in from Rennick's wife Fiona saying she was leaving him and that her affair with Neil Cathcart had begun in Cambridge the summer before they sailed. Rennick read it at 17:05, sat through the Midwinter dinner opposite Cathcart, and decided to kill him that night.","method":"Knowing Cathcart was on night duty and would make the 23:00 generator check and hand-pump the day tank, Rennick went out unsigned at 22:24, switched off the shed's extractor fan at 22:31, shut the air louvre and slackened the silencer clamp so the Lister's exhaust poured into the sealed shed. Cathcart collapsed by the pump soon after 23:00; at 23:44 Rennick, wearing Dave Lyle's windproof because his own was soaked, tightened the clamp, opened the louvre and switched the fan back on so the shed would clear and the death would pass for a drunk man's collapse.","alibiGap":{"from":"22:20","to":"23:51","killerClaims":"That he left the film at 22:20 with a headache, went to his bunk and did not stir until the shouting at midnight.","actually":"He went out to the generator shed from 22:24 to 22:38 to rig the exhaust leak, and again from 23:35 to 23:49 in Lyle's windproof to undo it while Cathcart lay dead."},"timeline":[{"time":"17:05","place":"ionosonde lab","present":["Kevin Ord","Iain Rennick"],"event":"Ord hands Rennick a sealed familygram that came in on the 16:00 schedule, and Rennick reads it, goes white and asks to be left alone.","witnesses":["Kevin Ord"]},{"time":"17:30","place":"generator shed and main hut","present":["Dave Lyle","Iain Rennick","Roger Beal","Kevin Ord"],"event":"Lyle signs out for his routine evening check of the Lister while Rennick sits alone in his lab, Beal works in the BC's office and Ord helps decorate the lounge.","witnesses":["Kevin Ord"]},{"time":"18:30","place":"lounge","present":["Iain Rennick","Roger Beal","Kevin Ord","Dave Lyle","Neil Cathcart"],"event":"All nine gather for Midwinter drinks and Ord reads out greetings from the other bases, Rennick drinking almost nothing.","witnesses":["Iain Rennick","Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"19:00","place":"dining room","present":["Iain Rennick","Roger Beal","Kevin Ord","Dave Lyle","Neil Cathcart"],"event":"Midwinter dinner for all nine, Cathcart in high spirits and Rennick seated opposite him saying hardly a word.","witnesses":["Iain Rennick","Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"21:00","place":"generator shed","present":["Dave Lyle"],"event":"Lyle, signed out 21:00 to 21:15, makes his last check of the evening and logs the exhaust sound, the extractor fan running and the air louvre open.","witnesses":[]},{"time":"21:45","place":"lounge","present":["Iain Rennick","Roger Beal","Kevin Ord","Dave Lyle","Neil Cathcart"],"event":"The film show begins with Beal at the projector and the whole crew watching.","witnesses":["Iain Rennick","Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"22:20","place":"lounge and cold porch","present":["Iain Rennick"],"event":"Rennick leaves the film saying he is turning in, and at 22:24 kits up in his own windproof and goes out along the handline without signing the outside log.","witnesses":["Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"22:28","place":"lounge","present":["Roger Beal","Kevin Ord","Dave Lyle","Neil Cathcart"],"event":"Reel change: the lights are up for six minutes while Beal threads the second reel, with Lyle, Ord, Cathcart and the others in their seats.","witnesses":["Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"22:31","place":"generator shed","present":["Iain Rennick"],"event":"Rennick switches off the extractor fan, shuts the air louvre and slackens the silencer clamp with the shed's spanner, leaves at 22:35 and is back inside by 22:38, hanging his drift-soaked windproof in the drying room.","witnesses":[]},{"time":"22:42","place":"lounge and cold porch","present":["Neil Cathcart","Roger Beal"],"event":"Cathcart leaves the film for his night-duty check and signs the outside log 'Gen shed 22:45', and Beal, slipping out two minutes after him, sees him signing as he passes the porch.","witnesses":["Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"22:46","place":"surgery","present":["Roger Beal"],"event":"Beal opens the drug cabinet with the duplicate key from the station safe, takes a strip of DF118, overwrites the register and is back at the projector by 22:58.","witnesses":[]},{"time":"22:47","place":"generator shed","present":["Neil Cathcart"],"event":"Cathcart takes the readings, writes a 22:50 log entry in a worsening hand and starts hand-pumping the day tank, collapsing beside the pump soon after 23:00 and dying within the half hour.","witnesses":[]},{"time":"22:52","place":"main corridor and radio room","present":["Kevin Ord","Roger Beal"],"event":"Ord, fetching the Midwinter telegrams from the radio room, sees Rennick's windproof dripping on the drying-room rail and at 22:57 sees Beal coming from the surgery corridor with a hand in his pocket.","witnesses":["Kevin Ord"]},{"time":"23:15","place":"lounge","present":["Roger Beal","Kevin Ord","Dave Lyle"],"event":"The film ends, Ord reads the telegrams aloud, and Beal, Lyle, Nolan and Ferris play cards until Lyle goes to his bunk at 23:30, next to Rennick's single cabin.","witnesses":["Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"23:35","place":"bunk rooms, cold porch and generator shed","present":["Iain Rennick","Dave Lyle"],"event":"Rennick leaves his cabin, which Lyle hears through the plywood, takes Lyle's windproof from its peg, goes out unsigned and in the shed tightens the clamp, opens the louvre and switches the fan back on at 23:44, his bare fingertip leaving a print in the fresh soot.","witnesses":["Dave Lyle"]},{"time":"23:49","place":"cold porch","present":["Iain Rennick","Kevin Ord","Dave Lyle"],"event":"Ord, passing the porch on the way to the gash room, sees through the porthole a hooded figure with LYLE stencilled on its back hang the windproof on Lyle's peg and takes it for Dave, and Lyle hears Rennick get back into his cabin at 23:51.","witnesses":["Kevin Ord","Dave Lyle"]},{"time":"23:55","place":"cold porch and generator shed","present":["Kevin Ord","Roger Beal"],"event":"Ord notices Cathcart is still signed out, fetches Beal from the cards, and at 00:02 the two of them find Cathcart dead on the shed floor beside the day-tank pump with the fan running.","witnesses":["Kevin Ord","Roger Beal"]},{"time":"00:08","place":"surgery, radio room, cold porch and lounge","present":["Roger Beal","Kevin Ord","Dave Lyle","Iain Rennick"],"event":"Dr Sorley pronounces Cathcart dead at 00:20 and finds the drug count short, Beal radios Cambridge at 00:28 with Ord, Lyle finds his own windproof wet when he kits up at 00:30 to look over the shed from the doorway, and at the 00:40 muster Rennick arrives last from his cabin.","witnesses":["Roger Beal","Kevin Ord","Dave Lyle","Iain Rennick"]}],"evidence":[{"id":"ev1","name":"Generator log","where":"on the bench in the generator shed","detail":"Lyle's 21:00 entry reads 'exhaust sound, fan on, louvre open'; Cathcart's 22:50 entry wanders across the ruled lines and stops mid-figure, and there is no 23:00 entry.","proves":"Cathcart was in the shed and already impaired at about 22:50, and stopped working soon afterwards.","atScene":true},{"id":"ev2","name":"Silencer clamp and soot","where":"the exhaust run behind the duty Lister","detail":"The clamp at the silencer joint is tight, but its nut shows fresh bright spanner marks, and a fan of new soot spreads across the wall behind it and the slats of the air louvre; the Gun Gum patch on the manifold flange is intact.","proves":"Exhaust escaped into the shed from a joint someone loosened and later tightened again, not from the old patched flange.","atScene":true},{"id":"ev3","name":"Extractor fan isolator switch","where":"beside the shed door","detail":"A grey plastic rocker switch, set to ON, filmed with fresh soot and carrying one clean fingertip print.","proves":"Someone switched the fan with a bare finger after the soot had settled; the print can be compared.","atScene":true},{"id":"ev4","name":"Rennick's windproof","where":"drying room rail","detail":"His stencilled green windproof, still damp inside at 00:45 with drift-melt in the hood seams.","proves":"Its owner was outside in drift sometime late in the evening.","atScene":false},{"id":"ev5","name":"Lyle's windproof and mukluks","where":"Lyle's peg and boot rack in the cold porch","detail":"The LYLE windproof has drift packed in the hood and a soot smudge on the right cuff, while Lyle's mukluks beneath it are frozen stiff and bone dry.","proves":"Someone went out in Lyle's windproof that night without wearing Lyle's boots.","atScene":false},{"id":"ev6","name":"Drug cabinet and register","where":"surgery","detail":"The DF118 count is a strip short, and the last register line has been overwritten in a different pen.","proves":"Someone other than the doctor took drugs from the cabinet and tried to hide it.","atScene":false}],"forensics":{"tod":"Cherry-pink lividity and bright red blood point to carbon monoxide; with the shed at about 18 degrees and rigor beginning at 00:45, death came between 23:00 and 23:40, after he collapsed beside the day-tank pump.","prints":"A fresh right index print of Iain Rennick lies on top of the soot film on the extractor-fan switch, so it was made after the leak began; the clamp and spanner show only glove smears, and Lyle's many prints in the shed all lie under the soot. Beal's prints are on the drug cabinet and register but nowhere in the shed.","comms":"Radio log: 16:22, telex familygram for I. Rennick from Fiona Rennick, Cambridge: 'Leaving you. It began with Neil Cathcart last summer before you sailed and it has not ended. Sorry. F.' No further transmission until Beal's emergency call to Cambridge via Rothera at 00:28.","tox":"Cathcart's blood carboxyhaemoglobin is about 60 per cent, a lethal level, with modest alcohol and no DF118, pethidine or other drug. Draeger-tube samples at 00:30 found only traces of CO in the shed, so the leak had been stopped and the shed ventilated before he was found.","logs":"The power chart recorder shows the extractor fan's load drop out at 22:31 and come back at 23:44. The outside log shows nobody out after 17:00 but Lyle (17:30-17:45 and 21:00-21:15), Cathcart (out 22:45, never signed in) and Beal and Ord at 23:58; Rennick last signed in from the aerial field at 15:10."},"redHerring":"Three days ago Lyle patched a weeping exhaust flange with Gun Gum and never logged it, and his prints are all over the shed, so the death looks like an accident from slack maintenance or Lyle's doing. But the patch is on the manifold flange and still sound, the leak was at the silencer clamp with fresh spanner marks, an accident does not switch off a fan or shut a louvre, and at 22:31, when the fan went off, Lyle was in the lounge at the reel change.","solutionPath":["Doctor and lab assay: carbon monoxide, death 23:00 to 23:40, no drugs, and the shed air clear by 00:30, so the leak was stopped before anyone found him.","Chart recorder: the fan went off at 22:31 and on at 23:44, yet the outside log shows nobody out at either time, so someone went to the shed twice unsigned; at 22:31 Beal, Lyle, Ord and Cathcart were all in the lit lounge at the reel change, and Rennick had left at 22:20.","Ord saw Rennick's windproof dripping in the drying room at 22:52, though the outside log has Rennick last coming in at 15:10, which breaks his 'wet from the afternoon' excuse and his 'in my bunk' alibi.","Ord's 'Dave in the porch at ten to twelve' is wrong: Lyle's prints lie under the soot while Rennick's lies on top of it on the fan switch, Lyle's mukluks were dry, and through the plywood Lyle heard Rennick go out at 23:35 and come back at 23:51.","Motive from the radio log and Ord: Fiona Rennick's familygram naming Cathcart, which Rennick passes off as 'the cat and the mortgage'.","Beal is cleared: toxicology finds no DF118 in Cathcart, Beal was threading the projector at 22:31, and his prints are on the drug cabinet but not in the shed; his lie hides taking painkillers for his back.","Name Iain Rennick: jealousy over the affair, carbon monoxide from the Lister's exhaust, rigged at 22:31 and undone at 23:44."]},"briefs":[{"name":"Iain Rennick","part":"killer","personality":"Precise, dry and very controlled, an Edinburgh physicist who corrects loose language ('strictly speaking') and hides inside technical vocabulary. He gives short, exact answers; when the walls close in he goes completely silent and stares at the table.","voiceSample":"Strictly speaking, I was asleep, which is less an alibi than a condition.","relationship":"Cathcart was his friend for two seasons; since 17:05 he has hated him with a cold, complete hatred, and he still does.","movements":[{"from":"17:05","to":"18:30","where":"ionosonde lab","doing":"Read Fiona's familygram and sat alone with it.","seenBy":["Kevin Ord"]},{"from":"18:30","to":"21:45","where":"lounge and dining room","doing":"Midwinter drinks and dinner, opposite Cathcart.","seenBy":["Roger Beal","Kevin Ord","Dave Lyle"]},{"from":"21:45","to":"22:20","where":"lounge","doing":"Watched the first reel, then said he was turning in.","seenBy":["Roger Beal","Kevin Ord","Dave Lyle"]},{"from":"22:20","to":"22:38","where":"cold porch and generator shed","doing":"Went out unsigned, switched off the fan, shut the louvre and slackened the silencer clamp.","seenBy":[]},{"from":"22:38","to":"23:35","where":"drying room, then his single cabin","doing":"Hung up his soaked windproof and lay awake, dressed.","seenBy":[]},{"from":"23:35","to":"23:51","where":"cold porch and generator shed","doing":"Went out in Lyle's windproof, found Cathcart dead, tightened the clamp, opened the louvre and switched the fan on.","seenBy":["Kevin Ord","Dave Lyle"]},{"from":"23:51","to":"01:00","where":"his cabin, then the lounge muster","doing":"Waited in his cabin until called, arriving last at the 00:40 muster.","seenBy":["Roger Beal","Kevin Ord","Dave Lyle"]}],"knows":["Fiona's familygram, which he read at 17:05, says she is leaving him and that her affair with Cathcart began last summer in Cambridge (he read it).","Cathcart was on the night-duty rota for Midwinter and would make the 23:00 generator check and hand-pump the day tank for a quarter of an hour (he saw the rota and has done the duty himself).","At about 22:31, wearing gloves, he switched off the extractor fan, shut the air louvre and slackened the silencer clamp with the shed spanner (he did it).","He did not sign the outside log either time he went out (he did it).","His own windproof came back soaked with drift and he hung it in the drying room at 22:38 (he did it).","At about 23:38 he found Cathcart slumped dead by the day-tank pump; he tightened the clamp, opened the louvre and, mitt off, switched the fan back on at about 23:44 (he did it).","He wore Lyle's windproof the second time because his own was still wet, and hung it back on Lyle's peg at 23:49 (he did it).","Cathcart was in the lounge, laughing, when he left at 22:20 (he saw it)."],"doesNotKnow":["That Ord saw his windproof dripping in the drying room at 22:52.","That Ord watched him through the porch porthole at 23:49.","That Lyle heard him leave and return through the cabin wall.","That his fingertip left a print in the soot on the fan switch.","That the chart recorder logs the fan's load.","That Beal took drugs from the surgery."],"secret":"He killed Cathcart over the affair with Fiona.","lies":[{"claim":"I left the film at twenty past ten with a head, went to my pit and didn't stir till the shouting.","truth":"He was in the generator shed from about 22:28 to 22:35 and again from 23:38 to 23:46.","when":"Asked where he was after leaving the film.","crack":"Lyle hearing him leave his cabin at 23:35 and return at 23:51, Ord seeing his windproof dripping at 22:52, or the chart recorder's 22:31 fan-off when everyone else was in the lounge at the reel change."},{"claim":"I've not been in the generator shed since my gash week, a fortnight ago.","truth":"He was there twice that night and switched the fan on at 23:44.","when":"Asked about the generator shed.","crack":"The fingerprint report: his fresh print lying on top of the soot on the extractor-fan switch."},{"claim":"Fiona's familygram? The cat, the mortgage, her mother's hip. The usual.","truth":"It told him she was leaving him for Cathcart.","when":"Asked about his familygram or his mood at dinner.","crack":"The radio log and telex text, or Ord, who typed it."},{"claim":"My windproof's been damp since I went out to the aerial field this afternoon.","truth":"It was soaked on his 22:24 trip to the shed.","when":"Asked why his windproof was wet.","crack":"The outside log showing him signed in at 15:10, seven hours before Ord saw it dripping at 22:52."}],"honestMistake":null,"tells":["Squares the edges of anything on the table.","Says 'strictly speaking' before an evasion."],"pressure":{"baseline":15,"breakPoint":70,"lawyerPoint":88,"style":"shutdown"},"opening":"I'll help where I can. Neil and I wintered together twice; I'd like to know what happened as much as anyone."},{"name":"Roger Beal","part":"liar","personality":"Brusque ex-Navy, a man of orders and lists who starts every other sentence with 'Right then'; protective of his base and his authority and short with questions he thinks impertinent. His back makes him shorter still, and cornered he blusters and shouts.","voiceSample":"Right then. I ran the projector, I ran the cards, and I run this base. What else do you want?","relationship":"He thought Cathcart able but slack, the sort who left the porch door unlatched; he is truly shaken to lose a man on his watch.","movements":[{"from":"17:00","to":"18:30","where":"BC's office","doing":"Paperwork and the Midwinter messages.","seenBy":[]},{"from":"18:30","to":"21:45","where":"lounge and dining room","doing":"Midwinter drinks and dinner.","seenBy":["Iain Rennick","Kevin Ord","Dave Lyle"]},{"from":"21:45","to":"22:44","where":"lounge, at the projector","doing":"Ran the film and threaded the second reel at 22:28 to 22:34 with the lights up.","seenBy":["Kevin Ord","Dave Lyle"]},{"from":"22:44","to":"22:58","where":"cold-porch corridor and surgery","doing":"Saw Cathcart signing out, then took DF118 from the drug cabinet with the duplicate key and overwrote the register.","seenBy":["Kevin Ord"]},{"from":"22:58","to":"23:55","where":"lounge","doing":"Finished the film, then played cards with Lyle, Nolan and Ferris.","seenBy":["Kevin Ord","Dave Lyle"]},{"from":"23:55","to":"00:08","where":"cold porch and generator shed","doing":"Went out with Ord, found Cathcart and helped carry him in.","seenBy":["Kevin Ord"]},{"from":"00:08","to":"01:00","where":"surgery, radio room, lounge","doing":"Stood by the doctor, radioed Cambridge at 00:28 and mustered the crew at 00:40.","seenBy":["Kevin Ord","Dave Lyle","Iain Rennick"]}],"knows":["Rennick left the film at 22:20 saying he was turning in (he saw it).","He threaded the second reel from about 22:28 to 22:34 with the lights up, and Lyle, Ord and Cathcart were in their seats (he did it and saw them).","At about 22:45, passing the cold porch, he saw Cathcart kitted up and signing the outside log for the generator shed (he saw it).","He took a strip of DF118 from the drug cabinet with the BC's duplicate key and overwrote the register (he did it).","At 23:30 Lyle left the cards for his bunk, a bit the worse for homebrew (he saw it).","At 00:02 he and Ord found Cathcart on the shed floor by the pump; the fan was running, the louvre open and the air seemed all right apart from the usual diesel (he saw it).","At about 00:10 Dr Sorley said the drug count was short (he heard it).","At the 00:40 muster Rennick came last from his cabin, fully dressed, his hair damp (he saw it)."],"doesNotKnow":["Who killed Cathcart, or how.","What happened in the shed before 00:02.","That Ord saw him coming from the surgery at 22:57.","What Rennick's familygram said."],"secret":"A slipped disc from coming off the Muskeg in March; the doctor rations his painkillers, so he has been taking DF118 from the cabinet with the BC's duplicate key and altering the register. Found out, he would lose his command and probably his career.","lies":[{"claim":"I was at that projector from the first reel to the last; I didn't leave the lounge till Kevin came for me at five to twelve.","truth":"He left from 22:44 to 22:58 to raid the drug cabinet.","when":"Asked where he was during the film.","crack":"Ord's sighting of him coming from the surgery corridor at 22:57, or his prints on the drug cabinet and register."},{"claim":"The drug cabinet? The duplicate key hasn't left my safe since we arrived. Ask the doc.","truth":"He used it that night and overwrote the register.","when":"Asked about the drug shortfall or the keys.","crack":"The fingerprint report placing his prints on the cabinet and the register page, and the overwritten line."}],"honestMistake":null,"tells":["Presses a hand into the small of his back and shifts in his chair.","Says 'Right then' and changes the subject."],"pressure":{"baseline":25,"breakPoint":65,"lawyerPoint":85,"style":"anger"},"opening":"Right then. I've a dead man in the surgery and eight people who can't leave till October, so let's be quick about it."},{"name":"Kevin Ord","part":"mistaken","personality":"Chirpy, nervy Scouser who talks too fast and jokes when frightened ('not exactly Butlins, is it'); eager to help and hurt if doubted. He reads everyone's messages for a living and feels guilty about it, and under pressure he goes to pieces and cries.","voiceSample":"It was Dave, honest, I saw LYLE on his back clear as day, hanging his windproof on his own peg.","relationship":"He liked Neil, who taught him darts and lent him tapes; he is shocked and frightened.","movements":[{"from":"17:00","to":"17:05","where":"radio room, then the ionosonde lab","doing":"Finished typing up the sked traffic and took Rennick his familygram.","seenBy":["Iain Rennick"]},{"from":"17:05","to":"21:45","where":"lounge, galley and dining room","doing":"Decorated, read out the greetings at 18:30 and ate Midwinter dinner.","seenBy":["Iain Rennick","Roger Beal","Dave Lyle"]},{"from":"21:45","to":"22:52","where":"lounge","doing":"Watched the film, including the reel change.","seenBy":["Roger Beal","Dave Lyle"]},{"from":"22:52","to":"23:00","where":"main corridor and radio room","doing":"Fetched the Midwinter telegrams, passing the drying room and seeing Beal by the surgery corridor.","seenBy":[]},{"from":"23:00","to":"23:48","where":"lounge","doing":"Read the telegrams aloud at 23:15 and watched the cards.","seenBy":["Roger Beal","Dave Lyle"]},{"from":"23:48","to":"23:58","where":"corridor by the cold porch","doing":"Saw the figure in Lyle's windproof, then noticed Cathcart still signed out and fetched Beal.","seenBy":["Roger Beal"]},{"from":"23:58","to":"01:00","where":"generator shed, surgery, radio room, lounge","doing":"Found Cathcart with Beal, helped carry him in and set up the HF for Beal's 00:28 call.","seenBy":["Roger Beal","Dave Lyle","Iain Rennick"]}],"knows":["He took Rennick's familygram off the teleprinter at 16:22 and read it, as he reads everything: Fiona leaving Iain, and the affair with Neil Cathcart since last summer (he read it).","He handed it to Rennick at 17:05 in the lab; Rennick went white and asked to be left alone (he saw it).","At the reel change, about 22:28 to 22:34, Lyle, Beal and Cathcart were in the lit lounge; Rennick had gone at 22:20 (he saw it).","At about 22:52 he saw Rennick's stencilled windproof dripping wet on the drying-room rail (he saw it).","At about 22:57 he saw Beal coming from the surgery corridor with a hand in his pocket (he saw it).","At about 23:49, through the porch porthole, he saw a hooded figure with LYLE on its back hang the windproof on Lyle's peg; he did not see its face (he saw it).","At 23:55 he noticed in the outside log that Cathcart had been signed out since 22:45 and never signed in (he read it).","At 00:02 he and Beal found Cathcart on the floor by the day-tank pump, the fan running and the shed smelling of diesel (he saw it).","He set up the HF for Beal's emergency call to Cambridge via Rothera at 00:28 (he did it)."],"doesNotKnow":["Who killed Cathcart, or how.","That the figure in the porch was Rennick in Lyle's windproof.","What Beal was doing in the surgery.","That the fan had been switched off earlier."],"secret":null,"lies":[],"honestMistake":{"claim":"It was Dave I saw in the porch at ten to twelve, coming in from the genny; LYLE on his back, and he hung it on his own peg.","truth":"It was Iain Rennick wearing Dave Lyle's windproof, because his own was soaked from his first trip.","why":"He saw the figure only from behind through the fogged porthole with the hood up and read the stencilled name; Dave coming in from a late generator check is so ordinary he never questioned it."},"tells":["Drums his fingers on the table like he's keying Morse.","Cracks a joke and then apologises for it."],"pressure":{"baseline":30,"breakPoint":60,"lawyerPoint":82,"style":"tears"},"opening":"Sorry, I've not slept, I'm all over the place. Ask us anything, I'll tell you straight."},{"name":"Dave Lyle","part":"honest","personality":"Blunt, slow-spoken Geordie who says 'aye', 'nowt' and 'man' and trusts machines more than people. Defensive about his generator and his maintenance; if he thinks he is being fitted up he folds his arms and says he'll have a solicitor on the radio before he says owt else.","voiceSample":"That clamp was tight at nine o'clock, man; I'd put my name to it, and I did, it's in the log.","relationship":"He got on fine with Neil, who sometimes gave him a hand in the shed; they were not close.","movements":[{"from":"17:30","to":"17:45","where":"generator shed","doing":"Routine evening check, signed out and in.","seenBy":[]},{"from":"17:45","to":"21:00","where":"lounge and dining room","doing":"Midwinter drinks and dinner.","seenBy":["Iain Rennick","Roger Beal","Kevin Ord"]},{"from":"21:00","to":"21:15","where":"generator shed","doing":"Last check of the evening, logged the clamp sound, fan on and louvre open.","seenBy":[]},{"from":"21:15","to":"23:15","where":"lounge","doing":"Watched the film, including the reel change.","seenBy":["Roger Beal","Kevin Ord"]},{"from":"23:15","to":"23:30","where":"lounge","doing":"Played cards with Beal, Nolan and Ferris.","seenBy":["Roger Beal","Kevin Ord"]},{"from":"23:30","to":"00:30","where":"his bunk room, next to Rennick's cabin","doing":"Lay in his bunk and heard Rennick go out and come back.","seenBy":[]},{"from":"00:30","to":"00:40","where":"cold porch and generator shed doorway","doing":"Kitted up, found his windproof wet, and looked over the shed with a torch from the doorway.","seenBy":["Roger Beal"]},{"from":"00:40","to":"01:00","where":"lounge","doing":"Mustered with the crew.","seenBy":["Roger Beal","Kevin Ord","Iain Rennick"]}],"knows":["At his 21:00 check the silencer clamp was tight, the extractor fan running and the louvre open, and he logged it (he did it).","Three days ago he patched a weeping manifold flange with Gun Gum and never logged it (he did it).","Rennick left the film at 22:20; at the reel change Beal, Ord and Cathcart were in the lounge and Rennick was not (he saw it).","The fan is on a manual isolator and the louvre on a hand lever; neither changes by itself, and the chart recorder in the shed traces the load, fan included (he knows his shed).","He went to his bunk at 23:30, a bit merry; the cabin walls are plywood and Rennick has the single cabin next door (he was there).","At about 23:35 he heard Rennick's door, steps towards the porch and the double clunk of the porch doors; at about 23:51 the porch doors again and Rennick's bunk creak (he heard it).","At 00:30, kitting up, he found his own windproof on its peg with drift in the hood and soot on the right cuff, though he had not been out since 21:15; his mukluks were frozen stiff and dry (he saw it).","From the shed doorway with a torch he saw fresh bright spanner marks on the silencer clamp nut and a fan of new soot on the wall and louvre slats, his flange patch untouched (he saw it)."],"doesNotKnow":["Who loosened the clamp or switched off the fan.","That Ord thinks he saw Dave in the porch.","What Beal did in the surgery.","What was in Rennick's familygram."],"secret":"His small embarrassment: the unlogged Gun Gum patch, which he fears will get the death blamed on his maintenance.","lies":[],"honestMistake":null,"tells":["Folds his arms tighter.","Wipes his palms on his knees."],"pressure":{"baseline":20,"breakPoint":65,"lawyerPoint":85,"style":"lawyer"},"opening":"Before you start: that generator was right as rain at nine o'clock, and it's in the log in my own hand."}],"id":"antarctic"}],"country_house":[{"settingId":"country_house","truth":{"title":"Sleet at Sallowmere","house":"Sallowmere House, a draughty flint-and-stone Jacobean house on the edge of Salisbury Plain, a mile and a half up a single lane from the village of Coombe Abbas, Wiltshire.","victim":{"name":"Sir Aubrey Callender","age":63,"role":"baronet, owner of Sallowmere and host of the shooting party","sketch":"A choleric, exacting old Etonian who ran his estate from his own ledgers and trusted few people with them. He was childless; his nephew Hugo is heir to the title and the entailed land."},"night":{"start":"19:30","end":"02:00","discovered":"01:10","discoveredBy":"Beatrice Orme","where":"the study"},"weather":"Sleet from dusk on Saturday 8 November 1924, driven by a north-westerly; the lane to Coombe Abbas ankle-deep in chalk slurry; no frost.","publicFacts":["Sir Aubrey Callender was found dead on the hearthrug of his study at ten past one in the morning by his sister, Mrs Beatrice Orme.","He had been struck on the back of the head; the police surgeon came out from Devizes before dawn.","The party for Saturday's shoot: Lady Callender, Mr Hugo Callender (nephew and heir), Mrs Orme, Mr Cyril Mabey (the land agent), and Colonel and Mrs Rudd.","At about twenty to ten Sir Aubrey left the port to put through a trunk call to London on the hall telephone, and at five past ten he shut himself in his study saying he had accounts to see to.","Sleet fell all night; the motor was laid up in the coach house and nobody used the lane after dinner, so far as the household knows.","Ruddle the butler telephoned the Devizes police through the Coombe Abbas exchange at 01:28; PC Gully bicycled up from the village, and Scotland Yard was asked for at first light."],"suspects":[{"name":"Cyril Mabey","age":47,"role":"land agent to the Sallowmere estate for nine years, invited to shoot with the party","sketch":"A plump, beautifully barbered man in a dinner jacket a shade too new, who turns his signet ring when he thinks. He is anxious to be taken for a gentleman and keeps saying 'Sir Aubrey and I'.","part":"killer"},{"name":"Hugo Callender","age":29,"role":"Sir Aubrey's nephew and heir","sketch":"Tall, fair and rumpled, with a chipped front tooth, a heavy cold and the look of a man who has not slept. He smokes Turkish cigarettes end to end.","part":"liar"},{"name":"Beatrice Orme","age":66,"role":"Sir Aubrey's widowed elder sister, who has kept house at Sallowmere since 1919","sketch":"Upright and beaky in black silk and jet, with a lorgnette she taps when displeased. She addresses the Inspector as she would a junior curate.","part":"mistaken"},{"name":"Ivy Dunn","age":22,"role":"second housemaid, a carter's daughter from Coombe Abbas","sketch":"A thin, freckled girl in a print dress and cap, her hands red from blacking grates. She keeps her eyes on the Inspector's boots.","part":"honest"}],"killer":"Cyril Mabey","accomplice":null,"motive":"Over three years Mabey sold Ridgeway Copse timber through Gedge & Sons of Devizes and banked about £3,800 of the proceeds as his own. A letter from Gedge put Sir Aubrey on to it; he telephoned his solicitor at 21:52 to arrange an audit for Monday and told Mabey to his face that he would be prosecuted.","method":"At 22:55 in the study, after a quarter of an hour of pleading, Mabey snatched the bronze stag from the mantelpiece as Sir Aubrey turned to ring for Ruddle, and struck him twice on the back of the head. He wiped the stag with his handkerchief and put it back, burned Gedge's letter and his own timber summary in the grate, left the lamp burning and the door shut, and went up the back stairs to scrub a spot of blood from his left shirt cuff before joining Colonel Rudd at billiards.","alibiGap":{"from":"22:35","to":"23:15","killerClaims":"That he left the drawing room at 22:35 to write letters in his bedroom, stayed there until about a quarter past eleven, and then went down to the billiard room.","actually":"He went straight to the study at 22:40, killed Sir Aubrey at 22:55, left at 23:04 and spent 23:06 to 23:13 in his room scrubbing his cuff and burning his handkerchief."},"timeline":[{"time":"19:30","place":"bedrooms","present":["Cyril Mabey","Hugo Callender","Beatrice Orme","Ivy Dunn"],"event":"The dressing gong sounds and the party dress for dinner while Ivy carries hot-water cans to the guest rooms.","witnesses":["Ivy Dunn"]},{"time":"20:00","place":"dining room","present":["Sir Aubrey Callender","Lady Callender","Hugo Callender","Beatrice Orme","Cyril Mabey","Colonel Rudd","Mrs Rudd"],"event":"Dinner is served to the family and guests while Ivy works in the servants' hall and still-room.","witnesses":["Hugo Callender","Beatrice Orme","Cyril Mabey"]},{"time":"21:12","place":"hall","present":["Hugo Callender","Ruddle"],"event":"Ruddle fetches Hugo from the table to the hall telephone for a three-minute local call from the Plough Inn at Coombe Abbas, and Hugo comes back to the table white.","witnesses":["Beatrice Orme","Cyril Mabey","Sir Aubrey Callender","Ruddle"]},{"time":"21:20","place":"dining room and drawing room","present":["Beatrice Orme","Lady Callender","Mrs Rudd","Sir Aubrey Callender","Hugo Callender","Cyril Mabey","Colonel Rudd"],"event":"The ladies withdraw to the drawing room and the men sit over the port.","witnesses":["Beatrice Orme","Hugo Callender","Cyril Mabey"]},{"time":"21:40","place":"dining room","present":["Sir Aubrey Callender","Hugo Callender","Cyril Mabey","Colonel Rudd"],"event":"Sir Aubrey leaves the port saying he must telephone Prothero in London about 'the Ridgeway timber money', and books a trunk call from the hall.","witnesses":["Hugo Callender","Cyril Mabey","Colonel Rudd"]},{"time":"21:52","place":"hall","present":["Sir Aubrey Callender","Cyril Mabey"],"event":"The exchange rings back and Sir Aubrey speaks to Mr Prothero for six minutes, arranging for him and an accountant, Mr Gell, to come down on Monday, while Mabey, out of the dining room for the cloakroom, overhears from the passage.","witnesses":["Cyril Mabey"]},{"time":"22:05","place":"hall and study","present":["Sir Aubrey Callender","Ruddle"],"event":"After looking in on the drawing room, Sir Aubrey orders Ruddle to lock up at a quarter to eleven and send the servants to bed, then shuts himself in the study; Ruddle passes the order on in the servants' hall at 22:10.","witnesses":["Beatrice Orme","Cyril Mabey","Hugo Callender","Ivy Dunn"]},{"time":"22:15","place":"drawing room","present":["Beatrice Orme","Hugo Callender","Cyril Mabey","Lady Callender","Colonel Rudd","Mrs Rudd"],"event":"Mrs Orme retires to her bedroom directly above the study and dozes off, and at 22:20 Hugo says good night, pleading his cold.","witnesses":["Cyril Mabey","Hugo Callender"]},{"time":"22:27","place":"back passage and garden door","present":["Hugo Callender"],"event":"Hugo takes the garden-door key from the board, hears his uncle cough behind the study door, lets himself out, locks the door behind him and walks down the lane towards the Plough, unseen.","witnesses":[]},{"time":"22:40","place":"back passage outside the study","present":["Cyril Mabey","Sir Aubrey Callender","Ivy Dunn"],"event":"Mabey, who left the drawing room at 22:35 saying he had letters to write, knocks and goes into the study, and Ivy, passing behind him with hot-water bottles, hears Sir Aubrey say 'Come in and shut that door, Mabey.'","witnesses":["Ivy Dunn"]},{"time":"22:47","place":"back passage and bachelors' corridor","present":["Ruddle","Ivy Dunn","Beatrice Orme"],"event":"Ruddle, on his early lock-up round, rattles the garden door beneath Mrs Orme's window and notes its key missing from the board, waking her, while Ivy, banking the bachelors'-corridor fires from 22:45 to 22:58, finds Mr Mabey's and Mr Hugo's rooms dark and empty.","witnesses":["Ruddle","Ivy Dunn","Beatrice Orme"]},{"time":"22:55","place":"study","present":["Cyril Mabey","Sir Aubrey Callender"],"event":"Mabey strikes Sir Aubrey twice on the back of the head with the bronze stag, and Mrs Orme, overhead, hears raised voices end in a heavy thump and a chair going over.","witnesses":["Beatrice Orme"]},{"time":"22:55","place":"the Plough Inn, Coombe Abbas","present":["Hugo Callender","Ruby Lacey","Jos Lacey"],"event":"Hugo reaches the Plough and sits in the back parlour with Ruby Lacey, his secret wife, and her furious father until 23:20, when he starts back up the lane.","witnesses":["Ruby Lacey","Jos Lacey"]},{"time":"23:04","place":"study, back passage and back stairs","present":["Cyril Mabey","Ivy Dunn","Albert"],"event":"Having wiped the stag and burned the papers, Mabey leaves the lamp burning and at 23:06 hurries up the back stairs gripping his left cuff, watched by Ivy and the footman Albert from the linen-room doorway, where they have been courting since 23:00.","witnesses":["Ivy Dunn","Albert"]},{"time":"23:15","place":"billiard room","present":["Cyril Mabey","Colonel Rudd"],"event":"Mabey, his cuff scrubbed, joins Colonel Rudd at billiards, remarks that he has been writing letters, and plays until 00:30, while Ivy goes up to bed in the maids' attic.","witnesses":["Colonel Rudd","Ruddle"]},{"time":"23:50","place":"garden door and back stairs","present":["Hugo Callender"],"event":"Hugo lets himself back in soaked and chalked to the shins, hangs the key on its hook, sees lamplight under the study door, hears billiard balls, and goes softly up the back stairs, which Mrs Orme hears.","witnesses":["Beatrice Orme"]},{"time":"01:10","place":"study","present":["Beatrice Orme"],"event":"Mrs Orme, sleepless and puzzled by the study lamplight still lying on the sleet below her window, comes down the back stairs and finds her brother dead on the hearthrug, while Mabey, Hugo and Ivy are in bed.","witnesses":["Beatrice Orme"]},{"time":"01:20","place":"hall","present":["Cyril Mabey","Hugo Callender","Beatrice Orme","Ivy Dunn","Ruddle","Lady Callender","Colonel Rudd","Mrs Rudd"],"event":"Ruddle rouses the house, everyone gathers in the hall, and at 01:28 he telephones the Devizes police, PC Gully arriving from the village at 01:55.","witnesses":["Cyril Mabey","Hugo Callender","Beatrice Orme","Ivy Dunn"]}],"evidence":[{"id":"ev1","name":"Bronze stag","where":"study mantelpiece","detail":"A six-pound bronze stag on a squared plinth, back in its place but wiped bright, with blood and two grey hairs caught where the antlers meet the plinth.","proves":"The weapon came from the room and was put back and wiped by someone composed enough to tidy up: a visitor Sir Aubrey had let in, not a stranger.","atScene":true},{"id":"ev2","name":"Burnt papers in the study grate","where":"study fireplace","detail":"Charred letter paper with part of a printed heading, '...EDGE & SONS, TIMBER MERCHANTS, DEVIZES', and a fragment of a ruled sheet reading 'Ridgeway Copse ... £1,1', on top of the fire's last coals.","proves":"Papers about estate timber money were burned after the fire was last made up, by someone with an interest in the estate accounts.","atScene":true},{"id":"ev3","name":"Study door finger-plate","where":"inside of the study door","detail":"A brass finger-plate the housemaid polishes every evening at six, showing fresh smudged prints at hand height.","proves":"Someone pushed the study door shut from inside after six that evening; whose hand it was can be settled by comparison.","atScene":true},{"id":"ev4","name":"Mr Mabey's dress shirt","where":"folded at the bottom of the wardrobe in Mabey's bedroom","detail":"The stiff evening shirt he wore at dinner, its left cuff scrubbed and still faintly damp, with a pinkish-brown ring at the stud hole.","proves":"The wearer tried that same night to wash a stain out of his cuff rather than leave the shirt for the laundry.","atScene":false},{"id":"ev5","name":"Hugo's evening shoes","where":"outside Hugo's bedroom door, collected by the boot boy","detail":"Patent evening shoes soaked through and caked with white chalk mud to the ankle, trouser hems the same.","proves":"Their owner walked a long way outdoors in the sleet after dinner, which is not where a man in bed with a cold would be.","atScene":false}],"forensics":{"tod":"Two blows to the back of the skull from a heavy, sharp-edged object, the first fatal within minutes. Body heat and early rigor in the jaw at 02:15 put death between 22:40 and 23:20, nearer the earlier hour.","prints":"The bronze stag has been wiped clean, but the study door's inner finger-plate, polished at six, bears Sir Aubrey's prints and a fresh right thumb and two fingers of Cyril Mabey. Hugo Callender's prints are nowhere in the study.","comms":"Coombe Abbas exchange: 21:12, a three-minute local call from Coombe Abbas 7 (the Plough Inn) to Sallowmere; 21:41, Sir Aubrey books a trunk call to Western 2214 (Mr Prothero, solicitor, Kensington), connected 21:52 and cleared 21:58. The only other call is Sallowmere to Devizes police at 01:28.","tox":"No poison or drug in Sir Aubrey's blood or in the study decanter; alcohol consistent with dinner wine, port and one whisky. The ring at the stud hole of Mr Mabey's scrubbed left shirt cuff gives a positive benzidine reaction for blood.","logs":"Ruddle's register shows lock-up begun at 22:45, an hour early on Sir Aubrey's order, with the garden-door key missing from the board at 22:47 and back on its hook at his 00:15 round. The staff book records Ivy Dunn banking the bachelors'-corridor fires from 22:45 to 22:58 and finding Mr Mabey's room dark, his writing case strapped shut, and Mr Hugo's room empty."},"redHerring":"An unsigned draft codicil in Sir Aubrey's desk, cutting Hugo's allowance and leaving the unentailed farms to a cousin, looks like a motive for the heir. It is dated March 1921, drawn up when Hugo was sent down from Oxford and dropped that Christmas, as Mrs Orme can say from her brother's own lips; and Hugo was a mile away at the Plough when the blows fell.","solutionPath":["Police surgeon: death between 22:40 and 23:20; the servants' log shows lock-up began at 22:45 that night, so Mrs Orme's thump 'after Ruddle's half past eleven round' really came at about 22:55.","Ivy Dunn saw Mabey go into the study at 22:40 and heard Sir Aubrey tell him to shut the door; fingerprint comparison puts Mabey's hand on the finger-plate polished at six, breaking his claim that he never entered the study.","The servants' log has Mabey's room dark and empty at 22:50, and Ivy (with Albert) saw him hurry up the back stairs at 23:06 holding his cuff, breaking 'I was writing letters in my room'.","Toxicology finds blood in the scrubbed stud hole of Mabey's left cuff; the wiped bronze stag on the mantel is the weapon.","Motive: Hugo heard Sir Aubrey mention 'the Ridgeway timber money' at the port, the exchange log shows the trunk call to his solicitor Prothero at 21:52, and the grate holds burnt Gedge & Sons timber papers, all pointing at the land agent's handling of estate money.","Hugo is cleared: the exchange log shows the call from the Plough, the key register has the garden-door key out over the murder, his shoes are soaked with chalk from the lane, and none of his prints are in the study; his lie hides a secret marriage, and the 1921 codicil is stale.","Name Cyril Mabey: to stop Monday's audit of his timber embezzlement, he struck Sir Aubrey with the bronze stag at about 22:55."]},"briefs":[{"name":"Cyril Mabey","part":"killer","personality":"Smooth, ingratiating and quick to agree, a Devizes ironmonger's son who has studied how gentlemen talk and overdoes it ('if I may say so', 'Sir Aubrey and I'). Pressed, he turns precise and legalistic; cornered, he retreats behind his rights and asks for a solicitor.","voiceSample":"Sir Aubrey and I understood one another perfectly, Inspector; nine years without a cross word, if I may say so.","relationship":"He feared and resented Sir Aubrey, who treated him as an upper servant, and in the last hour hated him for refusing even a week's grace.","movements":[{"from":"19:30","to":"20:00","where":"his bedroom, then the drawing room","doing":"Dressed for dinner and took sherry with the party.","seenBy":["Ivy Dunn","Hugo Callender","Beatrice Orme"]},{"from":"20:00","to":"21:50","where":"dining room","doing":"Dined, then sat over the port and heard Sir Aubrey speak of telephoning Prothero about the Ridgeway timber money.","seenBy":["Hugo Callender","Beatrice Orme","Colonel Rudd"]},{"from":"21:50","to":"22:00","where":"cloakroom passage off the hall","doing":"Overheard Sir Aubrey's trunk call arranging the Monday audit.","seenBy":[]},{"from":"22:00","to":"22:35","where":"drawing room","doing":"Sat silent over coffee, then said he had letters to write and went out.","seenBy":["Hugo Callender","Beatrice Orme","Lady Callender","Colonel Rudd","Mrs Rudd"]},{"from":"22:35","to":"23:04","where":"study","doing":"Went in at 22:40, pleaded with Sir Aubrey, struck him with the bronze stag at 22:55, wiped it and burned the papers.","seenBy":["Ivy Dunn"]},{"from":"23:04","to":"23:13","where":"back stairs and his bedroom","doing":"Hurried up the back stairs, scrubbed his cuff at the basin and burned his handkerchief in the banked fire.","seenBy":["Ivy Dunn","Albert"]},{"from":"23:15","to":"00:30","where":"billiard room","doing":"Played billiards with Colonel Rudd and told him he had been writing letters.","seenBy":["Colonel Rudd","Ruddle"]},{"from":"00:30","to":"01:20","where":"his bedroom","doing":"Took off the shirt, hid it in the wardrobe and lay awake until roused to the hall.","seenBy":[]}],"knows":["He has taken about £3,800 of Ridgeway Copse timber money through Gedge & Sons over three years (he did it).","He overheard Sir Aubrey's trunk call at 21:52 arranging for Prothero and the accountant Gell to come on Monday (he heard it).","Sir Aubrey told him in the study that he would be prosecuted and turned to ring for Ruddle to have him put out of the house (he was there).","He struck Sir Aubrey twice with the bronze stag at about 22:55, wiped it with his handkerchief and set it back on the mantel (he did it).","He burned Gedge's letter and his own timber summary in the study grate before leaving at 23:04 (he did it).","He pushed the study door shut with his bare hand when told to, and knows he wore no gloves (he did it).","A spot of blood on his left cuff, which he scrubbed with soap at 23:08 and then hid the shirt in his wardrobe (he did it).","Hugo was called to the telephone during dinner, came back white, and left the drawing room at 22:20 pleading a cold; Mrs Orme went up at 22:15 (he saw it).","He told Colonel Rudd at the billiard table that he had been writing letters (he said it)."],"doesNotKnow":["That Ivy Dunn saw him enter the study at 22:40 and, with Albert, saw him on the back stairs at 23:06.","That Ivy found his room dark and empty at 22:50 and it went into the staff book.","That the study finger-plate is polished every evening at six.","That Mrs Orme heard the voices and the thump through the floor.","Where Hugo went that night, or that he is secretly married."],"secret":"He embezzled the timber money and killed Sir Aubrey to stop Monday's audit.","lies":[{"claim":"I left the drawing room at about twenty-five to eleven and went straight up to write letters in my room; I came down to billiards at a quarter past.","truth":"He was in the study from 22:40 to 23:04 and in his room only from 23:06 to 23:13.","when":"Asked where he was after leaving the drawing room.","crack":"The servants' log showing his room dark and empty with the writing case strapped shut at 22:50, or Ivy Dunn's sighting of him entering the study or on the back stairs."},{"claim":"I never set foot in the study after dinner; Sir Aubrey had made it plain he was not to be disturbed.","truth":"He was in the study for twenty-four minutes and pushed the door shut with his hand.","when":"Asked whether he saw Sir Aubrey after 22:05.","crack":"The fingerprint report: his fresh prints on the inner finger-plate polished at six."},{"claim":"The estate accounts are in perfect order, Inspector; Sir Aubrey was entirely satisfied with my stewardship.","truth":"He had embezzled about £3,800 and Sir Aubrey had called in a solicitor and an accountant.","when":"Asked about his work, the accounts, or Sir Aubrey's telephone call.","crack":"The exchange log of the trunk call to Prothero together with the burnt Gedge & Sons papers, or Hugo's account of 'the Ridgeway timber money' at the port."},{"claim":"That mark on my cuff? Claret at dinner; I sponged it myself rather than trouble the servants.","truth":"It is Sir Aubrey's blood.","when":"Shown or asked about the shirt.","crack":"The Home Office analyst's positive benzidine test for blood on the cuff."}],"honestMistake":null,"tells":["Turns his signet ring round and round.","Pays the Inspector a compliment just before an untruth."],"pressure":{"baseline":20,"breakPoint":70,"lawyerPoint":85,"style":"lawyer"},"opening":"Good morning, Inspector. A dreadful business; anything I can do to help, anything at all, you have only to ask."},{"name":"Hugo Callender","part":"liar","personality":"Restless, charming and sulky by turns, full of Oxford slang ('I say', 'frightful rot') and inclined to answer a question with a question. He lies badly, gets cross when cornered, and is underneath a decent young man frightened for his wife.","voiceSample":"Look here, Inspector, I was in bed with a stinking cold, and I don't see that it's anybody's business but mine.","relationship":"Fond of his uncle in an exasperated way; Sir Aubrey paid his debts twice and lectured him for it, and Hugo dreaded what he would say about Ruby.","movements":[{"from":"19:30","to":"21:12","where":"his bedroom, drawing room, dining room","doing":"Dressed, took sherry and dined.","seenBy":["Beatrice Orme","Cyril Mabey","Ivy Dunn"]},{"from":"21:12","to":"21:15","where":"hall telephone","doing":"Took a call from Jos Lacey at the Plough telling him to come tonight.","seenBy":["Ruddle"]},{"from":"21:15","to":"22:00","where":"dining room","doing":"Sat over the port; heard his uncle speak of the Ridgeway timber money and watched Mabey go out at 21:50 and come back grey.","seenBy":["Cyril Mabey","Colonel Rudd","Sir Aubrey Callender"]},{"from":"22:00","to":"22:20","where":"drawing room","doing":"Sat with the party, then said good night pleading his cold.","seenBy":["Cyril Mabey","Beatrice Orme","Lady Callender","Colonel Rudd","Mrs Rudd"]},{"from":"22:20","to":"22:27","where":"back passage and garden door","doing":"Took the garden-door key from the board and let himself out, locking the door behind him.","seenBy":[]},{"from":"22:27","to":"23:50","where":"the lane and the Plough Inn back parlour","doing":"Walked to the Plough, sat with Ruby and her father from about 22:55 to 23:20, and walked back.","seenBy":["Ruby Lacey","Jos Lacey"]},{"from":"23:50","to":"01:20","where":"garden door, back stairs, his bedroom","doing":"Let himself in, hung the key back, went up and left his wet shoes outside his door.","seenBy":[]}],"knows":["The 21:12 call was from Jos Lacey at the Plough, saying Ruby was poorly and if Hugo did not come tonight he would come up to the house himself (he took the call).","At the port at about 21:40 his uncle said he must telephone Prothero about 'the Ridgeway timber money', and Mabey went very quiet (he heard and saw it).","Mabey left the dining room at about 21:50 for the cloakroom and came back at 22:00 grey in the face, gulping his port (he saw it).","At about 22:26, taking the key in the back passage, he saw lamplight under the study door and heard his uncle cough inside (he saw and heard it).","He walked to the Plough and back through the sleet rather than crank the motor, which would have woken the house (he did it).","He was in the Plough's back parlour from about 22:55 to 23:20 with Ruby and her father (he was there).","Coming in at 23:50 he heard billiard balls clicking and saw the study lamp still lit under the door (he heard and saw it).","He left his soaked evening shoes outside his door for the boot boy (he did it).","Aunt Beatrice told him at Christmas 1921 that his uncle had dropped the idea of a codicil cutting his allowance (he was told)."],"doesNotKnow":["Who killed his uncle, or how.","That Mabey went into the study at 22:40.","Anything that happened in the house between 22:27 and 23:50.","That Ruddle noticed the garden-door key was missing."],"secret":"He married Ruby Lacey, the Plough landlord's daughter, at Marylebone register office in August, and she is expecting. His uncle would have cut him off, and he fears the family still will.","lies":[{"claim":"I went up at twenty past ten with this beastly cold and slept like a log until Ruddle hammered on the door.","truth":"He was out of the house from 22:27 to 23:50, walking to the Plough and back.","when":"Asked where he was after leaving the drawing room.","crack":"His soaked, chalk-caked evening shoes, the key register showing the garden-door key missing from 22:47, or the exchange log's call from the Plough."},{"claim":"The call at dinner? Some chap from my club about a horse.","truth":"It was Jos Lacey calling from the Plough about Ruby.","when":"Asked about the telephone call during dinner.","crack":"The exchange log showing the call came from Coombe Abbas 7, the Plough Inn."}],"honestMistake":null,"tells":["Lights a fresh cigarette from the stub of the last.","Says 'Look here' before anything untrue."],"pressure":{"baseline":25,"breakPoint":60,"lawyerPoint":85,"style":"anger"},"opening":"I suppose you want to know where I was. In bed, Inspector, like any sane man on a night like that."},{"name":"Beatrice Orme","part":"mistaken","personality":"Imperious, exact and certain, a rector's daughter who has run other people's households for forty years and despises fuss. She speaks in short complete sentences and corrects grammar; if she feels doubted or patronised she goes cold and silent.","voiceSample":"I am not in the habit of imagining things, Inspector; I heard my brother cry out at five and twenty to twelve.","relationship":"She loved Aubrey without illusions and quarrelled with him daily; he was the last of her family, and she is badly shaken beneath the starch.","movements":[{"from":"19:30","to":"21:20","where":"her bedroom, drawing room, dining room","doing":"Dressed and dined.","seenBy":["Cyril Mabey","Hugo Callender","Ivy Dunn"]},{"from":"21:20","to":"22:15","where":"drawing room","doing":"Sat with Lady Callender and Mrs Rudd; the men came in at 22:00 and Aubrey looked in before going to the study.","seenBy":["Lady Callender","Mrs Rudd","Cyril Mabey","Hugo Callender"]},{"from":"22:15","to":"22:47","where":"her bedroom above the study","doing":"Went to bed and dozed.","seenBy":[]},{"from":"22:47","to":"01:05","where":"her bedroom","doing":"Woke to the garden door rattling, heard voices and a thump below, later the garden door and steps; lay awake.","seenBy":[]},{"from":"01:05","to":"01:12","where":"back stairs and study","doing":"Went down and found Aubrey dead.","seenBy":[]},{"from":"01:12","to":"02:00","where":"hall","doing":"Sat with the household until the constable came.","seenBy":["Cyril Mabey","Hugo Callender","Ivy Dunn"]}],"knows":["At about 21:12 Ruddle fetched Hugo from the table to the telephone and he came back white (she saw it).","At 22:00 the men came in; Aubrey looked in 'black as thunder', said he had accounts to see to and went to the study; Mabey sat silent fiddling with his signet ring (she saw it).","She went up at 22:15, dozed, and was woken by the garden door below her window being tried, which she took for Ruddle's lock-up round (she heard it).","A few minutes later she heard men's voices below, Aubrey's raised and the word 'Monday' twice, the other a man's voice, lower and pleading, that she could not
