ve looked at the log properly at five to midnight.","movements":[{"from":"17:00","to":"18:06","where":"met office and met screen","doing":"Worked up the afternoon returns and did the 18:00 obs outside from 17:55 to 18:06.","seenBy":[]},{"from":"18:08","to":"20:15","where":"lounge bar, dining room, then the met office","doing":"Had a can, reported the wind, ate, then plotted the evening synoptic.","seenBy":["Alec Fenwick","Terry Ludlow","Jim Threlfall"]},{"from":"20:15","to":"22:25","where":"lounge","doing":"Watched the film, out to the screen for the 21:00 obs from 20:55 to 21:06.","seenBy":["Alec Fenwick","Terry Ludlow","Jim Threlfall"]},{"from":"22:28","to":"23:50","where":"bunk room 1","doing":"Turned in for a kip before the midnight obs; heard thumps at about 22:33 and Ludlow's voice through the wall until about 23:20; Ludlow came to bed about 23:46.","seenBy":["Terry Ludlow"]},{"from":"23:55","to":"00:15","where":"met screen, cold porch and Teague's cabin","doing":"Did the midnight obs, found Marchant still signed out and his peg empty at 00:08, and woke Teague.","seenBy":["Graham Teague"]},{"from":"00:15","to":"01:00","where":"lounge and corridor","doing":"Mustered, waited, and helped carry Marchant to the surgery.","seenBy":["Alec Fenwick","Terry Ludlow","Jim Threlfall"]}],"knows":["The 21:00 obs: 52 knots south-easterly, minus 34, visibility three metres in drift; at 21:06 the porch light was on and Marchant not yet signed out (he did the obs and saw the log).","At dinner Marchant and Threlfall had words about the store; Fenwick left the film at about 22:08 with a headache, Teague went to his cabin at 22:12, Threlfall nipped out for four minutes at about 22:18, and the film ended at 22:25 (he saw and heard it).","Through the bunk 1 wall he heard Ludlow's voice in the radio room on and off from 22:28, when he turned in, until about twenty past eleven, and Ludlow's bunk was empty until about a quarter to midnight (he heard and saw it).","At about 22:33 he heard four or five heavy thumps from the porch end of the hut (he heard it).","At 23:55 the storm bar was stowed, the porch light on, a heap of fresh drift lay inside the outer door, and the door opened freely (he saw it).","At 00:08 the log still showed Marchant 'Core store 21:55, back 22:30' with no return, and his windproof and mitts were not on his peg (he saw it).","The porch standing orders: light on while anyone is out, bar only on the BC's word (he knows them)."],"doesNotKnow":["That the thumps were Marchant beating on a barred outer door from outside.","That the door was barred, or by whom.","What Ludlow was saying in the radio room, or to whom.","What was in Marchant's telex or what he and Fenwick quarrelled about."],"secret":null,"lies":[],"honestMistake":{"claim":"Clive came in at twenty-five to eleven, near enough: I heard him stamping the snow off and banging about in the porch, and at five to twelve there was fresh drift inside the door and the bar up, so he'd been in and gone out again later without signing, which he would.","truth":"The thumps were Marchant beating on the barred outer door from outside; the drift inside the door fell in when Fenwick opened it at 23:36. Marchant never came in.","why":"Bunk 1 backs onto the boot room, he was half asleep before the midnight obs, the porch is the only door, and thumping in the porch has always meant somebody coming in."},"tells":["Takes off his glasses and polishes them on his jersey.","Says 'I'll be honest with you' before anything he is unsure of."],"pressure":{"baseline":15,"breakPoint":65,"lawyerPoint":90,"style":"tears"},"opening":"I should have looked at that log properly at five to twelve. I'll give you everything I've got, times and all, and you can sort out what matters."},{"name":"Jim Threlfall","part":"honest","personality":"Terse, practical and quick to take offence, a Keswick climber on his first winter, who speaks in short Cumbrian sentences and stammers when angry. He distrusts clever talk and scientists' squabbles, says 'I'll not say what I don't know', and when he feels blamed asks for the Base Commander to be in the room.","voiceSample":"I rigged them lines in March and they'd hold a skidoo; it weren't the line that killed him.","relationship":"He thought Marchant a dry stick who never said thank you and is ashamed of what he said at dinner before Marchant was cold; he had nothing against him worth the name.","movements":[{"from":"17:10","to":"17:48","where":"skidoo garage and gash pit","doing":"Signed out, dug out the gash-pit hatch and checked the skidoo covers.","seenBy":[]},{"from":"18:00","to":"20:15","where":"lounge bar, dining room, then bunk room 2","doing":"Played crib with Ludlow, had words with Marchant at dinner, then wrote his diary.","seenBy":["Alec Fenwick","Terry Ludlow","Phil Garrity"]},{"from":"20:15","to":"23:25","where":"lounge","doing":"Watched the film and played darts, out to the boot room for tobacco from 22:18 to 22:22.","seenBy":["Alec Fenwick","Phil Garrity","Terry Ludlow","Ray Cosgrove"]},{"from":"23:25","to":"00:10","where":"bunk room 2","doing":"Turned in; Fenwick went out at 23:33 and came back at 23:48.","seenBy":["Alec Fenwick"]},{"from":"00:10","to":"01:00","where":"corridor, round the hut walls, then the surgery","doing":"Mustered, roped to Cosgrove, found Marchant at 00:40 on the north side and helped carry him in.","seenBy":["Phil Garrity","Terry Ludlow","Alec Fenwick","Ray Cosgrove","Owen Kerslake"]}],"knows":["On 20 April the middle rack in the ice cellar came off its brackets; next day Fenwick had him help carry four bags of smashed core to the gash pit, saying 'Clive'll have my guts, keep it between us', and put four empty tubes, numbers in the forties, back on the rack (he did and saw it).","He rigged line B in March on ten canes and it was taut and clipped when he walked it on 12 July; he painted the storm bar in March and it was last dropped on 18 May on Teague's word (he did it).","At dinner he told Marchant to carry his own core after Marchant as good as accused him of being in the store (he said it).","At 21:50 Marchant beckoned Fenwick out of the film and Fenwick came back three minutes later white and sat down without a word; Fenwick left for good at 22:08 saying he had a head (he saw it).","At 22:18, fetching tobacco from his windproof in the boot room, he heard Ludlow's voice behind the radio-room door, 'roger, go ahead', and saw through the porch window that the porch was dark, against the standing order that the light stays on while anyone is out; he took it for a dead bulb (he saw and heard it).","At 23:25 Fenwick was lying dressed on his bunk; at 23:33 he went out saying he needed the bog and was back at 23:48 with drift melting on his felt boots and trouser cuffs and his hands red, and lay down without a word (he saw it).","At 00:40 he found Marchant face down in the drift tail on the north side, ten metres from the annex wall, right hand bare, hood packed with drift, axe beside him; the bar was stowed and the outer door opened freely when they carried him in (he saw it)."],"doesNotKnow":["That the door was barred, or by whom.","What Fenwick wrote in his record book, or that Marchant's telex concerns him.","What Fenwick was doing between 23:33 and 23:48.","That anyone heard thumps at the porch."],"secret":"His small embarrassment: he helped Fenwick tip the smashed core and kept quiet, and said what he said at dinner; he fears Teague will blame him for both and for the line.","lies":[],"honestMistake":null,"tells":["Stammers on the first word when angry.","Looks at the floor and rubs the rope scars on his palm."],"pressure":{"baseline":30,"breakPoint":58,"lawyerPoint":80,"style":"lawyer"},"opening":"If this is about what I said at dinner, I'll want Graham in here. I found him. I'll tell you what I saw and nowt else."}],"id":"antarctic_2"},{"settingId":"antarctic","truth":{"title":"The Absent Observer","house":"Tern, a British Antarctic Survey wintering base on the Lydon Ice Shelf: one long hut of bunk rooms, lounge, galley, surgery, radio room, met office and lab behind a cold porch, with the generator shed forty metres east and the balloon shed sixty metres west along handlines.","victim":{"name":"Trevor Hallam","age":44,"role":"atmospheric physicist running the Dobson ozone programme, senior scientist on base","sketch":"A lean, exact man in half-moon spectacles and a Shetland jersey, who kept the Dobson readings in a hand like print and said 'it's the record' the way other men say amen. Three winters south, respected by everyone and liked by nobody much, he had never missed a reading."},"night":{"start":"17:00","end":"01:00","discovered":"23:52","discoveredBy":"Gethin Probert","where":"the lab"},"weather":"Thursday 14 July 1983: full dark, minus 31, a 40-knot south-easterly with heavy drift and visibility of ten metres on the handlines.","publicFacts":["Dr Trevor Hallam was found dead on the lab floor at 23:52 by Gethin Probert, face down between his bench and the Dobson hatch ladder with a retort stand beside him.","The wintering crew of nine: Howard Keble (Base Commander), Dr Martin Suttle (medical officer), Trevor Hallam (atmospheric physicist), Ray Coyle (diesel mechanic), Gethin Probert (radio operator), Simon Yeardley (met observer), Nick Stobart (general assistant), Les Dakin (cook) and Phil Crane (electrician).","Dr Suttle pronounced Hallam dead at 00:05 and told Keble the two head wounds were not a fall; Keble raised Rothera and Cambridge at 00:22 and the Director deputised Keble's deputy to investigate before the 08:00 sked. There is no aircraft until October.","A 40-knot south-easterly blew drift all evening at minus 31; nobody goes outside except along the handlines and everyone signs the porch log.","Dinner was at 18:30 and uckers in the lounge from 21:30; Hallam went to the lab after dinner as most nights, and Yeardley's 23:00 radiosonde ascent went up on time.","Everyone on base knew Hallam had had words with Yeardley in the met office that afternoon about his night observations.","Keble has sealed the lab; the crew were mustered in the lounge at 00:35 and nobody goes outside until morning."],"suspects":[{"name":"Ray Coyle","age":52,"role":"diesel mechanic, his fourth winter south, who keeps the base's two Listers running and has taken the met observer under his wing","sketch":"A thickset Wallsend man with cropped grey hair, fitter's hands black to the wrist and a roll-up behind one ear. He answers slowly, looks you in the eye, and calls everyone under forty 'son'.","part":"killer"},{"name":"Gethin Probert","age":29,"role":"radio operator from Aberystwyth, who keeps the daily sked with Cambridge and punches every telex that leaves the base","sketch":"Slight and pale with a chess player's stillness, a Welsh lilt and a pencil always in his hand. He gives exact times and frequencies and goes quiet rather than argue.","part":"liar"},{"name":"Nick Stobart","age":27,"role":"general assistant, a Keswick climber who runs the field equipment and is the base's photographer","sketch":"Broad, still windburnt from the midwinter trip, with a chipped incisor and fixer stains on his fingers. He is cheerful, certain of what he saw, and gets prickly if you doubt him.","part":"mistaken"},{"name":"Simon Yeardley","age":24,"role":"met observer, a Met Office assistant on loan to the Survey for his first winter, from South Shields","sketch":"Thin, hollow-eyed and polite, with bitten nails and a Met Office jersey a size too big. He apologises before he answers and his hands shake on the tea mug.","part":"honest"}],"killer":"Ray Coyle","accomplice":null,"motive":"Hallam found that Yeardley had entered the 03:00 and 06:00 observations for three nights without going out, and dictated a telex for the morning sked asking that the lad be relieved of duty and the Met Office told, which would have finished him. Coyle, who lost a son of Yeardley's age in 1979 and had found the lad sitting in the cold porch in his socks at four in the morning a week before, went to the lab to beg Hallam to hold it, and when Hallam would not, killed him to stop the sked.","method":"At 22:46 in the lab, after six minutes of pleading, Coyle took the retort stand from the bench by its rod and struck Hallam twice on the back of the head with its two-kilo iron base as he turned back to his readings. He wiped the rod, laid the stand by the Dobson hatch ladder and tipped the stool over to pass it off as a fall, pocketed Hallam's handwritten draft of the telex, and went back out unsigned to the generator shed to finish the oil change that was his alibi.","alibiGap":{"from":"22:30","to":"23:15","killerClaims":"That he signed out at 22:30 to change the oil on the standby Lister and was in the generator shed until he signed in at 23:15, as the porch log and the generator log both show.","actually":"He drained the sump at 22:33, walked back in unsigned at 22:38, pleaded with Hallam in the lab from 22:40, struck him at 22:46, staged a fall and left at 22:58, went out again unsigned at 23:02, refilled the sump and signed in at 23:15."},"timeline":[{"time":"17:10","place":"met office","present":["Trevor Hallam","Simon Yeardley"],"event":"Hallam lays the porch log beside the met register and tells Yeardley that three nights' 03:00 and 06:00 observations were entered without anyone going out and that it goes to Cambridge on the morning sked; Coyle is at his evening check in the generator shed (signed out 17:00 to 17:50), Probert in the radio room, and Stobart, passing the door, hears the last sentence.","witnesses":["Simon Yeardley","Nick Stobart"]},{"time":"18:30","place":"dining room","present":["Trevor Hallam","Ray Coyle","Gethin Probert","Nick Stobart","Simon Yeardley","Howard Keble","Martin Suttle","Les Dakin","Phil Crane"],"event":"Dinner for all nine: Hallam talks ozone with Suttle and never looks at Yeardley, who eats nothing beside Coyle; afterwards Hallam goes to the lab as most nights and Keble to his office.","witnesses":["Ray Coyle","Gethin Probert","Nick Stobart","Simon Yeardley"]},{"time":"19:20","place":"radio room","present":["Trevor Hallam","Gethin Probert"],"event":"Hallam dictates a telex to the Director for the 08:00 sked and Probert punches the tape and reads it back: Yeardley's night observations fabricated, relieve him of observing duties, inform the Met Office.","witnesses":["Gethin Probert"]},{"time":"20:40","place":"galley","present":["Gethin Probert","Ray Coyle"],"event":"Making a brew, Probert tells Coyle what is on the tape ('Trevor's sending the lad up the river in the morning, Ray, duties and all'), and Coyle puts his mug down untouched and goes back to the lounge; Yeardley is out at the 21:00 observation from 20:52.","witnesses":["Gethin Probert"]},{"time":"21:12","place":"Yeardley's bunk room","present":["Ray Coyle","Simon Yeardley"],"event":"Coyle follows Yeardley in from the observation (signed out 20:52, in 21:10) and asks him straight; Yeardley admits he filled in the night obs without going out because he could not face the dark, says he would sooner walk out onto the shelf than go home a fraud, and Coyle tells him to leave it with him.","witnesses":["Simon Yeardley"]},{"time":"21:30","place":"lounge","present":["Nick Stobart","Ray Coyle","Gethin Probert","Martin Suttle","Les Dakin","Phil Crane"],"event":"Uckers, Suttle and Dakin against Crane and Stobart until 22:15, with Coyle watching over his tea and saying nothing and Probert reading until he goes off at 22:12 saying he is turning in; Yeardley is in the met office from 21:40 preparing the sonde, and at 22:15 Stobart goes along to the darkroom, the plywood box partitioned off the end of the lab, and at 22:24 by its timer puts the week's aurora film into the developer.","witnesses":["Nick Stobart","Ray Coyle","Gethin Probert"]},{"time":"22:28","place":"cold porch","present":["Simon Yeardley","Ray Coyle"],"event":"Yeardley signs out at 22:28 for the balloon shed and the 23:00 ascent, noticing light under the radio-room door and the red lamp under the darkroom's, and Coyle, kitting up beside him, says he is off to drop the oil on the standby and signs out at 22:30.","witnesses":["Simon Yeardley","Ray Coyle"]},{"time":"22:31","place":"radio room","present":["Gethin Probert"],"event":"Probert, who slipped into the radio room at 22:26, keys the Argentine Base Lasala on 7.080 MHz and works the sked until 22:54; at 22:39, through the door's glass panel, he sees Coyle come in from the porch in boots and boilersuit without stopping at the log and go down the science corridor.","witnesses":["Gethin Probert"]},{"time":"22:40","place":"lab","present":["Ray Coyle","Trevor Hallam"],"event":"Coyle, who pulled the sump plug on the standby at 22:33 and walked back in unsigned at 22:38, asks Hallam to hold the telex and let him sort the lad out himself; Hallam says the record is the record and the boy falsified it, and for six minutes Coyle pleads in a low voice ('give him till October, man') that Stobart hears through the darkroom wall and takes for Yeardley's.","witnesses":["Nick Stobart"]},{"time":"22:46","place":"lab","present":["Ray Coyle","Trevor Hallam"],"event":"As Hallam turns back to the bench, Coyle takes the retort stand by its rod and strikes him twice on the back of the head with the iron base, the thump and the clatter of the stool reaching Stobart, who has film in the fixer and does not come out; Coyle turns Hallam over, leaving sump oil from his hands on the jersey collar and the bench edge, wipes the rod with a lab tissue, lays the stand by the hatch ladder, tips the stool, pockets the tissue and Hallam's handwritten draft, and leaves at 22:58, Stobart hearing the door and boots going up the corridor.","witnesses":["Nick Stobart"]},{"time":"22:59","place":"balloon shed","present":["Simon Yeardley"],"event":"Yeardley, who has been filling and holding the balloon since 22:35, launches the ascent into the drift, the sonde signal starting the met-office receiver chart at 22:59, and signs in at 23:06, finding Coyle still out in the log and his windproof off its peg.","witnesses":[]},{"time":"23:02","place":"generator shed","present":["Ray Coyle"],"event":"Coyle, out again unsigned at 23:02, refills the standby's sump, drops the draft telex and the tissue into the waste-oil tray, writes the oil change up as 22:30 to 23:10 and signs in at 23:15; Probert, off the key since 22:54, has been in his bunk room since 22:56.","witnesses":["Martin Suttle","Les Dakin","Phil Crane"]},{"time":"23:10","place":"science corridor","present":["Nick Stobart"],"event":"Stobart comes out of the darkroom, sees wet boot-prints on the lino from the porch end to the lab door and Yeardley's back at the sonde receiver with his headphones on, and goes to the galley for a brew, where Coyle comes in from the porch at 23:16 to wash, then to the lounge.","witnesses":["Ray Coyle"]},{"time":"23:50","place":"lab","present":["Gethin Probert","Trevor Hallam"],"event":"Sent by Keble with the tape for Hallam to read over before the sked, Probert finds Hallam at 23:52 face down between the bench and the hatch ladder with the retort stand beside him and shouts for Suttle, who pronounces him dead at 00:05 and tells Keble the two wounds are not a fall, Coyle and Stobart waiting in the lounge and Yeardley in the met office.","witnesses":["Gethin Probert"]},{"time":"00:35","place":"lounge","present":["Ray Coyle","Gethin Probert","Nick Stobart","Simon Yeardley","Howard Keble","Martin Suttle","Les Dakin","Phil Crane"],"event":"Keble, who raised Rothera and Cambridge at 00:22 with Probert on the key and was told the Director deputises his deputy to investigate, musters the eight in the lounge, Yeardley coming from the met office with the ascent still running, seals the lab and orders nobody outside until morning.","witnesses":["Ray Coyle","Gethin Probert","Nick Stobart","Simon Yeardley"]}],"evidence":[{"id":"ev1","name":"Retort stand","where":"lab floor beside the Dobson hatch ladder","detail":"A retort stand with a two-kilo cast-iron base, the rod wiped bright and the base's edge carrying blood and two grey hairs; it normally stands at the end of Hallam's bench holding the calibration lamp.","proves":"The weapon came from the room and was wiped and placed by someone composed enough to tidy, which a fall does not do.","atScene":true},{"id":"ev2","name":"Hatch ladder and stool","where":"the lab, under the Dobson roof hatch","detail":"The ladder to the roof hatch with both hatch clips still dogged shut from inside and frosted over, and the lab stool on its side a yard from the body.","proves":"Nobody opened the hatch or went up the ladder that night; the fall was arranged by someone who did not look up.","atScene":true},{"id":"ev3","name":"Oil smears","where":"collar of Hallam's jersey and the painted edge of the lab bench","detail":"A black thumb-sized smear of oil on the Shetland jersey collar, and a matching smear with ridge marks on the bench edge above the body.","proves":"Whoever turned Hallam over had fresh oil on his hands; the lab keeps no engine oil, and the assay can say what kind it is.","atScene":true},{"id":"ev4","name":"Telex tape","where":"the outgoing tray in the radio room","detail":"A punched tape and its typed copy, timed 19:25 for the 08:00 sked, Hallam to the Director: Yeardley's night observations on three dates fabricated, relieve him of observing duties, inform the Met Office.","proves":"Hallam was about to end the met observer's career in the morning, and the radio operator knew the text from 19:25.","atScene":false},{"id":"ev5","name":"Draft telex in the waste-oil tray","where":"the drain tray under the standby Lister in the generator shed","detail":"A sheet of Hallam's quarto folded small, soaked in black sump oil but legible, in his hand: the draft of the telex; with it a wad of lab tissue, oily and brown-stained.","proves":"Whoever took the draft from Hallam's bench put it in the tray during the night's oil change, and only the mechanic worked at that tray.","atScene":false},{"id":"ev6","name":"Hallam's pocket diary","where":"the shelf above Hallam's bunk","detail":"A Letts diary with Thursday's entry: '2230 - P. on 7 meg again? Tell HK Sat.'","proves":"Hallam had noticed someone on 7 MHz at 22:30 on other nights and meant to raise it with Keble on Saturday: a second man with reason to fear him.","atScene":false}],"forensics":{"tod":"Two blows to the back of the skull from a straight heavy edge about an inch wide, the second struck after he was down; no bruising to the hands, hips or shins such as a fall from the hatch ladder would give. With the lab at 16 degrees, body warmth and rigor beginning in the jaw at 00:45 put death between 22:20 and 23:10.","prints":"The retort stand's rod has been wiped and carries only smears. On the painted edge of the bench beside the body are a right thumb and two fingers of Ray Coyle laid down in fresh engine oil, and a second oily partial of his is on the lab door's push plate. Simon Yeardley's prints are on the met-office door, the sonde receiver and the balloon-shed winch and nowhere in the lab; Gethin Probert's are on the radio-room key and door and Hallam's watch strap only.","comms":"Radio log: 19:25, tape punched for the 08:00 sked, Hallam to the Director: 'MET OBSERVER YEARDLEY. SYNOPTIC OBS 0300 AND 0600 ON 12, 13 AND 14 JULY ENTERED BUT PORCH LOG SHOWS NO EXIT. VALUES FABRICATED. REQUEST HE BE RELIEVED OF OBSERVING DUTIES AND MET OFFICE INFORMED. HALLAM.' Nothing further until Keble's call to Rothera at 00:22. The transmitter was found on 7.080 MHz, outside any Survey frequency, with a chess position in Probert's hand on the blotter; at 07:10 Keble raised the Argentine station Lasala on it and their operator, Cabo Oscar Riquelme, confirmed a morse sked with 'Gethin' from 22:31 to 22:54 last night.","tox":"No drug or poison in Hallam's blood or in the lab's spirit bottle; alcohol equal to one measure of whisky. The black smear on his jersey collar and the one on the bench edge are used diesel-engine sump oil carrying combustion soot, matching the drain tray under the standby Lister and not the clean oil in the shed's drums.","logs":"Generator log, in Coyle's hand: 'No. 2 standby, 250-hr oil change, 2230-2310, 11 l out, 11 l in.' Porch log after 17:50: Yeardley out 20:52 in 21:10 (obs), out 22:28 in 23:06 (balloon shed); Coyle out 22:30 in 23:15 (gen shed); nobody else. The hut thermograph by the porch door dips at each opening of the outer door: after the pair for the 21:00 obs, a double dip at about 22:29, a single at 22:38, a double at about 23:04 and a single at 23:15: two openings more than the log records. The generator's load trace shows the ragged kilowatt of the HF transmitter keying from 22:31 to 22:54."},"redHerring":"Hallam's diary note '2230 - P. on 7 meg again? Tell HK Sat.' and the transmitter found on 7.080 MHz make Probert look like a second man Hallam was about to report, lying about his bunk twenty yards from the lab. But the load trace shows the transmitter keying from 22:31 to 22:54, Lasala confirms the sked, his prints are nowhere in the lab, and the note was for a word with Keble on Saturday, not a telex.","solutionPath":["Station doctor: two blows with a straight edge and no fall injuries, death between 22:20 and 23:10; the hatch clips dogged shut and frosted from inside show the fall was staged.","Stobart's darkroom account fixes the pleading at 22:40, the blows at about 22:46 and the voice as Tyneside; the porch log and the sonde receiver chart starting at 22:59 put Yeardley at the balloon shed from 22:28 to 23:06, so the voice was the other Tynesider, Coyle.","Logs report: the thermograph dips at 22:38 and about 23:02 are two door openings the porch log does not show, inside Coyle's claimed 22:30 to 23:15 in the generator shed; Stobart's wet boot-prints to the lab door and, once his sked is out, Probert's sighting of Coyle in the corridor at 22:39 put him inside.","Fingerprints put Coyle's oily hand on the bench edge beside the body and the lab assay matches the oil on Hallam's collar to the standby's drain tray, breaking 'I've not set foot in that lab since May'.","Motive: the telex tape, Probert's account of telling Coyle at 20:40, Yeardley's account of 'leave it with me, son' at 21:12 and Hallam's draft in the waste-oil tray show Coyle knew what the morning sked would do to the lad.","Probert is cleared: the load trace shows the transmitter keying 22:31 to 22:54, Lasala confirms the sked, his prints are nowhere in the lab, and Hallam's diary note was for a word with Keble, not a telex.","Name Ray Coyle: to stop the telex that would have finished Simon Yeardley, he struck Hallam twice with the lab's retort stand at about 22:46 and dressed it as a fall from the hatch ladder."]},"briefs":[{"name":"Ray Coyle","part":"killer","personality":"Gruff, slow-spoken and dry, a Wallsend fitter who did twenty years in Merchant Navy engine rooms and treats a question like a cold engine: he lets it turn over before he answers. Geordie to the bone ('why aye', 'man', 'nowt', 'canny'), he calls the deputy 'son', deflects by talking about the Listers, and when cornered gets loud and angry rather than clever.","voiceSample":"Why aye, I was in the shed, son. Eleven litres out and eleven in; a Lister's the only thing down here that does what it's told.","relationship":"He thought Hallam a cold, righteous man who would ruin a lad for a column of figures, and he begged him in all but on his knees; he does not regret it the way he should.","movements":[{"from":"17:00","to":"20:40","where":"generator shed, dining room, lounge","doing":"Evening check (signed out 17:00 to 17:50), dinner beside Yeardley, then the lounge; at 20:40 in the galley Probert told him what was on the tape.","seenBy":["Gethin Probert","Nick Stobart","Simon Yeardley"]},{"from":"21:10","to":"21:25","where":"Yeardley's bunk room","doing":"Asked the lad straight, heard it all, and told him to leave it with him.","seenBy":["Simon Yeardley"]},{"from":"21:30","to":"22:28","where":"lounge","doing":"Watched the uckers over his tea and said nothing.","seenBy":["Nick Stobart","Gethin Probert","Martin Suttle"]},{"from":"22:28","to":"22:38","where":"cold porch and generator shed","doing":"Signed out at 22:30 beside Yeardley, pulled the sump plug on the standby at 22:33 and walked back in unsigned at 22:38.","seenBy":["Simon Yeardley"]},{"from":"22:38","to":"23:02","where":"science corridor and lab","doing":"Pleaded with Hallam, struck him at 22:46, staged the fall, took the draft, left at 22:58 and kitted up in the porch.","seenBy":["Gethin Probert"]},{"from":"23:02","to":"23:15","where":"generator shed","doing":"Refilled the sump, dropped the draft and the tissue in the tray, wrote up the log and signed in at 23:15.","seenBy":[]},{"from":"23:16","to":"01:00","where":"galley, then lounge","doing":"Scrubbed his hands, sat with the uckers players until the shout at 23:52, then the muster.","seenBy":["Nick Stobart","Martin Suttle","Les Dakin","Phil Crane"]}],"knows":["Probert told him in the galley at 20:40 that Hallam's tape for the morning sked asked for the lad to be relieved and the Met Office told (he heard it).","Yeardley admitted to him at about 21:12 that he had filled in the night obs without going out, and said he would sooner walk out onto the shelf than go home a fraud (he heard it).","A week ago at four in the morning he found Yeardley sitting in the cold porch in his socks, and walked him back to his bunk without telling anyone (he did it).","He signed out at 22:30 next to Yeardley, drained the standby's sump at 22:33, and came back in at 22:38 without signing because he meant to be two minutes (he did it).","He pleaded with Hallam from 22:40 ('give him till October, man') and at 22:46 took the retort stand by its rod and hit him twice with the base; Hallam never turned round (he did it).","He turned Hallam over with oily hands, wiped the rod with a lab tissue, laid the stand by the ladder, tipped the stool, and took the handwritten draft because it had the lad's name on it (he did it).","He went out again unsigned at 23:02, put the draft and the tissue in the drain tray under the standby, wrote the oil change up as 22:30 to 23:10 and signed in at 23:15 (he did it).","There was light under the radio-room door at 22:30 and morse through its wall as he passed at 22:38, with no sked due (he saw and heard it)."],"doesNotKnow":["That Stobart was in the darkroom through the plywood wall and heard the pleading and the blows.","That Probert saw him come in at 22:39 through the radio-room door's glass.","That the hut thermograph by the porch door records every opening of the outer door.","That he left oily prints on the bench edge and oil on Hallam's collar.","That the hatch clips were dogged shut from inside and give the fall away."],"secret":"He killed Hallam to stop the telex that would have finished Simon Yeardley, the lad he has been keeping alive through the dark; nobody, least of all Simon, is to know.","lies":[{"claim":"I signed out at half ten to drop the oil on the standby and I was in the shed till quarter past eleven, son. It's in the porch log and the gen log.","truth":"He was back inside unsigned from 22:38 to 23:02 and in the lab from 22:40 to 22:58.","when":"Asked where he was between half past ten and quarter past eleven.","crack":"The thermograph dips at 22:38 and about 23:02 that the porch log does not show, Stobart's wet boot-prints to the lab door, or Probert's sighting of him in the corridor at 22:39."},{"claim":"I've not set foot in that lab since I fixed the fume-cupboard fan in May.","truth":"He was in the lab from 22:40 to 22:58 and turned the body over.","when":"Asked about the lab, or whether he saw Hallam after dinner.","crack":"The fingerprint report putting his oily prints on the bench edge, or the lab assay matching the oil on Hallam's collar to the standby's drain tray."},{"claim":"Telex? First I knew of any telex was when Gethin came running. I'm the mechanic, man; nobody tells me what goes on the sked.","truth":"Probert told him at 20:40 and Yeardley confirmed it at 21:12.","when":"Asked about the telex, Hallam's complaint, or Yeardley's observations.","crack":"Probert's or Yeardley's account of telling him, or the draft telex found in the drain tray he was working at."},{"claim":"Trevor was up that daft ladder to the hatch every night; he's come off it and cracked his head on the stand. There's your murder.","truth":"He struck Hallam twice from behind and arranged the stand, stool and ladder afterwards.","when":"Asked how he thinks Hallam died, or about the scene.","crack":"The doctor's report of two blows and no fall injuries, or the hatch clips dogged shut and frosted from inside."}],"honestMistake":null,"tells":["Rolls a cigarette he does not light.","Starts talking about the Listers when the question is about the lab."],"pressure":{"baseline":15,"breakPoint":72,"lawyerPoint":90,"style":"anger"},"opening":"Ask away, son, but ask quick; I've a sump in bits and a sked at eight. Bad do, this. Trevor was a cold fish but he didn't deserve the floor."},{"name":"Gethin Probert","part":"liar","personality":"Quiet, exact and watchful, a chess player from Aberystwyth who speaks in times and frequencies ('twenty-two fifty-four, on the nose') and answers a question with a question when he does not like it. Welsh-soft, says 'see' and 'fair play', never raises his voice; when trapped he simply stops talking and looks at the table.","voiceSample":"I log what goes out on the sked, see. What a man does with a paperback in his bunk is nobody's concern, is it?","relationship":"He respected Hallam's exactness as one careful man respects another, and had dreaded him since finding him in the radio-room doorway one night last week; he is sorry he is dead and ashamed of being relieved.","movements":[{"from":"17:00","to":"19:40","where":"radio room and dining room","doing":"Coded the afternoon obs, dined, then at 19:20 took Hallam's dictation and punched the tape for the morning sked.","seenBy":["Ray Coyle","Nick Stobart","Simon Yeardley"]},{"from":"20:35","to":"22:12","where":"galley, then lounge","doing":"Made a brew and told Coyle what was on the tape, then read his paperback through the uckers and said he was turning in.","seenBy":["Ray Coyle","Nick Stobart","Martin Suttle"]},{"from":"22:12","to":"22:26","where":"his bunk room","doing":"Fetched his chess notebook and waited for the corridor to clear.","seenBy":[]},{"from":"22:26","to":"22:56","where":"radio room","doing":"Keyed Base Lasala on 7.080 from 22:31 to 22:54 and saw Coyle pass at 22:39.","seenBy":[]},{"from":"22:56","to":"23:48","where":"his bunk room","doing":"Lay on his bunk with the notebook until Keble knocked.","seenBy":[]},{"from":"23:50","to":"01:00","where":"lab, radio room, lounge","doing":"Found Hallam, worked the emergency call with Keble, then the muster.","seenBy":["Howard Keble","Martin Suttle","Ray Coyle"]}],"knows":["Hallam dictated the telex at 19:20 and he punched it himself: Yeardley's 03:00 and 06:00 obs on the 12th to 14th fabricated, relieve him of duties, inform the Met Office (he did it).","He told Coyle what was on the tape in the galley at 20:40, and Coyle put his mug down and went out without a word (he did it).","From 22:31 to 22:54 he was on the key to Cabo Oscar Riquelme at the Argentine station Lasala on 7.080 MHz, a chess game adjourned at move 31 (he did it).","At 22:39, through the glass panel of the radio-room door, he saw Coyle come in from the porch in boots and boilersuit, not stop at the log, and go down the science corridor towards the lab (he saw it); he will admit this only once his own sked is out.","Hallam stood in the radio-room doorway at half past ten the Thursday before, said 'Seven megs, Gethin? Interesting', and walked off (he heard it).","At 23:52 Hallam was face down between the bench and the ladder, the stand beside him and the stool over; he touched only the wrist (he saw it).","Nothing went out between the 08:05 sked and the emergency call, and no sked is due at 22:30 (he keeps the schedule)."],"doesNotKnow":["Who killed Hallam or how; he saw only a man on the floor.","What Coyle did in the lab, or what was said there.","That Stobart was in the darkroom, or what he heard.","That Hallam wrote a note about '7 meg' in his diary."],"secret":"Since May he has kept an unlogged nightly morse sked with Cabo Oscar Riquelme, an Argentine conscript at Base Lasala whose brother died on the Belgrano: chess, family news, a little Welsh for a little Spanish. A year after the war, standing orders forbid contact with Argentine stations without the Base Commander's authority, and Keble, late of the Royal Marines, would have his licence and his job.","lies":[{"claim":"I turned in at ten past ten with a paperback, see, and I didn't stir till Howard knocked at ten to twelve.","truth":"He was in the radio room from 22:26 to 22:56 on an unauthorised sked, and saw Coyle pass at 22:39.","when":"Asked where he was after leaving the lounge, or about the murder hour.","crack":"The transmitter found on 7.080 with the chess position on the blotter, the load trace keying 22:31 to 22:54, Lasala's confirmation, or two witnesses to the radio-room light at half past ten."},{"claim":"The radio-room light? I'll have left it burning after the evening tape. Seven megs is where I find the Beeb for the cricket.","truth":"He was transmitting to an Argentine station on 7.080 MHz.","when":"Asked about the light, the dial setting, or 7 MHz.","crack":"Keble's call to Lasala confirming the sked, or the chess notation on the blotter in his hand."},{"claim":"I saw nobody in the corridor that night; I was asleep, wasn't I?","truth":"He saw Coyle come in at 22:39 and go towards the lab.","when":"Asked whether he saw anyone moving about after ten.","crack":"His first lie cracking, or being shown the thermograph dip at 22:38 and told that Coyle says the radio room was lit."}],"honestMistake":null,"tells":["Turns his pencil end over end.","Answers a question with a question before he goes quiet."],"pressure":{"baseline":30,"breakPoint":58,"lawyerPoint":84,"style":"shutdown"},"opening":"I found him, so I expect you want it from the top. Twenty-three fifty-two by the lab clock, and I touched nothing but his wrist."},{"name":"Nick Stobart","part":"mistaken","personality":"Brisk, cheerful and certain, a Keswick climber who has spent ten years trusting his own eyes on wet rock and says so ('I'd not bet my life on it, and I bet my life on things'). He talks fast in Lakeland vowels, laughs at the wrong moments, and if he feels doubted he gets stroppy and wants Howard in the room.","voiceSample":"It were a Geordie voice, young, saying 'please, man', and there's only one lad on this base talks like that; well, two, but one of them's fifty-odd.","relationship":"He found Hallam a cold stick but a straight one, who sat up all night with him on the midwinter trip when his tent went; he liked him more than he let on and is angry someone killed him.","movements":[{"from":"17:00","to":"22:15","where":"food store, dining room, lounge","doing":"Stacked boxes and passed the met office at 17:10, dined, did the washing-up rota, then uckers from 21:30 with Suttle, Dakin and Crane.","seenBy":["Simon Yeardley","Ray Coyle","Gethin Probert","Martin Suttle"]},{"from":"22:15","to":"23:10","where":"darkroom","doing":"Developed the aurora film and heard the lab through the plywood.","seenBy":[]},{"from":"23:10","to":"23:20","where":"science corridor and galley","doing":"Saw the boot-prints and Yeardley at the receiver, made a brew, saw Coyle come in and wash.","seenBy":["Ray Coyle"]},{"from":"23:20","to":"01:00","where":"lounge","doing":"Sat with the uckers players and Coyle until the shout at 23:52, then the muster.","seenBy":["Ray Coyle","Martin Suttle","Les Dakin","Phil Crane"]}],"knows":["At 17:10, passing the met office, he heard Hallam tell Yeardley 'it goes to Cambridge on the morning sked' and Yeardley say nothing (he heard it).","Everyone knew Hallam was on at the lad about his night obs; Coyle has been the lad's shadow all winter and the two of them are the only Tynesiders on base (common knowledge).","He put the film in the developer at 22:24 by the darkroom timer, and from about 22:40 heard Hallam through the plywood saying 'the record is the record' and 'he falsified it', and a second man, low and Tyneside, saying 'please, man' and 'give him till October' (he heard it).","At about 22:46 there was a heavy thump and a clatter like the stool going over, then nothing; he had film in the fixer and did not want to walk in on a row (he heard it).","At 22:58 he heard the lab door and boots, not hut shoes, going away up the corridor (he heard it).","At 23:10 there were wet boot-prints on the lino from the porch end to the lab door, and Yeardley was at the sonde receiver in the met office with his headphones on and his back to the door (he saw it).","At about 23:16 Coyle came into the galley from the porch and scrubbed his hands with Swarfega, nothing odd after an oil change (he saw it).","Filling a sonde balloon takes twenty minutes and cannot be left; he has helped Yeardley do it (he knows the job)."],"doesNotKnow":["Who killed Hallam, or that the retort stand was the weapon.","Where Coyle was between 22:30 and 23:15.","That Probert was in the radio room.","What Yeardley told Coyle in the bunk room."],"secret":null,"lies":[],"honestMistake":{"claim":"The man pleading with Trevor through the wall was Simon Yeardley: a young Geordie voice, 'please, man', and he'd had the rocket from Trevor that afternoon.","truth":"It was Ray Coyle, the other Tynesider; Yeardley was at the balloon shed from 22:28 to 23:06.","why":"Plywood, the enlarger fan running, a low pleading voice, and he had heard Hallam threaten Yeardley at 17:10, so he heard what he expected."},"tells":["Folds his arms and sets his jaw when doubted.","Says 'I know what I heard' and asks for Howard."],"pressure":{"baseline":20,"breakPoint":68,"lawyerPoint":88,"style":"lawyer"},"opening":"Right, I'll save you time. I was in the darkroom next to the lab and I heard the whole thing through the wall, and I'm not going to enjoy telling you who it was."},{"name":"Simon Yeardley","part":"honest","personality":"Quiet, polite and frightened, a South Shields lad in his first winter who apologises before he answers ('sorry, aye') and looks at his hands. He tells the truth even when it damns him, goes vague only about how bad the dark has been, and cries when pushed rather than argue.","voiceSample":"Sorry, aye, I made them up. I couldn't get out the door, that's all; I sat in the porch and I couldn't.","relationship":"He was afraid of Hallam and knew he was right; he does not blame him for the telex and cannot understand why anyone would hurt him over it.","movements":[{"from":"17:00","to":"20:50","where":"met office, dining room, lounge","doing":"Coded the 15:00 obs and had Hallam come in at 17:10 with the porch log, ate nothing at dinner, then sat in the lounge corner with a book he did not read.","seenBy":["Nick Stobart","Ray Coyle","Gethin Probert"]},{"from":"20:52","to":"21:10","where":"screen and mast","doing":"The 21:00 observation, signed out and in.","seenBy":["Ray Coyle"]},{"from":"21:10","to":"21:25","where":"his bunk room","doing":"Coyle asked him straight and he told him everything.","seenBy":["Ray Coyle"]},{"from":"21:40","to":"22:28","where":"met office","doing":"Prepared the sonde and the receiver.","seenBy":[]},{"from":"22:28","to":"23:06","where":"balloon shed","doing":"Filled the balloon from 22:35, launched at 22:59, signed in at 23:06.","seenBy":["Ray Coyle"]},{"from":"23:06","to":"00:35","where":"met office","doing":"Followed the ascent on the receiver until the muster.","seenBy":["Nick Stobart"]}],"knows":["He entered the 03:00 and 06:00 obs for the 12th, 13th and 14th from the screen thermograph and the barograph next morning without going out, because he could not make himself open the outer door (he did it).","Hallam told him at 17:10, with the porch log on the desk, that it goes to Cambridge on the morning sked (he heard it).","A week ago Coyle found him in the cold porch at four in the morning in his socks and walked him back to his bunk, and has brought him his tea every morning since (he was there).","At about 21:12 Coyle asked him straight in the bunk room; he told him everything, and Coyle said 'leave it with me, son' (he heard it).","At 22:28 he signed out beside Coyle, who said he was off to drop the oil on the standby; there was light under the radio-room door though no sked was due, and the red lamp under the darkroom's (he saw it).","He filled the balloon from 22:35, launched at 22:59, and the receiver chart in the met office starts at 22:59; filling cannot be left (he did it).","When he signed in at 23:06 Coyle's name was still out in the log and his windproof was off its peg (he saw it).","The hut thermograph by the porch door, which he keeps for the fuel return, dips every time the outer door opens (he keeps it).","Dakin the cook told him in May that Coyle's son died on a motorbike at twenty-three, which is why Ray 'fusses' (he was told)."],"doesNotKnow":["Who killed Hallam, or how.","That Coyle came back inside between 22:30 and 23:15.","What was said in the lab, or that Stobart heard anything.","That Probert was in the radio room, or who he was talking to."],"secret":"His shame is the obs: three nights of figures he never went out for, which he admits if asked directly, and the morning Coyle found him in the porch, which he would rather not discuss.","lies":[],"honestMistake":null,"tells":["Picks at the skin round his thumbnail.","Says 'sorry' before every answer when frightened."],"pressure":{"baseline":35,"breakPoint":55,"lawyerPoint":80,"style":"tears"},"opening":"Sorry. You'll want to know about the obs, I expect. I'll tell you; I'm not going to lie about it now."}],"id":"antarctic_3"}],"country_house":[{"settingId":"country_house","truth":{"title":"Sleet at Sallowmere","house":"Sallowmere House, a draughty flint-and-stone Jacobean house on the edge of Salisbury Plain, a mile and a half up a single lane from the village of Coombe Abbas, Wiltshire.","victim":{"name":"Sir Aubrey Callender","age":63,"role":"baronet, owner of Sallowmere and host of the shooting party","sketch":"A choleric, exacting old Etonian who ran his estate from his own ledgers and trusted few people with them. He was childless; his nephew Hugo is heir to the title and the entailed land."},"night":{"start":"19:30","end":"02:00","discovered":"01:10","discoveredBy":"Beatrice Orme","where":"the study"},"weather":"Sleet from dusk on Saturday 8 November 1924, driven by a north-westerly; the lane to Coombe Abbas ankle-deep in chalk slurry; no frost.","publicFacts":["Sir Aubrey Callender was found dead on the hearthrug of his study at ten past one in the morning by his sister, Mrs Beatrice Orme.","He had been struck on the back of the head; the police surgeon came out from Devizes before dawn.","The party for Saturday's shoot: Lady Callender, Mr Hugo Callender (nephew and heir), Mrs Orme, Mr Cyril Mabey (the land agent), and Colonel and Mrs Rudd.","At about twenty to ten Sir Aubrey left the port to put through a trunk call to London on the hall telephone, and at five past ten he shut himself in his study saying he had accounts to see to.","Sleet fell all night; the motor was laid up in the coach house and nobody used the lane after dinner, so far as the household knows.","Ruddle the butler telephoned the Devizes police through the Coombe Abbas exchange at 01:28; PC Gully bicycled up from the village, and Scotland Yard was asked for at first light."],"suspects":[{"name":"Cyril Mabey","age":47,"role":"land agent to the Sallowmere estate for nine years, invited to shoot with the party","sketch":"A plump, beautifully barbered man in a dinner jacket a shade too new, who turns his signet ring when he thinks. He is anxious to be taken for a gentleman and keeps saying 'Sir Aubrey and I'.","part":"killer"},{"name":"Hugo Callender","age":29,"role":"Sir Aubrey's nephew and heir","sketch":"Tall, fair and rumpled, with a chipped front tooth, a heavy cold and the look of a man who has not slept. He smokes Turkish cigarettes end to end.","part":"liar"},{"name":"Beatrice Orme","age":66,"role":"Sir Aubrey's widowed elder sister, who has kept house at Sallowmere since 1919","sketch":"Upright and beaky in black silk and jet, with a lorgnette she taps when displeased. She addresses the Inspector as she would a junior curate.","part":"mistaken"},{"name":"Ivy Dunn","age":22,"role":"second housemaid, a carter's daughter from Coombe Abbas","sketch":"A thin, freckled girl in a print dress and cap, her hands red from blacking grates. She keeps her eyes on the Inspector's boots.","part":"honest"}],"killer":"Cyril Mabey","accomplice":null,"motive":"Over three years Mabey sold Ridgeway Copse timber through Gedge & Sons of Devizes and banked about £3,800 of the proceeds as his own. A letter from Gedge put Sir Aubrey on to it; he telephoned his solicitor at 21:52 to arrange an audit for Monday and told Mabey to his face that he would be prosecuted.","method":"At 22:55 in the study, after a quarter of an hour of pleading, Mabey snatched the bronze stag from the mantelpiece as Sir Aubrey turned to ring for Ruddle, and struck him twice on the back of the head. He wiped the stag with his handkerchief and put it back, burned Gedge's letter and his own timber summary in the grate, left the lamp burning and the door shut, and went up the back stairs to scrub a spot of blood from his left shirt cuff before joining Colonel Rudd at billiards.","alibiGap":{"from":"22:35","to":"23:15","killerClaims":"That he left the drawing room at 22:35 to write letters in his bedroom, stayed there until about a quarter past eleven, and then went down to the billiard room.","actually":"He went straight to the study at 22:40, killed Sir Aubrey at 22:55, left at 23:04 and spent 23:06 to 23:13 in his room scrubbing his cuff and burning his handkerchief."},"timeline":[{"time":"19:30","place":"bedrooms","present":["Cyril Mabey","Hugo Callender","Beatrice Orme","Ivy Dunn"],"event":"The dressing gong sounds and the party dress for dinner while Ivy carries hot-water cans to the guest rooms.","witnesses":["Ivy Dunn"]},{"time":"20:00","place":"dining room","present":["Sir Aubrey Callender","Lady Callender","Hugo Callender","Beatrice Orme","Cyril Mabey","Colonel Rudd","Mrs Rudd"],"event":"Dinner is served to the family and guests while Ivy works in the servants' hall and still-room.","witnesses":["Hugo Callender","Beatrice Orme","Cyril Mabey"]},{"time":"21:12","place":"hall","present":["Hugo Callender","Ruddle"],"event":"Ruddle fetches Hugo from the table to the hall telephone for a three-minute local call from the Plough Inn at Coombe Abbas, and Hugo comes back to the table white.","witnesses":["Beatrice Orme","Cyril Mabey","Sir Aubrey Callender","Ruddle"]},{"time":"21:20","place":"dining room and drawing room","present":["Beatrice Orme","Lady Callender","Mrs Rudd","Sir Aubrey Callender","Hugo Callender","Cyril Mabey","Colonel Rudd"],"event":"The ladies withdraw to the drawing room and the men sit over the port.","witnesses":["Beatrice Orme","Hugo Callender","Cyril Mabey"]},{"time":"21:40","place":"dining room","present":["Sir Aubrey Callender","Hugo Callender","Cyril Mabey","Colonel Rudd"],"event":"Sir Aubrey leaves the port saying he must telephone Prothero in London about 'the Ridgeway timber money', and books a trunk call from the hall.","witnesses":["Hugo Callender","Cyril Mabey","Colonel Rudd"]},{"time":"21:52","place":"hall","present":["Sir Aubrey Callender","Cyril Mabey"],"event":"The exchange rings back and Sir Aubrey speaks to Mr Prothero for six minutes, arranging for him and an accountant, Mr Gell, to come down on Monday, while Mabey, out of the dining room for the cloakroom, overhears from the passage.","witnesses":["Cyril Mabey"]},{"time":"22:05","place":"hall and study","present":["Sir Aubrey Callender","Ruddle"],"event":"After looking in on the drawing room, Sir Aubrey orders Ruddle to lock up at a quarter to eleven and send the servants to bed, then shuts himself in the study; Ruddle passes the order on in the servants' hall at 22:10.","witnesses":["Beatrice Orme","Cyril Mabey","Hugo Callender","Ivy Dunn"]},{"time":"22:15","place":"drawing room","present":["Beatrice Orme","Hugo Callender","Cyril Mabey","Lady Callender","Colonel Rudd","Mrs Rudd"],"event":"Mrs Orme retires to her bedroom directly above the study and dozes off, and at 22:20 Hugo says good night, pleading his cold.","witnesses":["Cyril Mabey","Hugo Callender"]},{"time":"22:27","place":"back passage and garden door","present":["Hugo Callender"],"event":"Hugo takes the garden-door key from the board, hears his uncle cough behind the study door, lets himself out, locks the door behind him and walks down the lane towards the Plough, unseen.","witnesses":[]},{"time":"22:40","place":"back passage outside the study","present":["Cyril Mabey","Sir Aubrey Callender","Ivy Dunn"],"event":"Mabey, who left the drawing room at 22:35 saying he had letters to write, knocks and goes into the study, and Ivy, passing behind him with hot-water bottles, hears Sir Aubrey say 'Come in and shut that door, Mabey.'","witnesses":["Ivy Dunn"]},{"time":"22:47","place":"back passage and bachelors' corridor","present":["Ruddle","Ivy Dunn","Beatrice Orme"],"event":"Ruddle, on his early lock-up round, rattles the garden door beneath Mrs Orme's window and notes its key missing from the board, waking her, while Ivy, banking the bachelors'-corridor fires from 22:45 to 22:58, finds Mr Mabey's and Mr Hugo's rooms dark and empty.","witnesses":["Ruddle","Ivy Dunn","Beatrice Orme"]},{"time":"22:55","place":"study","present":["Cyril Mabey","Sir Aubrey Callender"],"event":"Mabey strikes Sir Aubrey twice on the back of the head with the bronze stag, and Mrs Orme, overhead, hears raised voices end in a heavy thump and a chair going over.","witnesses":["Beatrice Orme"]},{"time":"22:55","place":"the Plough Inn, Coombe Abbas","present":["Hugo Callender","Ruby Lacey","Jos Lacey"],"event":"Hugo reaches the Plough and sits in the back parlour with Ruby Lacey, his secret wife, and her furious father until 23:20, when he starts back up the lane.","witnesses":["Ruby Lacey","Jos Lacey"]},{"time":"23:04","place":"study, back passage and back stairs","present":["Cyril Mabey","Ivy Dunn","Albert"],"event":"Having wiped the stag and burned the papers, Mabey leaves the lamp burning and at 23:06 hurries up the back stairs gripping his left cuff, watched by Ivy and the footman Albert from the linen-room doorway, where they have been courting since 23:00.","witnesses":["Ivy Dunn","Albert"]},{"time":"23:15","place":"billiard room","present":["Cyril Mabey","Colonel Rudd"],"event":"Mabey, his cuff scrubbed, joins Colonel Rudd at billiards, remarks that he has been writing letters, and plays until 00:30, while Ivy goes up to bed in the maids' attic.","witnesses":["Colonel Rudd","Ruddle"]},{"time":"23:50","place":"garden door and back stairs","present":["Hugo Callender"],"event":"Hugo lets himself back in soaked and chalked to the shins, hangs the key on its hook, sees lamplight under the study door, hears billiard balls, and goes softly up the back stairs, which Mrs Orme hears.","witnesses":["Beatrice Orme"]},{"time":"01:10","place":"study","present":["Beatrice Orme"],"event":"Mrs Orme, sleepless and puzzled by the study lamplight still lying on the sleet below her window, comes down the back stairs and finds her brother dead on the hearthrug, while Mabey, Hugo and Ivy are in bed.","witnesses":["Beatrice Orme"]},{"time":"01:20","place":"hall","present":["Cyril Mabey","Hugo Callender","Beatrice Orme","Ivy Dunn","Ruddle","Lady Callender","Colonel Rudd","Mrs Rudd"],"event":"Ruddle rouses the house, everyone gathers in the hall, and at 01:28 he telephones the Devizes police, PC Gully arriving from the village at 01:55.","witnesses":["Cyril Mabey","Hugo Callender","Beatrice Orme","Ivy Dunn"]}],"evidence":[{"id":"ev1","name":"Bronze stag","where":"study mantelpiece","detail":"A six-pound bronze stag on a squared plinth, back in its place but wiped bright, with blood and two grey hairs caught where the antlers meet the plinth.","proves":"The weapon came from the room and was put back and wiped by someone composed enough to tidy up: a visitor Sir Aubrey had let in, not a stranger.","atScene":true},{"id":"ev2","name":"Burnt papers in the study grate","where":"study fireplace","detail":"Charred letter paper with part of a printed heading, '...EDGE & SONS, TIMBER MERCHANTS, DEVIZES', and a fragment of a ruled sheet reading 'Ridgeway Copse ... £1,1', on top of the fire's last coals.","proves":"Papers about estate timber money were burned after the fire was last made up, by someone with an interest in the estate accounts.","atScene":true},{"id":"ev3","name":"Study door finger-plate","where":"inside of the study door","detail":"A brass finger-plate the housemaid polishes every evening at six, showing fresh smudged prints at hand height.","proves":"Someone pushed the study door shut from inside after six that evening; whose hand it was can be settled by comparison.","atScene":true},{"id":"ev4","name":"Mr Mabey's dress shirt","where":"folded at the bottom of the wardrobe in Mabey's bedroom","detail":"The stiff evening shirt he wore at dinner, its left cuff scrubbed and still faintly damp, with a pinkish-brown ring at the stud hole.","proves":"The wearer tried that same night to wash a stain out of his cuff rather than leave the shirt for the laundry.","atScene":false},{"id":"ev5","name":"Hugo's evening shoes","where":"outside Hugo's bedroom door, collected by the boot boy","detail":"Patent evening shoes soaked through and caked with white chalk mud to the ankle, trouser hems the same.","proves":"Their owner walked a long way outdoors in the sleet after dinner, which is not where a man in bed with a cold would be.","atScene":false}],"forensics":{"tod":"Two blows to the back of the skull from a heavy, sharp-edged object, the first fatal within minutes. Body heat and early rigor in the jaw at 02:15 put death between 22:40 and 23:20, nearer the earlier hour.","prints":"The bronze stag has been wiped clean, but the study door's inner finger-plate, polished at six, bears Sir Aubrey's prints and a fresh right thumb and two fingers of Cyril Mabey. Hugo Callender's prints are nowhere in the study.","comms":"Coombe Abbas exchange: 21:12, a three-minute local call from Coombe Abbas 7 (the Plough Inn) to Sallowmere; 21:41, Sir Aubrey books a trunk call to Western 2214 (Mr Prothero, solicitor, Kensington), connected 21:52 and cleared 21:58. The only other call is Sallowmere to Devizes police at 01:28.","tox":"No poison or drug in Sir Aubrey's blood or in the study decanter; alcohol consistent with dinner wine, port and one whisky. The ring at the stud hole of Mr Mabey's scrubbed left shirt cuff gives a positive benzidine reaction for blood.","logs":"Ruddle's register shows lock-up begun at 22:45, an hour early on Sir Aubrey's order, with the garden-door key missing from the board at 22:47 and back on its hook at his 00:15 round. The staff book records Ivy Dunn banking the bachelors'-corridor fires from 22:45 to 22:58 and finding Mr Mabey's room dark, his writing case strapped shut, and Mr Hugo's room empty."},"redHerring":"An unsigned draft codicil in Sir Aubrey's desk, cutting Hugo's allowance and leaving the unentailed farms to a cousin, looks like a motive for the heir. It is dated March 1921, drawn up when Hugo was sent down from Oxford and dropped that Christmas, as Mrs Orme can say from her brother's own lips; and Hugo was a mile away at the Plough when the blows fell.","solutionPath":["Police surgeon: death between 22:40 and 23:20; the servants' log shows lock-up began at 22:45 that night, so Mrs Orme's thump 'after Ruddle's half past eleven round' really came at about 22:55.","Ivy Dunn saw Mabey go into the study at 22:40 and heard Sir Aubrey tell him to shut the door; fingerprint comparison puts Mabey's hand on the finger-plate polished at six, breaking his claim that he never entered the study.","The servants' log has Mabey's room dark and empty at 22:50, and Ivy (with Albert) saw him hurry up the back stairs at 23:06 holding his cuff, breaking 'I was writing letters in my room'.","Toxicology finds blood in the scrubbed stud hole of Mabey's left cuff; the wiped bronze stag on the mantel is the weapon.","Motive: Hugo heard Sir Aubrey mention 'the Ridgeway timber money' at the port, the exchange log shows the trunk call to his solicitor Prothero at 21:52, and the grate holds burnt Gedge & Sons timber papers, all pointing at the land agent's handling of estate money.","Hugo is cleared: the exchange log shows the call from the Plough, the key register has the garden-door key out over the murder, his shoes are soaked with chalk from the lane, and none of his prints are in the study; his lie hides a secret marriage, and the 1921 codicil is stale.","Name Cyril Mabey: to stop Monday's audit of his timber embezzlement, he struck Sir Aubrey with the bronze stag at about 22:55."]},"briefs":[{"name":"Cyril Mabey","part":"killer","personality":"Smooth, ingratiating and quick to agree, a Devizes ironmonger's son who has studied how gentlemen talk and overdoes it ('if I may say so', 'Sir Aubrey and I'). Pressed, he turns precise and legalistic; cornered, he retreats behind his rights and asks for a solicitor.","voiceSample":"Sir Aubrey and I understood one another perfectly, Inspector; nine years without a cross word, if I may say so.","relationship":"He feared and resented Sir Aubrey, who treated him as an upper servant, and in the last hour hated him for refusing even a week's grace.","movements":[{"from":"19:30","to":"20:00","where":"his bedroom, then the drawing room","doing":"Dressed for dinner and took sherry with the party.","seenBy":["Ivy Dunn","Hugo Callender","Beatrice Orme"]},{"from":"20:00","to":"21:50","where":"dining room","doing":"Dined, then sat over the port and heard Sir Aubrey speak of telephoning Prothero about the Ridgeway timber money.","seenBy":["Hugo Callender","Beatrice Orme","Colonel Rudd"]},{"from":"21:50","to":"22:00","where":"cloakroom passage off the hall","doing":"Overheard Sir Aubrey's trunk call arranging the Monday audit.","seenBy":[]},{"from":"22:00","to":"22:35","where":"drawing room","doing":"Sat silent over coffee, then said he had letters to write and went out.","seenBy":["Hugo Callender","Beatrice Orme","Lady Callender","Colonel Rudd","Mrs Rudd"]},{"from":"22:35","to":"23:04","where":"study","doing":"Went in at 22:40, pleaded with Sir Aubrey, struck him with the bronze stag at 22:55, wiped it and burned the papers.","seenBy":["Ivy Dunn"]},{"from":"23:04","to":"23:13","where":"back stairs and his bedroom","doing":"Hurried up the back stairs, scrubbed his cuff at the basin and burned his handkerchief in the banked fire.","seenBy":["Ivy Dunn","Albert"]},{"from":"23:15","to":"00:30","where":"billiard room","doing":"Played billiards with Colonel Rudd and told him he had been writing letters.","seenBy":["Colonel Rudd","Ruddle"]},{"from":"00:30","to":"01:20","where":"his bedroom","doing":"Took off the shirt, hid it in the wardrobe and lay awake until roused to the hall.","seenBy":[]}],"knows":["He has taken about £3,800 of Ridgeway Copse timber money through Gedge & Sons over three years (he did it).","He overheard Sir Aubrey's trunk call at 21:52 arranging for Prothero and the accountant Gell to come on Monday (he heard it).","Sir Aubrey told him in the study that he would be prosecuted and turned to ring for Ruddle to have him put out of the house (he was there).","He struck Sir Aubrey twice with the bronze stag at about 22:55, wiped it with his handkerchief and set it back on the mantel (he did it).","He burned Gedge's letter and his own timber summary in the study grate before leaving at 23:04 (he did it).","He pushed the study door shut with his bare hand when told to, and knows he wore no gloves (he did it).","A spot of blood on his left cuff, which he scrubbed with soap at 23:08 and then hid the shirt in his wardrobe (he did it).","Hugo was called to the telephone during dinner, came back white, and left the drawing room at 22:20 pleading a cold; Mrs Orme went up at 22:15 (he saw it).","He told Colonel Rudd at the billiard table that he had been writing letters (he said it)."],"doesNotKnow":["That Ivy Dunn saw him enter the study at 22:40 and, with Albert, saw him on the back stairs at 23:06.","That Ivy found his room dark and empty at 22:50 and it went into the staff book.","That the study finger-plate is polished every evening at six.","That Mrs Orme heard the voices and the thump through the floor.","Where Hugo went that night, or that he is secretly married."],"secret":"He embezzled the timber money and killed Sir Aubrey to stop Monday's audit.","lies":[{"claim":"I left the drawing room at about twenty-five to eleven and went straight up to write letters in my room; I came down to billiards at a quarter past.","truth":"He was in the study from 22:40 to 23:04 and in his room only from 23:06 to 23:13.","when":"Asked where he was after leaving the drawing room.","crack":"The servants' log showing his room dark and empty with the writing case strapped shut at 22:50, or Ivy Dunn's sighting of him entering the study or on the back stairs."},{"claim":"I never set foot in the study after dinner; Sir Aubrey had made it plain he was not to be disturbed.","truth":"He was in the study for twenty-four minutes and pushed the door shut with his hand.","when":"Asked whether he saw Sir Aubrey after 22:05.","crack":"The fingerprint report: his fresh prints on the inner finger-plate polished at six."},{"claim":"The estate accounts are in perfect order, Inspector; Sir Aubrey was entirely satisfied with my stewardship.","truth":"He had embezzled about £3,800 and Sir Aubrey had called in a solicitor and an accountant.","when":"Asked about his work, the accounts, or Sir Aubrey's telephone call.","crack":"The exchange log of the trunk call to Prothero together with the burnt Gedge & Sons papers, or Hugo's account of 'the Ridgeway timber money' at the port."},{"claim":"That mark on my cuff? Claret at dinner; I sponged it myself rather than trouble the servants.","truth":"It is Sir Aubrey's blood.","when":"Shown or asked about the shirt.","crack":"The Home Office analyst's positive benzidine test for blood on the cuff."}],"honestMistake":null,"tells":["Turns his signet ring round and round.","Pays the Inspector a compliment just before an untruth."],"pressure":{"baseline":20,"breakPoint":70,"lawyerPoint":85,"style":"lawyer"},"opening":"Good morning, Inspector. A dreadful business; anything I can do to help, anything at all, you have only to ask."},{"name":"Hugo Callender","part":"liar","personality":"Restless, charming and sulky by turns, full of Oxford slang ('I say', 'frightful rot') and inclined to answer a question with a question. He lies badly, gets cross when cornered, and is underneath a decent young man frightened for his wife.","voiceSample":"Look here, Inspector, I was in bed with a stinking cold, and I don't see that it's anybody's business but mine.","relationship":"Fond of his uncle in an exasperated way; Sir Aubrey paid his debts twice and lectured him for it, and Hugo dreaded what he would say about Ruby.","movements":[{"from":"19:30","to":"21:12","where":"his bedroom, drawing room, dining room","doing":"Dressed, took sherry and dined.","seenBy":["Beatrice Orme","Cyril Mabey","Ivy Dunn"]},{"from":"21:12","to":"21:15","where":"hall telephone","doing":"Took a call from Jos Lacey at the Plough telling him to come tonight.","seenBy":["Ruddle"]},{"from":"21:15","to":"22:00","where":"dining room","doing":"Sat over the port; heard his uncle speak of the Ridgeway timber money and watched Mabey go out at 21:50 and come back grey.","seenBy":["Cyril Mabey","Colonel Rudd","Sir Aubrey Callender"]},{"from":"22:00","to":"22:20","where":"drawing room","doing":"Sat with the party, then said good night pleading his cold.","seenBy":["Cyril Mabey","Beatrice Orme","Lady Callender","Colonel Rudd","Mrs Rudd"]},{"from":"22:20","to":"22:27","where":"back passage and garden door","doing":"Took the garden-door key from the board and let himself out, locking the door behind him.","seenBy":[]},{"from":"22:27","to":"23:50","where":"the lane and the Plough Inn back parlour","doing":"Walked to the Plough, sat with Ruby and her father from about 22:55 to 23:20, and walked back.","seenBy":["Ruby Lacey","Jos Lacey"]},{"from":"23:50","to":"01:20","where":"garden door, back stairs, his bedroom","doing":"Let himself in, hung the key back, went up and left his wet shoes outside his door.","seenBy":[]}],"knows":["The 21:12 call was from Jos Lacey at the Plough, saying Ruby was poorly and if Hugo did not come tonight he would come up to the house himself (he took the call).","At the port at about 21:40 his uncle said he must telephone Prothero about 'the Ridgeway timber money', and Mabey went very quiet (he heard and saw it).","Mabey left the dining room at about 21:50 for the cloakroom and came back at 22:00 grey in the face, gulping his port (he saw it).","At about 22:26, taking the key in the back passage, he saw lamplight under the study door and heard his uncle cough inside (he saw and heard it).","He walked to the Plough and back through the sleet rather than crank the motor, which would have woken the house (he did it).","He was in the Plough's back parlour from about 22:55 to 23:20 with Ruby and her father (he was there).","Coming in at 23:50 he heard billiard balls clicking and saw the study lamp still lit under the door (he heard and saw it).","He left his soaked evening shoes outside his door for the boot boy (he did it).","Aunt Beatrice told him at Christmas 1921 that his uncle had dropped the idea of a codicil cutting his allowance (he was told)."],"doesNotKnow":["Who killed his uncle, or how.","That Mabey went into the study at 22:40.","Anything that happened in the house between 22:27 and 23:50.","That Ruddle noticed the garden-door key was missing."],"secret":"He married Ruby Lacey, the Plough landlord's daughter, at Marylebone register office in August, and she is expecting. His uncle would have cut him off, and he fears the family still will.","lies":[{"claim":"I went up at twenty past ten with this beastly cold and slept like a log until Ruddle hammered on the door.","truth":"He was out of the house from 22:27 to 23:50, walking to the Plough and back.","when":"Asked where he was after leaving the drawing room.","crack":"His soaked, chalk-caked evening shoes, the key register showing the garden-door key missing from 22:47, or the exchange log's call from the Plough."},{"claim":"The call at dinner? Some chap from my club about a horse.","truth":"It was Jos Lacey calling from the Plough about Ruby.","when":"Asked about the telephone call during dinner.","crack":"The exchange log showing the call came from Coombe Abbas 7, the Plough Inn."}],"honestMistake":null,"tells":["Lights a fresh cigarette from the stub of the last.","Says 'Look here' before anything untrue."],"pressure":{"baseline":25,"breakPoint":60,"lawyerPoint":85,"style":"anger"},"opening":"I suppose you want to know where I was. In bed, Inspector, like any sane man on a night like that."},{"name":"Beatrice Orme","part":"mistaken","personality":"Imperious, exact and certain, a rector's daughter who has run other people's households for forty years and despises fuss. She speaks in short complete sentences and corrects grammar; if she feels doubted or patronised she goes cold and silent.","voiceSample":"I am not in the habit of imagining things, Inspector; I heard my brother cry out at five and twenty to twelve.","relationship":"She loved Aubrey without illusions and quarrelled with him daily; he was the last of her family, and she is badly shaken beneath the starch.","movements":[{"from":"19:30","to":"21:20","where":"her bedroom, drawing room, dining room","doing":"Dressed and dined.","seenBy":["Cyril Mabey","Hugo Callender","Ivy Dunn"]},{"from":"21:20","to":"22:15","where":"drawing room","doing":"Sat with Lady Callender and Mrs Rudd; the men came in at 22:00 and Aubrey looked in before going to the study.","seenBy":["Lady Callender","Mrs Rudd","Cyril Mabey","Hugo Callender"]},{"from":"22:15","to":"22:47","where":"her bedroom above the study","doing":"Went to bed and dozed.","seenBy":[]},{"from":"22:47","to":"01:05","where":"her bedroom","doing":"Woke to the garden door rattling, heard voices and a thump below, later the garden door and steps; lay awake.","seenBy":[]},{"from":"01:05","to":"01:12","where":"back stairs and study","doing":"Went down and found Aubrey dead.","seenBy":[]},{"from":"01:12","to":"02:00","where":"hall","doing":"Sat with the household until the constable came.","seenBy":["Cyril Mabey","Hugo Callender","Ivy Dunn"]}],"knows":["At about 21:12 Ruddle fetched Hugo from the table to the telephone and he came back white (she saw it).","At 22:00 the men came in; Aubrey looked in 'black as thunder', said he had accounts to see to and went to the study; Mabey sat silent fiddling with his signet ring (she saw it).","She went up at 22:15, dozed, and was woken by the garden door below her window being tried, which she took for Ruddle's lock-up round (she heard it).","A few minutes later she heard men's voices below, Aubrey's raised and the word 'Monday' twice, the other a man's voice, lower and pleading, that she could not place; then a heavy thump and a chair going over (she heard it).","A long while afterwards she heard the garden door open and shut and someone go softly up the back stairs (she heard it).","At about 01:05 she saw the study lamplight still lying on the sleet below her window, went down by the back stairs and found Aubrey face down on the hearthrug, the fire low and a smell of burnt paper (she saw it).","This week Aubrey grumbled at breakfast that 'the timber figures don't add up' (she heard it).","The 1921 draft codicil against Hugo was dropped that Christmas; Aubrey told her so himself (she was told)."],"doesNotKnow":["Who killed Aubrey, or with what.","That Ruddle locked up early that night, at a quarter to eleven, on Aubrey's order.","That Mabey went into the study at 22:40.","Where Hugo went, or who came in by the garden door."],"secret":null,"lies":[],"honestMistake":{"claim":"The thump came at five and twenty to twelve: Ruddle had just been round trying the garden door, and he does that at half past eleven every night of the year.","truth":"The rattle was Ruddle's round at 22:47, begun early on Aubrey's order, so the thump came at about 22:55.","why":"Her travelling clock is at the mender's in Devizes; she woke from a doze to the rattle and set the time by the household's usual routine."},"tells":["Draws herself up and looks down her nose.","Taps her lorgnette on her knee when doubted."],"pressure":{"baseline":15,"breakPoint":65,"lawyerPoint":90,"style":"shutdown"},"opening":"Sit down, Inspector, you are blocking the light. Ask what you must; I do not intend to weep in front of you."},{"name":"Ivy Dunn","part":"honest","personality":"Shy, quick-eyed and observant, in service since fourteen; she says 'sir' every few words and slips into broad Wiltshire when upset ('I never seen'). Terrified of losing her place, she cries easily but does not lie.","voiceSample":"I never meant to be on the back stairs, sir, honest, only Albert asked me and it were only ten minutes.","relationship":"Sir Aubrey was a sharp master but a fair one; he gave her a half-sovereign at Christmas and knew her name, which not all of them do.","movements":[{"from":"19:30","to":"19:50","where":"guest bedrooms","doing":"Carried hot-water cans to the guest rooms.","seenBy":["Cyril Mabey","Hugo Callender","Beatrice Orme"]},{"from":"19:50","to":"22:35","where":"servants' hall and still-room","doing":"Servants' supper and washing up; heard Mr Ruddle's early lock-up order at 22:10.","seenBy":["Ruddle","Albert","Mrs Tull"]},{"from":"22:35","to":"22:44","where":"back passage","doing":"Carried stone hot-water bottles to the back stairs and saw Mr Mabey go into the study.","seenBy":[]},{"from":"22:45","to":"22:58","where":"bachelors' corridor","doing":"Banked the fires and found Mr Mabey's and Mr Hugo's rooms empty, then told Mrs Tull.","seenBy":["Mrs Tull"]},{"from":"23:00","to":"23:10","where":"linen-room doorway at the head of the back stairs","doing":"Stood courting with Albert and saw Mr Mabey come up.","seenBy":["Albert"]},{"from":"23:12","to":"01:20","where":"maids' attic","doing":"Went to bed and slept until the screaming and the bell woke her.","seenBy":[]},{"from":"01:20","to":"02:00","where":"hall","doing":"Stood with the household.","seenBy":["Cyril Mabey","Hugo Callender","Beatrice Orme"]}],"knows":["At six o'clock, as every evening, she polished the brass finger-plates on the ground-floor doors, the study's included (she did it).","At 22:10 in the servants' hall Mr Ruddle said Sir Aubrey wanted the house locked up at a quarter to eleven and the staff abed, an hour early (she heard it).","At about 22:40 in the back passage she saw Mr Mabey knock at the study door and go in, and heard Sir Aubrey say 'Come in and shut that door, Mabey', and the door shut (she saw and heard it).","Between 22:45 and 22:58 Mr Mabey's room was dark, the lamp unlit and his writing case strapped shut on the table, and Mr Hugo's room was empty with the bed not slept in (she saw it).","At 22:58 she told Mrs Tull those two rooms were empty, and Mrs Tull wrote it in the staff book (she did it).","From 23:00 to 23:10 she was with Albert the footman in the linen-room doorway, which is against the rules (she did it).","At about 23:06 Mr Mabey came up the back stairs fast, with no candle, holding his left shirt cuff in his right hand, and went along to the bachelors' corridor without seeing them (she saw it).","The servants' hall says Mr Hugo is sweet on somebody at the Plough (she heard the gossip)."],"doesNotKnow":["Who killed Sir Aubrey, or how.","What was said in the study.","Where Mr Hugo went that night.","That Mrs Orme heard anything."],"secret":"Her small embarrassment: she was on the back stairs with Albert, which could cost them both their places.","lies":[],"honestMistake":null,"tells":["Twists her apron in both hands.","Looks at the Inspector's boots, not his face."],"pressure":{"baseline":30,"breakPoint":60,"lawyerPoint":82,"style":"tears"},"opening":"Please, sir, Mrs Tull said I was to come. I've done nothing wrong, sir, I only did the fires."}],"id":"country_house"},{"settingId":"country_house","truth":{"title":"Death on the Cellar Steps","house":"Brixcombe Court, a cold brick-and-flint Queen Anne house in a fold of the downs, two miles up its own lane from Brixcombe St Peter, Wiltshire; lamps and candles throughout.","victim":{"name":"Sir Lionel Marwood","age":58,"role":"4th baronet, owner of Brixcombe Court and host of the shoot; a magistrate and a famous shot","sketch":"Big, florid, hearty and sentimental, proudest of his cellar and his pheasants, a man who paid what was proper and never looked back. He told the story of the 1909 accident at his own table as a closed matter, which it was not."},"night":{"start":"19:30","end":"02:00","discovered":"23:52","discoveredBy":"Edwin Pethick","where":"the foot of the cellar steps"},"weather":"Sleet from four o'clock on Saturday 15 November 1924; the lane to Brixcombe St Peter running chalk.","publicFacts":["Sir Li
