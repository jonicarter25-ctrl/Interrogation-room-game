<title>Interrogation Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Special+Elite&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: one-screen app frame. Brass-ruled sticky header, a scrolling pane, a sticky tab bar at the foot on phones
   (tabs move into the header on wide screens). The interrogation pane splits into roster + typed transcript on wide screens. */
:root{
  --bg:#0f1815; --panel:#162119; --panel-2:#1c2a21; --line:#2b3c32; --line-2:#3b5044;
  --fg:#ebe3cf; --fg-2:#cbc4b0; --muted:#95a296;
  --accent:#c9a24a; --accent-2:#e3c874; --on-accent:#1b1507;
  --lie:#d0604d; --truth:#78b386; --warn:#dcae4a; --info:#86b5d2;
  --paper:#ece4cf; --paper-2:#dfd5b9; --paper-ink:#1e2a23; --paper-muted:#5c665f; --paper-line:#c9bd9c;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font-display:'Josefin Sans','Futura','Century Gothic','Trebuchet MS',sans-serif;
  --font-type:'Special Elite','American Typewriter','Courier New',monospace;
  --font-body:'Alegreya Sans','Gill Sans','Segoe UI',system-ui,sans-serif;
  --tabs-h:62px; --head-h:56px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e4e1d5; --panel:#f2efe6; --panel-2:#e9e5d8; --line:#cdc7b5; --line-2:#b4ad98;
    --fg:#1b2420; --fg-2:#3a453e; --muted:#616c64;
    --accent:#8a6a1a; --accent-2:#6b5110; --on-accent:#fff9ea;
    --lie:#a93a2b; --truth:#3b7c4a; --warn:#8f650b; --info:#37658a;
    --paper:#fbf7ed; --paper-2:#f0eadb; --paper-ink:#1b2420; --paper-muted:#5f6a62; --paper-line:#d6cdb3;
    --shadow:0 8px 24px rgba(40,35,20,.14);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e4e1d5; --panel:#f2efe6; --panel-2:#e9e5d8; --line:#cdc7b5; --line-2:#b4ad98;
  --fg:#1b2420; --fg-2:#3a453e; --muted:#616c64;
  --accent:#8a6a1a; --accent-2:#6b5110; --on-accent:#fff9ea;
  --lie:#a93a2b; --truth:#3b7c4a; --warn:#8f650b; --info:#37658a;
  --paper:#fbf7ed; --paper-2:#f0eadb; --paper-ink:#1b2420; --paper-muted:#5f6a62; --paper-line:#d6cdb3;
  --shadow:0 8px 24px rgba(40,35,20,.14);
  color-scheme:light;
}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-body);-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--panel)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:.02em;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:1120px;margin:0 auto}
.app{min-height:100%;display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column}
.hidden{display:none!important}

/* Header */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--accent);box-shadow:0 1px 0 var(--line)}
.head .wrap{display:flex;align-items:center;gap:12px;min-height:var(--head-h);padding-block:6px}
.brand{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.18em;font-size:13px;color:var(--accent);white-space:nowrap}
.brand small{display:block;letter-spacing:.08em;font-size:11px;color:var(--muted);text-transform:none;font-family:var(--font-body)}
.head-title{flex:1;min-width:0;font-family:var(--font-display);font-size:15px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums;line-height:1.15}
.clock b{font-family:var(--font-display);font-size:15px;letter-spacing:.06em}
.clock span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.clock.low b{color:var(--warn)}
.clock.out b{color:var(--lie)}
.meter{width:72px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
.clock.low .meter i{background:var(--warn)}
.clock.out .meter i{background:var(--lie)}
.iconbtn{background:transparent;border:1px solid var(--line-2);border-radius:8px;width:38px;height:38px;display:inline-grid;place-items:center;color:var(--fg-2)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}

/* Tabs */
.tabs{position:sticky;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line-2);height:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:100%}
.tab{background:none;border:0;border-top:2px solid transparent;color:var(--muted);font-family:var(--font-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);border-top-color:var(--accent)}
.tab .cnt{position:absolute;display:none}
.tabs-head{display:none}
@media (max-width:599px){.head.incase .brand{display:none}}
@media (min-width:860px) and (max-width:1023px){.head.incase .head-title{display:none}}
@media (min-width:860px){
  :root{--tabs-h:0px}
  .tabs{display:none}
  .tabs-head{display:flex;gap:4px}
  .tabs-head .tab{flex-direction:row;border-top:0;border-bottom:2px solid transparent;padding:10px 12px;font-size:12px;height:var(--head-h)}
  .tabs-head .tab.on{border-bottom-color:var(--accent)}
  .tabs-head .tab svg{width:16px;height:16px}
}

/* Generic blocks */
.pane{padding-block:18px 28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card+.card{margin-top:12px}
.eyebrow{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:var(--accent)}
.lede{color:var(--fg-2);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);border-radius:9px;padding:9px 14px;font-family:var(--font-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;line-height:1.1;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{border-color:var(--lie);color:var(--lie)}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:5px 10px;font-size:11px;letter-spacing:.08em}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--fg-2);background:var(--panel-2);max-width:100%}
.chip.lie{border-color:var(--lie);color:var(--lie)}
.chip.truth{border-color:var(--truth);color:var(--truth)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.info{border-color:var(--info);color:var(--info)}
.chip .x{border:0;background:none;color:inherit;padding:0 2px;line-height:1;font-size:14px}
.chip .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:13.5px;color:var(--muted)}
.rule{height:1px;background:var(--line);margin:14px 0}
textarea,input[type=text],input[type=time],select{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;color:var(--fg);min-width:0}
textarea{resize:vertical;min-height:80px;line-height:1.45}
textarea:focus,input:focus,select:focus{border-color:var(--accent);outline:none}
label.f{display:block;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted);margin-bottom:6px}
.err{border:1px solid var(--lie);color:var(--lie);background:transparent;border-radius:9px;padding:10px 12px;font-size:14px}
.ok{border:1px solid var(--truth);color:var(--truth);border-radius:9px;padding:10px 12px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px}
.kv dt{color:var(--muted);font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding-top:3px}
.kv dd{margin:0;min-width:0}

/* Menu */
.hero{padding-block:34px 18px;text-align:left}
.hero h1{font-size:clamp(28px,9.5vw,58px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;color:var(--fg);overflow-wrap:anywhere}
.hero h1 span{color:var(--accent)}
.hero .sub{margin-top:10px;font-family:var(--font-type);color:var(--fg-2);font-size:15px;max-width:52ch}
.menu-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){.menu-grid{grid-template-columns:1.3fr .9fr}}
.setting{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:18px}
.setting .deco{position:absolute;right:-30px;top:-30px;width:180px;height:180px;opacity:.14;pointer-events:none}
.setting h2{font-size:22px;text-transform:uppercase;letter-spacing:.1em}
.setting .blurb{margin-top:8px;color:var(--fg-2);max-width:56ch}
.soon{display:grid;gap:8px}
.soon .it{display:flex;justify-content:space-between;gap:10px;border:1px dashed var(--line-2);border-radius:9px;padding:9px 12px;color:var(--muted);font-size:14px}
.soon .it b{font-family:var(--font-display);font-weight:600;letter-spacing:.04em;color:var(--fg-2)}
.howto{font-size:14.5px;color:var(--fg-2)}
.howto ol{margin:6px 0 0;padding-left:20px}
.howto li{margin:4px 0}
details summary{cursor:pointer;font-family:var(--font-display);letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--accent)}

.settings-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
@media (min-width:520px){.settings-grid{grid-template-columns:repeat(2,1fr)}}
.scard{position:relative;overflow:hidden;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:12px 12px 10px;color:var(--fg);display:flex;flex-direction:column;gap:4px;min-height:96px}
.scard .deco{position:absolute;right:-18px;top:-14px;width:110px;height:110px;opacity:.14;pointer-events:none}
.scard b{font-family:var(--font-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.scard span{font-size:12.5px;color:var(--muted)}
.scard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.scard.on .deco{opacity:.3;color:var(--accent)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.presets .chip{cursor:pointer}
.presets .chip.on{border-color:var(--accent);color:var(--accent)}
.dials{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
@media (min-width:520px){.dials{grid-template-columns:1fr 1fr}}
.dial{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px}
.dial .k{color:var(--fg-2)}
.stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:transparent;width:30px;height:30px;color:var(--accent);font-size:16px}
.stepper b{min-width:22px;text-align:center;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.switch{border:1px solid var(--line-2);border-radius:999px;width:44px;height:24px;position:relative;background:var(--bg)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{left:23px;background:var(--on-accent)}
.cast{margin-top:12px;font-family:var(--font-type);font-size:14px;color:var(--fg-2)}
.linklist{display:grid;gap:10px}
.lpair{display:grid;grid-template-columns:1fr;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px}
@media (min-width:640px){.lpair{grid-template-columns:1fr auto 1fr}}
.lpair.contradicts{border-color:var(--lie)}
.lpair.supports{border-color:var(--truth)}
.lpair .lmid{display:flex;align-items:center;gap:8px;justify-content:center;font-family:var(--font-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.lpair.contradicts .lmid{color:var(--lie)}
.lpair.supports .lmid{color:var(--truth)}
.lpair .lmid .x{border:0;background:none;color:var(--muted);font-size:16px;padding:0 4px}
.lp{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:8px 10px;font-family:var(--font-type);font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.lp small{display:block;font-family:var(--font-body);color:var(--paper-muted);font-size:12px;margin-top:3px}
.tr-sus{border:1px solid var(--line);border-radius:10px;padding:0 12px}
.tr-sus summary{padding:10px 0;font-size:13px}
.tr-sus .msgs{padding:4px 0 12px}
mark.lie{background:transparent;color:inherit;border-bottom:2px solid var(--lie);box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--lie) 22%,transparent)}
mark.mistaken{background:transparent;color:inherit;border-bottom:2px solid var(--warn);box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--warn) 25%,transparent)}
.flag{font-size:12px;color:var(--lie);margin-top:4px}
.flag.mistaken{color:var(--warn)}
.career{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.career div{border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-align:center}
.career b{display:block;font-family:var(--font-display);font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.career span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--font-display)}
.stamp.tr{border-color:var(--info);color:var(--info)}
.intro{max-width:760px;margin:0 auto;padding-block:8px 32px}
.intro h2{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.intro ol{margin:0;padding-left:20px;color:var(--fg-2)}
.intro li{margin:6px 0}
.intro li b{color:var(--fg)}
.costs{display:grid;grid-template-columns:1fr auto;gap:0;font-size:15px}
.costs>div{padding:8px 0;border-top:1px dashed var(--line-2)}
.costs>div:nth-child(-n+2){border-top:0}
.costs .c{font-family:var(--font-display);font-variant-numeric:tabular-nums;text-align:right;padding-left:16px;color:var(--accent);white-space:nowrap}
.costs .k small{display:block;color:var(--muted);font-size:13px}
/* Generating */
.gen{max-width:620px;margin:28px auto 0}
.gen .steps{display:grid;gap:10px;margin-top:16px}
.step{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--muted)}
.step .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.step.on{color:var(--fg);border-color:var(--accent)}
.step.on .dot{border-color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.step.done .dot{background:var(--truth);border-color:var(--truth)}
.step .st{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);white-space:nowrap}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.gen .tip{margin-top:16px;font-family:var(--font-type);color:var(--fg-2);font-size:14px}
@media (prefers-reduced-motion:reduce){.step.on .dot{animation:none}}

/* Interrogation */
.inter{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:860px){.inter{grid-template-columns:260px 1fr;align-items:start}}
.roster{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
@media (min-width:860px){.roster{flex-direction:column;overflow:visible;position:sticky;top:calc(var(--head-h) + env(safe-area-inset-top,0px) + 12px)}}
button.sus{flex:0 0 auto;min-width:150px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;color:var(--fg)}
@media (min-width:860px){button.sus{min-width:0}}
.sus.on{border-color:var(--accent);background:var(--panel-2)}
.sus .nm{font-family:var(--font-display);font-size:14px;letter-spacing:.04em}
.sus .rl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px}
.pbar i{display:block;height:100%;background:var(--truth);transition:width .4s}
.pbar.tense i{background:var(--warn)}
.pbar.rattled i,.pbar.shutdown i,.pbar.lawyered i{background:var(--lie)}
.sus .stt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--font-display);color:var(--muted)}
.sus .stt.rattled,.sus .stt.shutdown,.sus .stt.lawyered{color:var(--lie)}
.sus .stt.tense{color:var(--warn)}
.sus .stt.guarded{color:var(--info)}

.transcript{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:50vh}
.t-head{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.t-head .who{min-width:0;flex:1}
.t-head .who b{font-family:var(--font-display);font-size:16px;letter-spacing:.04em;display:block}
.t-head .who span{font-size:13px;color:var(--muted)}
.t-head .stt{margin-left:auto;text-align:right;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--font-display);color:var(--muted);max-width:46%}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(92%,640px);display:flex;flex-direction:column;gap:4px}
.msg.det{align-self:flex-end;align-items:flex-end}
.msg .b{border-radius:12px;padding:10px 13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.det .b{background:var(--panel-2);border:1px solid var(--line-2);border-bottom-right-radius:4px}
.msg.sus .b{background:var(--paper);color:var(--paper-ink);font-family:var(--font-type);font-size:15px;border-bottom-left-radius:4px;box-shadow:0 1px 0 var(--paper-line)}
.msg.sys .b{background:transparent;border:1px dashed var(--line-2);color:var(--muted);font-size:13.5px;font-style:italic}
.msg .m{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg .m button{border:0;background:none;color:var(--accent);font-family:var(--font-display);letter-spacing:.08em;text-transform:uppercase;font-size:11px;padding:2px 4px}
.msg .pres{font-size:12.5px;color:var(--info);border:1px solid var(--info);border-radius:8px;padding:4px 9px;max-width:100%}
.msg .b.thinking{color:var(--paper-muted)}
.msg .b.thinking::after{content:"…";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.sheet-sel{font-family:var(--font-type);background:var(--paper);color:var(--paper-ink);padding:10px 12px;border-radius:8px;font-size:14px}
.composer{position:sticky;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-radius:0 0 12px 12px}
.composer .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

ould clear and the death would pass for a drunk man's collapse.","alibiGap":{"from":"22:20","to":"23:51","killerClaims":"That he left the film at 22:20 with a headache, went to his bunk and did not stir until the shouting at midnight.","actually":"He went out to the generator shed from 22:24 to 22:38 to rig the exhaust leak, and again from 23:35 to 23:49 in Lyle's windproof to undo it while Cathcart lay dead."},"timeline":[{"time":"17:05","place":"ionosonde lab","present":["Kevin Ord","Iain Rennick"],"event":"Ord hands Rennick a sealed familygram that came in on the 16:00 schedule, and Rennick reads it, goes white and asks to be left alone.","witnesses":["Kevin Ord"]},{"time":"17:30","place":"generator shed and main hut","present":["Dave Lyle","Iain Rennick","Roger Beal","Kevin Ord"],"event":"Lyle signs out for his routine evening check of the Lister while Rennick sits alone in his lab, Beal works in the BC's office and Ord helps decorate the lounge.","witnesses":["Kevin Ord"]},{"time":"18:30","place":"lounge","present":["Iain Rennick","Roger Beal","Kevin Ord","Dave Lyle","Neil Cathcart"],"event":"All nine gather for Midwinter drinks and Ord reads out greetings from the other bases, Rennick drinking almost nothing.","witnesses":["Iain Rennick","Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"19:00","place":"dining room","present":["Iain Rennick","Roger Beal","Kevin Ord","Dave Lyle","Neil Cathcart"],"event":"Midwinter dinner for all nine, Cathcart in high spirits and Rennick seated opposite him saying hardly a word.","witnesses":["Iain Rennick","Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"21:00","place":"generator shed","present":["Dave Lyle"],"event":"Lyle, signed out 21:00 to 21:15, makes his last check of the evening and logs the exhaust sound, the extractor fan running and the air louvre open.","witnesses":[]},{"time":"21:45","place":"lounge","present":["Iain Rennick","Roger Beal","Kevin Ord","Dave Lyle","Neil Cathcart"],"event":"The film show begins with Beal at the projector and the whole crew watching.","witnesses":["Iain Rennick","Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"22:20","place":"lounge and cold porch","present":["Iain Rennick"],"event":"Rennick leaves the film saying he is turning in, and at 22:24 kits up in his own windproof and goes out along the handline without signing the outside log.","witnesses":["Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"22:28","place":"lounge","present":["Roger Beal","Kevin Ord","Dave Lyle","Neil Cathcart"],"event":"Reel change: the lights are up for six minutes while Beal threads the second reel, with Lyle, Ord, Cathcart and the others in their seats.","witnesses":["Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"22:31","place":"generator shed","present":["Iain Rennick"],"event":"Rennick switches off the extractor fan, shuts the air louvre and slackens the silencer clamp with the shed's spanner, leaves at 22:35 and is back inside by 22:38, hanging his drift-soaked windproof in the drying room.","witnesses":[]},{"time":"22:42","place":"lounge and cold porch","present":["Neil Cathcart","Roger Beal"],"event":"Cathcart leaves the film for his night-duty check and signs the outside log 'Gen shed 22:45', and Beal, slipping out two minutes after him, sees him signing as he passes the porch.","witnesses":["Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"22:46","place":"surgery","present":["Roger Beal"],"event":"Beal opens the drug cabinet with the duplicate key from the station safe, takes a strip of DF118, overwrites the register and is back at the projector by 22:58.","witnesses":[]},{"time":"22:47","place":"generator shed","present":["Neil Cathcart"],"event":"Cathcart takes the readings, writes a 22:50 log entry in a worsening hand and starts hand-pumping the day tank, collapsing beside the pump soon after 23:00 and dying within the half hour.","witnesses":[]},{"time":"22:52","place":"main corridor and radio room","present":["Kevin Ord","Roger Beal"],"event":"Ord, fetching the Midwinter telegrams from the radio room, sees Rennick's windproof dripping on the drying-room rail and at 22:57 sees Beal coming from the surgery corridor with a hand in his pocket.","witnesses":["Kevin Ord"]},{"time":"23:15","place":"lounge","present":["Roger Beal","Kevin Ord","Dave Lyle"],"event":"The film ends, Ord reads the telegrams aloud, and Beal, Lyle, Nolan and Ferris play cards until Lyle goes to his bunk at 23:30, next to Rennick's single cabin.","witnesses":["Roger Beal","Kevin Ord","Dave Lyle"]},{"time":"23:35","place":"bunk rooms, cold porch and generator shed","present":["Iain Rennick","Dave Lyle"],"event":"Rennick leaves his cabin, which Lyle hears through the plywood, takes Lyle's windproof from its peg, goes out unsigned and in the shed tightens the clamp, opens the louvre and switches the fan back on at 23:44, his bare fingertip leaving a print in the fresh soot.","witnesses":["Dave Lyle"]},{"time":"23:49","place":"cold porch","present":["Iain Rennick","Kevin Ord","Dave Lyle"],"event":"Ord, passing the porch on the way to the gash room, sees through the porthole a hooded figure with LYLE stencilled on its back hang the windproof on Lyle's peg and takes it for Dave, and Lyle hears Rennick get back into his cabin at 23:51.","witnesses":["Kevin Ord","Dave Lyle"]},{"time":"23:55","place":"cold porch and generator shed","present":["Kevin Ord","Roger Beal"],"event":"Ord notices Cathcart is still signed out, fetches Beal from the cards, and at 00:02 the two of them find Cathcart dead on the shed floor beside the day-tank pump with the fan running.","witnesses":["Kevin Ord","Roger Beal"]},{"time":"00:08","place":"surgery, radio room, cold porch and lounge","present":["Roger Beal","Kevin Ord","Dave Lyle","Iain Rennick"],"event":"Dr Sorley pronounces Cathcart dead at 00:20 and finds the drug count short, Beal radios Cambridge at 00:28 with Ord, Lyle finds his own windproof wet when he kits up at 00:30 to look over the shed from the doorway, and at the 00:40 muster Rennick arrives last from his cabin.","witnesses":["Roger Beal","Kevin Ord","Dave Lyle","Iain Rennick"]}],"evidence":[{"id":"ev1","name":"Generator log","where":"on the bench in the generator shed","detail":"Lyle's 21:00 entry reads 'exhaust sound, fan on, louvre open'; Cathcart's 22:50 entry wanders across the ruled lines and stops mid-figure, and there is no 23:00 entry.","proves":"Cathcart was in the shed and already impaired at about 22:50, and stopped working soon afterwards.","atScene":true},{"id":"ev2","name":"Silencer clamp and soot","where":"the exhaust run behind the duty Lister","detail":"The clamp at the silencer joint is tight, but its nut shows fresh bright spanner marks, and a fan of new soot spreads across the wall behind it and the slats of the air louvre; the Gun Gum patch on the manifold flange is intact.","proves":"Exhaust escaped into the shed from a joint someone loosened and later tightened again, not from the old patched flange.","atScene":true},{"id":"ev3","name":"Extractor fan isolator switch","where":"beside the shed door","detail":"A grey plastic rocker switch, set to ON, filmed with fresh soot and carrying one clean fingertip print.","proves":"Someone switched the fan with a bare finger after the soot had settled; the print can be compared.","atScene":true},{"id":"ev4","name":"Rennick's windproof","where":"drying room rail","detail":"His stencilled green windproof, still damp inside at 00:45 with drift-melt in the hood seams.","proves":"Its owner was outside in drift sometime late in the evening.","atScene":false},{"id":"ev5","name":"Lyle's windproof and mukluks","where":"Lyle's peg and boot rack in the cold porch","detail":"The LYLE windproof has drift packed in the hood and a soot smudge on the right cuff, while Lyle's mukluks beneath it are frozen stiff and bone dry.","proves":"Someone went out in Lyle's windproof that night without wearing Lyle's boots.","atScene":false},{"id":"ev6","name":"Drug cabinet and register","where":"surgery","detail":"The DF118 count is a strip short, and the last register line has been overwritten in a different pen.","proves":"Someone other than the doctor took drugs from the cabinet and tried to hide it.","atScene":false}],"forensics":{"tod":"Cherry-pink lividity and bright red blood point to carbon monoxide; with the shed at about 18 degrees and rigor beginning at 00:45, death came between 23:00 and 23:40, after he collapsed beside the day-tank pump.","prints":"A fresh right index print of Iain Rennick lies on top of the soot film on the extractor-fan switch, so it was made after the leak began; the clamp and spanner show only glove smears, and Lyle's many prints in the shed all lie under the soot. Beal's prints are on the drug cabinet and register but nowhere in the shed.","comms":"Radio log: 16:22, telex familygram for I. Rennick from Fiona Rennick, Cambridge: 'Leaving you. It began with Neil Cathcart last summer before you sailed and it has not ended. Sorry. F.' No further transmission until Beal's emergency call to Cambridge via Rothera at 00:28.","tox":"Cathcart's blood carboxyhaemoglobin is about 60 per cent, a lethal level, with modest alcohol and no DF118, pethidine or other drug. Draeger-tube samples at 00:30 found only traces of CO in the shed, so the leak had been stopped and the shed ventilated before he was found.","logs":"The power chart recorder shows the extractor fan's load drop out at 22:31 and come back at 23:44. The outside log shows nobody out after 17:00 but Lyle (17:30-17:45 and 21:00-21:15), Cathcart (out 22:45, never signed in) and Beal and Ord at 23:58; Rennick last signed in from the aerial field at 15:10."},"redHerring":"Three days ago Lyle patched a weeping exhaust flange with Gun Gum and never logged it, and his prints are all over the shed, so the death looks like an accident from slack maintenance or Lyle's doing. But the patch is on the manifold flange and still sound, the leak was at the silencer clamp with fresh spanner marks, an accident does not switch off a fan or shut a louvre, and at 22:31, when the fan went off, Lyle was in the lounge at the reel change.","solutionPath":["Doctor and lab assay: carbon monoxide, death 23:00 to 23:40, no drugs, and the shed air clear by 00:30, so the leak was stopped before anyone found him.","Chart recorder: the fan went off at 22:31 and on at 23:44, yet the outside log shows nobody out at either time, so someone went to the shed twice unsigned; at 22:31 Beal, Lyle, Ord and Cathcart were all in the lit lounge at the reel change, and Rennick had left at 22:20.","Ord saw Rennick's windproof dripping in the drying room at 22:52, though the outside log has Rennick last coming in at 15:10, which breaks his 'wet from the afternoon' excuse and his 'in my bunk' alibi.","Ord's 'Dave in the porch at ten to twelve' is wrong: Lyle's prints lie under the soot while Rennick's lies on top of it on the fan switch, Lyle's mukluks were dry, and through the plywood Lyle heard Rennick go out at 23:35 and come back at 23:51.","Motive from the radio log and Ord: Fiona Rennick's familygram naming Cathcart, which Rennick passes off as 'the cat and the mortgage'.","Beal is cleared: toxicology finds no DF118 in Cathcart, Beal was threading the projector at 22:31, and his prints are on the drug cabinet but not in the shed; his lie hides taking painkillers for his back.","Name Iain Rennick: jealousy over the affair, carbon monoxide from the Lister's exhaust, rigged at 22:31 and undone at 23:44."]},"briefs":[{"name":"Iain Rennick","part":"killer","personality":"Precise, dry and very controlled, an Edinburgh physicist who corrects loose language ('strictly speaking') and hides inside technical vocabulary. He gives short, exact answers; when the walls close in he goes completely silent and stares at the table.","voiceSample":"Strictly speaking, I was asleep, which is less an alibi than a condition.","relationship":"Cathcart was his friend for two seasons; since 17:05 he has hated him with a cold, complete hatred, and he still does.","movements":[{"from":"17:05","to":"18:30","where":"ionosonde lab","doing":"Read Fiona's familygram and sat alone with it.","seenBy":["Kevin Ord"]},{"from":"18:30","to":"21:45","where":"lounge and dining room","doing":"Midwinter drinks and dinner, opposite Cathcart.","seenBy":["Roger Beal","Kevin Ord","Dave Lyle"]},{"from":"21:45","to":"22:20","where":"lounge","doing":"Watched the first reel, then said he was turning in.","seenBy":["Roger Beal","Kevin Ord","Dave Lyle"]},{"from":"22:20","to":"22:38","where":"cold porch and generator shed","doing":"Went out unsigned, switched off the fan, shut the louvre and slackened the silencer clamp.","seenBy":[]},{"from":"22:38","to":"23:35","where":"drying room, then his single cabin","doing":"Hung up his soaked windproof and lay awake, dressed.","seenBy":[]},{"from":"23:35","to":"23:51","where":"cold porch and generator shed","doing":"Went out in Lyle's windproof, found Cathcart dead, tightened the clamp, opened the louvre and switched the fan on.","seenBy":["Kevin Ord","Dave Lyle"]},{"from":"23:51","to":"01:00","where":"his cabin, then the lounge muster","doing":"Waited in his cabin until called, arriving last at the 00:40 muster.","seenBy":["Roger Beal","Kevin Ord","Dave Lyle"]}],"knows":["Fiona's familygram, which he read at 17:05, says she is leaving him and that her affair with Cathcart began last summer in Cambridge (he read it).","Cathcart was on the night-duty rota for Midwinter and would make the 23:00 generator check and hand-pump the day tank for a quarter of an hour (he saw the rota and has done the duty himself).","At about 22:31, wearing gloves, he switched off the extractor fan, shut the air louvre and slackened the silencer clamp with the shed spanner (he did it).","He did not sign the outside log either time he went out (he did it).","His own windproof came back soaked with drift and he hung it in the drying room at 22:38 (he did it).","At about 23:38 he found Cathcart slumped dead by the day-tank pump; he tightened the clamp, opened the louvre and, mitt off, switched the fan back on at about 23:44 (he did it).","He wore Lyle's windproof the second time because his own was still wet, and hung it back on Lyle's peg at 23:49 (he did it).","Cathcart was in the lounge, laughing, when he left at 22:20 (he saw it)."],"doesNotKnow":["That Ord saw his windproof dripping in the drying room at 22:52.","That Ord watched him through the porch porthole at 23:49.","That Lyle heard him leave and return through the cabin wall.","That his fingertip left a print in the soot on the fan switch.","That the chart recorder logs the fan's load.","That Beal took drugs from the surgery."],"secret":"He killed Cathcart over the affair with Fiona.","lies":[{"claim":"I left the film at twenty past ten with a head, went to my pit and didn't stir till the shouting.","truth":"He was in the generator shed from about 22:28 to 22:35 and again from 23:38 to 23:46.","when":"Asked where he was after leaving the film.","crack":"Lyle hearing him leave his cabin at 23:35 and return at 23:51, Ord seeing his windproof dripping at 22:52, or the chart recorder's 22:31 fan-off when everyone else was in the lounge at the reel change."},{"claim":"I've not been in the generator shed since my gash week, a fortnight ago.","truth":"He was there twice that night and switched the fan on at 23:44.","when":"Asked about the generator shed.","crack":"The fingerprint report: his fresh print lying on top of the soot on the extractor-fan switch."},{"claim":"Fiona's familygram? The cat, the mortgage, her mother's hip. The usual.","truth":"It told him she was leaving him for Cathcart.","when":"Asked about his familygram or his mood at dinner.","crack":"The radio log and telex text, or Ord, who typed it."},{"claim":"My windproof's been damp since I went out to the aerial field this afternoon.","truth":"It was soaked on his 22:24 trip to the shed.","when":"Asked why his windproof was wet.","crack":"The outside log showing him signed in at 15:10, seven hours before Ord saw it dripping at 22:52."}],"honestMistake":null,"tells":["Squares the edges of anything on the table.","Says 'strictly speaking' before an evasion."],"pressure":{"baseline":15,"breakPoint":70,"lawyerPoint":88,"style":"shutdown"},"opening":"I'll help where I can. Neil and I wintered together twice; I'd like to know what happened as much as anyone."},{"name":"Roger Beal","part":"liar","personality":"Brusque ex-Navy, a man of orders and lists who starts every other sentence with 'Right then'; protective of his base and his authority and short with questions he thinks impertinent. His back makes him shorter still, and cornered he blusters and shouts.","voiceSample":"Right then. I ran the projector, I ran the cards, and I run this base. What else do you want?","relationship":"He thought Cathcart able but slack, the sort who left the porch door unlatched; he is truly shaken to lose a man on his watch.","movements":[{"from":"17:00","to":"18:30","where":"BC's office","doing":"Paperwork and the Midwinter messages.","seenBy":[]},{"from":"18:30","to":"21:45","where":"lounge and dining room","doing":"Midwinter drinks and dinner.","seenBy":["Iain Rennick","Kevin Ord","Dave Lyle"]},{"from":"21:45","to":"22:44","where":"lounge, at the projector","doing":"Ran the film and threaded the second reel at 22:28 to 22:34 with the lights up.","seenBy":["Kevin Ord","Dave Lyle"]},{"from":"22:44","to":"22:58","where":"cold-porch corridor and surgery","doing":"Saw Cathcart signing out, then took DF118 from the drug cabinet with the duplicate key and overwrote the register.","seenBy":["Kevin Ord"]},{"from":"22:58","to":"23:55","where":"lounge","doing":"Finished the film, then played cards with Lyle, Nolan and Ferris.","seenBy":["Kevin Ord","Dave Lyle"]},{"from":"23:55","to":"00:08","where":"cold porch and generator shed","doing":"Went out with Ord, found Cathcart and helped carry him in.","seenBy":["Kevin Ord"]},{"from":"00:08","to":"01:00","where":"surgery, radio room, lounge","doing":"Stood by the doctor, radioed Cambridge at 00:28 and mustered the crew at 00:40.","seenBy":["Kevin Ord","Dave Lyle","Iain Rennick"]}],"knows":["Rennick left the film at 22:20 saying he was turning in (he saw it).","He threaded the second reel from about 22:28 to 22:34 with the lights up, and Lyle, Ord and Cathcart were in their seats (he did it and saw them).","At about 22:45, passing the cold porch, he saw Cathcart kitted up and signing the outside log for the generator shed (he saw it).","He took a strip of DF118 from the drug cabinet with the BC's duplicate key and overwrote the register (he did it).","At 23:30 Lyle left the cards for his bunk, a bit the worse for homebrew (he saw it).","At 00:02 he and Ord found Cathcart on the shed floor by the pump; the fan was running, the louvre open and the air seemed all right apart from the usual diesel (he saw it).","At about 00:10 Dr Sorley said the drug count was short (he heard it).","At the 00:40 muster Rennick came last from his cabin, fully dressed, his hair damp (he saw it)."],"doesNotKnow":["Who killed Cathcart, or how.","What happened in the shed before 00:02.","That Ord saw him coming from the surgery at 22:57.","What Rennick's familygram said."],"secret":"A slipped disc from coming off the Muskeg in March; the doctor rations his painkillers, so he has been taking DF118 from the cabinet with the BC's duplicate key and altering the register. Found out, he would lose his command and probably his career.","lies":[{"claim":"I was at that projector from the first reel to the last; I didn't leave the lounge till Kevin came for me at five to twelve.","truth":"He left from 22:44 to 22:58 to raid the drug cabinet.","when":"Asked where he was during the film.","crack":"Ord's sighting of him coming from the surgery corridor at 22:57, or his prints on the drug cabinet and register."},{"claim":"The drug cabinet? The duplicate key hasn't left my safe since we arrived. Ask the doc.","truth":"He used it that night and overwrote the register.","when":"Asked about the drug shortfall or the keys.","crack":"The fingerprint report placing his prints on the cabinet and the register page, and the overwritten line."}],"honestMistake":null,"tells":["Presses a hand into the small of his back and shifts in his chair.","Says 'Right then' and changes the subject."],"pressure":{"baseline":25,"breakPoint":65,"lawyerPoint":85,"style":"anger"},"opening":"Right then. I've a dead man in the surgery and eight people who can't leave till October, so let's be quick about it."},{"name":"Kevin Ord","part":"mistaken","personality":"Chirpy, nervy Scouser who talks too fast and jokes when frightened ('not exactly Butlins, is it'); eager to help and hurt if doubted. He reads everyone's messages for a living and feels guilty about it, and under pressure he goes to pieces and cries.","voiceSample":"It was Dave, honest, I saw LYLE on his back clear as day, hanging his windproof on his own peg.","relationship":"He liked Neil, who taught him darts and lent him tapes; he is shocked and frightened.","movements":[{"from":"17:00","to":"17:05","where":"radio room, then the ionosonde lab","doing":"Finished typing up the sked traffic and took Rennick his familygram.","seenBy":["Iain Rennick"]},{"from":"17:05","to":"21:45","where":"lounge, galley and dining room","doing":"Decorated, read out the greetings at 18:30 and ate Midwinter dinner.","seenBy":["Iain Rennick","Roger Beal","Dave Lyle"]},{"from":"21:45","to":"22:52","where":"lounge","doing":"Watched the film, including the reel change.","seenBy":["Roger Beal","Dave Lyle"]},{"from":"22:52","to":"23:00","where":"main corridor and radio room","doing":"Fetched the Midwinter telegrams, passing the drying room and seeing Beal by the surgery corridor.","seenBy":[]},{"from":"23:00","to":"23:48","where":"lounge","doing":"Read the telegrams aloud at 23:15 and watched the cards.","seenBy":["Roger Beal","Dave Lyle"]},{"from":"23:48","to":"23:58","where":"corridor by the cold porch","doing":"Saw the figure in Lyle's windproof, then noticed Cathcart still signed out and fetched Beal.","seenBy":["Roger Beal"]},{"from":"23:58","to":"01:00","where":"generator shed, surgery, radio room, lounge","doing":"Found Cathcart with Beal, helped carry him in and set up the HF for Beal's 00:28 call.","seenBy":["Roger Beal","Dave Lyle","Iain Rennick"]}],"knows":["He took Rennick's familygram off the teleprinter at 16:22 and read it, as he reads everything: Fiona leaving Iain, and the affair with Neil Cathcart since last summer (he read it).","He handed it to Rennick at 17:05 in the lab; Rennick went white and asked to be left alone (he saw it).","At the reel change, about 22:28 to 22:34, Lyle, Beal and Cathcart were in the lit lounge; Rennick had gone at 22:20 (he saw it).","At about 22:52 he saw Rennick's stencilled windproof dripping wet on the drying-room rail (he saw it).","At about 22:57 he saw Beal coming from the surgery corridor with a hand in his pocket (he saw it).","At about 23:49, through the porch porthole, he saw a hooded figure with LYLE on its back hang the windproof on Lyle's peg; he did not see its face (he saw it).","At 23:55 he noticed in the outside log that Cathcart had been signed out since 22:45 and never signed in (he read it).","At 00:02 he and Beal found Cathcart on the floor by the day-tank pump, the fan running and the shed smelling of diesel (he saw it).","He set up the HF for Beal's emergency call to Cambridge via Rothera at 00:28 (he did it)."],"doesNotKnow":["Who killed Cathcart, or how.","That the figure in the porch was Rennick in Lyle's windproof.","What Beal was doing in the surgery.","That the fan had been switched off earlier."],"secret":null,"lies":[],"honestMistake":{"claim":"It was Dave I saw in the porch at ten to twelve, coming in from the genny; LYLE on his back, and he hung it on his own peg.","truth":"It was Iain Rennick wearing Dave Lyle's windproof, because his own was soaked from his first trip.","why":"He saw the figure only from behind through the fogged porthole with the hood up and read the stencilled name; Dave coming in from a late generator check is so ordinary he never questioned it."},"tells":["Drums his fingers on the table like he's keying Morse.","Cracks a joke and then apologises for it."],"pressure":{"baseline":30,"breakPoint":60,"lawyerPoint":82,"style":"tears"},"opening":"Sorry, I've not slept, I'm all over the place. Ask us anything, I'll tell you straight."},{"name":"Dave Lyle","part":"honest","personality":"Blunt, slow-spoken Geordie who says 'aye', 'nowt' and 'man' and trusts machines more than people. Defensive about his generator and his maintenance; if he thinks he is being fitted up he folds his arms and says he'll have a solicitor on the radio before he says owt else.","voiceSample":"That clamp was tight at nine o'clock, man; I'd put my name to it, and I did, it's in the log.","relationship":"He got on fine with Neil, who sometimes gave him a hand in the shed; they were not close.","movements":[{"from":"17:30","to":"17:45","where":"generator shed","doing":"Routine evening check, signed out and in.","seenBy":[]},{"from":"17:45","to":"21:00","where":"lounge and dining room","doing":"Midwinter drinks and dinner.","seenBy":["Iain Rennick","Roger Beal","Kevin Ord"]},{"from":"21:00","to":"21:15","where":"generator shed","doing":"Last check of the evening, logged the clamp sound, fan on and louvre open.","seenBy":[]},{"from":"21:15","to":"23:15","where":"lounge","doing":"Watched the film, including the reel change.","seenBy":["Roger Beal","Kevin Ord"]},{"from":"23:15","to":"23:30","where":"lounge","doing":"Played cards with Beal, Nolan and Ferris.","seenBy":["Roger Beal","Kevin Ord"]},{"from":"23:30","to":"00:30","where":"his bunk room, next to Rennick's cabin","doing":"Lay in his bunk and heard Rennick go out and come back.","seenBy":[]},{"from":"00:30","to":"00:40","where":"cold porch and generator shed doorway","doing":"Kitted up, found his windproof wet, and looked over the shed with a torch from the doorway.","seenBy":["Roger Beal"]},{"from":"00:40","to":"01:00","where":"lounge","doing":"Mustered with the crew.","seenBy":["Roger Beal","Kevin Ord","Iain Rennick"]}],"knows":["At his 21:00 check the silencer clamp was tight, the extractor fan running and the louvre open, and he logged it (he did it).","Three days ago he patched a weeping manifold flange with Gun Gum and never logged it (he did it).","Rennick left the film at 22:20; at the reel change Beal, Ord and Cathcart were in the lounge and Rennick was not (he saw it).","The fan is on a manual isolator and the louvre on a hand lever; neither changes by itself, and the chart recorder in the shed traces the load, fan included (he knows his shed).","He went to his bunk at 23:30, a bit merry; the cabin walls are plywood and Rennick has the single cabin next door (he was there).","At about 23:35 he heard Rennick's door, steps towards the porch and the double clunk of the porch doors; at about 23:51 the porch doors again and Rennick's bunk creak (he heard it).","At 00:30, kitting up, he found his own windproof on its peg with drift in the hood and soot on the right cuff, though he had not been out since 21:15; his mukluks were frozen stiff and dry (he saw it).","From the shed doorway with a torch he saw fresh bright spanner marks on the silencer clamp nut and a fan of new soot on the wall and louvre slats, his flange patch untouched (he saw it)."],"doesNotKnow":["Who loosened the clamp or switched off the fan.","That Ord thinks he saw Dave in the porch.","What Beal did in the surgery.","What was in Rennick's familygram."],"secret":"His small embarrassment: the unlogged Gun Gum patch, which he fears will get the death blamed on his maintenance.","lies":[],"honestMistake":null,"tells":["Folds his arms tighter.","Wipes his palms on his knees."],"pressure":{"baseline":20,"breakPoint":65,"lawyerPoint":85,"style":"lawyer"},"opening":"Before you start: that generator was right as rain at nine o'clock, and it's in the log in my own hand."}],"id":"antarctic"},{"settingId":"antarctic","truth":{"title":"The Skerrow Core","house":"Skerrow, a British Antarctic Survey wintering station on the Cressy Ice Shelf: one long surface hut with the cold porch and boot room at the west end, then the radio room, four bunk rooms, lounge, galley, surgery and glaciology lab, and the generator annex built on at the east end; handlines run out to the core store (an ice cellar 80 metres east), the met screen and the skidoo garage.","victim":{"name":"Clive Marchant","age":41,"role":"senior glaciologist leading the Skerrow deep-core programme, on his first winter south","sketch":"A tall, stooping, exact Yorkshireman who read everything twice and signed nothing he had not checked. He came south to lead a programme the base had run without him for a year, and did not make friends by saying so."},"night":{"start":"17:00","end":"01:00","discovered":"00:40","discoveredBy":"Jim Threlfall","where":"the drift tail on the north side of the hut by the generator annex"},"weather":"Thursday 14 July 1983: full dark, minus 34, a 50-knot south-easterly with heavy drift and visibility of about three metres on the handlines.","publicFacts":["Dr Clive Marchant was found dead at twenty to one by Jim Threlfall, face down in the drift tail on the north side of the hut by the generator annex, after Phil Garrity noticed at 00:08 that he had never signed in from a trip to the core store at 21:55.","The wintering crew of nine: Graham Teague (Base Commander), Dr Owen Kerslake (medical officer), Terry Ludlow (radio operator), Barry Quinnell (diesel mechanic), Ray Cosgrove (builder, this week's cook and nightwatchman), Phil Garrity (met observer), Jim Threlfall (general assistant), and the glaciologists Dr Clive Marchant and Alec Fenwick.","A 50-knot south-easterly blew drift all evening at minus 34. Porch standing orders: sign the outside log, leave the porch light on while anyone is out, and drop the storm bar only on the Base Commander's word and never with a man signed out.","Skerrow has one door in winter: the cold porch at the west end. The emergency hatch in the generator annex roof at the east end has been drifted over since May.","At dinner Marchant said somebody had been moving tubes in his core store and he and Threlfall had words, ending with Threlfall telling him to carry his own core; later Marchant told Teague he was fetching the store book and wanted a report to Cambridge countersigned at half past ten.","The film ran in the lounge from 20:15 to 22:25 with a reel change at about 21:20, then darts; Teague went to wait for Marchant in his cabin at 22:12 and fell asleep, and Garrity raised the alarm at 00:10 after the midnight obs.","Dr Kerslake pronounced Marchant dead of exposure at 00:52 and Ludlow raised Rothera at 00:58; Cambridge has deputised the Base Commander's deputy to question the base before the 09:00 schedule, there being no aircraft until October."],"suspects":[{"name":"Alec Fenwick","age":29,"role":"glaciologist, second winter; the Cambridge research student who drilled and logged the Skerrow core; shares bunk room 2 with Threlfall","sketch":"A fair, bony, fast-talking man with a bitten thumbnail and a second-year winterer's beard, who answers before the question is finished; the base's rising star since Cambridge telexed its congratulations in May.","part":"killer"},{"name":"Terry Ludlow","age":36,"role":"radio operator, ex-Royal Signals, third winter south; shares bunk room 1 with Garrity","sketch":"A compact, careful Welshman with a cigarette behind one ear and headphone marks in his hair, who speaks in procedure and gives nothing away for free. He looks as if he has not been to bed.","part":"liar"},{"name":"Phil Garrity","age":44,"role":"Met Office observer seconded to the Survey, second winter; shares bunk room 1 with Ludlow","sketch":"A big, slow, kindly Lancastrian in a paraffin-stained jersey with a logbook under his arm, who dates everything by his observations and, having thought, speaks for too long.","part":"mistaken"},{"name":"Jim Threlfall","age":26,"role":"general assistant: climber, keeper of the handlines, skidoos and gash pit, first winter; shares bunk room 2 with Fenwick","sketch":"A wiry, wind-burnt Cumbrian with rope-scarred hands and a stammer that comes and goes, who looks at the floor when angry and at you when not. He found the body and has not stopped shaking.","part":"honest"}],"killer":"Alec Fenwick","accomplice":null,"motive":"Fenwick's Nature note, accepted in May, rests on an acid spike at 120.4 metres that he identified as the 1815 Tambora eruption; the four core sections holding that depth were smashed when a rack collapsed in April and tipped in the gash pit, and he wrote their conductivity readings in from the trend. Marchant found the empty tubes on his afternoon inventory, told Fenwick at 17:05 that Cambridge would be asked to hold the note, and meant to put the store book and the tubes in front of Teague at half past ten.","method":"With Marchant in the core store and bound to come back along line B to the only door, Fenwick dropped the storm bar across the outer door at 22:10 and switched off the porch light so the bar could not be seen through the boot-room window. Marchant reached the door at 22:33, could not open it, tried for the annex along the lee wall in 50 knots at minus 34 and died in the drift tail by about 23:15. At 23:35 Fenwick lifted the bar, put the light on, took in the kitbag Marchant had dropped at the door and hid it in the lab cold room, so the death would pass for a man who lost the line.","alibiGap":{"from":"22:05","to":"23:50","killerClaims":"That he left the film at ten past ten with a headache, lay on his bunk reading until Garrity's shout at ten past midnight, and got up once, to the lavatory, after Threlfall turned in.","actually":"At 22:10 he barred the outer door and switched off the porch light while Marchant was in the core store; at 23:35 he lifted the bar, put the light on, opened the door and hid Marchant's kitbag in the lab cold room after razoring out the store-book page."},"sharedStory":null,"timeline":[{"time":"17:05","place":"glaciology lab","present":["Clive Marchant","Alec Fenwick"],"event":"Marchant, back from his afternoon inventory of the core store, tells Fenwick that tubes 44 to 47 are empty, that his conductivity record for 118 to 123 metres cannot have been measured, and that Cambridge will be asked to hold the Nature note; Quinnell, passing, hears raised voices.","witnesses":["Barry Quinnell"]},{"time":"19:00","place":"dining room","present":["Clive Marchant","Alec Fenwick","Terry Ludlow","Phil Garrity","Jim Threlfall","Graham Teague","Owen Kerslake","Barry Quinnell","Ray Cosgrove"],"event":"Marchant says somebody has been moving tubes in his store, Threlfall says he warned about that rack in April and is asked whether he was in there, and their words end with Threlfall telling him to carry his own core; Fenwick eats in silence.","witnesses":["Alec Fenwick","Jim Threlfall"]},{"time":"19:35","place":"radio room","present":["Clive Marchant","Terry Ludlow"],"event":"Marchant hands Ludlow a telex form for Cambridge for the morning schedule, saying it is to go whatever anyone says, and Ludlow punches it to tape at 19:45 and locks the form in his traffic drawer.","witnesses":[]},{"time":"20:15","place":"lounge","present":["Alec Fenwick","Terry Ludlow","Phil Garrity","Jim Threlfall","Ray Cosgrove"],"event":"Cosgrove runs the film with everyone but Marchant watching; Garrity is out at the screen for the 21:00 obs from 20:55 to 21:06, and Ludlow slips out at 21:40 'to turn in', shuts himself in the radio room and is on the amateur set to Raul at the Argentine base Belgrano II from 21:48 to 23:22.","witnesses":["Phil Garrity","Jim Threlfall"]},{"time":"21:50","place":"corridor outside the lounge","present":["Clive Marchant","Alec Fenwick"],"event":"Marchant beckons Fenwick out of the film and says he is fetching the store book and the empty tubes for Teague to countersign the report at half past ten, as agreed in Teague's cabin at 21:45; he refuses Fenwick's company and Fenwick goes back to his seat white.","witnesses":["Jim Threlfall"]},{"time":"21:55","place":"cold porch","present":["Clive Marchant"],"event":"Marchant kits up, signs the outside log 'Core store 21:55, back 22:30' and goes out along line B, leaving the porch light burning as standing orders require.","witnesses":[]},{"time":"22:03","place":"core store","present":["Clive Marchant"],"event":"Marchant climbs down into the ice cellar, takes the store book off its nail, pencils 'EMPTY CM 14/7' on tubes 44 and 45, packs them in his kitbag and climbs out at 22:26 to follow line B home.","witnesses":[]},{"time":"22:08","place":"lounge","present":["Alec Fenwick","Phil Garrity","Jim Threlfall","Graham Teague"],"event":"Fenwick leaves the film pleading a headache, Teague goes at 22:12 to wait for Marchant in his cabin, the film ends at 22:25, Garrity turns in at 22:28 for a kip before the midnight obs, and the rest start the darts.","witnesses":["Phil Garrity","Jim Threlfall"]},{"time":"22:10","place":"cold porch and boot room","present":["Alec Fenwick","Jim Threlfall"],"event":"Fenwick, in felt boots, drops the storm bar bare-handed and switches off the porch light so the bar cannot be seen from the boot room, and is on his bunk by 22:13; at 22:18 Threlfall, fetching tobacco from the boot room, hears Ludlow's voice behind the radio-room door and sees the porch dark through the window, and takes it for a dead bulb.","witnesses":["Terry Ludlow","Jim Threlfall"]},{"time":"22:33","place":"outside the outer porch door","present":["Clive Marchant"],"event":"Marchant finds the door immovable, beats on it with fist and axe shaft, kicks it, pulls off his right mitt to work the latch and drops his torch; Ludlow takes the thumps for the drying-room door and Garrity, in bunk 1, for Marchant stamping in; at 22:40 Marchant drops the kitbag at the door and works east along the lee wall for the annex.","witnesses":["Terry Ludlow","Phil Garrity"]},{"time":"23:00","place":"generator annex","present":["Barry Quinnell"],"event":"Quinnell makes his hourly check and logs 'bang on annex wall? checked exhaust, nothing'; outside, ten metres from the wall in waist-deep drift, Marchant sits down and is dead within the quarter hour.","witnesses":["Barry Quinnell"]},{"time":"23:25","place":"bunk room 2","present":["Jim Threlfall","Alec Fenwick"],"event":"Threlfall turns in from the darts and finds Fenwick lying dressed on his bunk; at 23:33 Fenwick gets up saying he needs the bog.","witnesses":["Jim Threlfall"]},{"time":"23:35","place":"cold porch","present":["Alec Fenwick"],"event":"Fenwick lifts the bar bare-handed, switches on the porch light, opens the outer door onto a fall of drift that covers his felt boots, finds Marchant's kitbag and no Marchant, and carries the bag in.","witnesses":[]},{"time":"23:43","place":"corridor by the galley","present":["Alec Fenwick","Terry Ludlow"],"event":"Ludlow, coming from the galley with a brew after shutting down the set at 23:31, passes Fenwick heading for the lab in felt boots with Marchant's kitbag, drift still on it, and says nothing.","witnesses":["Terry Ludlow"]},{"time":"23:44","place":"lab cold room","present":["Alec Fenwick"],"event":"Fenwick razors the page for tubes 41 to 50 out of the store book, burns it in the fume cupboard, pushes the kitbag behind the ECM bench and is on his bunk by 23:48 with drift melting on his felt boots and trouser cuffs, which Threlfall notices.","witnesses":["Jim Threlfall"]},{"time":"23:55","place":"met screen","present":["Phil Garrity"],"event":"Garrity goes out for the midnight obs past a heap of fresh drift inside the outer door and the bar stowed, and comes in at 00:08 to find Marchant still signed out and his windproof gone from its peg.","witnesses":[]},{"time":"00:10","place":"corridor","present":["Phil Garrity","Graham Teague","Alec Fenwick","Jim Threlfall","Terry Ludlow"],"event":"Garrity wakes Teague, who musters the base at 00:15; at 00:20 Teague, Fenwick and Quinnell go out on line B to the empty store while Threlfall and Cosgrove rope up to search the hut walls.","witnesses":["Phil Garrity","Jim Threlfall"]},{"time":"00:40","place":"north side of the hut at the east gable","present":["Jim Threlfall","Ray Cosgrove"],"event":"Threlfall finds Marchant face down in the drift tail ten metres from the annex, right hand bare and hood packed with drift; he and Cosgrove carry him to the surgery, Kerslake pronounces him dead at 00:52 and Ludlow raises Rothera at 00:58.","witnesses":["Jim Threlfall","Ray Cosgrove"]}],"evidence":[{"id":"ev1","name":"Outer porch door","where":"the outer door of the cold porch, west end","detail":"A plywood-faced door opening outward: a two-inch gouge from an ice-axe pick at shoulder height, paint scuffed through round the latch, boot marks along the foot, latch and hinges working freely; the bar brackets inside show fresh bright scrapes.","proves":"Marchant reached the door and beat on it; it does not stick, so the storm bar held it from inside, against standing orders, while he was signed out.","atScene":true},{"id":"ev2","name":"Marchant's torch and right mitt","where":"dug from the drift against the foot of the outer door at 07:20","detail":"A Survey-issue rubber torch, switch on and battery flat, and a Dachstein mitt, both iced hard, a foot down in the drift against the door.","proves":"He stood at the door long enough to bare a hand for the latch and drop his torch; he had not lost the line, he had come home to a door that would not open.","atScene":true},{"id":"ev3","name":"The storm bar","where":"stowed upright in its clips beside the outer door","detail":"A four-by-two baulk painted red in March, made to drop into brackets across the outer door: frost on it, glove smears, and on the lifting edge a set of bare finger and palm prints frozen into the paint.","proves":"Someone dropped and lifted it bare-handed in the cold that night and did not expect it to be looked at.","atScene":true},{"id":"ev4","name":"Marchant's blue kitbag","where":"behind the ECM bench in the cold room off the glaciology lab","detail":"A Survey kitbag, drift still in its folds, holding two empty core tubes pencilled '44 EMPTY CM 14/7' and '45 EMPTY CM 14/7' and the store book with the page for tubes 41 to 50 razored out at the spine; paper ash in the fume-cupboard sink.","proves":"Marchant brought the bag from the store to the door; someone carried it in after he died, cut out the page listing the missing tubes and hid it where only the glaciologists go.","atScene":false},{"id":"ev5","name":"Marchant's telex form","where":"Ludlow's locked traffic drawer in the radio room, punched to tape for the morning","detail":"A telex form in Marchant's hand timed 19:30: 'BAS CAMBRIDGE FOR DIRECTOR. REQUEST HOLD NATURE NOTE FENWICK ET AL. STORE INVENTORY TODAY SHOWS TUBES 44-47 (118.6-122.9 M) EMPTY. ECM RECORD THOSE DEPTHS CANNOT BE GENUINE. FULL REPORT FOLLOWS. MARCHANT.'","proves":"By half past seven Marchant meant to tell Cambridge that Fenwick's record was invented, and Fenwick had known since five past five.","atScene":false},{"id":"ev6","name":"Fenwick's ECM record book","where":"the glaciology lab bench","detail":"The conductivity record in Fenwick's hand: tubes 44 to 47 entered in one run dated 3 to 5 May in a different pen from the March entries either side, the acid spike at 120.4 metres ringed 'Tambora 1815'.","proves":"The readings the Nature note rests on were written up in May for core tipped in the gash pit in April, by the man who kept the book.","atScene":false}],"forensics":{"tod":"Dr Kerslake: core temperature at 00:55 and rigor in jaw and fingers put death from exposure between 22:45 and 23:30; no injury but barked right knuckles and a split nail. Right hand bare, hood packed with drift, inner gloves frozen stiff: nothing on him had thawed, so he had not been indoors since he signed out at 21:55.","prints":"Nothing readable outdoors, and the porch clipboard and pencil carry everyone's prints. The storm bar, painted in March and not dropped since 18 May, shows glove smears and one set of bare prints frozen into the frost on its lifting edge: Alec Fenwick's right palm and four fingers, laid down in the cold that night; Ludlow, Garrity and Threlfall are not on it.","comms":"Radio log: the 16:00 schedule cleared at 16:41, nothing further until Ludlow raised Rothera at 00:58. In Ludlow's locked drawer: Marchant's telex form, timed 19:30 and punched to tape, asking Cambridge to hold Fenwick's Nature note because tubes 44 to 47 are empty and the conductivity record for those depths cannot be genuine; beside it a scratch pad in Ludlow's hand, 'LU1ZB Belgrano 2148-2322, Raul, Qc5, mum better', and the amateur set's hour-meter 1.6 hours up on the sign-off reading.","tox":"Blood alcohol about 30 mg per 100 ml, two cans' worth; no sedative, no carbon monoxide, nothing from the surgery cabinet, and the stomach lining shows the small haemorrhages of death from cold. Air samples from porch, bunk rooms and annex are normal and the drug count is complete.","logs":"Outside log: Marchant 'Core store 15:30, in 16:12'; Threlfall 'Garage 17:10, in 17:48'; Garrity 'Met 17:55, in 18:06' and 'Met 20:55, in 21:06'; Marchant 'Core store 21:55, back 22:30' with no return; Garrity 'Met 23:55, in 00:08'; the search party at 00:20. Quinnell's generator log has the Lister steady all night and at 23:00 the note 'bang on annex wall? checked exhaust, nothing'."},"redHerring":"Threlfall, keeper of the lines, told Marchant at dinner to carry his own core and was roped on the wall when the body was found, so the first base theory is that he let Marchant go alone or that his line failed. Dispelled by: he was in the lounge in full view from 20:15 to 23:25 except four minutes at 22:18, the torch and mitt at the door show Marchant never lost the line, his prints are not on the bar, and his account of the core he helped tip in April makes him the key witness against Fenwick.","solutionPath":["Doctor's report: death from exposure between 22:45 and 23:30 and nothing on him thawed, so Garrity's 'Clive came in at twenty-five to eleven' is wrong; the thumps he heard were Marchant at the barred door.","The gouged outer door, the torch and mitt dug from the drift at its foot, and the generator log's 'bang on annex wall' at 23:00: Marchant reached a door that works freely and could not open it, so the bar was down while he was signed out, and he was alive at the east end at eleven.","Fingerprints: Fenwick's bare prints frozen on the storm bar, which nobody had dropped since May, breaking his 'on my bunk from ten past ten'.","Threlfall: the porch was dark at 22:18 while Marchant was out, Fenwick left the bunk room from 23:33 to 23:48 and came back with drift on his boots, and in April Fenwick had him tip four bags of smashed core and asked him to keep quiet.","Motive: Marchant's telex in Ludlow's drawer asking Cambridge to hold the Nature note, the kitbag in the lab cold room with the razored store book and the tubes pencilled EMPTY, and the ECM book with readings dated May for core tipped in April.","Ludlow is cleared: Garrity heard his voice through the wall until gone eleven and the scratch pad and hour-meter put him on the amateur set to Belgrano II from 21:48 to 23:22; cracked, he gives the thumps at 22:33 and Fenwick carrying Marchant's kitbag towards the lab at 23:43.","Name Alec Fenwick: to stop the telex exposing his invented conductivity record, he barred the only door at 22:10 while Marchant was at the core store and left him to the cold, then lifted the bar at 23:35 and hid the kitbag."]},"briefs":[{"name":"Alec Fenwick","part":"killer","personality":"Quick, clever and plausible, a Cambridge research student who talks in depths and numbers ('a hundred and twenty metres, give or take') and finishes the detective's sentences for him. Used to being the cleverest man in the hut, he turns sharp when doubted; pushed to the edge he stops talking and stares at the ECM trace on the wall.","voiceSample":"Clive read everything twice, which is a virtue in an auditor and a disease in a scientist.","relationship":"He admired Marchant's rigour and resented being supervised by a man who arrived a year after the core came up; since five past five he has thought of him only as the man who would end his career.","movements":[{"from":"17:05","to":"18:00","where":"glaciology lab","doing":"Took Marchant's accusation about tubes 44 to 47, then sat alone with the ECM book.","seenBy":[]},{"from":"18:00","to":"20:15","where":"lounge bar, dining room, then the lab","doing":"Drank three cans fast, ate in silence while Marchant and Threlfall had words, then sat in the lab with the ECM book.","seenBy":["Terry Ludlow","Phil Garrity","Jim Threlfall"]},{"from":"20:15","to":"22:08","where":"lounge","doing":"Watched the film; called out by Marchant at 21:50, back by 21:53; left at 22:08 pleading a headache.","seenBy":["Phil Garrity","Jim Threlfall","Terry Ludlow"]},{"from":"22:08","to":"22:13","where":"cold porch","doing":"Dropped the storm bar bare-handed and switched off the porch light.","seenBy":[]},{"from":"22:13","to":"23:33","where":"bunk room 2","doing":"Lay dressed on his bunk, awake, until he told Threlfall he needed the bog.","seenBy":["Jim Threlfall"]},{"from":"23:33","to":"23:48","where":"cold porch, corridor and lab cold room","doing":"Lifted the bar, put the light on, opened the door, carried Marchant's kitbag to the cold room, razored out the store-book page and hid the bag.","seenBy":["Terry Ludlow"]},{"from":"23:48","to":"01:00","where":"bunk room 2, corridor, line B and the lounge","doing":"Lay down until the shout, then went out with Teague and Quinnell to the empty store and waited in the lounge.","seenBy":["Jim Threlfall","Phil Garrity","Terry Ludlow"]}],"knows":["His ECM readings for tubes 44 to 47 (118.6 to 122.9 m), with the acid spike at 120.4 he called Tambora, were never measured: the core shattered when the rack collapsed on 20 April and he wrote them in on 3 May from the trend either side (he did it).","He and Threlfall tipped the four bags of smashed core in the gash pit on 21 April and he asked Threlfall to keep it between them; the empty tubes went back on the rack, where 46 and 47 still stand (he did it).","Marchant told him at 17:05 that he had found tubes 44 to 47 empty and would telex Cambridge to hold the Nature note (he heard it).","At 21:50 Marchant told him he was fetching the store book and the empty tubes for Teague to countersign a report at 22:30, and would not have him along (he heard it).","At 22:10, in felt boots, he dropped the storm bar bare-handed and switched off the porch light; at 23:35 he lifted it, put the light on and opened the outer door (he did it).","At 23:36 he found Marchant's kitbag against the door, drift falling in over his boots, and no Marchant; he carried it to the lab cold room, razored out the store-book page for tubes 41 to 50, burned it and pushed the bag behind the ECM bench (he did it).","Threlfall was in the bunk room when he got up at 23:33 and came back at 23:48, and Ludlow passed him by the galley at 23:43 with a mug (he saw them)."],"doesNotKnow":["That Marchant handed the telex to Ludlow at 19:35 and it is punched to tape in the traffic drawer.","That Threlfall saw the porch dark at 22:18 and knows the standing order about the light.","That Ludlow and Garrity heard the thumps, or that Quinnell logged a bang on the annex wall at 23:00.","That his bare prints froze onto the storm bar.","That Threlfall noticed the drift on his boots, or that Ludlow took note of the kitbag."],"secret":"He invented the conductivity record for four metres of core smashed in April, and barred the door on Marchant to stop the telex that would have exposed it.","lies":[{"claim":"I left the film about ten past ten with a head and lay on my bunk reading till Jim came in; I got up once for the bog after that and never otherwise stirred till Phil shouted.","truth":"He was in the porch from 22:10 to 22:13 barring the door, and from 23:33 to 23:48 lifting the bar, opening the door and carrying the kitbag to the lab.","when":"Asked where he was after leaving the film.","crack":"His bare prints on the storm bar, Threlfall's account of the drift on his boots at 23:48, or Ludlow's sighting of him with the kitbag."},{"claim":"Clive and I had a difference over the write-up, who went first on the author line, nothing more; the note is sound and Cambridge has it.","truth":"His conductivity readings for 118.6 to 122.9 metres are invented and Marchant was telexing Cambridge to hold the note.","when":"Asked about the row in the lab, the Nature note, or why Marchant went to the store.","crack":"Marchant's telex form with the tubes pencilled EMPTY, or the ECM record book dated May set against Threlfall's account of core tipped in April."},{"claim":"The store book and the tubes? Clive must have left them in the cellar; the search party found nothing but an iced ladder.","truth":"He carried them in from the outer door at 23:36 and hid the kitbag behind the ECM bench after razoring out the page.","when":"Asked about the store book, the kitbag or the empty tubes.","crack":"The kitbag found in the lab cold room with drift in its folds, or Ludlow's sighting of him carrying it towards the lab."},{"claim":"The core that went in April was a few bits of top section, nothing from depth, and Clive knew at the time.","truth":"It was tubes 44 to 47 from 118 to 123 metres; he told nobody and asked Threlfall to keep quiet.","when":"Asked about the rack collapse or the gash pit.","crack":"Threlfall's account of the four bags and the request to keep it between them, or the empty tubes 46 and 47 still on the rack."}],"honestMistake":null,"tells":["Bites the side of his thumbnail.","Gives a depth or a figure before the real answer when the question is hard."],"pressure":{"baseline":20,"breakPoint":75,"lawyerPoint":90,"style":"shutdown"},"opening":"You'll want it from the top, I suppose. Clive went out on line B at five to ten in fifty knots and the line let him down; there isn't a great deal more to it."},{"name":"Terry Ludlow","part":"liar","personality":"A careful, dry Welshman from Pembroke Dock, ex-Royal Signals, who talks in procedure ('say again', 'confirm that') and answers only the question asked. He holds to his trade's rule that traffic is nobody's business; cornered, he flares in short bursts of temper and goes back to 'that's all I've got for you'.","voiceSample":"I log what goes out and what comes in, boy; what people say to each other in the corridor isn't traffic.","relationship":"He respected Marchant as the only man on base who filled in a telex form properly and thought him a cold fish; he feels sick that he heard the thumps and did nothing.","movements":[{"from":"17:00","to":"18:00","where":"radio room","doing":"Cleared the schedule traffic and wrote up the day's log.","seenBy":[]},{"from":"18:00","to":"19:35","where":"lounge bar, then dining room","doing":"Played crib with Threlfall, then ate and heard Marchant and Threlfall have words.","seenBy":["Alec Fenwick","Phil Garrity","Jim Threlfall"]},{"from":"19:35","to":"20:10","where":"radio room","doing":"Took Marchant's telex form at 19:35, read it to punch it to tape, and locked it in the drawer.","seenBy":[]},{"from":"20:15","to":"21:40","where":"lounge","doing":"Watched the film and left at 21:40 saying he was turning in.","seenBy":["Alec Fenwick","Phil Garrity","Jim Threlfall"]},{"from":"21:40","to":"23:31","where":"radio room","doing":"On the amateur set to Raul at Belgrano II from 21:48 to 23:22, then shut down and tidied the pad away.","seenBy":[]},{"from":"23:31","to":"00:10","where":"galley, corridor and bunk room 1","doing":"Made a brew, passed Fenwick in the corridor at 23:43, and slept from 23:46 until Garrity woke him.","seenBy":["Alec Fenwick","Phil Garrity"]},{"from":"00:10","to":"01:00","where":"corridor, lounge and radio room","doing":"Mustered, waited, and raised Rothera at 00:58.","seenBy":["Phil Garrity","Jim Threlfall","Alec Fenwick"]}],"knows":["Marchant handed him a telex form at 19:35 for the morning schedule, 'to go whatever anyone says'; it asks Cambridge to hold Fenwick's Nature note because tubes 44 to 47 are empty, and it is punched to tape in his locked drawer (he read it to type it).","Nothing went out or came in after the 16:41 sign-off until he raised Rothera at 00:58 (he keeps the log).","From 21:48 to 23:22 he was on the amateur set to Raul at Belgrano II, forbidden since the war and enough to finish him with the Survey (he did it).","At about 22:10 he heard the inner porch door open and shut, and at about 22:33 three or four heavy thumps that shook the porch-side wall, which he took for the drying-room door banging; he pulled his headphones back on (he heard it).","At 23:43, coming from the galley with a brew, he passed Fenwick in felt boots heading for the lab with Marchant's blue kitbag, drift still on it, and thought it odd but not his business (he saw it).","Garrity was asleep in the top bunk when he turned in at 23:46, and the alarm went at 23:50 (he saw it).","At dinner Marchant said somebody had been moving tubes in the store and Threlfall told him to carry his own core; Fenwick had drunk three cans fast at the bar and said nothing all evening (he saw and heard it)."],"doesNotKnow":["That the storm bar was down, or who dropped it.","What Fenwick did with the kitbag or why he had it.","That the porch light was off at 22:18.","What Marchant and Fenwick said to each other at 17:05 or 21:50."],"secret":"Monthly contacts on the amateur bands with an Argentine radio operator at Belgrano II, kept up since before the Falklands war: a sacking offence under the Survey's post-war order and, he fears, worse.","lies":[{"claim":"I turned in at twenty to ten with a paperback and I never left my pit till Phil came hammering at ten past twelve.","truth":"He was in the radio room from 21:40 to 23:31 on the amateur set, then in the galley until 23:45.","when":"Asked where he was after leaving the film.","crack":"Garrity's statement that his bunk was empty till a quarter to midnight and his voice came through the wall, or the comms report with the scratch pad and hour-meter."},{"claim":"Heard nothing and saw nothing all night; the wind takes everything and I was asleep.","truth":"He heard the inner door at 22:10 and the thumps at 22:33, and saw Fenwick with the kitbag at 23:43.","when":"Asked what he heard or saw during the evening.","crack":"Once his first lie is cracked, or when shown the gouged outer door or the torch and mitt from the drift; he then gives the thumps and the kitbag."}],"honestMistake":null,"tells":["Takes the cigarette from behind his ear and puts it back.","Says 'say again' to buy time."],"pressure":{"baseline":25,"breakPoint":60,"lawyerPoint":85,"style":"anger"},"opening":"Before you start: I've logged the Rothera call and Cambridge has the bare facts. Ask what you want and I'll give you what I've got."},{"name":"Phil Garrity","part":"mistaken","personality":"Slow, warm and thorough, a Bolton man with twenty years of three-hourly observations behind him, who trusts his senses as he trusts his thermometer. He answers in long, careful paragraphs with the times in, apologises for the length, and takes being doubted as a personal unkindness; pressed too hard he goes quiet and wet-eyed.","voiceSample":"Fifty-two knots and minus thirty-four at nine, and I'll put money on every figure.","relationship":"He liked Marchant more than most did, because Marchant read the met returns and asked sensible questions; he keeps thinking he should ha
