onel Marwood was found dead at the foot of the cellar steps at eight minutes to midnight by Pethick, the butler, face down among broken glass and spilt port, his candle-stick on the steps above him.","The party for the Saturday shoot: Lady Marwood, Captain Guy Marwood (son and heir), Miss Verity Marwood, Mr and Mrs Stanley Carrow of Coventry, who are buying the Downside farms, and Major and Mrs Rendell; the Vicar, Mr Odgers, dined and bicycled home at a quarter past ten.","Every night of a party Sir Lionel went down to his cellar at eleven, alone, with his own key and chamber candle, by the fourteen stone steps from the basement cellar passage, where the lamp room opens opposite the cellar door; nobody was to follow him, and at dinner he joked that the worn dark step would have him one day.","Sleet fell from four o'clock on Saturday 15 November 1924; the lane was running chalk, the motor stood in the coach house, and nobody is known to have left the house after the Vicar.","Pethick telephoned Dr Lennard at 00:06 and the Warminster police at 00:09 through the Brixcombe exchange; Dr Lennard would not sign it off as a fall, and Scotland Yard was asked for a man at first light."],"suspects":[{"name":"Delphine Carrow","age":25,"role":"wife of Mr Stanley Carrow, the Coventry motor-body manufacturer buying the Downside farms; at Brixcombe for the first time, so far as anyone knows","sketch":"Tall, still and finished, with dark red hair dressed low and a green frock a shade too good for a Wiltshire November; she speaks slowly and watches the mouth of whoever is speaking.","part":"killer"},{"name":"Guy Marwood","age":31,"role":"Sir Lionel's only son and heir, a captain in the 4th Dragoon Guards at Tidworth","sketch":"Lean, dark and handsome in a worn way, with a cavalry moustache and a limp from Cambrai; he fills a pipe he does not light and answers a question with a question.","part":"liar"},{"name":"Edwin Pethick","age":61,"role":"butler at Brixcombe since 1911, footman there from 1898","sketch":"Grey, exact and stooped, in a morning coat older than the Inspector, with a tremor in the left hand that he keeps behind his back. He says 'Sir Lionel is' and corrects himself to 'was'.","part":"mistaken"},{"name":"Verity Marwood","age":17,"role":"Sir Lionel's daughter, home from Malvern for half-term; dined down with the party for the first time last night","sketch":"A thin, quick girl with bitten nails and her brother's dark eyes, in a jersey over last night's frock; she has been crying and is furious about it. She smells faintly of Gold Flake.","part":"honest"}],"killer":"Delphine Carrow","accomplice":null,"motive":"On 15 November 1909, at the last drive in the Long Plantation, Lionel Marwood fired at a low pheasant and killed Tom Hinde, a fourteen-year-old beater; the inquest cleared the gun and censured the boy's father, the under-keeper Jack Hinde, who was dismissed without a character, drank, and died in Salisbury infirmary in 1913. Tom's sister Dora, ten that day and sent to an aunt in Coventry, remade herself as Delphine, married her employer Stanley Carrow in 1921, steered him into buying the Downside farms so the Marwoods would ask them to the shoot, and when Sir Lionel told the story at his own table as a thing done with, killed him that night, fifteen years to the day.","method":"At 23:08 on the cellar steps. Having gone down at 22:56 in Captain Marwood's trench coat and cap from the lobby pegs and waited in the dark lime-washed lamp room opposite the cellar door, she followed Sir Lionel down and shoved him between the shoulders on the seventh step; he went headlong onto the flags and broke his neck and skull. By match-light she broke a bottle of the '96 on the fourth step beside his hand so it would read as a slip coming up with the wine, hung the coat back at 23:14 and was in her room by 23:18.","alibiGap":{"from":"22:50","to":"23:20","killerClaims":"That she undressed as soon as the housemaid left her at about ten to eleven, took her aspirin and slept until her husband came up near midnight.","actually":"She went down at 22:56 in the Captain's coat and cap, waited in the lamp room from 23:00, pushed Sir Lionel down the cellar steps at 23:08, staged the broken bottle, hung the coat up at 23:14 and was back in her room at 23:18."},"timeline":[{"time":"19:30","place":"bedrooms and dining room","present":["Delphine Carrow","Guy Marwood","Verity Marwood","Edwin Pethick"],"event":"The dressing gong; the party dress while Pethick and the footman lay the table, and Lady Marwood tells Verity she may dine down for the first time.","witnesses":["Edwin Pethick"]},{"time":"20:00","place":"dining room","present":["Sir Lionel Marwood","Guy Marwood","Verity Marwood","Delphine Carrow","Edwin Pethick"],"event":"Dinner, Pethick at the sideboard; Sir Lionel says he will go down at eleven 'as usual' for the Cockburn '96 and jokes that the dark step will have him one day.","witnesses":["Edwin Pethick"]},{"time":"20:40","place":"dining room","present":["Sir Lionel Marwood","Guy Marwood","Verity Marwood","Delphine Carrow","Edwin Pethick"],"event":"The Vicar mentions fresh chrysanthemums on 'the Hinde boy's grave' and Sir Lionel tells the 1909 story shortly, as a closed matter ('a low bird, a boy out of his line; I did what was proper by the family'); Mrs Carrow goes white, which Verity sees and Pethick does not.","witnesses":["Verity Marwood","Edwin Pethick"]},{"time":"21:15","place":"drawing room and dining room","present":["Delphine Carrow","Verity Marwood","Guy Marwood","Edwin Pethick"],"event":"The ladies withdraw, Mrs Carrow playing the piano with Verity turning the pages; over the port Guy asks his father for £400 for Pellow, his Salisbury bookmaker, and is refused with 'not another penny while I live', which Pethick, bringing the cigars, hears.","witnesses":["Edwin Pethick","Guy Marwood"]},{"time":"21:50","place":"drawing room","present":["Delphine Carrow","Verity Marwood","Guy Marwood"],"event":"The men come through and bridge is made up; Mrs Carrow asks the Vicar what became of the Hinde family, and Verity hears him say the father died in Salisbury infirmary, the mother in 1916, and a little girl went to relations in the Midlands.","witnesses":["Verity Marwood","Guy Marwood"]},{"time":"22:15","place":"hall, billiard room, study and drawing room","present":["Edwin Pethick","Delphine Carrow","Guy Marwood","Verity Marwood"],"event":"Pethick lights the Vicar out; Mr Carrow and Major Rendell go to billiards and Sir Lionel shuts himself in the study with the game book, leaving Lady Marwood, Mrs Carrow, Guy and Verity in the drawing room.","witnesses":["Edwin Pethick"]},{"time":"22:35","place":"drawing room, main stairs and Mrs Carrow's bedroom","present":["Delphine Carrow","Verity Marwood","Guy Marwood","Edwin Pethick","Hetty Voss"],"event":"Mrs Carrow pleads a headache and goes up with Lady Marwood, who sends Verity up too; Guy stays alone in the drawing room with the whisky; at 22:48 Hetty Voss brings Mrs Carrow hot milk and aspirin and finds her still in her green frock and bronze slippers, taking down her hair; Pethick is in his pantry until 22:50, then sends the staff to bed.","witnesses":["Guy Marwood","Verity Marwood","Hetty Voss"]},{"time":"22:56","place":"back stairs and gun-room lobby","present":["Delphine Carrow"],"event":"Mrs Carrow comes down the back stairs with a candle, takes Captain Marwood's trench coat and tweed cap from the lobby pegs, puts them on, blows out the candle and goes on down to the basement unseen.","witnesses":[]},{"time":"23:00","place":"basement passage and lamp room","present":["Edwin Pethick","Delphine Carrow"],"event":"Pethick, coming out of the servants' hall, sees fifteen yards off under the passage lamp a figure in the Captain's coat and cap, back turned, go into the cellar passage, and takes it for Captain Guy; Mrs Carrow slips into the lime-washed lamp room opposite the cellar door and waits in the dark.","witnesses":["Edwin Pethick"]},{"time":"23:02","place":"hall, pantry and back landing","present":["Guy Marwood","Sid Mullins","Verity Marwood"],"event":"Captain Marwood, alone in the hall, books a trunk call to Mayfair 3146; the exchange rings back at 23:04 and he talks to Mrs Lavinia Pryde until 23:13, Sid Mullins the hall boy hearing his voice from the pantry; Verity, hearing the bell, slips out at 23:03 to the back-landing window seat with a novel and a cigarette.","witnesses":["Sid Mullins","Verity Marwood"]},{"time":"23:05","place":"study, back stairs, cellar passage and billiard room","present":["Sir Lionel Marwood","Delphine Carrow","Edwin Pethick"],"event":"Sir Lionel leaves the study with his chamber candle, goes down the back stairs and along the cellar passage, unlocks the cellar door with the key on his chain and starts down the fourteen steps; Pethick carries the tray into the billiard room.","witnesses":["Stanley Carrow","Major Rendell"]},{"time":"23:08","place":"cellar steps and cellar","present":["Delphine Carrow","Sir Lionel Marwood"],"event":"Mrs Carrow comes out of the lamp room, follows him down soft-footed and shoves him between the shoulders on the seventh step; he goes headlong onto the flags and dies within a minute, Sid Mullins in the pantry taking the thump for the garden door in the wind; by match-light she takes a bottle of the '96 from the bin at the stair-foot, breaks it on the fourth step beside his right hand so the port sprays over his back, pockets the spent matches and goes up at 23:12, leaving the cellar door open.","witnesses":["Sid Mullins"]},{"time":"23:14","place":"gun-room lobby, back stairs and first-floor landing","present":["Delphine Carrow","Verity Marwood","Guy Marwood"],"event":"She hangs the coat and cap back on their peg, goes up the back stairs and at 23:17 crosses the first-floor landing to her room, hair half down, not seeing Verity in the curtained window seat, who smells cold cellar air and wine as she passes; Guy goes up to bed at 23:20 and Verity creeps back to bed at 23:25.","witnesses":["Verity Marwood"]},{"time":"23:30","place":"ground floor and billiard room","present":["Edwin Pethick","Delphine Carrow"],"event":"Pethick makes his lock-up round, sees the Captain's coat and cap on their peg, and sits in his pantry waiting for Sir Lionel's bell; Mr Carrow and Major Rendell finish at billiards at 23:45 and go up, Mr Carrow finding his wife apparently asleep.","witnesses":["Stanley Carrow","Major Rendell"]},{"time":"23:50","place":"study and cellar","present":["Edwin Pethick"],"event":"The bell not having rung, Pethick finds the study empty, goes down to the cellar passage, finds the cellar door open, calls, and at 23:52 goes down with the passage lamp and finds Sir Lionel face down at the foot of the steps among broken glass and port.","witnesses":[]},{"time":"00:00","place":"hall","present":["Edwin Pethick","Guy Marwood","Delphine Carrow","Verity Marwood"],"event":"Pethick wakes Captain Marwood, who says nothing is to be moved, and telephones Dr Lennard at 00:06 and the Warminster police at 00:09; the household gathers in the hall; Dr Lennard arrives at 00:35 and will not call it a fall, and PC Dyer bicycles up at 00:55.","witnesses":["Edwin Pethick"]}],"evidence":[{"id":"ev1","name":"Broken bottle of the '96 port","where":"the fourth step from the bottom, beside Sir Lionel's right hand","detail":"A bottle from the Cockburn '96 bin at the stair-foot, smashed on the step edge, the neck whole and clean; port pooled on the lower steps and sprayed over the back of Sir Lionel's dinner jacket; a clean oblong in the dust of the bin where it was lifted. His candle-stick lies above him on the sixth step.","proves":"Taken from the bin and broken beside a man already lying there: a man carrying wine up does not get it over his back, and this one, candle in hand, never reached the bins.","atScene":true},{"id":"ev2","name":"The lamp room","where":"the lime-washed closet opposite the cellar door","detail":"Door ajar; flakes of fresh lime-wash on the floor and a rubbed patch at shoulder height by the door, which Hetty Voss dusted and swept on Friday; over the paraffin, a faint smell of scent.","proves":"Someone stood waiting in the dark closet opposite the cellar door that night, rubbing lime-wash onto a shoulder; someone who wore scent.","atScene":true},{"id":"ev3","name":"Captain Marwood's trench coat and cap","where":"the gun-room lobby pegs at the foot of the back stairs","detail":"A Burberry trench coat and tweed cap, hung there since Friday's shoot: lime-wash on the right shoulder and sleeve, port spots on the hem, two spent Bryant & May matches in the right pocket, though the Captain uses a petrol lighter and the footman emptied the pockets on Friday.","proves":"Worn into the lamp room and the cellar that night by someone who struck matches: the Captain's coat, but not necessarily the Captain.","atScene":false},{"id":"ev4","name":"Mrs Carrow's evening slippers","where":"outside her bedroom door, set aside uncleaned by the hall boy at 06:30","detail":"Bronze kid slippers with Louis heels, the soles and welts tacky with a dark red deposit in which oak sawdust is caught.","proves":"Their wearer stood in spilt wine on a sawdusted floor last night; there is no sawdust in the dining room or drawing room.","atScene":false},{"id":"ev5","name":"The 1909 game book and a cutting","where":"the game book on the gun-room shelf; the cutting under the lining of Mrs Carrow's dressing-case","detail":"The game book for 15 November 1909, in Sir Lionel's young hand: 'Last drive, Long Plantation. Accident to a beater boy (Hinde). My bird', the last two words scored through; the Salisbury Journal's inquest cutting ('under-keeper censured; the deceased leaves a father, mother and a sister, Dora, aged ten') has 'Not forgotten' written across it in violet ink.","proves":"Sir Lionel killed Tom Hinde fifteen years ago to the day, and Mrs Carrow carried the record of it to Brixcombe.","atScene":false}],"forensics":{"tod":"Death between 22:50 and 23:30 from a fractured skull and broken neck, consistent with a headlong fall down the fourteen steps; he lay face down, hands flung forward, so he fell going down, not climbing up with wine. A flat bruise the size of a hand between the shoulder-blades, made in life, is not explained by the fall; blood alcohol consistent with dinner wine and two glasses of port.","prints":"The candle-stick and cellar key carry Sir Lionel's prints alone and the bottle neck was handled through cloth; the inside of the lamp-room door, dusted by Hetty Voss on Friday, bears a fresh left hand at shoulder height that is Mrs Carrow's. Captain Marwood's prints are on the hall telephone and nowhere in the cellar passage.","comms":"Brixcombe exchange: at 23:02 a trunk call booked from the Court to Mayfair 3146 (Mrs L. Pryde, Curzon Street), connected 23:04, cleared 23:13, the operator knowing Captain Marwood's voice as the usual Saturday caller to that number. Otherwise only Brixcombe 4 (Dr Lennard) at 00:06 and Warminster 20 (police) at 00:09; nothing between seven and eleven.","tox":"No poison or drug in Sir Lionel's blood; alcohol consistent with dinner wine and port. The tacky deposit in the welts of Mrs Carrow's bronze kid slippers is port wine with oak sawdust in it, matching the cellar floor; the spots on the hem of the trench coat from the lobby peg are the same wine.","logs":"Pethick's register: garden and gun-room doors locked at 22:00, fast at 23:30; the pantry's duplicate cellar key never signed out, Sir Lionel's own on his chain. Staff book: Hetty Voss took milk to Mrs Carrow at 22:48 and found her still dressed; Sid Mullins heard Captain Marwood at the hall telephone from about eleven and a heavy thump below at about ten past, and set Mrs Carrow's slippers aside at 06:30, the soles tacky with red stuff and sawdust."},"redHerring":"The dark step. Sir Lionel joked at dinner that the worn eighth step would have him one day, and the body with a smashed bottle beside it made the household, and at first Dr Lennard, take it for the fall he had predicted. The police surgeon dispels it: he fell headlong going down, so he carried no wine; the port is over his back; the bruise between the shoulders is a shove.","solutionPath":["Police surgeon: Sir Lionel lay face down, hands flung forward, so he fell descending; the bottle broken on the fourth step and the port over his back mean someone staged a slip 'coming up with the wine', and the bruise between the shoulders is a shove.","Pethick saw 'the Captain' in trench coat and cap go into the cellar passage at eleven; Guy denies being below stairs or quarrelling over money, yet Pethick heard him refused £400 at the port: the heir looks guilty.","Telephone exchange log: a trunk call to Mayfair 3146 booked 23:02, connected 23:04, cleared 23:13, the operator knowing Captain Marwood's voice; Sid Mullins heard him; his prints are on the telephone and nowhere in the cellar passage. Guy is cleared, his lie hides an affair, and the coated figure wore his coat.","The trench coat on the lobby peg carries lime-wash on the right shoulder, port on the hem and two spent matches in the pocket of a man who uses a petrol lighter; the lamp room is lime-washed and smells of scent; fingerprint comparison finds Mrs Carrow's left hand inside its door.","Verity Marwood saw Mrs Carrow come up the back stairs at 23:17 in her frock with her hair down, smelling of the cellar, and Hetty Voss had left her dressed at 22:48; the analyst finds port and cellar sawdust in her slippers; her 'asleep before eleven' falls.","Motive: the 1909 game book entry 'Accident to a beater boy (Hinde). My bird'; the Vicar's 'little girl gone to the Midlands' and Mrs Carrow's questions about the family; Pethick's memory of red-haired Dora Hinde; the inquest cutting marked 'Not forgotten' in her dressing-case; her Wiltshire vowels when pressed.","Name Delphine Carrow, born Dora Hinde: for her brother Tom, shot by Sir Lionel fifteen years to the day, and her father broken by the inquest, she pushed Sir Lionel down his own cellar steps at 23:08 and dressed it as the fall he had joked about."]},"briefs":[{"name":"Delphine Carrow","part":"killer","personality":"Cool, deliberate and over-correct, her finishing-school diction learned from elocution lessons rather than a nursery; she favours 'one' and 'I am afraid' and never contracts. Pressed, she grows colder and more precise; cornered, she sends for her husband's solicitor.","voiceSample":"I had never set eyes on Sir Lionel before Friday, Inspector; one does not forget a man like that, and I should have remembered.","relationship":"She hated him with a fifteen-year patience, the more for telling her brother's story at his own table as a thing done with.","movements":[{"from":"19:30","to":"20:00","where":"her bedroom, then the drawing room","doing":"Dressed in the green frock and bronze slippers; sherry.","seenBy":["Guy Marwood","Verity Marwood"]},{"from":"20:00","to":"21:15","where":"dining room","doing":"Dined; heard Sir Lionel announce the cellar at eleven and tell the story of 1909.","seenBy":["Guy Marwood","Verity Marwood","Edwin Pethick"]},{"from":"21:15","to":"22:35","where":"drawing room","doing":"Played the piano, then asked the Vicar what became of the Hinde family.","seenBy":["Verity Marwood","Guy Marwood"]},{"from":"22:35","to":"22:56","where":"her bedroom","doing":"Went up with a headache; Hetty Voss brought milk and aspirin at 22:48 and found her still dressed.","seenBy":["Hetty Voss"]},{"from":"22:56","to":"23:08","where":"back stairs, gun-room lobby and lamp room","doing":"Took the Captain's trench coat and cap from the pegs, went down to the basement and waited in the dark lamp room, shoulder against the lime-washed wall.","seenBy":["Edwin Pethick"]},{"from":"23:08","to":"23:14","where":"cellar steps and cellar","doing":"Pushed him on the seventh step, broke a bottle beside his hand by match-light, pocketed the matches, went up.","seenBy":[]},{"from":"23:14","to":"02:00","where":"lobby, back stairs, her bedroom, then the hall","doing":"Hung the coat back, went up at 23:17, undressed and feigned sleep; her husband came up at 23:50 and she went down with him at midnight.","seenBy":["Verity Marwood","Stanley Carrow"]}],"knows":["She is Dora Hinde, born 1899 in the under-keeper's cottage here; Mr Lionel shot her brother Tom dead at the last drive on 15 November 1909, and the inquest censured her father, who was dismissed, drank and died in Salisbury infirmary in 1913; the inquest cutting, marked 'Not forgotten', lies under the lining of her dressing-case (she lived it).","She went to an aunt in Coventry in 1910, became a typist at Carrow's works, took the name Delphine with elocution lessons and married Stanley Carrow in 1921; he believes her a Reading solicitor's daughter (she did it).","On Friday afternoon she walked alone to Brixcombe churchyard and laid chrysanthemums on Tom's grave (she did it).","At dinner Sir Lionel said he would go down to the cellar at eleven 'as usual' and had nobody follow him there (she heard it).","She knows the house's back ways from childhood: the back stairs, the cellar passage the servants called the Dark Walk, the lamp room opposite the cellar door (she remembers it).","She took the Captain's coat and cap at 22:56, waited in the lamp room from 23:00, pushed Sir Lionel on the seventh step at 23:08, broke a bottle of the '96 beside him so the port sprayed his back, pocketed the two spent matches in the coat, touched the lamp-room door bare-handed and hung the coat back at 23:14 (she did it).","Hetty Voss saw her still dressed at 22:48; her husband came to bed at about ten to twelve and found her apparently asleep; she met no one on the back stairs either way (she knows it)."],"doesNotKnow":["That Pethick saw the coated figure at 23:00 and took it for the Captain.","That Verity was in the window seat on the back landing at 23:17 and saw her face.","That Sid Mullins heard the thump, or that the hall boy set her slippers aside.","That Pethick was footman here in 1909 and remembers the Hinde children; where Captain Marwood was between 22:35 and 23:20."],"secret":"She is Dora Hinde of the keeper's cottage and killed Sir Lionel for her brother and her father; her husband knows neither.","lies":[{"claim":"I undressed as soon as the maid had gone, took my aspirin and was asleep before eleven; I knew nothing until my husband came up.","truth":"She went down the back stairs at 22:56, killed Sir Lionel at 23:08 and was back in her room at 23:18.","when":"Asked about her movements after she went up.","crack":"Verity's sighting of her on the back stairs at 23:17 with her hair down, her left hand's prints inside the lamp-room door, or the analyst's port and sawdust on her slippers."},{"claim":"I had never set eyes on Brixcombe or Sir Lionel until Friday. I was brought up at Reading; my father was a solicitor there.","truth":"She was born Dora Hinde in the keeper's cottage on this estate; Sir Lionel shot her brother in 1909.","when":"Asked about her background, the Hinde story or her walk to the village.","crack":"The inquest cutting from her dressing-case, or Pethick's red-haired Dora Hinde set beside the Vicar's 'little girl gone to the Midlands', or her own Wiltshire slip about 'the Dark Walk'."},{"claim":"I did not go near the cellar or the lobby and would not know the Captain's coat from any other; if there is wine on my shoes the footman was clumsy with the port.","truth":"She wore the coat into the lamp room and the cellar and stood in the spilt '96 at the stair-foot.","when":"Asked about the coat, the lamp room or her slippers.","crack":"The analyst's oak sawdust in the wine on her slippers, or Pethick's sighting of the coat while the exchange log puts Captain Marwood at the telephone."}],"honestMistake":null,"tells":["Goes very still and watches the Inspector's mouth before answering.","A Wiltshire vowel slips out when she is angry ('I were', 'that there') and she corrects it a beat late."],"pressure":{"baseline":15,"breakPoint":75,"lawyerPoint":90,"style":"lawyer"},"opening":"Inspector. My husband has asked me to help you in any way I can, and of course I shall; though I am afraid I slept through the whole dreadful thing."},{"name":"Guy Marwood","part":"liar","personality":"Clipped cavalry drawl, bored and faintly insolent ('my dear chap', 'rather'), used to being disliked by his seniors and liked by women. He lies with a straight face, loses his temper when the lie is caught, swears at the Inspector and then apologises stiffly.","voiceSample":"Did I use the telephone? My dear chap, who should I be ringing up at eleven o'clock at night?","relationship":"He loved his father and was bored by him; the old man paid his debts once, in 1922, and never let him forget it.","movements":[{"from":"19:30","to":"20:00","where":"his bedroom, then the drawing room","doing":"Dressed; sherry.","seenBy":["Delphine Carrow","Verity Marwood"]},{"from":"20:00","to":"21:50","where":"dining room","doing":"Dined, heard the 1909 story, and over the port asked his father for £400 and was refused.","seenBy":["Edwin Pethick","Delphine Carrow","Verity Marwood"]},{"from":"21:50","to":"22:35","where":"drawing room","doing":"Smoked and watched the bridge; saw the Vicar off at 22:15 from the door.","seenBy":["Delphine Carrow","Verity Marwood"]},{"from":"22:35","to":"23:02","where":"drawing room","doing":"Sat alone with the whisky waiting for the house to settle.","seenBy":[]},{"from":"23:02","to":"23:13","where":"hall telephone","doing":"Booked a trunk call to Mayfair 3146 and talked to Mrs Pryde with the doors shut.","seenBy":["Sid Mullins"]},{"from":"23:13","to":"23:58","where":"main stairs and his bedroom","doing":"Went up at 23:20 and slept until Pethick woke him.","seenBy":[]},{"from":"23:58","to":"02:00","where":"cellar passage and hall","doing":"Saw his father at the stair-foot, ordered nothing moved, sat with the household until the police came.","seenBy":["Edwin Pethick","Delphine Carrow","Verity Marwood"]}],"knows":["At dinner his father said he would go down at eleven as usual and joked about the dark step (he heard it).","Over the port he asked his father for £400 for Pellow, the Salisbury bookmaker, and was told 'not another penny while I live', with Pethick in the room bringing the cigars (he did it).","Mrs Carrow went white at dinner when the Hinde story was told; he put it down to the pheasant (he saw it).","He sat alone in the drawing room from 22:35 to 23:02 and heard nobody on the main stairs or in the hall (he was there).","He booked the trunk call at 23:02 and spoke to Mrs Lavinia Pryde until 23:13; the hall was empty and the doors shut (he did it).","His trench coat and cap have hung on the lobby pegs since Friday; he lights his pipe with a wartime petrol lighter and never carries matches, and the footman emptied the pockets on Friday (he knows it).","At 23:58 he saw his father face down at the stair-foot with port over his back and broken glass on the fourth step, and told Pethick nothing was to be touched (he saw it)."],"doesNotKnow":["Who killed his father, or how the fall was arranged.","That Pethick saw someone in his coat go to the cellar passage at 23:00.","That Mrs Carrow is Dora Hinde, or that she left her room.","Anything that happened in the basement between 22:50 and 23:20; that Verity was on the back landing."],"secret":"He is the lover of Mrs Lavinia Pryde, his colonel's wife, and telephones her from Brixcombe on Saturday nights at eleven when the Colonel is at his club; exposure means resigning his commission and the divorce court.","lies":[{"claim":"I went up at half past ten, read a bit and slept. I didn't go below stairs and I didn't use the telephone; if the exchange has a call at eleven, Carrow was for ever ringing his works.","truth":"He sat alone in the drawing room until 23:02, telephoned Mrs Pryde from the hall until 23:13, and went up at 23:20.","when":"Asked where he was after the party broke up, or about the telephone.","crack":"The exchange log of the Mayfair call, the operator knowing his voice, Sid Mullins having heard him at the telephone, or his prints on the receiver."},{"claim":"Father and I had no quarrel. We talked shooting over the port and he and Carrow argued farms; there was nothing between him and me.","truth":"He asked his father for £400 for his bookmaker and was refused with 'not another penny while I live'.","when":"Asked about the port, money, debts or his father's temper.","crack":"Pethick's account of what he heard bringing in the cigars, or the bookmaker's name, Pellow, put to him."}],"honestMistake":null,"tells":["Fills his pipe and does not light it.","Answers a question with a question when the answer would be untrue."],"pressure":{"baseline":25,"breakPoint":60,"lawyerPoint":85,"style":"anger"},"opening":"Look, Inspector, I've seen men dead before and I'd rather we got on with it. What do you want to know?"},{"name":"Edwin Pethick","part":"mistaken","personality":"Measured, deferential and exact, forty years of 'very good, sir' over flattened Wiltshire; he gives times to the minute and distances in yards. Doubted, he goes quiet and formal and repeats that he has said what he saw.","voiceSample":"Sir Lionel did not care to be followed into his cellar, sir; it was the one thing in this house he did with his own hands.","relationship":"Twenty-six years' service and a real, unspoken fondness; a careless man, he thought, and a kind master.","movements":[{"from":"19:30","to":"21:50","where":"dining room","doing":"Laid the table, served dinner and the port.","seenBy":["Delphine Carrow","Guy Marwood","Verity Marwood"]},{"from":"21:50","to":"22:15","where":"pantry and hall","doing":"Took coffee through, then lit the Vicar out to his bicycle.","seenBy":["Guy Marwood"]},{"from":"22:15","to":"22:50","where":"pantry","doing":"Rang through to Hetty Voss at 22:35 for Mrs Carrow's milk; set the billiard-room tray.","seenBy":["Sid Mullins"]},{"from":"22:50","to":"23:03","where":"servants' hall, basement passage and kitchen stair","doing":"Sent the staff to bed and locked the area door; coming out at 23:00 saw a figure in the Captain's coat and cap go into the cellar passage, then went up for the tray.","seenBy":["Hetty Voss"]},{"from":"23:03","to":"23:12","where":"billiard room","doing":"Took in the whisky and siphons and marked for Mr Carrow and the Major.","seenBy":["Stanley Carrow","Major Rendell"]},{"from":"23:12","to":"23:50","where":"pantry and ground floor","doing":"Lock-up round at 23:30, the Captain's coat and cap on their peg; then waited for Sir Lionel's bell.","seenBy":[]},{"from":"23:50","to":"02:00","where":"study, cellar, hall","doing":"Found the study empty, found Sir Lionel at 23:52, woke the Captain and telephoned the doctor and the police.","seenBy":["Guy Marwood","Delphine Carrow","Verity Marwood"]}],"knows":["Footman here in 1909, he remembers the last drive of 15 November when Mr Lionel shot the beater boy Tom Hinde, the inquest at the Brixcombe Arms, Jack Hinde turned off without a character, and a red-haired little maid, Dora, at the kitchen door (he lived it).","Sir Lionel went down to his cellar at eleven every night of a party, alone, with his chamber candle and the key on his chain, and nobody was to follow him; the duplicate key in his pantry was not signed out (he knows it).","At the port Captain Guy asked Sir Lionel for £400 for his Salisbury bookmaker and was told 'not another penny while I live' (he heard it bringing the cigars).","At 23:00, coming out of the servants' hall, he saw fifteen yards off under the passage lamp a figure in the Captain's trench coat and tweed cap, back turned, go into the cellar passage (he saw it).","From 23:03 to 23:12 he was in the billiard room with Mr Carrow and Major Rendell, who were still playing when he left; on his 23:30 round the doors were fast and the Captain's coat and cap hung on their peg (he was there).","At 23:52 he found Sir Lionel face down at the stair-foot, head toward the cellar, port over his back, the broken bottle on the fourth step from the bottom, the candle-stick on the sixth from the top, the cellar key on his chain (he saw it).","Mrs Carrow has a look of the Hindes about the eyes, which he had put down to fancy (he noticed it)."],"doesNotKnow":["Who pushed Sir Lionel, or that the fall was staged.","That the figure in the coat was Mrs Carrow.","That Captain Guy was at the hall telephone from 23:02 to 23:13.","That Verity was on the back landing after she was sent to bed."],"secret":null,"lies":[],"honestMistake":{"claim":"It was Captain Guy I saw go along to the cellar passage at eleven, sir, in his trench coat and his cap; I know the Captain's back as well as my own hand.","truth":"It was Mrs Carrow wearing the Captain's coat and cap from the lobby pegs; the Captain was in the drawing room and then at the hall telephone.","why":"A back view at fifteen yards under one passage lamp, the Captain's own coat and cap, and Mrs Carrow within two inches of the Captain's height."},"tells":["Puts his trembling left hand behind his back.","Says 'Sir Lionel is' and corrects it to 'was'."],"pressure":{"baseline":20,"breakPoint":70,"lawyerPoint":92,"style":"shutdown"},"opening":"Good morning, sir. Six and twenty years I have been in this house, and I never thought to see such a night. Ask what you will, sir."},{"name":"Verity Marwood","part":"honest","personality":"Quick, candid and schoolgirl-slangy ('frightfully', 'honestly', 'a swizz'), proud of noticing things and ashamed of crying; she calls her father Daddy and her brother 'Guy, the idiot'. Frightened or scolded she dissolves, then tells the truth.","voiceSample":"She came up the back stairs at seventeen minutes past, I looked at my watch, and she smelt exactly like the cellar does when Daddy comes up: cold and winey.","relationship":"She adored her father and fought him about school, Oxford and cigarettes; he called her 'the Terror' and let her dine down last night as a treat.","movements":[{"from":"19:30","to":"20:00","where":"her bedroom","doing":"Dressed for her first grown-up dinner.","seenBy":["Lady Marwood"]},{"from":"20:00","to":"21:15","where":"dining room","doing":"Dined; watched Mrs Carrow go white at the Hinde story.","seenBy":["Delphine Carrow","Guy Marwood","Edwin Pethick"]},{"from":"21:15","to":"22:35","where":"drawing room","doing":"Turned pages at the piano and sat near Mrs Carrow and the Vicar.","seenBy":["Delphine Carrow","Guy Marwood"]},{"from":"22:35","to":"23:03","where":"her bedroom","doing":"Sent up by Mother; read 'The Green Hat' in bed and listened for the house to settle.","seenBy":[]},{"from":"23:03","to":"23:25","where":"back-landing window seat, first floor","doing":"Sat behind the curtain with her novel and a Gold Flake, candle out; saw Mrs Carrow come up at 23:17.","seenBy":[]},{"from":"23:25","to":"00:00","where":"her bedroom","doing":"Crept back to bed and lay awake until Pethick's voice on the stairs.","seenBy":[]},{"from":"00:00","to":"02:00","where":"hall","doing":"Sat in Mother's wrap with the household.","seenBy":["Delphine Carrow","Guy Marwood","Edwin Pethick"]}],"knows":["At dinner Daddy said he would go down at eleven as usual and made the dark-step joke (she heard it).","The Vicar mentioned fresh chrysanthemums on the Hinde boy's grave, Daddy told the 1909 story, and Mrs Carrow put down her fork and went as white as the cloth (she saw it).","In the drawing room Mrs Carrow asked the Vicar what became of the family; he said the father died in Salisbury infirmary, the mother in 1916, and a little girl went to relations in the Midlands (she heard it).","On Friday afternoon Mrs Carrow walked down the lane to the village alone in the sleet and came back with wet shoes, saying she had looked at the church (she saw it).","Mother sent her up at 22:35; at about five past eleven by her wrist-watch she heard the hall telephone bell, and at 23:03 she slipped out to the back-landing window seat (she did it).","At 23:17 Mrs Carrow came up the back stairs from below in her green frock, no coat, hair half down, hurrying to her room, smelling of cold cellar air and wine; she did not see Verity behind the curtain, and nobody else used the back stairs between 23:03 and 23:25 (she saw it).","Guy lights his pipe with a petrol lighter from the war and never has matches on him; his trench coat and cap have hung on the lobby pegs since Friday (she knows it)."],"doesNotKnow":["Who killed her father, or how the fall was arranged.","That Pethick saw a figure in Guy's coat go to the cellar passage.","Where Guy was between 22:35 and 23:20, beyond the telephone bell.","Who Mrs Carrow really is, or what happened in the basement."],"secret":"Her small shame: she was smoking Gold Flake and reading 'The Green Hat' on the back landing after being sent to bed, which Mother would call a betrayal on such a night.","lies":[],"honestMistake":null,"tells":["Bites a thumbnail.","Says 'honestly' twice when she is embarrassed."],"pressure":{"baseline":30,"breakPoint":58,"lawyerPoint":82,"style":"tears"},"opening":"I suppose you know I'm only seventeen and oughtn't to be smoking. Daddy's dead and everyone's being frightfully kind, which is worse. Ask me things."}],"id":"country_house_3"}],"noir_docks":[{"settingId":"noir_docks","truth":{"title":"Ebb Tide at Berth 54","house":"The San Pedro waterfront: Berths 54 and 55 on the main channel behind Gate 3, the Anchor Bar on Beacon Street three hundred yards up the hill, and the longshore union hall on Sixth Street with half its neon sign dark.","victim":{"name":"Mike Radovich","age":38,"role":"longshoreman on a day gang, member of the local","sketch":"A big, loud, well-liked hold man from a San Pedro Croatian fishing family, with a bad knee and a sick boy whose doctor bills had him borrowing from everybody. In the last week he had been flashing money and telling people his luck had turned."},"night":{"start":"21:00","end":"04:00","discovered":"02:50","discoveredBy":"Gus Lindqvist","where":"the water under Berth 55, in the stern lines of the freighter Mariposa Bay"},"weather":"Friday 21 February 1947: dense fog off the channel from dusk, visibility under fifty yards, foghorns every half minute, 52 degrees and dead calm.","publicFacts":["Mike Radovich was pulled out of the water under Berth 55 a little before three in the morning, tangled in the stern lines of the freighter Mariposa Bay.","Gus Lindqvist, the Pacific Coastwise night watchman at Gate 3, found him and called Harbor Division from the gate phone.","Mike spent the evening drinking at the Anchor Bar on Beacon Street, which never closes.","Fog lay on the channel all night; the night gang loading the Mariposa Bay at Berth 55 say they saw and heard nothing over the winches.","The local votes Monday, and Vince Corrigan, the business agent, is standing again.","Mike leaves a wife, Rosa, and two kids in a room at Mrs. Ferrante's boarding house on 14th Street.","The word on the waterfront is that a drunk fell off the pier."],"suspects":[{"name":"Vince Corrigan","age":46,"role":"business agent of the longshore local, up for re-election Monday","sketch":"Barrel-chested and silver at the temples in a good gray suit with a union button in the lapel; he shakes hands like he's counting votes. There is a fresh scrape across the back of his right hand and he keeps it in his pocket.","part":"killer"},{"name":"Rosa Radovich","age":33,"role":"Mike's wife","sketch":"A small, dark, tired woman in her good coat over a house dress, red-eyed but not crying. She keeps looking at the clock on the wall.","part":"liar"},{"name":"Dee Mahan","age":41,"role":"owner and night bartender of the Anchor Bar, where Mike drank","sketch":"Bottle-blonde and sharp-eyed, sleeves rolled, a pencil behind her ear and a voice like a cement mixer. She has met every kind of cop and likes none of them.","part":"mistaken"},{"name":"Gus Lindqvist","age":62,"role":"night watchman for Pacific Coastwise Stevedoring at Gate 3","sketch":"A stooped old Swede in a pea coat and watch cap with a lantern jaw and a smell of muscatel he hopes you won't notice. Forty years at sea and on the docks; he uses as few words as he can.","part":"honest"}],"killer":"Vince Corrigan","accomplice":null,"motive":"During the October 1946 strike Corrigan took $500 from Pacific Coastwise Stevedoring to steer the local toward a settlement, and Mike got hold of a carbon of the company voucher. Mike had squeezed $300 out of him and wanted $200 more on Friday night, or he would read the voucher aloud at Monday's election meeting, which would finish Corrigan on the waterfront and maybe put him in the channel.","method":"Corrigan brought a half-pint of Old Crow and met Mike, very drunk, at the dark open end of Berth 54, out of sight of the floodlit night gang at 55. At 00:40, on a running ebb, he shoved him off the end; when Mike caught the fender piling, Corrigan knelt on the stringer and prised his fingers loose until he went under, trusting the ebb to carry him out past Angels Gate and make it look like a drunk's fall.","alibiGap":{"from":"00:15","to":"01:15","killerClaims":"That he left the Anchor at 00:15 with Mike still in the booth, drove straight to the union hall to work on the election rolls, and telephoned his wife from the hall at about one.","actually":"He followed Mike through Gate 3 at 00:18, drowned him off the end of Berth 54 at 00:40, sat shaking in his parked Buick outside the Anchor, telephoned his wife from the Anchor's payphone at 01:04 and reached the hall at 01:15."},"timeline":[{"time":"21:00","place":"Gate 3","present":["Gus Lindqvist"],"event":"Gus comes on watch in the gate shack as the night gang starts loading the Mariposa Bay under floodlights at Berth 55.","witnesses":["Gus Lindqvist"]},{"time":"21:05","place":"Anchor Bar","present":["Mike Radovich","Dee Mahan"],"event":"Mike takes a stool at the bar and starts on beer with whiskey chasers, telling Dee he is coming into money.","witnesses":["Dee Mahan"]},{"time":"21:30","place":"union hall","present":["Vince Corrigan","Tony Agnello","Bert Shaw"],"event":"Corrigan works over the election rolls with two committee men until 23:30, then drives down to Beacon Street.","witnesses":["Tony Agnello","Bert Shaw"]},{"time":"21:30","place":"Mrs. Ferrante's boarding house, 14th Street","present":["Rosa Radovich"],"event":"Rosa puts the children to bed and begins packing a cardboard suitcase for the 6:40 morning bus to Fresno.","witnesses":[]},{"time":"22:30","place":"Anchor Bar","present":["Mike Radovich","Dee Mahan","Sammy Kolb"],"event":"Sammy Kolb, a bookie's runner, leans on Mike over a $180 marker, and Mike peels the cash off a roll and pays him at the bar before Sammy leaves by cab at 22:45.","witnesses":["Dee Mahan"]},{"time":"23:20","place":"end of Berth 54","present":["Gus Lindqvist"],"event":"Shortly after high water at 23:12, Gus punches the watch-clock station at the empty end of Berth 54 and goes back to sit in the dark gate shack with a pint of muscatel.","witnesses":["Gus Lindqvist"]},{"time":"23:50","place":"Anchor Bar","present":["Vince Corrigan","Mike Radovich","Dee Mahan"],"event":"Corrigan parks his Buick at the curb and joins Mike in the back booth, and Dee, serving two beers, hears Mike say 'Friday's price, Vince, or I read it out Monday.'","witnesses":["Dee Mahan"]},{"time":"00:10","place":"Anchor Bar","present":["Mike Radovich","Vince Corrigan","Dee Mahan"],"event":"Just after the midnight news Mike cracks wise about Truman and walks out alone toward the waterfront.","witnesses":["Dee Mahan","Vince Corrigan"]},{"time":"00:12","place":"Gate 3","present":["Mike Radovich","Gus Lindqvist"],"event":"Gus, in the dark shack, sees Mike pass unsteadily under the gate lamp and out onto the pier toward Berth 54.","witnesses":["Gus Lindqvist"]},{"time":"00:15","place":"Anchor Bar","present":["Vince Corrigan","Dee Mahan"],"event":"Corrigan pays, announces 'Quarter past twelve, Dee, I've got the rolls to finish,' and leaves on foot, leaving the Buick at the curb.","witnesses":["Dee Mahan"]},{"time":"00:18","place":"Gate 3","present":["Vince Corrigan","Gus Lindqvist"],"event":"Gus sees Corrigan, hat brim down, pass under the lamp and out onto the pier without a glance at the dark shack.","witnesses":["Gus Lindqvist"]},{"time":"00:24","place":"Mrs. Ferrante's boarding house","present":["Rosa Radovich"],"event":"Rosa places a collect call from the hall telephone to her sister Ana in Fresno and talks until 00:49 while Mrs. Ferrante bangs on the wall.","witnesses":["Mrs. Ferrante"]},{"time":"00:40","place":"end of Berth 54","present":["Vince Corrigan","Mike Radovich"],"event":"With the Old Crow nearly gone, Corrigan shoves Mike off the open end, kneels to prise his fingers off the fender pile, and Mike goes under on the ebb, his watch stopping at 00:41.","witnesses":[]},{"time":"00:44","place":"Gate 3","present":["Vince Corrigan","Gus Lindqvist"],"event":"Gus sees Corrigan come back off the pier alone and fast, hat in his hand, his trouser knees dark and wet.","witnesses":["Gus Lindqvist"]},{"time":"00:50","place":"Beacon Street, outside the Anchor","present":["Dee Mahan","Vince Corrigan"],"event":"Dee, carrying empties to the alley, notices Corrigan's Buick still at the curb, not seeing him sitting in the dark inside it wiping his hands.","witnesses":["Dee Mahan"]},{"time":"01:04","place":"payphone outside the Anchor","present":["Vince Corrigan","Dee Mahan"],"event":"Corrigan calls his wife in Long Beach to say he is at the hall and will be late, Dee glimpsing him at the phone through the fogged window, and drives off at 01:08.","witnesses":["Dee Mahan"]},{"time":"01:15","place":"union hall","present":["Vince Corrigan"],"event":"Corrigan lets himself in, changes into the spare slacks he keeps in his office, hangs the wet trousers over the radiator and sits alone at the rolls until morning.","witnesses":[]},{"time":"02:50","place":"Berth 55","present":["Gus Lindqvist"],"event":"Gus, back on his rounds since 02:45, finds Mike in the stern lines of the Mariposa Bay and phones Harbor Division at 02:58; patrolmen arrive at 03:10, question Dee at the Anchor at 03:30 and tell Rosa, sitting up dressed beside her suitcase, at 03:45.","witnesses":["Gus Lindqvist","Dee Mahan","Rosa Radovich"]}],"evidence":[{"id":"ev1","name":"Mike's wristwatch","where":"on the body","detail":"A steel Elgin, crystal fogged with seawater, stopped at 12:41.","proves":"Mike was most likely in the water by about 00:41.","atScene":true},{"id":"ev2","name":"Old Crow half-pint","where":"on the stringer at the open end of Berth 54","detail":"A flat half-pint bottle with the cap missing and an inch of whiskey left, beaded with fog.","proves":"Someone drank at the dark end of 54 that night; Mike was not necessarily alone there.","atScene":true},{"id":"ev3","name":"Scraped fender pile","where":"outer fender pile at the end of Berth 54","detail":"Fresh scratches through the creosote and weed just below the stringer, with a torn fingernail lodged in one, and scuff marks on the stringer edge above.","proves":"A man clung to the pile after going in, and someone stood or knelt at the edge above him.","atScene":true},{"id":"ev4","name":"Corrigan's gray trousers","where":"over the radiator in Corrigan's office at the union hall","detail":"Gray worsted suit trousers, the knees salt-stiff and smeared black with creosote and fuel oil.","proves":"Their owner knelt on wet, creosoted timber that night, not the sort of thing found in a union office.","atScene":false},{"id":"ev5","name":"Voucher carbon","where":"pinned inside the lining of Mike's Sunday jacket at the boarding house","detail":"A carbon copy of a Pacific Coastwise Stevedoring voucher: 'Consulting services, V. Corrigan, $500, Oct. 14 1946', initialed by the company's labor-relations man.","proves":"Mike held paper showing the business agent was paid by the company during the strike.","atScene":false},{"id":"ev6","name":"Rosa's packed suitcase","where":"Rosa's room at Mrs. Ferrante's","detail":"A cardboard suitcase packed with her clothes and the children's, a Greyhound timetable with the 6:40 to Fresno circled, and $120 in small bills in her purse.","proves":"Rosa meant to leave town at dawn, with money she has not explained.","atScene":false}],"forensics":{"tod":"Drowned: froth in the airway and waterlogged lungs mean he was alive when he went in, with a bruise on the right temple and three torn fingernails with creosote under them from a piling. Rigor and the 56-degree water put death between 00:20 and 01:10.","prints":"The Old Crow half-pint from the end of Berth 54 carries Mike Radovich's prints and the right thumb and two fingers of Vincent Corrigan. Neither Rosa Radovich nor August Lindqvist left prints on it.","comms":"Two toll tickets: a collect call accepted in Fresno from the hall telephone of Mrs. Ferrante's boarding house, 00:24 to 00:49, and a call from the payphone outside the Anchor Bar to Long Beach 6-3317, the Corrigan residence, 01:04 to 01:06. No toll call went out from the union hall's line after 21:00.","tox":"Blood alcohol 0.19 per cent, very drunk, with no drug or poison, and the Old Crow dregs are plain bonded whiskey. No bullet, powder burn or knife wound anywhere on the body.","logs":"High water 23:12, with the ebb running toward Angels Gate from about 23:40; a man going in off the end of Berth 54 near 00:40 would be carried along the pier face into the stern lines of the Mariposa Bay, where he was found. No vessel or launch moved in the main channel between 22:00 and 03:30, and the watch-clock tape shows Berth 54 punched at 23:20 and not again until 02:45."},"redHerring":"Sammy Kolb, a bookie's runner, leaned on Mike in the Anchor at 22:30 over a $180 marker, which looks like a gambling hit. Dee watched Mike pay him in full and Sammy leave by cab at 22:45, Gus saw nobody but Mike and Corrigan come through Gate 3, and the coroner and ballistics find no bullet or knife.","solutionPath":["Coroner: Mike drowned alive between 00:20 and 01:10; his watch stopped at 00:41, and the tide tables show a body off the end of Berth 54 at that hour would fetch up in the Mariposa Bay's stern lines.","Dee's 'Mike left after the twelve-thirty news' is corrected by Gus (Mike through Gate 3 at 00:12) and the stopped watch; Mike left before Corrigan, not after, which breaks Corrigan's 'Mike was still in the booth'.","Gus saw Corrigan follow Mike onto the pier at 00:18 and come back alone at 00:44 with wet knees; Corrigan's trousers at the hall have creosote on the knees to match the scraped fender pile.","Fingerprints put Corrigan's hand on the Old Crow bottle at the end of Berth 54, breaking 'I never set foot on the pier'.","The toll tickets show his 'call from the hall' came from the Anchor payphone at 01:04, which Dee saw; she also saw his Buick still at the curb at 00:50, breaking 'I drove straight to the hall'.","Motive: Rosa says Mike was collecting $200 from Vince that night, Dee heard 'or I read it out Monday', and the voucher carbon in Mike's Sunday jacket shows Corrigan on the company payroll before Monday's election.","Rosa is cleared by her Fresno call 00:24 to 00:49; her lie only hides that she was leaving Mike with $120 from his coffee can. Name Vince Corrigan: blackmail, drowned off Berth 54 on the ebb."]},"briefs":[{"name":"Vince Corrigan","part":"killer","personality":"Big, warm and loud, a backslapper who calls every man 'brother' and every cop 'pal', with the union-hall habit of answering a question with a speech. Pushed, the warmth goes out of him in an instant and he gets loud and ugly, jabbing a finger.","voiceSample":"Brother, I been carrying this waterfront on my back since '34; you think I'd hurt one of my own men?","relationship":"He liked Mike once; by the end he was terrified of him and hated the grin he wore while he squeezed.","movements":[{"from":"21:00","to":"23:30","where":"union hall","doing":"Worked on the election rolls with Tony Agnello and Bert Shaw.","seenBy":["Tony Agnello","Bert Shaw"]},{"from":"23:30","to":"23:50","where":"his Buick, Sixth Street to Beacon Street","doing":"Drove down and parked outside the Anchor with a half-pint of Old Crow in his coat.","seenBy":[]},{"from":"23:50","to":"00:15","where":"Anchor Bar, back booth","doing":"Argued with Mike over the $200; Mike walked out at 00:10 and he followed five minutes later.","seenBy":["Dee Mahan","Mike Radovich"]},{"from":"00:15","to":"00:44","where":"Gate 3 and the end of Berth 54","doing":"Drank with Mike, shoved him in at 00:40 and prised his fingers off the pile.","seenBy":["Gus Lindqvist","Mike Radovich"]},{"from":"00:44","to":"01:04","where":"his parked Buick outside the Anchor","doing":"Sat in the dark wiping his hands with a rag.","seenBy":[]},{"from":"01:04","to":"01:08","where":"payphone outside the Anchor","doing":"Called his wife Marge and told her he was at the hall.","seenBy":["Dee Mahan"]},{"from":"01:15","to":"04:00","where":"union hall, alone","doing":"Changed into spare slacks, hung the wet trousers on the radiator and sat over the rolls.","seenBy":[]}],"knows":["Mike had a carbon of the Pacific Coastwise voucher paying him $500 in October 1946, and showed it to him a week ago (he saw it).","He paid Mike $300 last Friday and was to pay $200 more tonight, or Mike would read the voucher out Monday (he did it).","Mike walked out of the Anchor at about 00:10, before him; he followed at 00:15 after loudly telling Dee the time (he did it).","Mike told him in the booth that he had paid off Sammy Kolb that evening (he heard it).","At about 00:40 he shoved Mike off the end of Berth 54 and knelt on the stringer to prise his fingers off the fender pile; his knees got soaked with oily water and creosote and the pile scraped his hand (he did it).","He set the Old Crow bottle down on the stringer in the dark and could not find it afterwards (he did it).","He called Marge from the payphone outside the Anchor at about 01:04 and said he was at the hall (he did it).","At the hall he changed into spare slacks and hung the wet trousers over the radiator, meaning to take them to the cleaner's (he did it).","Dee was behind the bar the whole time he was in the Anchor (he saw it)."],"doesNotKnow":["That Gus Lindqvist was sitting in the dark gate shack and saw him go onto the pier and come back.","That Mike's watch stopped at 00:41.","That the phone company tickets toll calls from payphones.","That Dee noticed his Buick at 00:50 or saw him at the payphone.","That Rosa was leaving Mike, or where she was that night."],"secret":"He took company money during the strike, Mike was blackmailing him over it, and he drowned Mike to stop him.","lies":[{"claim":"Mike was still sitting in the booth when I left at a quarter past twelve. I went straight to the hall.","truth":"Mike left at 00:10 and Corrigan followed him onto the pier.","when":"Asked when he last saw Mike or where he went after the Anchor.","crack":"Gus Lindqvist's sighting of Mike through Gate 3 at 00:12 and Corrigan at 00:18, or Mike's watch stopped at 00:41."},{"claim":"I haven't set foot on that pier in a month, pal.","truth":"He was at the end of Berth 54 from about 00:20 to 00:42.","when":"Asked whether he went down to the berths.","crack":"His prints on the Old Crow half-pint from the end of Berth 54, or the creosote on his trouser knees matching the scraped fender pile."},{"claim":"I called Marge from the hall around one, told her I'd be late. Ask her.","truth":"He called from the payphone outside the Anchor at 01:04 and reached the hall at 01:15.","when":"Asked to account for himself between midnight and two.","crack":"The toll ticket from the Anchor payphone at 01:04 and no call from the hall line, or Dee seeing him at the payphone and his Buick still at the curb at 00:50."},{"claim":"Mike? Mike was a pal. He wanted a loan for the kid's doctor, I said I'd see what the welfare fund could do.","truth":"Mike was blackmailing him with the voucher carbon.","when":"Asked what he and Mike talked about.","crack":"The voucher carbon in Mike's Sunday jacket, Rosa's account of the $200, or Dee overhearing 'or I read it out Monday'."}],"honestMistake":null,"tells":["Calls the detective 'pal' more and more often.","Shoves his scraped right hand into his pocket."],"pressure":{"baseline":20,"breakPoint":70,"lawyerPoint":88,"style":"anger"},"opening":"Let's make this quick, pal. I got a membership in mourning and an election Monday, and Mike Radovich was a brother of mine."},{"name":"Rosa Radovich","part":"liar","personality":"Quiet, proud and stubborn, she speaks plainly with the odd Croatian word ('Bože moj') and comes back to her children every other sentence. Cornered, she cries, then gets angry at herself for crying.","voiceSample":"I got two kids asleep in one room and a husband in the morgue, mister, so ask what you want and let me go home.","relationship":"She loved Mike and was worn out by him: the drinking, the debts, and lately money she knew came from somewhere bad. She had decided to leave him and now feels as if deciding killed him.","movements":[{"from":"21:00","to":"00:24","where":"her room at Mrs. Ferrante's","doing":"Put the children to bed and packed a suitcase.","seenBy":[]},{"from":"00:24","to":"00:49","where":"the boarding-house hall telephone","doing":"Talked to her sister Ana in Fresno on a collect call.","seenBy":["Mrs. Ferrante"]},{"from":"00:49","to":"03:45","where":"her room","doing":"Sat up dressed beside the suitcase, waiting for Mike or for morning.","seenBy":[]},{"from":"03:45","to":"04:00","where":"the boarding-house front hall","doing":"Was told by two patrolmen that Mike had been pulled out of the water.","seenBy":["Mrs. Ferrante"]}],"knows":["At supper Mike said Vince Corrigan was paying him $200 at the Anchor tonight 'and regular after that' (she heard it).","Mike's 'insurance' is a carbon of a company paper with Vince Corrigan's name and $500 on it, pinned inside the lining of his Sunday jacket (she has seen it).","Mike owed Sammy Kolb $180 and said he would pay him tonight (she heard it).","Mike left for the Anchor at about 20:50 in his pea coat and she never saw him alive again (she saw it).","She called Ana in Fresno collect from the hall phone from about 00:24 to 00:49 to say she and the kids were coming on the 6:40 bus (she did it).","She took $120 Mike had hidden in the coffee can in the closet (she did it).","Mrs. Ferrante banged on the wall during the call (she heard it).","The patrolmen came at about 03:45 (she saw them)."],"doesNotKnow":["Who killed Mike, or how.","Anything that happened at the Anchor or on the waterfront that night.","That Corrigan was seen going onto the pier.","That Mike paid Sammy Kolb at the bar."],"secret":"She was leaving Mike: the suitcase packed, the 6:40 Greyhound to Fresno, and $120 taken from his coffee can, money she suspects came from Vince. She is ashamed and afraid it makes her look as though she knew he would die.","lies":[{"claim":"I was in bed by ten. I never stirred till the cops knocked.","truth":"She was on the hall telephone to Fresno from 00:24 to 00:49 and sat up dressed all night.","when":"Asked where she was during the night.","crack":"The toll ticket for the collect call from the boarding-house hall phone to Fresno, 00:24 to 00:49."},{"claim":"Me and Mike were fine. I wasn't going nowhere.","truth":"She had packed to leave him on the 6:40 bus with the children and the coffee-can money.","when":"Asked about the marriage, the suitcase or the money.","crack":"The packed suitcase with the circled Greyhound timetable and the $120 in her purse, or the Fresno call."}],"honestMistake":null,"tells":["Glances at the clock on the wall.","Smooths her coat over her knees again and again."],"pressure":{"baseline":30,"breakPoint":60,"lawyerPoint":85,"style":"tears"},"opening":"They told me at a quarter to four. I haven't slept, I haven't told the kids, so please, mister, don't waste my time."},{"name":"Dee Mahan","part":"mistaken","personality":"Brassy, quick and unsentimental; calls everybody 'honey' or 'sugar' and talks out of the side of her mouth while she polishes glasses. She has been raided and shaken down by better cops than you, and if pushed she asks whether she needs her lawyer.","voiceSample":"Honey, I pour the drinks, I don't read the minds; but Mike went out right after the twelve-thirty news, I'd put money on it.","relationship":"She liked Mike, a good tipper and a funny drunk, and worried about his wife and kids.","movements":[{"from":"21:00","to":"22:30","where":"behind the bar of the Anchor","doing":"Served Mike beer and chasers from 21:05.","seenBy":["Mike Radovich"]},{"from":"22:30","to":"22:45","where":"behind the bar","doing":"Watched Mike pay Sammy Kolb $180 and Sammy leave by cab.","seenBy":["Mike Radovich","Sammy Kolb"]},{"from":"22:45","to":"00:15","where":"bar and back booths","doing":"Served Corrigan and Mike in the back booth from 23:50 and saw both leave.","seenBy":["Vince Corrigan","Mike Radovich"]},{"from":"00:15","to":"00:52","where":"bar, then the alley","doing":"Served the swing shift crowd and at 00:50 carried empties out past Corrigan's parked Buick.","seenBy":[]},{"from":"00:52","to":"03:30","where":"behind the bar","doing":"Worked the bar and at about 01:05 saw Corrigan at the payphone outside.","seenBy":[]},{"from":"03:30","to":"04:00","where":"behind the bar","doing":"Answered questions from two Harbor Division patrolmen.","seenBy":[]}],"knows":["Mike came in about 21:05, sat at the bar on beer and whiskey chasers, and said he was 'coming into money' (she saw and heard it).","At about 22:30 Sammy Kolb leaned on Mike over a $180 marker; Mike paid him in cash at the bar and Sammy left by cab around 22:45 (she saw it).","Vince Corrigan came in about 23:50, parked his Buick out front and sat with Mike in the back booth; she served them two beers (she saw it).","Wiping the next table, she heard Mike laugh and say 'Friday's price, Vince, or I read it out Monday'; Corrigan didn't laugh (she heard it).","Mike made a crack about Truman after a radio newscast and walked out alone toward the waterfront (she saw and heard it).","Corrigan paid up and said loudly 'Quarter past twelve, Dee, I've got the rolls to finish', and left on foot (she saw and heard it).","At about 00:50, putting empties in the alley, she saw Corrigan's Buick still at the curb, lights off (she saw it).","At about 01:05 she saw Corrigan at the payphone outside through the fogged window, collar up, hat in his hand; the Buick was gone by 01:10 (she saw it).","The swing shift crowd came in after midnight and kept her run off her feet till two (she was there)."],"doesNotKnow":["Who killed Mike, or how.","What happened on the pier or at Gate 3.","Anything about Rosa's night.","What paper Mike meant to 'read out Monday'."],"secret":null,"lies":[],"honestMistake":{"claim":"Mike went out right after the twelve-thirty news, say twenty-five to one, a good while after Vince left.","truth":"Mike left at 00:10, just after the midnight news, five minutes before Corrigan.","why":"The swing shift was pouring in and both newscasts end the same way; she remembers Mike's crack about Truman and has hung it on the wrong bulletin."},"tells":["Polishes the same glass over and over.","Says 'honey' with an edge on it."],"pressure":{"baseline":15,"breakPoint":65,"lawyerPoint":85,"style":"lawyer"},"opening":"Coffee's on the house, sugar; answers cost extra. Ask your questions, I got a bar to run."},{"name":"Gus Lindqvist","part":"honest","personality":"Slow and laconic, an old Swedish sailor who says 'ja' and 'I mind my gate' and offers nothing unasked. Ashamed of the muscatel, he answers in short plain sentences, and if he is bullied he stops talking and looks at the floor.","voiceSample":"Ja, I see him. Union man, Corrigan. He go out on the pier, he come back. Union business is not my business.","relationship":"He knew Mike only to nod to; Mike once gave him a cigar on the Fourth of July.","movements":[{"from":"21:00","to":"23:12","where":"gate shack and rounds of the transit shed","doing":"Came on watch and walked his rounds.","seenBy":[]},{"from":"23:12","to":"23:25","where":"end of Berth 54","doing":"Punched the watch clock at 23:20; the pier end was empty.","seenBy":[]},{"from":"23:25","to":"02:45","where":"gate shack, lamp off","doing":"Sat drinking muscatel instead of walking his rounds and watched the gate.","seenBy":[]},{"from":"02:45","to":"02:58","where":"Berths 54 and 55, then the gate phone","doing":"Walked his round, found Mike at 02:50 and phoned Harbor Division.","seenBy":[]},{"from":"03:10","to":"04:00","where":"Berth 55","doing":"Showed the patrolmen the body and answered questions.","seenBy":[]}],"knows":["At 23:20 he punched the clock at the end of 54; nobody there, just a coil of line and the open end where the stringer has no rail (he saw it).","At about 00:12 Mike passed under the gate lamp alone, unsteady, heading out toward 54 (he saw it).","At about 00:18 Vince Corrigan passed under the lamp with his hat brim down; Gus knows the face from the election posters and the union picnic, and Corrigan did not look at the dark shack (he saw it).","At about 00:44 Corrigan came back alone, walking fast, hat in his hand, his trouser knees dark and wet; there was no Mike (he saw it).","Nobody else came through Gate 3 between 23:00 and 02:45 (he watched the gate).","Out on the pier he heard nothing over the winches at 55 and the foghorn (he heard nothing).","He sat in the shack from about 23:25 to 02:45 with a pint of muscatel instead of walking his rounds, and the clock tape will show it (he did it).","At 02:50 his flashlight found Mike face down in the stern lines of the Mariposa Bay (he saw it).","At 02:58 he phoned Harbor Division from the gate phone (he did it)."],"doesNotKnow":["What happened at the end of 54.","Who killed Mike, or how.","What was said or done in the Anchor.","Anything about Rosa, the blackmail or the voucher."],"secret":"His small embarrassment: he sat drinking in the shack for over three hours instead of walking his rounds, and could lose the job.","lies":[],"honestMistake":null,"tells":["Rubs his thumb along the brim of his cap.","Says 'Ja, maybe' when he means yes."],"pressure":{"baseline":25,"breakPoint":60,"lawyerPoint":85,"style":"shutdown"},"opening":"I find him. I call. That's all, mister. You want more, you ask, I tell."}],"id":"noir_docks"},{"settingId":"noir_docks","truth":{"title":"Small Hours at Gate Nine","house":"Berth 171 on the East Channel of San Pedro harbor, behind Gate 9 at the foot of Front Street: the Coast Marine Forwarding office, a clapboard shack with a Mosler safe sixty yards from the transit shed where the night gang is loading the freighter Marysville Victory; Teo's, a bar four hundred yards up Front Street that never closes; and the Harbor Belt Line spur through a padlocked gate at the north end of the shed.","victim":{"name":"Eddie Marchetti","age":28,"role":"night clerk for Coast Marine Forwarding at the Berth 171 office","sketch":"An ex-Navy signalman, handsome and quick, who wore a camel polo coat to a pier job and spent his pay on the Hollywood Legion fights and on women. He roomed over a Pacific Avenue barbershop and had told half the pier he was quitting for San Francisco."},"night":{"start":"21:00","end":"04:00","discovered":"03:08","discoveredBy":"Benny Ochoa","where":"the Coast Marine Forwarding office at Berth 171"},"weather":"Friday 7 February 1947: wet sea fog in off the breakwater from nine, thickening after midnight until the floodlights on Berth 171 were haloes and the Point Fermin horn sounded every thirty seconds; 49 degrees, dead calm.","publicFacts":["Eddie Marchetti, night clerk for Coast Marine Forwarding, was found shot dead on the floor of the Berth 171 office at 03:08 by Benny Ochoa, the night gang's jitney driver; the safe stood open and the cash box was gone.","Pop Kowalski, the Gate 9 gateman, telephoned Harbor Division at 03:12; patrolmen were on the pier by 03:20, the coroner's wagon by 04:10.","The night gang loading the Marysville Victory heard one bang at about twenty past one and took it for Benny's jitney backfiring, as it had been doing all evening.","Roy Haskell, the port agent, left the office at ten to eleven for his Friday poker game in the back room at Teo's on Front Street, and the police called him down from Palos Verdes Estates at half past three.","Fog came in off the breakwater at nine and lay thick on the East Channel all night; nobody on the pier saw more than forty yards.","On the pier that night: Augie Sarkis's twelve-man night gang, Pop Kowalski at the gate, and Dutch Vander Meer asleep in his Valley Produce reefer, waiting for the five o'clock gate.","The word on the waterfront is a stick-up for the Friday cash, and Chick Navarro, the bookie's runner, was seen hanging at the gate fence half the night."],"suspects":[{"name":"Roy Haskell","age":46,"role":"port agent for Coast Marine Forwarding, Eddie's employer","sketch":"Lean and barbered in a camel-hair overcoat over last night's suit, bay rum and Chesterfields, with the stillness of a man used to being the calmest one in the room. There is a green-brown smear on the coat hem he has not noticed.","part":"killer"},{"name":"Vivian Haskell","age":33,"role":"Roy's wife, fourteen years younger, a former Long Beach club hostess","sketch":"Slim and dark-blonde in a good gray suit and gloves, coral lipstick put on fresh at six in the morning over eyes that have been crying. She holds an unlit cigarette throughout and keeps her left hand out of sight.","part":"liar"},{"name":"Chick Navarro","age":24,"role":"a bookie's runner who works the Front Street bars and the pier gates","sketch":"A small quick kid in a sharp drape jacket and two-tone shoes, pencil moustache, a wad of betting slips in his breast pocket he keeps touching. He laughs when nothing is funny.","part":"mistaken"},{"name":"Benny Ochoa","age":38,"role":"jitney driver on the night gang, San Pedro born, ex-Army","sketch":"Broad and quiet in oil-black dungarees and a field jacket, a wrench still in his hip pocket and grease to the elbows. He answers slowly and looks the detective in the eye when he does.","part":"honest"}],"killer":"Roy Haskell","accomplice":null,"motive":"Vivian Haskell had been meeting Eddie Marchetti in the Berth 171 office on Friday nights while Roy played poker, and the two meant to take the Lark to San Francisco on the 14th. Roy had suspected for a month; when Chick Navarro mentioned her car parked at the office, he walked to the pier, and Eddie told him to his face that she was leaving.","method":"At 01:22, in the office with the door shut, Roy shot Eddie once in the chest at about four feet with his own licensed Colt .38 Detective Special, carried in his overcoat pocket on poker nights. The night gang sixty yards off, under the winches, took the single bang for Benny Ochoa's jitney, which had backfired all evening. Roy opened the safe with the combination and took the cash box to make it a stick-up, left by the spur gate with his own key, dropped the box in the ice plant and the Colt into the channel, telephoned home from Teo's coin phone, and was back at the table at 01:42.","alibiGap":{"from":"00:55","to":"01:42","killerClaims":"That he stepped out of the poker game at Teo's for ten minutes around one o'clock to telephone his wife from the coin phone and get some air, and never set foot on the pier after he drove out at ten to eleven.","actually":"He walked to the spur gate, let himself in with his key, watched Vivian's car leave, confronted and shot Eddie at 01:22, staged the safe, dropped the cash box and the gun, telephoned home at 01:38 and sat back down at 01:42."},"timeline":[{"time":"21:00","place":"Coast Marine office and Berth 171","present":["Roy Haskell","Eddie Marchetti","Benny Ochoa"],"event":"Roy Haskell and Eddie Marchetti close out Friday's manifests in the office while Augie Sarkis's night gang starts loading the Marysville Victory under the floodlights and Benny Ochoa's jitney backfires on its first run.","witnesses":["Benny Ochoa","Pop Kowalski","Augie Sarkis"]},{"time":"21:10","place":"Front Street bars and the Haskell house, Palos Verdes Estates","present":["Chick Navarro","Vivian Haskell"],"event":"Chick Navarro works the Hollywood Legion fight collections through the Front Street bars, while Vivian Haskell sits alone in the Palos Verdes house waiting for Roy's poker night to settle in.","witnesses":[]},{"time":"22:50","place":"Gate 9 and Teo's back room","present":["Roy Haskell","Eddie Marchetti"],"event":"Roy tells Eddie to lock the day's $612 in the safe at two, drives his Packard out through Gate 9, where Pop logs it, and sits down at 23:00 in Teo's back room with Sol Hirsch, Ned Garza and Cap Mulhern, Teo Almeida dealing.","witnesses":["Pop Kowalski","Benny Ochoa","Teo Almeida","Sol Hirsch"]},{"time":"23:30","place":"Teo's back room and Gate 9","present":["Chick Navarro","Roy Haskell"],"event":"Chick comes in to settle the fight money with the players and hangs about the table, and at 23:40 Dutch Vander Meer's Valley Produce reefer checks in at Gate 9 and parks thirty yards from the office, the driver climbing into his sleeper.","witnesses":["Teo Almeida","Sol Hirsch","Pop Kowalski"]},{"time":"00:09","place":"Gate 9 and the office","present":["Vivian Haskell","Eddie Marchetti"],"event":"Vivian's cream Mercury comes in through Gate 9, Pop waving the agent's wife through and logging it, and parks beside the office, where Eddie pours two rye highballs; Benny sees the car's lights from the jitney.","witnesses":["Pop Kowalski","Benny Ochoa"]},{"time":"00:25","place":"Gate 9 fence","present":["Chick Navarro"],"event":"Chick walks down to see whether Eddie is working, sees the Mercury parked under the office light and is turned away by Pop for want of a pass.","witnesses":["Pop Kowalski"]},{"time":"00:38","place":"Teo's back room","present":["Chick Navarro","Roy Haskell"],"event":"Back at the table Chick says 'Your missus is working late, Mr. Haskell, the Merc's parked at the office, and I got to see your night man after one about forty bucks,' and Roy folds the next hand without looking at it.","witnesses":["Teo Almeida","Sol Hirsch","Ned Garza","Cap Mulhern"]},{"time":"00:48","place":"Teo's","present":["Chick Navarro","Roy Haskell"],"event":"Chick leaves for the gate to wait for Eddie's one o'clock, and at 00:55 Roy puts on his camel-hair overcoat, the Colt in its right pocket as on every poker night, says he must telephone his wife, and walks along the fence toward the spur.","witnesses":["Teo Almeida","Sol Hirsch","Ned Garza","Cap Mulhern"]},{"time":"00:58","place":"Gate 9 coin phone","present":["Chick Navarro"],"event":"Chick telephones Lefty's wire room in Hollywood with the night's figures, is refused at the gate a second time, and settles against the fence to smoke and watch the office.","witnesses":["Pop Kowalski"]},{"time":"01:01","place":"Harbor Belt Line spur gate","present":["Roy Haskell"],"event":"Roy opens the spur padlock with the key on his ring, walks the dark channel side of the transit shed and stops in its shadow as the Mercury's lights come on outside the office.","witnesses":[]},{"time":"01:03","place":"Office door and Gate 9","present":["Vivian Haskell","Eddie Marchetti","Chick Navarro"],"event":"Vivian kisses Eddie at the door, leaves her lighter and her glass on the desk, and drives out through Gate 9 past Pop and Chick at the fence, home at 01:20; Roy watches her tail-lights from the shed's shadow.","witnesses":["Pop Kowalski","Chick Navarro","Roy Haskell"]},{"time":"01:06","place":"pier apron","present":["Roy Haskell","Benny Ochoa"],"event":"Roy crosses the edge of the lit apron to the office, and Benny, who shut the jitney down at 01:05 at the shed's north door to change a plug, sees a tall man in a long light overcoat and hat go in and shut the door.","witnesses":["Benny Ochoa"]},{"time":"01:22","place":"Coast Marine office","present":["Roy Haskell","Eddie Marchetti"],"event":"After fourteen minutes in which Eddie, in shirtsleeves with his polo coat on the rack, tells him Vivian is leaving on the Lark on the 14th, Roy shoots him once in the chest; the gang yells 'Benny's jitney', the ship's second mate reports a shot or backfire to the patrol launch, Vander Meer wakes and sleeps again, and Chick at the fence and Benny at the shed door both hear it.","witnesses":["Benny Ochoa","Chick Navarro","Augie Sarkis","Dutch Vander Meer"]},{"time":"01:23","place":"Coast Marine office","present":["Roy Haskell"],"event":"Roy opens the safe with the combination, takes the cash box, pulls the desk drawers, gets Eddie's blood on his right hand from the desk edge, and at 01:31 crosses the apron fast with the box under his arm, seen by Benny and, from the fence, by Chick, who takes the camel coat for Eddie's.","witnesses":["Benny Ochoa","Chick Navarro"]},{"time":"01:33","place":"spur gate, Front Street and Teo's","present":["Roy Haskell"],"event":"Roy drops the cash box into the ice plant inside the spur fence and the Colt through the deck gap into the channel, leaves the padlock hanging, telephones home from Teo's coin phone at 01:38 and hears Vivian answer, and sits back down at 01:42 to Sol Hirsch's 'Long call, Roy.'","witnesses":["Vivian Haskell","Teo Almeida","Sol Hirsch","Ned Garza","Cap Mulhern"]},{"time":"01:45","place":"Gate 9 to Teo's, and Berth 171","present":["Chick Navarro","Roy Haskell","Benny Ochoa"],"event":"Chick gives up on Eddie, walks back to Teo's, finds Roy dealing at 01:50 and Sol razzing him about the longest phone call in history, collects from Cap Mulhern and goes home to Grand Avenue at 02:15, while Benny restarts the jitney at 01:35 and the gang works on.","witnesses":["Teo Almeida","Sol Hirsch","Augie Sarkis"]},{"time":"02:30","place":"Teo's, the Haskell house and Berth 171","present":["Roy Haskell","Vivian Haskell"],"event":"Roy cashes out, drives home and comes in at 02:52 to sit in the kitchen in his overcoat while Vivian lies awake pretending to sleep; at Berth 171 the tally sheets Eddie should have brought to the hatch never come and Augie Sarkis says to leave it.","witnesses":["Vivian Haskell","Augie Sarkis","Benny Ochoa"]},{"time":"03:08","place":"Coast Marine office","present":["Benny Ochoa"],"event":"Hatches covered at 03:00, Benny goes for the tally sheets and finds Eddie dead behind the desk, the safe open; Pop calls Harbor Division at 03:12, patrolmen find the spur padlock open at 03:20 and the cash box at 03:35, the police ring the Haskell house at 03:25 and Roy reaches the pier at 03:50, leaving Vivian sitting up at home while Chick sleeps on Grand Avenue.","witnesses":["Pop Kowalski","Benny Ochoa","Roy Haskell"]}],"evidence":[{"id":"ev1","name":"Eddie's camel polo coat","where":"on the coat rack by the office door","detail":"A camel-hair polo coat hanging with a gray fedora, untouched by any robber; in the inside pocket two Pullman tickets on the Lark to San Francisco for Friday the 14th and a snapshot of a woman in dark glasses on Cabrillo Beach.","proves":"Eddie was in shirtsleeves when shot, so a camel coat seen crossing the apron at half past one was somebody else's; and he meant to leave town next Friday with a woman.","atScene":true},{"id":"ev2","name":"Gold lighter and two glasses","where":"on the office desk, pushed behind the manifest tray","detail":"A gold Ronson engraved V.H. and two highball glasses with the dregs of rye and ginger ale, one rimmed with coral lipstick.","proves":"A woman with those initials drank with Eddie in the office that night.","atScene":true},{"id":"ev3","name":"The open safe and Eddie's wallet","wh
